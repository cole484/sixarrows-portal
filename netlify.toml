[build]
  publish = "portal"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ── Scheduled update generation ───────────────────────────────────────────────
# Monday 5:00 AM CT (10:00 UTC) — week preview
[[scheduled_functions]]
  name = "generate-updates"
  cron = "0 10 * * 1"

# Friday 1:00 PM CT (18:00 UTC) — weekly recap
[[scheduled_functions]]
  name = "generate-updates"
  cron = "0 18 * * 5"

# ── Lookahead audit ───────────────────────────────────────────────────────────
# Daily 8:00 AM CT (13:00 UTC) — audits 8-week window across all active
# projects, creates/refreshes action items for gaps. On Fridays it also
# creates the weekly "Friday lookahead review" item per project.
[[scheduled_functions]]
  name = "lookahead-cron"
  cron = "0 13 * * *"
# ─────────────────────────────────────────────────────────────────────────────

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
