[build]
  publish = "portal"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# PDF to PNG conversion is parked in netlify/functions-pending until the
# deploy pipeline is confirmed working. It needs the mupdf WASM package
# and a per-function nft bundler override, both of which were introduced
# at the same time as this feature, so they are the first thing to rule
# out if a build fails. Restoring it means moving the file back into
# netlify/functions, reinstalling mupdf, and putting this block back:
#
#   [functions."plan-convert-background"]
#     node_bundler = "nft"
#     included_files = ["node_modules/mupdf/dist/**"]

# ── Scheduled update generation ───────────────────────────────────────────────
# Version C: portal-native, Notion-driven, deterministic.
# Runs every Sunday morning and drops a draft weekly update into the `updates`
# table for every active construction client whose Notion timeline DB is set.
# Admin approves in the portal; approval publishes to the client's Updates page.
#
# Sunday 11 UTC = 6am CDT (summer) / 5am CST (winter). Netlify cron is UTC-only
# so the local hour drifts by 1 across DST — accept the drift or pin to whatever
# season matters most (CDT covers most of the U.S. build calendar).
[[scheduled_functions]]
  name = "notion-weekly-update"
  cron = "0 11 * * 0"

# ── Subcontractor scheduling gate ─────────────────────────────────────────────
# Tier 1: look ahead at tasks entering the scheduling window, recompute
# readiness, and DM the digest. Weekdays only, since nobody is scheduling subs
# on a Saturday.
#
# 12 UTC = 7am CDT (summer) / 6am CST (winter). Same one-hour DST drift as the
# weekly update above; accepted for the same reason.
#
# A cron run notifies. It does NOT write to Notion: apply=1 is manual only, and
# stays that way until the gate has been read for a couple of weeks and is
# calling things correctly.
[[scheduled_functions]]
  name = "scheduling-gate"
  cron = "0 12 * * 1-5"

# ── LEGACY: the old generate-updates.js was a Claude-drafted-from-scratch
# generator (Mon week-preview / Fri weekly-recap). Version C above replaces
# both. The old function is still on disk in netlify/functions/ for
# reference; safe to delete once the new flow is proven on real clients.
#
# [[scheduled_functions]]
#   name = "generate-updates"
#   cron = "0 10 * * 1"
# [[scheduled_functions]]
#   name = "generate-updates"
#   cron = "0 18 * * 5"
# ─────────────────────────────────────────────────────────────────────────────

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
