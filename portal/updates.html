<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Updates — Six Arrows</title>
<link rel="stylesheet" href="style.css"/>
<script src="data.js"></script><script src="app.js"></script>
</head>
<body>
<script>
const p = AUTH.requireAuth();
if (p) {
  const MAX_VISIBLE = 3;
  const showAll     = new URLSearchParams(window.location.search).get('all') === '1';

  // ── Load updates: Netlify function first, localStorage fallback ──
  async function loadUpdates() {
    let allUpdates = [];
    let loadedFromServer = false;

    // Try Netlify function (has approved + draft updates)
    try {
      const res = await fetch(`/.netlify/functions/client-updates?clientId=${p.id}`);
      if (res.ok) {
        const data = await res.json();
        allUpdates = data.updates || [];
        loadedFromServer = true;
      }
    } catch(e) {
      console.log('Updates function unavailable, using local state');
    }

    // Fall back to localStorage admin updates + data.js base updates
    if (!loadedFromServer) {
      const baseUpdates = p.updates || [];
      let adminUpdates = [];
      try { adminUpdates = JSON.parse(localStorage.getItem(`sa_admin_${p.id}_updates`) || '[]'); } catch(e) {}
      allUpdates = [...adminUpdates].reverse().concat(baseUpdates);
    }

    const visible = showAll ? allUpdates : allUpdates.slice(0, MAX_VISIBLE);
    const hasMore = allUpdates.length > MAX_VISIBLE;
    renderUpdates(allUpdates, visible, hasMore);
  }

  // ── Format update body: convert plain text with bullets to HTML ─────────
  function formatUpdateBody(text) {
    if (!text) return '';
    const lines = text.split('\n');
    let html   = '';
    let inList = false;

    for (const raw of lines) {
      const line = raw.trim();
      if (!line) {
        // Blank line — close any open list, add spacing
        if (inList) { html += '</ul>'; inList = false; }
        continue;
      }

      // Section headers (end with colon, no leading dash)
      if (!line.startsWith('-') && line.endsWith(':') && line.length < 60) {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<div style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--green-dk);margin:10px 0 4px">${line.slice(0,-1)}</div>`;
        continue;
      }

      // Bullet point
      if (line.startsWith('- ')) {
        if (!inList) { html += '<ul style="margin:0 0 6px 0;padding-left:16px;list-style:none">'; inList = true; }
        html += `<li style="position:relative;padding-left:10px;margin-bottom:3px;font-size:13px;line-height:1.5;color:var(--charcoal)"><span style="position:absolute;left:0;color:var(--green-dk);font-weight:700">-</span>${line.slice(2)}</li>`;
        continue;
      }

      // Sign-off line (starts with "- Cole" or "- Your")
      if (line.startsWith('- ') && (line.includes('Six Arrows') || line.includes('Project'))) {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<div style="font-size:12px;color:var(--charcoal-4);margin-top:10px;padding-top:8px;border-top:0.5px solid var(--border)">${line}</div>`;
        continue;
      }

      // Regular paragraph line
      if (inList) { html += '</ul>'; inList = false; }
      html += `<p style="font-size:13px;line-height:1.6;color:var(--charcoal);margin:0 0 6px">${line}</p>`;
    }

    if (inList) html += '</ul>';
    return html;
  }

  function renderUpdates(allUpdates, visible, hasMore) {
    mountLayout('updates', 'Updates', `
    <div class="page-eyebrow">Communication</div>
    <div class="page-title">Project Updates</div>
    <p class="page-sub">Notes, decisions, and milestones from your Six Arrows team.</p>
    <div class="grid g2">
      <div class="card">
        <div class="sh">
          <div class="sh-title">Project Updates</div>
          ${allUpdates.length > 0 ? `<span class="tag neutral">${allUpdates.length} total</span>` : ''}
        </div>
        ${visible.length > 0
          ? visible.map(u=>`<div class="upd-item"><div class="upd-date">${u.date}</div><div class="upd-title">${u.title}</div><div class="upd-body">${formatUpdateBody(u.body)}</div></div>`).join('')
          : `<div style="text-align:center;padding:2rem 1rem">
               <div style="font-size:28px;margin-bottom:10px">📋</div>
               <div style="font-size:14px;font-weight:600;color:var(--charcoal-3);margin-bottom:5px">No updates yet</div>
               <div style="font-size:12px;color:var(--charcoal-4);line-height:1.55">Your Six Arrows team will post updates here as your project progresses.</div>
             </div>`
        }
        ${hasMore && !showAll
          ? `<div style="padding-top:10px;border-top:0.5px solid var(--border);margin-top:4px">
               <a href="updates.html?all=1" style="font-size:12px;font-weight:600;color:var(--green-dk);text-decoration:none">View all ${allUpdates.length} updates →</a>
             </div>`
          : showAll && allUpdates.length > MAX_VISIBLE
          ? `<div style="padding-top:10px;border-top:0.5px solid var(--border);margin-top:4px">
               <a href="updates.html" style="font-size:12px;font-weight:600;color:var(--charcoal-4);text-decoration:none">← Show recent only</a>
             </div>`
          : ''
        }
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="card">
          <div class="sh"><div class="sh-title">Upcoming Decisions</div></div>
          ${p.decisions.length > 0
            ? p.decisions.map(d=>`<div class="dec-item"><div class="dec-head"><div class="dec-title">${d.title}</div>${decTag(d.status)}</div><div class="dec-due">Due ${d.due}</div><div class="dec-note">${d.note}</div></div>`).join('')
            : `<div style="font-size:13px;color:var(--charcoal-4);padding:6px 0">No open decisions at this time.</div>`
          }
        </div>
        <div class="card">
          <div class="sh"><div class="sh-title">Your Project Team</div></div>
          <!-- Customer Experience (primary) -->
          <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--green-dk);margin-bottom:7px">Customer Experience</div>
          <div style="display:flex;align-items:center;gap:11px;margin-bottom:10px">
            <div style="width:38px;height:38px;border-radius:50%;background:var(--green-lt);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--green-deep);flex-shrink:0">${(p.cxName||p.teamLead||'').split(' ').map(n=>n[0]).join('')}</div>
            <div><div style="font-size:13px;font-weight:600;color:var(--charcoal)">${p.cxName||p.teamLead||'Cole Borders'}</div><div style="font-size:11px;color:var(--charcoal-3)">Six Arrows Construction</div></div>
          </div>
          <div class="mrow"><span class="lbl">Phone</span><a href="tel:${p.cxPhone||p.teamPhone}" class="val" style="font-size:12px;color:var(--charcoal);text-decoration:none">${p.cxPhone||p.teamPhone}</a></div>
          <div class="mrow" style="${p.pmName?'':'border:none'}"><span class="lbl">Email</span><a href="mailto:${p.cxEmail||p.teamEmail}" class="val" style="font-size:12px;color:var(--charcoal);text-decoration:none">${p.cxEmail||p.teamEmail}</a></div>
          ${p.pmName ? `
          <!-- Project Manager -->
          <div style="border-top:0.5px solid var(--border);padding-top:10px;margin-top:6px">
            <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--charcoal-4);margin-bottom:7px">Project Manager</div>
            <div style="display:flex;align-items:center;gap:11px;margin-bottom:10px">
              <div style="width:38px;height:38px;border-radius:50%;background:var(--cream-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--charcoal-3);flex-shrink:0">${p.pmName.split(' ').map(n=>n[0]).join('')}</div>
              <div><div style="font-size:13px;font-weight:600;color:var(--charcoal)">${p.pmName}</div><div style="font-size:11px;color:var(--charcoal-3)">Six Arrows Construction</div></div>
            </div>
            ${p.pmPhone?`<div class="mrow"><span class="lbl">Phone</span><a href="tel:${p.pmPhone}" class="val" style="font-size:12px;color:var(--charcoal);text-decoration:none">${p.pmPhone}</a></div>`:''}
            ${p.pmEmail?`<div class="mrow" style="border:none"><span class="lbl">Email</span><a href="mailto:${p.pmEmail}" class="val" style="font-size:12px;color:var(--charcoal);text-decoration:none">${p.pmEmail}</a></div>`:''}
          </div>` : ''}
        </div>
      </div>
    </div>
  `);
  } // end renderUpdates

  loadUpdates();
}
</script></body></html>
