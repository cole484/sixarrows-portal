<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Selections Book — Six Arrows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --cream:    #ebe9de;
  --cream-dk: #dfdccf;
  --stone:    #9a9585;
  --charcoal: #2e2e2e;
  --charcoal-lt: #4a4a4a;
  --sage:     #757f69;
  --sage-lt:  #8d9681;
  --green:    #757f69;
  --green-dk: #5c6652;
  --white:    #f5f4ef;
  --border:   rgba(46,46,46,.12);

  --heading:  'Cormorant Garamond', Georgia, serif;
  --sans:     'Jost', sans-serif;

  --page-w:   960px;
  --gutter:   48px;
}

html { background: var(--cream); color: var(--charcoal); font-family: var(--sans); }
body { min-height: 100vh; }

/* ── Loading ── */
#loading-screen {
  position:fixed;inset:0;background:var(--charcoal);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;transition:opacity .6s;
}
#loading-screen.fade-out { opacity:0;pointer-events:none; }
.loading-logo { font-family:var(--heading);font-size:28px;color:var(--cream);letter-spacing:.2em;margin-bottom:16px; }
.loading-sub { font-size:11px;color:var(--stone);letter-spacing:.2em;text-transform:uppercase; }
.loading-bar { width:120px;height:1px;background:rgba(255,255,255,.15);margin-top:24px;position:relative;overflow:hidden; }
.loading-bar::after { content:'';position:absolute;inset:0;background:var(--sage);animation:loadbar 1.4s ease-in-out infinite; }
@keyframes loadbar { 0%{transform:translateX(-100%)} 100%{transform:translateX(200%)} }

/* ── Print / Download Bar ── */
#action-bar {
  position:sticky;top:0;z-index:100;
  background:var(--charcoal);
  display:flex;align-items:center;justify-content:space-between;
  padding:12px var(--gutter);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.ab-logo { font-family:var(--heading);font-size:15px;color:var(--cream);letter-spacing:.12em; }
.ab-title { font-size:11px;color:var(--stone);letter-spacing:.15em;text-transform:uppercase; }
.ab-actions { display:flex;gap:12px; }
.ab-btn {
  font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;padding:8px 20px;border-radius:2px;cursor:pointer;
  transition:all .2s;border:none;
}
.ab-btn-outline { background:transparent;border:1px solid var(--stone);color:var(--stone); }
.ab-btn-outline:hover { border-color:var(--cream);color:var(--cream); }
.ab-btn-primary { background:var(--sage);color:var(--charcoal); }
.ab-btn-primary:hover { background:var(--sage-lt); }

/* ── Book Container ── */
#book { max-width:var(--page-w);margin:0 auto;padding:0 24px 80px; }

/* ── Cover Page ── */
.cover-page {
  min-height:85vh;display:flex;flex-direction:column;justify-content:flex-end;
  padding:var(--gutter);margin:40px 0;
  background:var(--charcoal);position:relative;overflow:hidden;
}
.cover-page::before {
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(92,107,90,.3) 0%,transparent 60%),
             linear-gradient(315deg,rgba(184,150,90,.15) 0%,transparent 50%);
}
.cover-ornament {
  position:absolute;top:40px;right:40px;
  width:180px;height:180px;
  border:1px solid rgba(184,150,90,.2);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.cover-ornament::before {
  content:'';width:140px;height:140px;
  border:1px solid rgba(184,150,90,.12);border-radius:50%;position:absolute;
}
.cover-ornament-text {
  font-family:var(--heading);font-size:11px;color:rgba(184,150,90,.5);
  letter-spacing:.3em;text-transform:uppercase;
}
.cover-eyebrow {
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--sage-lt);margin-bottom:20px;position:relative;
}
.cover-title {
  font-family:var(--heading);font-size:clamp(40px,6vw,72px);
  font-weight:300;color:var(--cream);line-height:1.05;
  letter-spacing:-.01em;position:relative;margin-bottom:8px;
}
.cover-title em { font-style:italic;color:var(--sage-lt); }
.cover-subtitle {
  font-family:var(--heading);font-size:18px;color:var(--stone);
  font-style:italic;margin-bottom:32px;position:relative;
}
.cover-divider { width:60px;height:1px;background:var(--sage);margin-bottom:28px;position:relative; }
.cover-meta { display:flex;gap:40px;position:relative; }
.cover-meta-item label { font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--stone);display:block;margin-bottom:4px; }
.cover-meta-item span { font-family:var(--heading);font-size:16px;color:var(--cream); }
.cover-sa {
  position:absolute;bottom:40px;right:40px;
  font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.2);
}

/* ── Section Divider ── */
.section-divider {
  display:flex;align-items:center;gap:20px;
  padding:40px 0 24px;
}
.section-divider-line { flex:1;height:1px;background:var(--border); }
.section-divider-label {
  font-size:9px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--stone);white-space:nowrap;
}

/* ── PART 1: Room Collage Spreads ── */
.room-spread {
  margin-bottom:60px;
  border:1px solid var(--border);
  background:var(--white);
  overflow:hidden;
}
.room-spread-header {
  padding:28px 36px 20px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:flex-end;justify-content:space-between;
  background:linear-gradient(to right,var(--cream),var(--white));
}
.room-name {
  font-family:var(--heading);font-size:36px;font-weight:300;
  color:var(--charcoal);letter-spacing:-.01em;
}
.room-name em { font-style:italic;color:var(--sage); }
.room-item-count {
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone);
}
.room-collage {
  display:grid;gap:0;
}
.room-collage.layout-2 { grid-template-columns:1fr 1fr; }
.room-collage.layout-3 { grid-template-columns:2fr 1fr 1fr; }
.room-collage.layout-4 { grid-template-columns:1fr 1fr;grid-template-rows:auto auto; }
.room-collage.layout-featured { grid-template-columns:3fr 2fr; }

.collage-cell {
  position:relative;min-height:220px;overflow:hidden;
  border:1px solid var(--border);margin:-0.5px;
}
.collage-cell.tall { min-height:400px; }
.collage-img-wrap {
  width:100%;height:100%;
  background:var(--cream-dk);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;min-height:220px;
}
.collage-img-wrap img {
  width:100%;height:100%;object-fit:cover;
  transition:transform .4s ease;display:block;
}
.collage-cell:hover .collage-img-wrap img { transform:scale(1.03); }

/* Image placeholder */
.img-placeholder {
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;height:100%;min-height:220px;
  background:linear-gradient(135deg,var(--cream-dk) 0%,var(--cream) 100%);
  position:relative;
}
.img-placeholder::before {
  content:'';position:absolute;inset:20px;
  border:1px dashed rgba(184,150,90,.25);
}
.img-placeholder-icon {
  font-size:28px;margin-bottom:8px;opacity:.4;
}
.img-placeholder-label {
  font-family:var(--heading);font-size:13px;font-style:italic;
  color:var(--stone);text-align:center;padding:0 20px;
  line-height:1.5;
}
.img-placeholder-sku {
  font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--sage-lt);margin-top:6px;
}

/* Collage cell overlay */
.collage-overlay {
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(to top,rgba(44,44,42,.85) 0%,transparent 100%);
  padding:20px 16px 14px;
}
.collage-item-label {
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.55);margin-bottom:3px;
}
.collage-item-value {
  font-family:var(--heading);font-size:15px;color:var(--cream);
  line-height:1.3;
}

/* ── PART 2: Detailed Item Catalog ── */
.catalog-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:2px;
  margin-bottom:60px;
}
.catalog-card {
  background:var(--white);border:1px solid var(--border);
  overflow:hidden;
}
.catalog-card-img {
  aspect-ratio:4/3;
  background:var(--cream-dk);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.catalog-card-img img { width:100%;height:100%;object-fit:cover; }
.catalog-card-img .img-placeholder { min-height:auto;height:100%; }
.catalog-card-body { padding:16px; }
.catalog-card-cat {
  font-size:8px;letter-spacing:.25em;text-transform:uppercase;
  color:var(--sage);margin-bottom:6px;
}
.catalog-card-name {
  font-family:var(--heading);font-size:18px;font-weight:400;
  color:var(--charcoal);margin-bottom:8px;line-height:1.2;
}
.catalog-card-value {
  font-size:12px;color:var(--charcoal-lt);line-height:1.55;margin-bottom:10px;
}
.catalog-card-meta {
  border-top:1px solid var(--border);padding-top:10px;
  display:flex;flex-direction:column;gap:4px;
}
.catalog-meta-row {
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:10px;
}
.catalog-meta-label { color:var(--stone);letter-spacing:.08em; }
.catalog-meta-val { color:var(--charcoal);font-weight:500; }

/* ── Category Header ── */
.cat-header {
  padding:32px 0 16px;
  display:flex;align-items:flex-end;gap:20px;
}
.cat-header-num {
  font-family:var(--heading);font-size:48px;font-weight:300;
  color:var(--border);line-height:1;
}
.cat-header-info {}
.cat-header-name {
  font-family:var(--heading);font-size:28px;font-weight:300;
  color:var(--charcoal);
}
.cat-header-count {
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone);
  margin-top:2px;
}

/* ── Empty state ── */
.empty-book {
  text-align:center;padding:80px 40px;
}
.empty-book-title {
  font-family:var(--heading);font-size:28px;color:var(--charcoal);
  margin-bottom:12px;
}
.empty-book-sub { font-size:14px;color:var(--stone);line-height:1.6; }

/* ── Print styles ── */
@media print {
  #action-bar { display:none!important; }
  body { background:white; }
  .room-spread, .catalog-card { break-inside:avoid; }
  .cover-page { min-height:100vh;margin:0; }
}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-logo">Six Arrows</div>
  <div class="loading-sub">Preparing Design Selections Book</div>
  <div class="loading-bar"></div>
</div>

<div id="action-bar">
  <div>
    <div class="ab-logo"><img src="assets/logo-light.png" alt="Six Arrows Co." style="height:32px;vertical-align:middle;margin-right:8px"></div>
    <div class="ab-title">Design Selections Book</div>
  </div>
  <div class="ab-actions">
    <button class="ab-btn ab-btn-outline" onclick="window.print()">Print / Save PDF</button>
    <button class="ab-btn ab-btn-primary" onclick="window.location.href='dashboard.html'">← Back to Portal</button>
  </div>
</div>

<div id="book">
  <div id="book-content"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
// ── Auth & Session ────────────────────────────────────
// Two ways to land here:
//   1) Client logged in normally — AUTH.requireAuth() returns their session
//   2) Admin previewing — URL has ?clientKey=... (set by admin Selections
//      view's "Open Design Book" button). We build a stub p from the URL
//      params so we can fetch selections and render without a client login.
const _params = new URLSearchParams(window.location.search);
const _adminClientKey = _params.get('clientKey');
const _editMode = _params.get('editMode') === '1';
let p;
if (_adminClientKey) {
  p = {
    id:                  _adminClientKey,
    selectionsClientKey: _adminClientKey,
    clientName:          _params.get('clientName')  || _adminClientKey,
    projectName:         _params.get('projectName') || 'Custom Home',
    location:            _params.get('location')    || '',
    _adminPreview:       true,
    _editMode:           _editMode,
  };
} else {
  p = AUTH.requireAuth();
  if (!p) throw new Error('Not authed');
}

// Edit-mode-only state — never set in client-facing mode
let DBI_OVERRIDES = {};   // current override map, mutated by edit-mode UI

// ── Helpers ──────────────────────────────────────────
function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function currency(n) {
  if (!n || isNaN(n)) return '';
  return '$' + Number(n).toLocaleString();
}

// Detects http(s):// URLs anywhere in a string. Returns the first match
// or empty string. Used to find product links pasted into the
// "exact product" / "_product" fields by the client.
function extractUrl(s) {
  if (!s) return '';
  const m = String(s).match(/https?:\/\/[^\s)\]<>"']+/i);
  return m ? m[0] : '';
}
function isUrlString(s) { return !!extractUrl(s); }

// Strip the URL out of a label so the displayed product text doesn't
// include the raw link (the link goes in the "View product →" anchor).
function stripUrl(s) {
  if (!s) return '';
  return String(s).replace(/https?:\/\/[^\s)\]<>"']+/gi, '').trim();
}

// Slug helper for synthesizing stable identifiers from human-readable
// cat / room / label strings. Keeps lowercase a-z, 0-9, replaces
// everything else with underscores, and collapses repeats. Matches what
// most of the selections-app room IDs already look like.
function slug(s) {
  return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'x';
}

// Build a stable per-item key. Same cat/room/label always returns the
// same key; the de-dupe layer below handles rare label collisions
// (e.g. two ext_doors labeled "Front door" → front_door, front_door_2).
function tagItemsWithKeys(items) {
  const seen = Object.create(null);
  items.forEach(it => {
    let base = `${slug(it.cat)}:${slug(it.room)}:${slug(it.label)}`;
    let key = base;
    let n = 2;
    while (seen[key]) key = `${base}_${n++}`;
    seen[key] = true;
    it.itemKey = key;
  });
  return items;
}

// ── Category definitions (mirrors selections-app.html) ──
const ROOM_GROUPS = [
  {
    id: 'kitchen',
    name: 'Kitchen',
    subtitle: 'Countertops, Appliances & Fixtures',
    cats: ['countertops','appliances','plumbing','lighting'],
    roomFilter: r => /kitchen|kit/i.test(r),
  },
  {
    id: 'primary_bath',
    name: 'Primary Bath',
    subtitle: 'Countertops, Tile, Fixtures & Finishes',
    cats: ['countertops','tile','plumbing','lighting'],
    roomFilter: r => /master|primary|main/i.test(r),
  },
  {
    id: 'baths',
    name: 'Additional Baths',
    subtitle: 'Countertops, Tile, Fixtures & Finishes',
    cats: ['countertops','tile','plumbing','lighting'],
    roomFilter: r => /bath|powder|guest/i.test(r) && !/master|primary|main/i.test(r),
  },
  {
    id: 'interior',
    name: 'Interior',
    subtitle: 'Flooring, Doors, Hardware & Trim',
    cats: ['flooring','doors','hardware','specialty_trim','lighting','fireplace','paint'],
    // Exclude exterior-room items so exterior doors don't double up here
    roomFilter: r => !/exterior/i.test(r),
  },
  {
    id: 'exterior',
    name: 'Exterior',
    subtitle: 'Finishes, Doors, Roofing & Windows',
    cats: ['exterior_finishes','doors'],
    roomFilter: r => /exterior/i.test(r),
  },
];

const CAT_LABELS = {
  fireplace:         'Fireplace',
  appliances:        'Appliances',
  exterior_finishes: 'Exterior Finishes',
  specialty_trim:    'Specialty Trim & Built-Ins',
  flooring:          'Flooring',
  tile:              'Tile Selections',
  plumbing:          'Plumbing Fixtures',
  lighting:          'Lighting Fixtures',
  countertops:       'Countertops',
  hardware:          'Hardware',
  paint:             'Paint & Stain Colors',
  doors:             'Doors & Trim',
  hvac:              'HVAC',
};

// ── Load selections from Supabase ─────────────────────
async function loadSelections(clientKey) {
  try {
    const res = await fetch(`/.netlify/functions/selections-storage?clientKey=${clientKey}`);
    if (!res.ok) return { answers: {}, saved: {}, rooms: [] };
    const data = await res.json();
    const all  = data.data || {};
    return {
      answers: all.ans || {},
      saved:   all.sav || {},
      rooms:   all.rms ? (typeof all.rms === 'string' ? JSON.parse(all.rms) : all.rms) : [],
    };
  } catch(e) {
    console.error('loadSelections error:', e);
    return { answers: {}, saved: {}, rooms: [] };
  }
}

// ── Parse answers into structured items ───────────────
// Helper: try key with and without section prefix (handles both formats)
function a(answers, ...keys) {
  for (const k of keys) {
    if (answers[k]) return answers[k];
  }
  return '';
}

function parseSelections(answers, saved, rooms) {
  const items = [];

  // ── Countertops ──
  const ctProduct = a(answers, 'countertops_ct_product', 'ct_product');
  const ctKit     = a(answers, 'countertops_ct_kit', 'ct_kit');
  if (ctProduct || ctKit) {
    items.push({
      cat: 'countertops', room: 'Kitchen',
      label: 'Kitchen Countertop',
      material: ctKit,
      color: a(answers, 'countertops_ct_color', 'ct_color'),
      edge: a(answers, 'countertops_ct_edge', 'ct_edge'),
      product: ctProduct,
      notes: a(answers, 'countertops_ct_notes', 'ct_notes'),
      image: a(answers, 'countertops_ct_photo', 'ct_photo'),
    });
    const ctIsl = a(answers, 'countertops_ct_isl', 'ct_isl');
    if (ctIsl === 'Yes — contrasting material' || ctIsl === 'Yes — contrasting color') {
      items.push({
        cat: 'countertops', room: 'Kitchen',
        label: 'Island Countertop',
        material: a(answers, 'countertops_ct_isl_mat', 'ct_isl_mat'),
        product: a(answers, 'countertops_ct_isl_mat', 'ct_isl_mat'),
        image: a(answers, 'countertops_ct_isl_photo', 'ct_isl_photo'),
      });
    }
  }

  // ── Per-bathroom countertops ──
  const bathrooms = Array.isArray(rooms) ? rooms.filter(r => /bath|powder/i.test(r.name||'')) : [];
  bathrooms.forEach(rm => {
    const rk = (rm.id || rm.name || '').replace(/\s+/g,'_').toLowerCase();
    const mat = a(answers, `ct_bath_${rk}_mat`, `ct_bath_${rk}`);
    if (mat) {
      items.push({
        cat: 'countertops', room: rm.name || rk,
        label: `${rm.name} Countertop`,
        material: mat,
        product: a(answers, `ct_bath_product_${rk}`, `ct_bath_${rk}_product`) || mat,
        image: a(answers, `ct_bath_photo_${rk}`, `ct_bath_${rk}_photo`),
      });
    }
  });

  // ── Flooring ──
  if (Array.isArray(rooms)) {
    rooms.forEach(rm => {
      const rk = (rm.id || rm.name || '').replace(/\s+/g,'_').toLowerCase();
      const type = a(answers, `flooring_floor_${rk}`, `flooring_${rk}_type`);
      if (type) {
        items.push({
          cat: 'flooring', room: rm.name || rk,
          label: `${rm.name} Flooring`,
          material: type,
          color: a(answers, `flooring_color_${rk}`, `flooring_${rk}_color`),
          product: a(answers, `flooring_product_${rk}`, `flooring_${rk}_product`),
          notes: a(answers, `flooring_notes_${rk}`, `flooring_${rk}_notes`),
          image: a(answers, `flooring_photo_${rk}`, `flooring_${rk}_photo`),
        });
      }
    });
  }

  // ── Appliances ──
  const appFields = [
    ['app_range','Range / Cooktop'],['app_hood','Range Hood'],
    ['app_fridge','Refrigerator'],['app_dish','Dishwasher'],
    ['app_micro','Microwave'],['app_oven','Wall Oven'],
  ];
  appFields.forEach(([key, name]) => {
    const val = answers[`${key}_product`] || answers[key];
    if (val) {
      items.push({
        cat: 'appliances', room: 'Kitchen',
        label: name,
        product: val,
        finish: answers[`${key}_finish`] || '',
        image: answers[`${key}_photo`] || '',
      });
    }
  });

  // ── Hardware ──
  const hwFinish  = a(answers, 'hardware_hw_finish', 'hw_finish');
  const hwProduct = a(answers, 'hardware_hw_product', 'hw_product');
  if (hwFinish || hwProduct) {
    items.push({
      cat: 'hardware', room: 'Whole Home',
      label: 'Door & Cabinet Hardware',
      finish: hwFinish,
      style: a(answers, 'hardware_hw_door_style', 'hw_door_style'),
      cabinetStyle: a(answers, 'hardware_hw_cabinet', 'hw_cabinet'),
      product: hwProduct,
      notes: a(answers, 'hardware_hw_notes', 'hw_notes'),
      image: a(answers, 'hardware_hw_photo', 'hw_photo'),
    });
  }

  // ── Doors & Trim ──
  const drSty     = a(answers, 'doors_dr_sty', 'dr_sty');
  const trProduct = a(answers, 'doors_tr_product', 'tr_product');
  if (drSty || trProduct) {
    items.push({
      cat: 'doors', room: 'Whole Home',
      label: 'Interior Doors',
      style: drSty,
      height: a(answers, 'doors_dr_ht', 'dr_ht'),
      finish: a(answers, 'doors_dr_col', 'dr_col'),
      product: trProduct,
      notes: [a(answers, 'doors_dr_spec', 'dr_spec'), a(answers, 'doors_tr_notes', 'tr_notes')].filter(Boolean).join(' — '),
      image: a(answers, 'doors_dr_photo', 'dr_photo'),
    });
    items.push({
      cat: 'doors', room: 'Whole Home',
      label: 'Trim & Molding',
      style: a(answers, 'doors_tr_prof', 'tr_prof'),
      height: a(answers, 'doors_tr_base', 'tr_base'),
      crown: a(answers, 'doors_tr_crown', 'tr_crown'),
      product: trProduct,
      image: a(answers, 'doors_tr_photo', 'tr_photo'),
    });
  }

  // ── Exterior Finishes — roof / soffit / gutter / siding ──
  ['roof','soffit','gutter','siding'].forEach(part => {
    const mat = a(answers, `ext_${part}_type`, `ext_${part}_mat`, `ext_${part}`);
    if (mat) {
      items.push({
        cat: 'exterior_finishes', room: 'Exterior',
        label: part.charAt(0).toUpperCase() + part.slice(1),
        material: mat,
        color: answers[`ext_${part}_color`] || '',
        product: answers[`ext_${part}_product`] || mat,
        notes:  answers[`ext_${part}_notes`]   || '',
        image:  answers[`ext_${part}_photo`]   || '',
      });
    }
  });

  // ── Exterior Finishes — windows ──
  if (answers.ext_window_color) {
    items.push({
      cat: 'exterior_finishes', room: 'Exterior',
      label: 'Windows',
      material: answers.ext_window_color,
      product: answers.ext_window_brand || answers.ext_window_color,
      style:   answers.ext_window_grilles || '',
      notes:   answers.ext_window_notes   || '',
      image:   answers.ext_window_photo   || '',
    });
  }

  // ── Exterior Finishes — porch ceiling ──
  if (answers.ext_porch_ceil_type && answers.ext_porch_ceil_type !== 'None / no porch') {
    items.push({
      cat: 'exterior_finishes', room: 'Exterior',
      label: 'Porch Ceiling',
      material: answers.ext_porch_ceil_type,
      color:   answers.ext_porch_ceil_color || '',
      product: answers.ext_porch_ceil_product || answers.ext_porch_ceil_other || answers.ext_porch_ceil_type,
      notes:   answers.ext_porch_ceil_notes  || '',
      image:   answers.ext_porch_ceil_photo  || '',
    });
  }

  // ── Exterior Doors (variable-length JSON array) ──
  try {
    const rawDoors = answers.ext_doors;
    const doors = Array.isArray(rawDoors)
      ? rawDoors
      : (typeof rawDoors === 'string' && rawDoors.trim() ? JSON.parse(rawDoors) : []);
    if (Array.isArray(doors)) {
      doors.forEach((d, i) => {
        if (!d || (!d.label && !d.product)) return;
        const lbl = d.label === 'Other (specify below)' ? (d.customLabel || `Door ${i+1}`) : (d.label || `Door ${i+1}`);
        items.push({
          cat: 'doors', room: 'Exterior',
          label: lbl,
          material: d.roSize || '',
          product: d.product || lbl,
          color:   d.color   || '',
          finish:  d.finish  || '',
          notes:   d.notes   || '',
          image:   '',
        });
      });
    }
  } catch (e) { /* malformed door list — ignore */ }

  // ── HVAC ──
  if (answers.hvac_heat_type && answers.hvac_heat_type !== 'Undecided') {
    items.push({
      cat: 'hvac', room: 'Whole Home',
      label: 'Heating',
      material: answers.hvac_heat_type,
      product: answers.hvac_heat_make_model || answers.hvac_heat_type,
      style:   answers.hvac_heat_size  || '',
      finish:  answers.hvac_heat_eff   || '',
      notes:   answers.hvac_notes      || '',
      image:   '',
    });
  }
  if (answers.hvac_cool_type && answers.hvac_cool_type !== 'Undecided' && answers.hvac_cool_type !== 'None / heating only') {
    items.push({
      cat: 'hvac', room: 'Whole Home',
      label: 'Cooling',
      material: answers.hvac_cool_type,
      product: answers.hvac_cool_make_model || answers.hvac_cool_type,
      style:   answers.hvac_cool_size  || '',
      finish:  answers.hvac_cool_seer  || '',
      image:   '',
    });
  }

  // ── Tile (per bathroom) ──
  if (Array.isArray(rooms)) {
    rooms.filter(r => /bath|shower|powder/i.test(r.name||'')).forEach(rm => {
      const rk = (rm.id || rm.name || '').replace(/\s+/g,'_').toLowerCase();
      const floor = a(answers, `tile_floor_${rk}`, `tile_${rk}_floor`, `tile_floor_product_${rk}`);
      if (floor) {
        items.push({
          cat: 'tile', room: rm.name,
          label: `${rm.name} Floor Tile`,
          material: floor,
          product: a(answers, `tile_floor_product_${rk}`, `tile_${rk}_floor_product`) || floor,
          grout: a(answers, `tile_floor_grout_${rk}`, `tile_${rk}_floor_grout`),
          image: a(answers, `tile_floor_photo_${rk}`, `tile_${rk}_floor_photo`),
        });
      }
      const shower = a(answers, `tile_shower_${rk}`, `tile_${rk}_shower`, `tile_shower_product_${rk}`);
      if (shower) {
        items.push({
          cat: 'tile', room: rm.name,
          label: `${rm.name} Shower Tile`,
          material: shower,
          product: a(answers, `tile_shower_product_${rk}`, `tile_${rk}_shower_product`) || shower,
          grout: a(answers, `tile_shower_grout_${rk}`, `tile_${rk}_shower_grout`),
          image: a(answers, `tile_shower_photo_${rk}`, `tile_${rk}_shower_photo`),
        });
      }
    });
  }

  // ── Specialty trim ──
  const trimItems = [
    {id:'beams',name:'Exposed Beams',fields:['specialty_trim_beams_loc','beams_loc'],styleFields:['specialty_trim_beams_style','beams_style'],finFields:['specialty_trim_beams_fin','beams_fin']},
    {id:'shelves',name:'Floating Shelves',fields:['specialty_trim_shelves_loc','shelves_loc'],styleFields:['specialty_trim_shelves_mat','shelves_mat'],finFields:[]},
    {id:'mantle',name:'Fireplace Mantle',fields:['specialty_trim_mantle_style','mantle_style'],styleFields:[],finFields:['specialty_trim_mantle_fin','mantle_fin']},
    {id:'wainscot',name:'Wainscoting / Paneling',fields:['specialty_trim_wain_style','wain_style'],styleFields:['specialty_trim_wain_ht','wain_ht'],finFields:[]},
  ];
  trimItems.forEach(ti => {
    const primary = a(answers, ...ti.fields);
    if (primary) {
      items.push({
        cat: 'specialty_trim', room: 'Whole Home',
        label: ti.name,
        material: primary,
        style: ti.styleFields.length ? a(answers, ...ti.styleFields) : '',
        finish: ti.finFields.length ? a(answers, ...ti.finFields) : '',
        notes: a(answers, `specialty_trim_${ti.id}_notes`, `${ti.id}_notes`),
        image: a(answers, `specialty_trim_${ti.id}_photo`, `${ti.id}_photo`),
      });
    }
  });

  // ── Plumbing fixtures ──
  // Kitchen sink & faucet
  if (Array.isArray(rooms)) {
    rooms.forEach(rm => {
      const rk = (rm.id || rm.name || '').replace(/\s+/g,'_').toLowerCase();
      const pfxRoom = answers._pfx?.[rk] || {};
      // Check all plumbing fixture types for this room
      const fixtureTypes = [
        { id: 'kitchen_sink', label: 'Kitchen Sink', roomMatch: /kitchen/i },
        { id: 'toilet', label: 'Toilet', roomMatch: /bath|powder/i },
        { id: 'shower', label: 'Shower Fixture', roomMatch: /bath/i },
        { id: 'tub', label: 'Bathtub', roomMatch: /bath/i },
      ];
      fixtureTypes.forEach(ft => {
        if (!ft.roomMatch.test(rm.name || '')) return;
        const product = a(answers, `plumbing_${rk}_${ft.id}_product`, `plumbing_${rk}_${ft.id}_sink_product`);
        const style = a(answers, `plumbing_${rk}_${ft.id}_style`, `plumbing_${rk}_${ft.id}_type`);
        if (product || style) {
          items.push({
            cat: 'plumbing', room: rm.name,
            label: `${rm.name} ${ft.label}`,
            style: style,
            product: product || style,
            image: a(answers, `plumbing_${rk}_${ft.id}_photo`, `plumbing_${rk}_${ft.id}_sink_photo`),
          });
        }
        // Faucet (paired with sink)
        const faucet = a(answers, `plumbing_${rk}_${ft.id}_faucet_product`);
        if (faucet) {
          items.push({
            cat: 'plumbing', room: rm.name,
            label: `${rm.name} ${ft.id === 'kitchen_sink' ? 'Faucet' : ft.label + ' Faucet'}`,
            style: a(answers, `plumbing_${rk}_${ft.id}_faucet`),
            product: faucet,
            image: a(answers, `plumbing_${rk}_${ft.id}_faucet_photo`),
          });
        }
      });
    });
  }

  // ── Lighting fixtures ──
  if (Array.isArray(rooms)) {
    rooms.forEach(rm => {
      const rk = (rm.id || rm.name || '').replace(/\s+/g,'_').toLowerCase();
      // Check known fixture types: recessed, pendant, chandelier, vanity, sconce, under_cabinet
      const lightTypes = ['recessed','pendant','chandelier','vanity','sconce','under_cabinet'];
      lightTypes.forEach(lt => {
        const product = a(answers, `lighting_${rk}_${lt}_product`);
        if (product) {
          const ltLabel = lt.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
          items.push({
            cat: 'lighting', room: rm.name,
            label: `${rm.name} ${ltLabel}`,
            product: product,
            image: a(answers, `lighting_${rk}_${lt}_photo`),
          });
        }
      });
    });
  }

  // ── Fireplace ──
  if (answers.fireplace_fp_want && answers.fireplace_fp_want !== 'No — no fireplace') {
    items.push({
      cat: 'fireplace', room: 'Great Room',
      label: 'Fireplace',
      fuel: answers.fireplace_fp_fuel || '',
      style: answers.fireplace_fp_style || '',
      count: answers.fireplace_fp_count || '1',
      product: answers.fireplace_fp_product || '',
      image: answers.fireplace_fp_photo || '',
    });
  }

  return tagItemsWithKeys(items);
}

// ── Per-client image overrides (selections suffix='dbi') ──
// Stored as a flat map: { itemKey: imageUrl }. Saved by admin via the
// Design Book editor in admin.html. Always wins over auto-fetched
// metadata when present.
async function loadImageOverrides(clientKey) {
  try {
    const res = await fetch(`/.netlify/functions/selections-storage?clientKey=${clientKey}&suffix=dbi`);
    if (!res.ok) return {};
    const j = await res.json();
    return (j && j.data && typeof j.data === 'object') ? j.data : {};
  } catch (e) {
    console.error('loadImageOverrides failed:', e);
    return {};
  }
}

// ── Render a single collage cell ─────────────────────
function renderCollageCell(item, tall = false) {
  // item.image may be either a real image URL fetched by product-meta or
  // a URL the client pasted into a *_photo field. Trust whichever is set;
  // the <img onerror> handler below catches anything that doesn't load.
  const imgSrc = item.image || '';
  const hasImg = !!imgSrc;
  // Prefer the fetched product title over the raw URL string in product field
  const cleanedProduct = stripUrl(item.product) || item._fetchedTitle || item.product || '';
  const primaryVal = cleanedProduct || item.material || item.style || item.finish || '';
  const label = esc(item.label);
  const val   = esc(primaryVal);

  return `
  <div class="collage-cell${tall?' tall':''}">
    <div class="collage-img-wrap">
      ${hasImg
        ? `<img src="${esc(imgSrc)}" alt="${label}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\\'img-placeholder\\'><div class=\\'img-placeholder-icon\\'>🖼️</div><div class=\\'img-placeholder-label\\'>${label}</div></div>'">`
        : `<div class="img-placeholder">
            <div class="img-placeholder-icon">🖼️</div>
            <div class="img-placeholder-label">${label}</div>
            ${val ? `<div class="img-placeholder-sku">${esc(primaryVal.slice(0,40))}</div>` : ''}
          </div>`
      }
    </div>
    <div class="collage-overlay">
      <div class="collage-item-label">${esc(CAT_LABELS[item.cat] || item.cat)}</div>
      <div class="collage-item-value">${label}${val && val !== label ? ' — ' + val.slice(0,50) : ''}</div>
    </div>
  </div>`;
}

// ── Render a catalog card ─────────────────────────────
function renderCatalogCard(item, num) {
  // Use the clean (URL-stripped) product text, or the auto-fetched title
  const cleanedProduct = stripUrl(item.product) || item._fetchedTitle || item.product || '';
  const primaryVal = cleanedProduct || item.material || item.style || item.finish || '';
  const sourceUrl  = item._sourceUrl || extractUrl(item.product);
  const imgSrc     = item.image || '';

  const details = [];
  if (item.material && item.material !== primaryVal) details.push(['Material', item.material]);
  if (item.color)   details.push(['Color', item.color]);
  if (item.finish)  details.push(['Finish', item.finish]);
  if (item.style && item.style !== primaryVal) details.push(['Style', item.style]);
  if (item.edge)    details.push(['Edge Profile', item.edge]);
  if (item.grout)   details.push(['Grout', item.grout]);
  if (item.height)  details.push(['Height', item.height]);
  if (item.crown)   details.push(['Crown', item.crown]);
  if (item.fuel)    details.push(['Fuel Type', item.fuel]);
  if (item._retailer) details.push(['Source', item._retailer]);

  return `
  <div class="catalog-card">
    <div class="catalog-card-img">
      ${imgSrc
        ? `<img src="${esc(imgSrc)}" alt="${esc(item.label)}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\\'img-placeholder\\' style=\\'height:100%\\'><div class=\\'img-placeholder-icon\\'>🖼️</div><div class=\\'img-placeholder-label\\'>${esc(item.label)}</div></div>'">`
        : `<div class="img-placeholder" style="height:100%">
            <div class="img-placeholder-icon">🖼️</div>
            <div class="img-placeholder-label">${esc(item.label)}</div>
          </div>`
      }
    </div>
    <div class="catalog-card-body">
      <div class="catalog-card-cat">${esc(CAT_LABELS[item.cat] || item.cat)} · ${esc(item.room)}</div>
      <div class="catalog-card-name">${esc(item.label)}</div>
      <div class="catalog-card-value">${esc(primaryVal || 'Selection pending')}</div>
      ${details.length ? `
      <div class="catalog-card-meta">
        ${details.map(([k,v]) => `
        <div class="catalog-meta-row">
          <span class="catalog-meta-label">${esc(k)}</span>
          <span class="catalog-meta-val">${esc(v)}</span>
        </div>`).join('')}
      </div>` : ''}
      ${item.notes ? `<div style="margin-top:10px;font-size:11px;color:var(--stone);font-style:italic;line-height:1.5">${esc(item.notes)}</div>` : ''}
      ${sourceUrl ? `<a href="${esc(sourceUrl)}" target="_blank" rel="noopener noreferrer" style="display:inline-block;margin-top:10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);text-decoration:none;border-bottom:1px solid var(--sage);padding-bottom:1px">View product →</a>` : ''}
      ${p._editMode ? renderEditOverlay(item) : ''}
    </div>
  </div>`;
}

// ── Edit-mode UI (admin only, visible when ?editMode=1) ──
function renderEditOverlay(item) {
  const current = DBI_OVERRIDES[item.itemKey] || '';
  return `
  <div class="dbi-edit" data-key="${esc(item.itemKey)}" style="margin-top:14px;padding:10px;background:rgba(184,151,62,0.06);border:1px dashed rgba(184,151,62,0.5);border-radius:4px">
    <div style="font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#b8973e;margin-bottom:6px">Manual Image Override</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <input type="url" placeholder="Paste an image URL (https://...) " value="${esc(current).replace(/"/g,'&quot;')}"
        style="flex:1;min-width:160px;padding:6px 9px;font-size:11px;font-family:inherit;border:1px solid var(--border);border-radius:3px;background:#fff;color:var(--charcoal)"
        oninput="dbiPreviewLocal(this)">
      <button onclick="dbiSaveCard(this)"
        style="padding:6px 11px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:none;background:var(--sage);color:#fff;border-radius:3px;cursor:pointer">Save</button>
      ${current ? `<button onclick="dbiClearCard(this)" style="padding:6px 11px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--stone);background:transparent;color:var(--stone);border-radius:3px;cursor:pointer">Clear</button>` : ''}
    </div>
    <div class="dbi-status" style="font-size:10px;color:var(--stone);margin-top:5px;min-height:13px"></div>
  </div>`;
}

// Find the catalog card containing a given button, return its key + input
function dbiCardCtx(btn) {
  const wrap = btn.closest('.dbi-edit');
  return {
    wrap,
    key:    wrap?.dataset.key,
    input:  wrap?.querySelector('input[type=url]'),
    status: wrap?.querySelector('.dbi-status'),
    card:   btn.closest('.catalog-card'),
  };
}

function dbiSetStatus(ctx, msg, kind) {
  if (!ctx.status) return;
  ctx.status.textContent = msg || '';
  ctx.status.style.color = kind === 'err' ? '#c33' : kind === 'ok' ? 'var(--sage)' : 'var(--stone)';
}

// Live preview (no save) — replace the card's image preview as user types
function dbiPreviewLocal(inputEl) {
  const ctx = dbiCardCtx(inputEl);
  const url = (inputEl.value || '').trim();
  const imgWrap = ctx.card?.querySelector('.catalog-card-img');
  if (!imgWrap) return;
  if (url && /^https?:\/\//.test(url)) {
    imgWrap.innerHTML = `<img src="${esc(url)}" alt="preview" loading="lazy" onerror="this.parentNode.innerHTML='<div class=\\'img-placeholder\\' style=\\'height:100%\\'><div class=\\'img-placeholder-icon\\'>🖼️</div><div class=\\'img-placeholder-label\\'>Bad URL or blocked image</div></div>'">`;
  }
}

// Save: write the full DBI map back to selections-storage suffix='dbi'
async function dbiPersist() {
  const ck = p.selectionsClientKey || p.id;
  const res = await fetch(`/.netlify/functions/selections-storage?clientKey=${ck}`, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ suffix: 'dbi', data: DBI_OVERRIDES }),
  });
  if (!res.ok) throw new Error('Save failed: ' + res.status);
}

window.dbiSaveCard = async function(btn) {
  const ctx = dbiCardCtx(btn);
  const url = (ctx.input.value || '').trim();
  if (!ctx.key) return;
  if (url && !/^https?:\/\//.test(url)) {
    dbiSetStatus(ctx, 'URL must start with http:// or https://', 'err');
    return;
  }
  dbiSetStatus(ctx, 'Saving…');
  try {
    if (url) DBI_OVERRIDES[ctx.key] = url;
    else delete DBI_OVERRIDES[ctx.key];
    await dbiPersist();
    dbiSetStatus(ctx, url ? 'Saved.' : 'Cleared.', 'ok');
    // Hide status after a moment
    setTimeout(() => dbiSetStatus(ctx, ''), 2200);
  } catch (e) {
    console.error('dbiSaveCard:', e);
    dbiSetStatus(ctx, 'Save failed — try again.', 'err');
  }
};

window.dbiClearCard = async function(btn) {
  const ctx = dbiCardCtx(btn);
  if (!ctx.key) return;
  ctx.input.value = '';
  delete DBI_OVERRIDES[ctx.key];
  dbiSetStatus(ctx, 'Saving…');
  try {
    await dbiPersist();
    dbiSetStatus(ctx, 'Cleared.', 'ok');
    // Restore the card to whatever the auto-fetch had previously found, if anything
    setTimeout(() => location.reload(), 600);
  } catch (e) {
    dbiSetStatus(ctx, 'Save failed.', 'err');
  }
};

// ── Render room collage spread ────────────────────────
function renderRoomSpread(group, items) {
  const groupItems = items.filter(item =>
    group.cats.includes(item.cat) &&
    (!group.roomFilter || group.roomFilter(item.room || ''))
  );
  if (!groupItems.length) return '';

  const count = groupItems.length;
  const layoutClass = count >= 4 ? 'layout-4'
                    : count === 3 ? 'layout-3'
                    : count === 2 ? 'layout-2'
                    : 'layout-featured';

  const cells = groupItems.slice(0, 4).map((item, i) =>
    renderCollageCell(item, i === 0 && count >= 3)
  ).join('');

  return `
  <div class="room-spread">
    <div class="room-spread-header">
      <div class="room-name"><em>${esc(group.name)}</em></div>
      <div class="room-item-count">${count} selection${count !== 1 ? 's' : ''}</div>
    </div>
    <div class="room-collage ${layoutClass}">
      ${cells}
    </div>
  </div>`;
}

// ── Enrich items with auto-fetched product metadata ─────
// For every item whose product field (or image field) is a URL we
// don't already have an image for, batch-call product-meta and merge
// the returned image/title back in. Plain-text products are left
// untouched and fall back to the placeholder card.
async function enrichItemsWithMeta(items) {
  // Find candidate URLs across the common fields where clients paste links.
  // Precedence rules:
  //   1. If item.image already looks like an actual image URL (ends in
  //      a common image extension), it's a manual paste and wins — skip
  //      the metadata fetch for this item.
  //   2. Otherwise we look for a product URL to fetch metadata for.
  //   3. Treat URLs in the image field (sometimes pasted there as a
  //      shortcut) as fallback source URLs — if the metadata fetch
  //      gives us a real image, use it; if it doesn't, keep the user's
  //      pasted URL as the image source so the <img> tag still tries.
  const isImageUrl = u => /\.(jpe?g|png|webp|gif|avif|svg)(\?|#|$)/i.test(u);
  const urlsToFetch = new Set();

  items.forEach(it => {
    const productUrl = extractUrl(it.product);
    const imageUrl   = extractUrl(it.image);

    // Manual photo paste (image URL ending in a real image extension) wins
    if (imageUrl && isImageUrl(imageUrl)) {
      it._manualImage = true;
      // Still expose a source URL so the "View product" link works when
      // the client pasted the product URL in the product field too
      if (productUrl) it._sourceUrl = productUrl;
      return;
    }

    const u = productUrl || imageUrl || '';
    if (u) {
      it._sourceUrl = u;
      urlsToFetch.add(u);
    }
  });

  if (!urlsToFetch.size) return items;

  // Batch fetch (function caps at 50 per call; chunk if more)
  const all = Array.from(urlsToFetch);
  const chunks = [];
  for (let i = 0; i < all.length; i += 40) chunks.push(all.slice(i, i + 40));

  const metaByUrl = new Map();
  for (const chunk of chunks) {
    try {
      const res = await fetch(`/.netlify/functions/product-meta`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ urls: chunk }),
      });
      if (!res.ok) continue;
      const j = await res.json();
      (j.results || []).forEach(r => { if (r && r.url) metaByUrl.set(r.url, r); });
      // The function canonicalizes URLs; key the map by the original chunk URL too
      chunk.forEach(orig => {
        if (!metaByUrl.has(orig)) {
          // Loose match by hostname + path
          for (const [k, v] of metaByUrl.entries()) {
            try {
              const a = new URL(orig), b = new URL(k);
              if (a.hostname === b.hostname && a.pathname === b.pathname) { metaByUrl.set(orig, v); break; }
            } catch {}
          }
        }
      });
    } catch (e) { console.error('product-meta batch failed:', e); }
  }

  // Merge back into items — manual photo URLs (set above) are preserved.
  items.forEach(it => {
    if (it._manualImage) return;       // manual paste wins, leave alone
    const u = it._sourceUrl;
    if (!u) return;
    const meta = metaByUrl.get(u);
    if (!meta) return;
    if (meta.image && !meta.error) {
      it.image = meta.image;
    }
    if (meta.title) {
      it._fetchedTitle = meta.title;
    }
    if (meta.retailer) {
      it._retailer = meta.retailer;
    }
    if (meta.error) {
      it._fetchError = meta.error;
    }
  });

  return items;
}

// ── Main render ───────────────────────────────────────
async function renderBook() {
  // Refresh session for latest data (skip for admin preview — no session)
  if (!p._adminPreview) {
    try {
      const fresh = await AUTH.refreshSession(p.id);
      if (fresh) p = fresh;
    } catch(e) {}
  }

  const clientKey = p.selectionsClientKey || p.id;
  const [{ answers, saved, rooms }, overrides] = await Promise.all([
    loadSelections(clientKey),
    loadImageOverrides(clientKey),
  ]);
  // Stash overrides in a module-level so the per-card save handlers can
  // mutate + persist without re-fetching.
  DBI_OVERRIDES = overrides;

  let items = parseSelections(answers, saved, rooms);

  // Manual overrides win over everything. Apply BEFORE enrich so the auto
  // fetcher knows it doesn't need to bother with these URLs (saves on
  // Microlink quota).
  items.forEach(it => {
    if (overrides[it.itemKey]) {
      it.image = overrides[it.itemKey];
      it._manualImage = true;   // skip enrich for this item
    }
  });

  // Pull product images/titles for any items whose product field is a URL
  try {
    items = await enrichItemsWithMeta(items);
  } catch (e) { console.error('enrichItemsWithMeta failed:', e); }

  const el = document.getElementById('book-content');

  if (!items.length) {
    el.innerHTML = `
    <div class="empty-book">
      <div class="empty-book-title">No selections completed yet</div>
      <div class="empty-book-sub">Complete your selections in the Selections section of your portal.<br>Your Design Book will populate as each section is finished.</div>
    </div>`;
    fadeOut();
    return;
  }

  const date = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });

  // Edit mode banner — only when admin opened with ?editMode=1
  const editBanner = p._editMode ? `
  <div style="position:sticky;top:48px;z-index:50;background:#b8973e;color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--sans);box-shadow:0 2px 8px rgba(0,0,0,.12)">
    <div>
      <div style="font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.85">Edit Mode</div>
      <div style="font-size:13px;font-weight:500;margin-top:2px">Paste an image URL into any product card to override its image. Each save is per-item.</div>
    </div>
    <a href="${location.pathname}${location.search.replace(/[?&]editMode=1/g,'').replace(/^\\?$/,'') || '?clientKey=' + esc(clientKey)}" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.6);padding:7px 14px;border-radius:3px">Exit edit mode</a>
  </div>` : '';

  let html = editBanner + `
  <!-- COVER -->
  <div class="cover-page">
    <div style="position:absolute;top:40px;right:40px"><img src="assets/logo-light.png" alt="Six Arrows Co." style="width:140px;opacity:.6"></div>
    <div class="cover-eyebrow">Custom Home Build · Design Selections Package</div>
    <div class="cover-title">${esc(p.clientName || p.projectName)}<br><em>Design Book</em></div>
    <div class="cover-subtitle">${esc(p.projectName || 'Custom Home')}</div>
    <div class="cover-divider"></div>
    <div class="cover-meta">
      <div class="cover-meta-item"><label>Location</label><span>${esc(p.location || '—')}</span></div>
      <div class="cover-meta-item"><label>Prepared</label><span>${date}</span></div>
      <div class="cover-meta-item"><label>Selections</label><span>${items.length} Items</span></div>
    </div>
    <div class="cover-sa">Six Arrows Co. · Bowling Green, KY</div>
  </div>

  <!-- PART 1: Room Spreads -->
  <div class="section-divider">
    <div class="section-divider-line"></div>
    <div class="section-divider-label">Part One · Room by Room</div>
    <div class="section-divider-line"></div>
  </div>`;

  // Room collage spreads
  ROOM_GROUPS.forEach(group => {
    html += renderRoomSpread(group, items);
  });

  // Part 2: Full catalog
  html += `
  <div class="section-divider">
    <div class="section-divider-line"></div>
    <div class="section-divider-label">Part Two · Complete Selections Catalog</div>
    <div class="section-divider-line"></div>
  </div>`;

  // Group by category for the catalog
  const ALL_CATS = ['countertops','flooring','appliances','plumbing','tile','lighting','hardware','doors','specialty_trim','exterior_finishes','hvac','fireplace','paint'];
  let catNum = 0;
  ALL_CATS.forEach(catId => {
    const catItems = items.filter(i => i.cat === catId);
    if (!catItems.length) return;
    catNum++;
    html += `
    <div class="cat-header">
      <div class="cat-header-num">0${catNum}</div>
      <div class="cat-header-info">
        <div class="cat-header-name">${esc(CAT_LABELS[catId] || catId)}</div>
        <div class="cat-header-count">${catItems.length} selection${catItems.length !== 1 ? 's' : ''}</div>
      </div>
    </div>
    <div class="catalog-grid">
      ${catItems.map((item, i) => renderCatalogCard(item, i + 1)).join('')}
    </div>`;
  });

  el.innerHTML = html;
  fadeOut();
}

function fadeOut() {
  const loading = document.getElementById('loading-screen');
  loading.classList.add('fade-out');
  setTimeout(() => loading.remove(), 700);
}

renderBook();
</script>
</body>
</html>
