<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coordinator">
<meta name="theme-color" content="#2e2e2e">
<link rel="apple-touch-icon" href="/coordinator-icon.png">
<link rel="manifest" href="/coordinator.webmanifest">
<title>Six Arrows Coordinator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone first. A top bar names the screen, a bottom tab bar switches
   between Today, Board, Messages and More, and a task opens as a full page.
   From 760px (iPad) the board shows the list and the open task side by side. */
:root {
  --bg: #f1f0ea; --surface: #ffffff; --sunk: #e8e7df; --ink: #2e2e2e; --muted: #676b61; --line: #d9d8ce;
  --sage: #757f69; --sage-ink: #4f5844; --sage-wash: #e6e9e0;
  --ok: #2e7a4c; --ok-wash: #e1efe6; --warn: #a76b12; --warn-wash: #f6ebd6; --bad: #b0412b; --bad-wash: #f6e2dc;
  --na: #b5b7ad; --wk: #f4f3ee; --soft: #3d6b74; --soft-wash: #dceaec; --c-req: #4f74a0; --c-order: #7d62a8; --c-choice: #a8557f; --bar: #2e2e2e; --bar-ink: #f1f0ea;
  --f-head: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Inter", -apple-system, system-ui, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --tabh: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161715; --surface: #21231f; --sunk: #2a2c27; --ink: #ecebe4; --muted: #a2a59a; --line: #363833;
  --sage: #9ba78b; --sage-ink: #c3cdb4; --sage-wash: #2c3228;
  --ok: #6cc28f; --ok-wash: #1d3125; --warn: #e2a64a; --warn-wash: #382e1b; --bad: #ec8a74; --bad-wash: #3b2520;
  --na: #5c5f56; --wk: #1b1c1a; --soft: #8cc6d0; --soft-wash: #1e3135; --c-req: #86a9d4; --c-order: #b39ddb; --c-choice: #e091ba; --bar: #0f100e; --bar-ink: #ecebe4; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161715; --surface: #21231f; --sunk: #2a2c27; --ink: #ecebe4; --muted: #a2a59a; --line: #363833;
  --sage: #9ba78b; --sage-ink: #c3cdb4; --sage-wash: #2c3228;
  --ok: #6cc28f; --ok-wash: #1d3125; --warn: #e2a64a; --warn-wash: #382e1b; --bad: #ec8a74; --bad-wash: #3b2520;
  --na: #5c5f56; --wk: #1b1c1a; --soft: #8cc6d0; --soft-wash: #1e3135; --c-req: #86a9d4; --c-order: #b39ddb; --c-choice: #e091ba; --bar: #0f100e; --bar-ink: #ecebe4; color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
[hidden] { display: none !important }
html, body { margin: 0; height: 100% }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-text-size-adjust: 100% }
h1, h2, h3 { font-family: var(--f-head); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance }
.mono, .date { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
button, input, select, textarea { font: inherit; color: inherit }
input, select, textarea { font-size: 16px } /* 16px stops iPhone zooming into fields */
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--bar); color: var(--bar-ink);
       padding: calc(var(--safe-t) + 10px) var(--gut-r) 10px var(--gut-l); display: flex; align-items: center; gap: 10px; min-height: 52px }
.top h1 { font-size: 22px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.top .asof { font-size: 11.5px; opacity: .65; text-align: right; line-height: 1.2 }
.back { background: none; border: 0; color: inherit; font-size: 16px; padding: 8px 8px 8px 0; display: flex; gap: 4px; align-items: center; min-height: 44px }
.back svg { width: 18px; height: 18px }

/* bottom tabs (phone); a side rail from 760px */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
        display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 env(safe-area-inset-right, 0px) var(--safe-b) env(safe-area-inset-left, 0px) }
.tabs a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: var(--tabh);
          color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600 }
.tabs a svg { width: 24px; height: 24px }
.tabs a[aria-current="page"] { color: var(--sage-ink) }
.tabs .badge { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--bad); color: #fff; font: 600 11px/18px var(--f-body);
               min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; text-align: center }

main { padding: 14px var(--gut-r) calc(var(--tabh) + var(--safe-b) + 24px) var(--gut-l); max-width: 1180px; margin: 0 auto }
.stack { display: grid; gap: 18px }

/* summary chips */
.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0 }
.stat label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.stat b { font-family: var(--f-head); font-size: 26px; font-weight: 600; line-height: 1.15 }
.stat.bad b { color: var(--bad) } .stat.ok b { color: var(--ok) }
.stat span { display: block; font-size: 12px; color: var(--muted) }

/* sections and lists */
.sec h2 { font-size: 20px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.sec h2 small { font: 500 12.5px var(--f-body); color: var(--muted) }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line);
        padding: 12px 14px; min-height: 56px; color: inherit; text-decoration: none }
.item:first-child { border-top: 0 }
.item:active { background: var(--sunk) }
.item .main { flex: 1; min-width: 0 }
.item .t { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.item .m { font-size: 13px; color: var(--muted); margin-top: 2px }
.item .r { text-align: right; flex: none; font-size: 13px }
.item .chev { color: var(--na); flex: none; width: 16px; height: 16px }
svg { max-width: 24px; max-height: 24px }
.late .r .date { color: var(--bad); font-weight: 600 }
.kind { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--sage-ink) }
.empty { color: var(--muted); padding: 18px 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; text-align: center }

/* job switch and filters */
.seg { display: flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 3px }
.seg button { flex: 1; border: 0; background: none; border-radius: 8px; padding: 9px 6px; font-weight: 600; font-size: 14px; color: var(--muted); min-height: 40px }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12) }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut-l)); padding: 2px var(--gut-r) 2px var(--gut-l) }
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 7px 14px; font-size: 13.5px; font-weight: 500; min-height: 36px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

/* task cards */
.card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: inherit }
.card:active { background: var(--sunk) }
.card[aria-current="true"] { border-color: var(--sage); box-shadow: 0 0 0 1px var(--sage) }
.cards { display: grid; gap: 8px }
.card .row1 { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start }
.card .t { font-weight: 600 }
.card .m { font-size: 13px; color: var(--muted); margin-top: 2px }
.card .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px }
.gates { display: flex; gap: 10px }
.g { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: .02em }
.dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none }
.dot.green { background: var(--ok) } .dot.red { background: var(--bad) }
.dot.unknown { border: 2px solid var(--warn) } .dot.not_applicable { border: 1px dashed var(--na); width: 12px; height: 12px; margin: 1px }
.pill { font: 600 12px var(--f-body); padding: 3px 9px; border-radius: 12px; white-space: nowrap }
.s-ok { background: var(--ok-wash); color: var(--ok) } .s-warn { background: var(--warn-wash); color: var(--warn) }
.s-bad { background: var(--bad-wash); color: var(--bad) } .s-plain { background: var(--sunk); color: var(--muted) }
.edited { display: inline-block; margin-top: 6px; font-size: 11.5px; font-weight: 600; color: var(--sage-ink); background: var(--sage-wash); padding: 2px 8px; border-radius: 10px }

/* task page */
.sheet { display: grid; gap: 16px }
.sheet .head .t { font-family: var(--f-head); font-size: 26px; font-weight: 600; line-height: 1.1 }
.sheet .head .m { color: var(--muted); font-size: 14px; margin-top: 4px }
.gatelist .item { min-height: 52px; align-items: flex-start }
.gatelist .item .dot { margin-top: 4px }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px }
.facts dt { color: var(--muted) } .facts dd { margin: 0; font-weight: 500 }
.acts { display: grid; gap: 8px }
.act { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.act > button { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 0 14px; min-height: 52px; font-weight: 600; text-align: left }
.act > button svg { width: 16px; height: 16px; color: var(--na); transition: transform .15s }
.act.open > button svg { transform: rotate(90deg) }
.act form { display: grid; gap: 10px; padding: 0 14px 14px }
.act label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500 }
.act input, .act select { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg) }
.btn { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; padding: 0 16px }
.btn.primary { background: var(--sage); border-color: var(--sage); color: #fff }
.btn.block { width: 100% }
.btn:disabled { opacity: .5 }
details.dod { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px }
details.dod summary { font-weight: 600; cursor: pointer; min-height: 28px }
details.dod ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px }

/* messages */
.msg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px }
.msg .t { font-family: var(--f-head); font-size: 19px; font-weight: 600 }
.msg .m { font-size: 13px; color: var(--muted) }
.msg textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px 12px; resize: vertical; line-height: 1.45 }
.row { display: flex; gap: 8px } .row .btn { flex: 1 }
.decided { font-weight: 600; font-size: 14px } .decided.approved { color: var(--ok) } .decided.skipped { color: var(--muted) }

/* more */
.key dl { margin: 0; display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px }
.key dt { font-weight: 600; display: flex; align-items: center; gap: 8px } .key dd { margin: 0; color: var(--muted); font-size: 14px }
.diff { font-size: 14px }
.note { font-size: 13px; color: var(--muted) }

/* login and toast */
.login { max-width: 420px; margin: 8vh auto 0; display: grid; gap: 12px }
.login h1 { font-size: 34px } .login p { margin: 0; color: var(--muted) }
.login input { min-height: 50px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
.warn-text { color: var(--bad); font-weight: 500 }
.toast { position: fixed; left: var(--gut-l); right: var(--gut-r); bottom: calc(var(--tabh) + var(--safe-b) + 12px); z-index: 30;
         background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-size: 14.5px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 560px; margin: 0 auto }
.toast.bad { background: var(--bad); color: #fff }

/* iPad and wider: side rail instead of bottom tabs, list and task side by side */
@media (min-width: 760px) {
  .tabs { top: 0; bottom: 0; right: auto; width: 84px; grid-template-columns: 1fr; grid-auto-rows: 76px; align-content: start;
          border-top: 0; border-right: 1px solid var(--line); padding: calc(var(--safe-t) + 64px) 0 var(--safe-b) env(safe-area-inset-left, 0px) }
  .top, main { margin-left: 84px }
  .top { padding-left: 20px } main { padding: 18px 24px 40px; max-width: none }
  .toast { bottom: 20px; left: 104px }
  .summary { grid-template-columns: repeat(4, minmax(0, 1fr)) }
  .split { display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); gap: 20px; align-items: start }
  .split .pane { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; padding-bottom: 20px }
  .chips { margin: 0; padding: 2px 0 }
}
@media (min-width: 760px) and (max-width: 979px) { .split { grid-template-columns: minmax(260px, 340px) minmax(0, 1fr) } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

/* ---------------------------------------------------------------- desktop
   A computer with a mouse and a wide window gets its own layout: navigation
   across the top, dense tables, and the task in a panel on the right so the
   list stays in view. Phones and iPads never see it. */
body.desk { font-size: 14px }
body.desk .tabs { display: none }
body.desk .top, body.desk main { margin-left: 0 }
body.desk .top { padding: 0 24px; min-height: 54px; gap: 22px }
body.desk .top .brand { font-family: var(--f-head); font-size: 20px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap }
body.desk .top .brand small { font-weight: 500; opacity: .6; margin-left: 6px; font-size: 14px; letter-spacing: .1em }
body.desk .nav { display: flex; gap: 2px; flex: 1; min-width: 0 }
body.desk .nav a { color: var(--bar-ink); opacity: .78; text-decoration: none; padding: 7px 12px; border-radius: 6px; font-weight: 500; font-size: 14.5px; display: flex; gap: 7px; align-items: center; white-space: nowrap }
body.desk .nav a:hover { opacity: 1; background: rgba(255,255,255,.08) }
body.desk .nav a[aria-current="page"] { opacity: 1; background: var(--sage); color: #fff }
body.desk .nav .n { background: var(--bad); color: #fff; font-size: 11px; font-weight: 600; border-radius: 9px; padding: 0 6px; line-height: 17px }
body.desk .top .asof { font-family: var(--f-mono); font-size: 11.5px }
body.desk main { padding: 20px 24px 48px; max-width: 1500px; transition: margin-right .15s }
body.desk.panel-open main { margin-right: 460px }
body.desk .msg textarea { min-height: 170px }
body.desk .toast { left: 24px; right: auto; bottom: 20px; margin: 0; max-width: 480px }

.d-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap }
.d-head h2 { font-size: 30px; line-height: 1.1 }
.d-head p { margin: 2px 0 0; color: var(--muted) }
.d-note { font-size: 12.5px; color: var(--sage-ink); background: var(--sage-wash); padding: 5px 10px; border-radius: 6px }
.d-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 8px }
.d-stats .stat { border: 0; border-radius: 0; padding: 10px 16px }
.d-stats .stat + .stat { border-left: 1px solid var(--line) }
.d-jobs { display: grid; gap: 10px }
.d-job { display: grid; grid-template-columns: 170px 1fr; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.d-job > a { display: flex; flex-direction: column; justify-content: center; padding: 10px 16px; color: inherit; text-decoration: none; border-right: 1px solid var(--line); background: var(--sunk) }
.d-job > a b { font-family: var(--f-head); font-size: 22px; font-weight: 600 }
.d-job > a span { font-size: 12px; color: var(--sage-ink); font-weight: 600 }
.d-job .d-stats { border: 0; border-radius: 0 }
.d-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 14px; align-items: start }
body.desk.panel-open .d-groups { grid-template-columns: 1fr }
.d-group { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.d-group h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .07em; color: var(--sage-ink); padding: 9px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between }
.d-group h3 small { color: var(--muted); font: 500 12px var(--f-body); letter-spacing: 0; text-transform: none }
.d-row { display: grid; grid-template-columns: 1fr auto; gap: 1px 14px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 7px 14px; color: inherit }
.d-row:first-of-type { border-top: 0 }
.d-row:hover { background: var(--sunk) }
.d-row[aria-current="true"], tr.d-tr[aria-current="true"] td { background: var(--sage-wash) }
.d-row .t { font-weight: 500 }
.d-row .m { grid-column: 1; font-size: 12.5px; color: var(--muted) }
.d-row .date { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 13px }
.d-row.late .date { color: var(--bad); font-weight: 600 }
.d-filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.d-filters .chip { min-height: 30px; padding: 4px 12px; font-size: 13px }
.d-filters .count { margin-left: auto; color: var(--muted); font-size: 12.5px }
.d-table { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: auto }
.d-table table { border-collapse: collapse; width: 100% }
.d-table th { position: sticky; top: 0; background: var(--sunk); font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
.d-table th.gc, .d-table td.gc { text-align: center; width: 54px; padding-left: 4px; padding-right: 4px }
.d-table td.date { white-space: nowrap }
.d-table td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
.d-table tr.d-tr { cursor: pointer }
.d-table tr.d-tr:hover td { background: var(--sunk) }
.d-table .task { font-weight: 500 }
.d-table .task small { display: block; font-weight: 400; color: var(--muted); font-size: 12px }
.d-table .sub { color: var(--muted); font-size: 13px }
.d-table .sub.none { color: var(--bad) }
.d-table .edited { margin: 3px 0 0 }
.d-key { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted) }
.d-key span { display: inline-flex; gap: 6px; align-items: center }
.d-msgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; align-items: start }
.d-narrow { max-width: 860px }

.panel { position: fixed; top: 54px; right: 0; bottom: 0; width: 460px; background: var(--bg); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0,0,0,.08);
         overflow-y: auto; padding: 16px 20px 40px; z-index: 15 }
.panel .close { position: sticky; top: 0; float: right; margin: -6px -8px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px; font-size: 20px; line-height: 1; color: var(--muted) }
.panel .close:hover { color: var(--ink) }
.panel .sheet .head .t { font-size: 24px; padding-right: 36px }
.panel .act > button, .panel .btn { min-height: 40px }
.panel .act input, .panel .act select { min-height: 38px; font-size: 14px; padding: 6px 10px }
.panel .gatelist .item { min-height: 0; padding: 8px 12px }
body.desk .act > button { min-height: 42px }

/* subs */
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px }
.tck { display: flex; gap: 9px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-height: 44px; font-size: 14px; cursor: pointer }
.tck input { width: 20px; height: 20px; accent-color: var(--sage); flex: none; margin: 0 }
.tck:has(input:checked) { border-color: var(--sage); background: var(--sage-wash) }
.tchips { display: flex; flex-wrap: wrap; gap: 4px }
.tchip { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--sunk); color: var(--ink); white-space: nowrap }
.tchip.add { background: var(--ok-wash); color: var(--ok); font-weight: 600 }
.tchip.del { background: var(--bad-wash); color: var(--bad); text-decoration: line-through }
.tchip.muted { color: var(--muted); background: transparent; border: 1px dashed var(--line) }
.callout { background: var(--warn-wash); color: var(--ink); border-radius: 10px; padding: 10px 14px; font-size: 14px }
.callout b { color: var(--warn) }
.subtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.subtools input, .subtools select { min-height: 40px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
.subtools input { flex: 1; min-width: 180px }
.diffrow { display: grid; grid-template-columns: 64px 1fr; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted) }
.d-table td.tr-cell { min-width: 220px }
.panel form .btn.primary, body:not(.desk) .sheet form .btn.primary { position: sticky; bottom: calc(var(--safe-b) + 8px); box-shadow: 0 6px 18px rgba(0,0,0,.15) }
body:not(.desk) .sheet form .btn.primary { bottom: calc(var(--tabh) + var(--safe-b) + 8px) }

/* ---------------------------------------------------------------- timeline */
:root { --nw: 300px }
body:not(.desk) { --nw: 148px }
.seg.mode { max-width: 280px }
body.desk .d-head .seg.mode { width: 220px; flex: none }
body.desk .seg.mode button { min-height: 32px; padding: 6px; font-size: 13.5px }
.tl { display: grid; gap: 10px; min-width: 0 }
.tl-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.tl-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface) }
.tl-seg button { border: 0; background: none; padding: 6px 11px; font: 600 12.5px var(--f-body); color: var(--muted); min-height: 34px }
.tl-seg button + button { border-left: 1px solid var(--line) }
.tl-seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.tl-check { display: flex; gap: 6px; align-items: center; font-size: 13px; min-height: 34px }
.tl-check input { width: 18px; height: 18px; accent-color: var(--sage) }
.tl-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font: 600 13px var(--f-body); min-height: 34px }
.tl-btn.primary { background: var(--sage); border-color: var(--sage); color: #fff }
.tl-finish { margin-left: auto; font-size: 13.5px }
.tl-muted { color: var(--muted); font-size: 12px }
.tl-banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--sage-wash); border: 1px solid var(--sage); border-radius: 10px; padding: 8px 12px; font-size: 14px }
.tl-btext { flex: 1; min-width: 240px }
.tl-held { color: var(--warn); font-weight: 600 } .tl-late { color: var(--bad); font-weight: 600 } .tl-early { color: var(--ok); font-weight: 600 }
.tl-scroll { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); height: calc(100vh - 250px); min-height: 380px; position: relative; overscroll-behavior: contain }
body:not(.desk) .tl-scroll { height: calc(100vh - var(--tabh) - var(--safe-b) - 300px); min-height: 360px }
.tl-canvas { width: calc(var(--nw) + var(--tl-w)); position: relative }
.tl-head { display: flex; position: sticky; top: 0; z-index: 6; background: var(--sunk); border-bottom: 1px solid var(--line); height: 46px }
.tl-corner { position: sticky; left: 0; z-index: 7; width: var(--nw); flex: none; background: var(--sunk); border-right: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; padding: 0 10px; font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.tl-corner .tl-muted { text-transform: none; letter-spacing: 0; font-weight: 500 }
.tl-scale { position: relative; width: var(--tl-w); flex: none; overflow: hidden }
.tl-months span { position: absolute; top: 4px; font: 600 12px var(--f-body); color: var(--ink); padding-left: 4px; border-left: 1px solid var(--line); white-space: nowrap }
.tl-ticks span { position: absolute; top: 24px; height: 22px; font: 500 11px var(--f-mono); color: var(--muted); padding: 3px 0 0 3px; border-left: 1px solid var(--line); overflow: hidden; box-sizing: border-box }
.tl-body { position: relative }
.tl-row { display: flex; height: 30px; box-sizing: border-box; border-bottom: 1px solid var(--line) }
.tl-name { position: sticky; left: 0; z-index: 3; width: var(--nw); flex: none; background: var(--surface); border: 0; border-right: 1px solid var(--line); text-align: left; padding: 0 10px; display: flex; flex-direction: column; justify-content: center; min-width: 0; overflow: hidden; color: inherit; cursor: pointer; font: inherit }
.tl-name:hover { background: var(--sunk) }
.tl-tn { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2 }
.tl-name .tl-muted { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25 }
.tl-row.sel .tl-name, .tl-row.sel .tl-track { background-color: var(--sage-wash) }
.tl-phase .tl-name { flex-direction: row; align-items: center; justify-content: flex-start; gap: 6px; background: var(--sunk) }
.tl-phase .tl-track { background-color: var(--sunk) }
.tl-caret { color: var(--muted); width: 12px }
.tl-ph { font-family: var(--f-head); font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0 }
.tl-track { position: relative; width: var(--tl-w); flex: none; background-image: linear-gradient(to right, var(--wk) 0, var(--wk) calc(var(--px) * 2), transparent calc(var(--px) * 2)); background-size: calc(var(--px) * 7) 100%; background-repeat: repeat-x }
.tl-span { position: absolute; top: 13px; height: 4px; border-radius: 2px; background: var(--sage) } .tl-span.done { background: var(--na) }
.tl-layer { position: absolute; top: 0; bottom: 0; left: var(--nw); right: 0; pointer-events: none; z-index: 2 }
.tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bad); opacity: .75 }
.tl-links { position: absolute; top: 0; left: 0; overflow: visible }
.ln { fill: none; stroke-width: 1.7 }
.ln.ln-hard { stroke: var(--ink) } .ln.ln-partial { stroke: var(--warn); stroke-dasharray: 6 3 } .ln.ln-soft { stroke: var(--soft); stroke-dasharray: 2 3 }
.lnd.ln-hard { fill: var(--ink) } .lnd.ln-partial { fill: var(--warn) } .lnd.ln-soft { fill: var(--soft) }
.tl-bar { position: absolute; top: 6px; height: 18px; border-radius: 4px; display: flex; align-items: center; font-size: 11px; white-space: nowrap; z-index: 1; box-sizing: border-box; --c: var(--na) }
.tl-bar.k-work { --c: var(--sage) } .tl-bar.k-insp { --c: var(--warn) } .tl-bar.k-req { --c: var(--c-req) } .tl-bar.k-order { --c: var(--c-order) }
.tl-bar.k-choice { --c: var(--c-choice) } .tl-bar.k-mile { --c: var(--ink) } .tl-bar.k-office { --c: var(--muted) }
.tl-bar.booked { background: var(--c); color: #fff }
.tl-bar.fc { background: color-mix(in srgb, var(--c) 22%, var(--surface)); border: 1.5px solid var(--c); color: var(--ink) }
.tl-bar.prog { background: var(--c); background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.28) 6px 12px); color: #fff }
.tl-bar.done { background: var(--line); color: var(--muted) }
.tl-bar.crit { box-shadow: 0 0 0 2px var(--bad) }
.tl-bar.k-order:not(.pt) { height: 10px; top: 10px }
.tl-bar.pt { width: 12px; height: 12px; top: 9px; transform: rotate(45deg); border-radius: 2px; margin-left: -6px }
.tl-bar.pt .tl-lab { display: none } .tl-bar.pt .tl-marks { transform: rotate(-45deg); left: 140% }
.tl-arrive { position: absolute; top: -4px; width: 3px; height: 18px; background: var(--c); border-radius: 1px }
.tl-lab { padding: 0 6px; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0 }
.tl-marks { position: absolute; left: 100%; margin-left: 4px; display: flex; gap: 4px; align-items: center; color: var(--muted); pointer-events: none }
.tl-marks i { font-style: normal; font-size: 12px; line-height: 1 }
.tl-red { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block }
.tl-ovl { color: var(--warn); font-weight: 700 } .tl-edit { color: var(--sage-ink) } .tl-marks .tl-edit { font-size: 20px }
.tl-bar.movable { cursor: grab; touch-action: none }
.tl-bar.dragging { cursor: grabbing; box-shadow: 0 4px 14px rgba(0,0,0,.25); z-index: 4 }
.tl-bar.moved { outline: 2px dashed var(--warn); outline-offset: 1px }
.tl-grip { position: absolute; right: -4px; top: -2px; bottom: -2px; width: 10px; cursor: ew-resize }
.tl-key { gap: 12px 16px }
.tl-key .tl-swatch { position: static; display: inline-block; width: 26px; height: 12px; top: auto; vertical-align: middle; transform: none; margin: 0 }
.tl-key .tl-swatch.k-order { height: 8px }
.tl-lswatch { display: inline-block; width: 26px; height: 0; border-top: 2px solid var(--ink); vertical-align: middle }
.tl-lswatch.ln-partial { border-top: 2px dashed var(--warn) } .tl-lswatch.ln-soft { border-top: 2px dotted var(--soft) }

/* how it connects */
.conn .list { overflow: hidden }
.conn-h { padding: 8px 14px 5px; font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); background: var(--sunk); border-top: 1px solid var(--line) }
.conn-h:first-child { border-top: 0 }
.conn-row { gap: 12px; flex-wrap: wrap }
.conn-ctl { display: flex; gap: 6px; align-items: center }
.conn-ctl input { min-height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--bg); width: 150px }
.conn-ctl input[type="number"] { width: 80px }
.conn-ctl .btn, .conn-row > .btn { min-height: 40px }
.conn-link > .item { border-top: 1px solid var(--line) }
.lk { font: 600 11.5px var(--f-body); padding: 1px 7px; border-radius: 9px }
.lk-hard { background: var(--bad-wash); color: var(--bad) } .lk-partial { background: var(--warn-wash); color: var(--warn) } .lk-soft { background: var(--soft-wash); color: var(--soft) }
.drives { color: var(--sage-ink); font-weight: 600 }
.conn-edit { display: grid; gap: 10px; padding: 4px 14px 14px; background: var(--bg); border-top: 1px dashed var(--line) }
.conn-edit .seg { margin-top: 10px }
.conn-lag { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap }
.conn-lag input { width: 70px; min-height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--surface) }
.conn-effect { margin: 0; font-weight: 600; font-size: 14px }
</style>

<body>
<header class="top" id="top"><h1>Coordinator</h1></header>
<main id="main"><div class="empty">Loading…</div></main>
<nav class="tabs" id="tabs" aria-label="Sections" hidden></nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/coordinator-timeline.js"></script>
<script>
(function () {
  "use strict";
  const API = "/.netlify/functions/";
  const KEY = "sa-coord-passcode";
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const fmt = (iso) => { if (!iso) return ""; const [y, m, d] = iso.slice(0, 10).split("-").map(Number); return MON[m - 1] + " " + d; };
  const fmtY = (iso) => iso ? fmt(iso) + ", " + iso.slice(0, 4) : "";
  const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const slug = (name) => name.split(/[\s(]/)[0].toLowerCase().replace(/[^a-z0-9-]/g, "");
  const short = (name) => name.split(" (")[0];
  const wide = () => window.matchMedia("(min-width: 760px)").matches;
  // a computer: wide window and a mouse. iPads report a coarse pointer and keep the tablet layout.
  const desk = () => window.matchMedia("(min-width: 1100px) and (hover: hover) and (pointer: fine)").matches;

  const ICON = {
    today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 3v3M16 3v3M8 14l2.5 2.5L16 12"/></svg>',
    board: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="4" width="17" height="16" rx="2"/><circle cx="8" cy="9" r="1.3" fill="currentColor"/><circle cx="8" cy="15" r="1.3" fill="currentColor"/><path d="M11.5 9h5.5M11.5 15h5.5"/></svg>',
    messages: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5.5h16v11H9l-5 4v-15z"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></svg>',
    chev: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>',
    back: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>',
  };
  const svg = (name, cls) => { const s = el("span"); s.innerHTML = ICON[name]; const g = s.firstChild; g.setAttribute("aria-hidden", "true"); if (cls) g.setAttribute("class", cls); return g; };

  const GATES = [
    ["sequence", "Seq", "Sequence", "Everything that has to happen first is done: earlier work, inspections, permits, materials on site."],
    ["scope", "Scope", "Scope", "This visit has its own written scope and definition of done, issued to the sub and acknowledged."],
    ["booking", "Book", "Booking", "The sub has confirmed the dates."],
    ["money", "$", "Money", "There is an accepted price, with payment terms, matching the budget line."],
    ["paperwork", "Papers", "Paperwork", "The sub's W-9 is on file and insurance is current through the work."],
    ["site_ready", "Site", "Site ready", "The PM has released the site for this crew."],
  ];
  const TYPES = {
    work: ["Crew on site", "A sub's crew doing physical work at the house."],
    external_gate: ["Inspection or permit", "An outside sign-off. Called the day everything ahead of it is done, never booked ahead."],
    external_request: ["Request", "Something we ask a utility or 811 for, ahead of when it is needed."],
    material_order: ["Material order", "Placed by its latest order date so it arrives before the work that needs it."],
    decision: ["Client selection", "A choice the client makes, due when the order or work it feeds needs it."],
    admin_task: ["Office", "Office work with a date and an owner."],
    client_meeting: ["Client meeting", "A walkthrough or meeting with the client."],
    pm_walk: ["PM walk", "A walkthrough by the PM."],
    milestone: ["Milestone", "A marker that a stage is complete."],
  };
  const KIND = { booking_request: "Booking request", follow_up: "Follow-up", paperwork_request: "Paperwork request" };

  let passcode = null, RES = null, busy = false, jobKey = null, filter = "all", openAct = null;
  try { passcode = localStorage.getItem(KEY); jobKey = localStorage.getItem("sa-coord-job"); } catch (e) {}

  // ------------------------------------------------------------------ data
  async function load() {
    if (!passcode) return renderLogin();
    let r;
    try { r = await fetch(API + "coord-board", { headers: { Authorization: "Bearer " + encodeURIComponent(passcode) }, cache: "no-store" }); }
    catch (e) { return renderError(navigator.onLine === false ? "You're offline. Reconnect and try again." : "The coordinator didn't answer. Try again in a minute."); }
    if (r.status === 401) { forget(); return renderLogin("That passcode didn't work."); }
    const body = await r.json().catch(() => ({}));
    if (!r.ok) return renderError(body.error || "The coordinator returned an error.");
    if (!body.snapshot) return renderError("The coordinator hasn't run yet. It runs every weekday morning.");
    RES = body;
    const jobs = body.snapshot.jobs.map((j) => slug(j.job));
    if (!jobs.includes(jobKey)) jobKey = jobs[0];
    render();
  }
  function forget() { passcode = null; try { localStorage.removeItem(KEY); } catch (e) {} }

  async function edit(payload) {
    if (busy) return false;
    busy = true;
    try {
      const r = await fetch(API + "coord-edit", { method: "POST", headers: { Authorization: "Bearer " + encodeURIComponent(passcode), "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const body = await r.json().catch(() => ({}));
      if (r.status === 401) { forget(); renderLogin("Your passcode has changed. Enter it again."); return false; }
      if (!r.ok) { toast(body.error || "That didn't save.", true); return false; }
      toast((body.summary || "Saved") + ". The board updates within 30 minutes.");
      openAct = null;
      await load();
      return true;
    } catch (e) { toast("That didn't save: no connection.", true); return false; }
    finally { busy = false; }
  }

  function toast(text, bad) {
    const t = $("#toast"); t.textContent = text; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false;
    clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 4500);
  }

  // --------------------------------------------------------------- routing
  // #today | #board | #messages | #more | #task-<id>
  function route() {
    const h = (location.hash || "#today").slice(1);
    if (h.startsWith("task-")) return { view: "task", id: h.slice(5) };
    if (h.startsWith("job-")) return { view: "job", job: h.slice(4) };
    if (h.startsWith("sub-")) return { view: "sub", id: h.slice(4) };
    if (h.startsWith("timeline-")) return { view: "timeline", job: h.slice(9) };
    if (h === "timeline") return { view: "timeline" };
    if (h === "subs") return { view: "subs" };
    return { view: ["today", "board", "messages", "more"].includes(h) ? h : "today" };
  }
  function go(hash) { if (location.hash !== "#" + hash) location.hash = hash; else render(); }
  function openTask(id) {
    if (desk()) { panelId = id; panelSub = null; openAct = null; renderPanel(); return; }
    if (wide() && route().view === "board") { selected = id; render(); return; }
    go("task-" + id);
  }
  let selected = null, panelId = null, panelSub = null;

  // ------------------------------------------------------------- helpers
  const jobs = () => RES.snapshot.jobs;
  const curJob = () => jobs().find((j) => slug(j.job) === jobKey) || jobs()[0];
  function findTask(id) {
    for (const j of jobs()) { const r = (j.board || []).find((x) => x.id === id); if (r) return [r, j]; }
    // beyond the board's 8 weeks: build the same shape from the timeline
    for (const j of jobs()) {
      const t = ((j.timeline || {}).tasks || []).find((x) => x.id === id);
      if (t) return [{ id: t.id, name: t.name, type: t.type, trade: t.trade, phase: t.phase, sub: t.sub, start: t.es, end: t.ef,
        in_progress: !!t.started && !t.done, done: t.done, confirmed: t.booked, issues: t.issues || [], checklist: [],
        gates: Object.fromEntries(Object.entries(t.gates || {}).map(([k, v]) => [k, { state: v, reasons: [] }])) }, j];
    }
    return [null, null];
  }
  const pendingMessages = () => RES.snapshot.proposals.filter((p) => p.kind === "message" && !RES.decided[p.id]);
  const disagreements = () => jobs().flatMap((j) => (j.disagreements || []).map((d) => Object.assign({ job: j.job }, d)));
  const editedTasks = () => new Set((RES.edits || []).map((e) => e.task_id).filter(Boolean));
  const liveSubs = () => RES.subs || RES.snapshot.subs || [];
  const tradeName = (k) => ((RES.trades || []).find((t) => t.key === k) || {}).name || k;

  function statusOf(r) {
    const g = r.gates || {}; const red = Object.keys(g).filter((k) => g[k].state === "red");
    if (r.in_progress) return { text: "In progress", cls: "s-ok" };
    if (r.type === "work") {
      if (g.booking && g.booking.state === "green") return red.length ? { text: "Booked, not ready", cls: "s-warn" } : { text: "Ready", cls: "s-ok" };
      if (g.booking && g.booking.reasons.some((x) => x.startsWith("requested"))) return { text: "Asked", cls: "s-warn" };
      return red.length ? { text: "Blocked", cls: "s-bad" } : { text: "Not asked", cls: "s-plain" };
    }
    if (r.type === "external_gate") return r.ready_since ? { text: "Call now", cls: "s-warn" } : { text: "Waiting", cls: "s-plain" };
    if (r.type === "material_order") return { text: r.latest_order ? "Order by " + fmt(r.latest_order) : "Not ordered", cls: "s-warn" };
    if (r.type === "decision") return { text: r.decision_latest ? "Due " + fmt(r.decision_latest) : "Open", cls: "s-warn" };
    return red.length ? { text: "Waiting", cls: "s-plain" } : { text: "Ready", cls: "s-ok" };
  }

  function todayGroups() {
    const g = { bookings: [], orders: [], calls: [], decisions: [], requests: [] };
    jobs().forEach((j) => {
      const t = j.today || {};
      (t.bookings || []).forEach((x) => g.bookings.push({ job: j.job, id: x.id, name: x.task, date: x.start, pre: "starts", late: x.late, sub: x.sub || "No sub assigned" }));
      (t.orders || []).forEach((x) => g.orders.push({ job: j.job, id: x.id, name: x.task, date: x.latest, pre: "by", late: x.level === "late" }));

  // ------------------------------------------------------- how it connects
  // What this task waits for and what waits for it, each link's strength, and
  // the timeline controls that belong to one task: ready for the next trade, a
  // moved date, and how long it takes. Link changes preview the finish first.
  const STRENGTH = { hard: "Hard", partial: "Partial", soft: "Soft" };
  let linkOpen = null;
  function connections(r, j) {
    const T = j.timeline; if (!T || !window.CoordPlan) return null;
    const ov = CoordPlan.overridesFromEdits(RES.edits);
    const P = CoordPlan.plan(T, ov), t = P.byId[r.id], me = P.res[r.id];
    if (!t || !me) return null;
    const sec = el("section", "sec conn"); sec.append(el("h2", null, "How it connects"));
    const box = el("div", "list");
    const fmtD = (n) => fmt(CoordPlan.iso(n));

    if (!me.done && !["external_gate", "milestone", "decision", "material_order"].includes(t.type)) {
      const handoff = ov.handoff && r.id in ov.handoff ? ov.handoff[r.id] : CoordPlan.dn(t.handoff);
      if (handoff != null) box.append(infoRow("Ready for the next trade since " + fmtD(handoff), "What waits on this task can start.", "Clear", () => edit({ action: "handoff", task_id: r.id, date: null })));
      else box.append(dateRow("Ready for the next trade", "Enough is done for what waits on it to start, though this task isn't finished.", "handoff-" + r.id,
        (d) => edit({ action: "handoff", task_id: r.id, date: d })));
      if (me.pinned != null && !me.booked && !me.started) box.append(infoRow("Moved: starts no earlier than " + fmtD(me.pinned), "Set on the timeline.", "Back to the forecast", () => edit({ action: "clear_pin", task_id: r.id })));
      if (!me.started && t.type !== "milestone") box.append(durationRow(t, ov));
    }

    const pl = (P.preds[r.id] || []).filter((l) => P.byId[l.p].active), sl = (P.succs[r.id] || []).filter((l) => P.byId[l.s].active);
    if (pl.length) { box.append(el("div", "conn-h", "Waits for")); pl.forEach((l) => box.append(linkRow(l, l.p, P, T, ov, me.driver === l.p))); }
    if (sl.length) { box.append(el("div", "conn-h", "Leads to")); sl.forEach((l) => box.append(linkRow(l, l.s, P, T, ov, P.res[l.s].driver === r.id))); }
    if (!pl.length && !sl.length) box.append(el("div", "item", "Not linked to other tasks."));
    sec.append(box);
    return sec;
  }

  function linkRow(l, otherId, P, T, ov, drives) {
    const o = P.byId[otherId], st = P.strengthOf(l);
    const key = l.p + ">" + l.s, open = linkOpen === key;
    const wrap = el("div", "conn-link" + (open ? " open" : ""));
    const head = el("button", "item"); head.type = "button";
    const c = el("div", "main");
    c.append(el("div", "t", o.name));
    const m = el("div", "m");
    const fromJob = ov.link && key in ov.link ? ov.link[key] !== "default" : l.source === "job";
    m.append(el("span", "lk lk-" + st.strength, STRENGTH[st.strength] + (st.strength === "partial" ? " +" + st.lag + "d" : "")),
             document.createTextNode(fromJob ? " this job" : " default"));
    if (drives) m.append(el("span", "drives", " · sets the start"));
    c.append(m);
    head.append(c, svg("chev", "chev"));
    head.addEventListener("click", () => {
      linkOpen = open ? null : key;
      if (desk()) { renderPanel(); return; }
      const y = window.scrollY; render(); window.scrollTo(0, y);
    });
    wrap.append(head);
    if (!open) return wrap;

    const f = el("form", "conn-edit");
    const seg = el("div", "seg"); let pick = st.strength, lag = st.lag || 1;
    const lagBox = el("label", "conn-lag"); const li = el("input"); li.type = "number"; li.min = "0"; li.max = "30"; li.value = lag; li.id = "f-lag-" + key.replace(/[^a-z0-9]/gi, ""); li.inputMode = "numeric";
    lagBox.append("Starts", li, "working days after it starts");
    const effect = el("p", "conn-effect");
    const update = () => {
      seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === pick)));
      lagBox.hidden = pick !== "partial";
      const o2 = Object.assign({}, ov, { link: Object.assign({}, ov.link, { [key]: { strength: pick, lag: pick === "partial" ? (parseInt(li.value, 10) || 0) : 0 } }) });
      const P2 = CoordPlan.plan(T, o2);
      const d = P.cal.workdaysBetween(P.finish, P2.finish);
      const moved = Object.keys(P2.res).filter((id) => P.res[id] && (P.res[id].es !== P2.res[id].es)).length;
      effect.textContent = d === 0 ? "No change to the finish date" + (moved ? " (" + moved + " task" + (moved > 1 ? "s" : "") + " move)." : ".")
        : "Finish " + fmt(CoordPlan.iso(P.finish)) + " → " + fmt(CoordPlan.iso(P2.finish)) + " (" + (d > 0 ? "+" : "") + d + " working days), " + moved + " tasks move.";
    };
    ["hard", "partial", "soft"].forEach((k) => { const b = el("button", null, STRENGTH[k]); b.type = "button"; b.dataset.s = k; b.addEventListener("click", () => { pick = k; update(); }); seg.append(b); });
    li.addEventListener("input", update);
    const help = el("p", "note", "Hard: waits for it to finish. Partial: can start a set number of working days after it starts. Soft: usual order, may overlap.");
    const row = el("div", "row");
    const save = el("button", "btn primary", "Save for this job"); save.type = "submit";
    const dflt = el("button", "btn", "Make it the default"); dflt.type = "button";
    dflt.title = "Every job that hasn't changed this link, and every new job";
    const payload = () => ({ pred_id: l.p, succ_id: l.s, strength: pick, lag: pick === "partial" ? (parseInt(li.value, 10) || 0) : 0 });
    f.addEventListener("submit", (e) => { e.preventDefault(); linkOpen = null; edit(Object.assign({ action: "set_link" }, payload())); });
    dflt.addEventListener("click", () => { linkOpen = null; edit(Object.assign({ action: "set_link_default" }, payload())); });
    row.append(save, dflt);
    f.append(seg, lagBox, effect, help, row);
    if (fromJob) {
      const back = el("button", "btn block", "Back to the default (" + STRENGTH[l.default] + (l.default === "partial" ? " +" + l.default_lag + "d" : "") + ")"); back.type = "button";
      back.addEventListener("click", () => { linkOpen = null; edit({ action: "set_link", pred_id: l.p, succ_id: l.s, strength: null }); });
      f.append(back);
    }

    [["Book a sub", g.bookings, "Assign, ask, then mark booked"], ["Orders to place", g.orders, "By the latest order date"], ["Calls to make", g.calls, "Inspections ready to call"],
     ["Client decisions", g.decisions, "Due before the order they feed"], ["Requests", g.requests, "Utilities and 811"]].forEach(([title, items, sub]) => {
      if (!items.length) return;
      const box = el("section", "d-group"); const h3 = el("h3", null, title + " · " + items.length); h3.append(el("small", null, sub)); box.append(h3);
      items.forEach((x) => box.append(deskRow(x)));
      groups.append(box);
    });
    if (!groups.childNodes.length) wrap.append(el("div", "empty", "Nothing due today on either job."));
    else wrap.append(groups);
  }

  function deskRow(x) {
    const b = el("button", "d-row" + (x.late ? " late" : "")); b.type = "button"; b.dataset.id = x.id;
    if (panelId === x.id) b.setAttribute("aria-current", "true");
    b.append(el("span", "t", x.name), el("span", "date", (x.pre ? x.pre + " " : "") + fmt(x.date)), el("span", "m", short(x.job) + (x.sub ? " · " + x.sub : "")));
    b.addEventListener("click", () => openTask(x.id));
    return b;
  }

  function deskJob(wrap, j) {
    const head = el("div", "d-head"); const h = el("div");
    h.append(el("h2", null, j.job), el("p", null, "Lookahead " + fmt(j.run_date) + " to " + fmt(j.window_end) + ". Forecast finish " + fmtY(j.finish) + "."));
    head.append(h, modeSwitch("board"));
    wrap.append(head, jobStats(j));
    const fl = el("div", "d-filters");
    const rows = (j.board || []).filter((r) => filter === "work" ? r.type === "work" : filter === "blocked" ? statusOf(r).cls === "s-bad"
      : filter === "orders" ? (r.type === "material_order" || r.type === "decision") : filter === "calls" ? r.type.startsWith("external") : true);
    [["all", "Next 8 weeks"], ["blocked", "Blocked"], ["work", "Crew on site"], ["orders", "Orders & selections"], ["calls", "Inspections & requests"]].forEach(([k, label]) => {
      const b = el("button", "chip", label); b.type = "button"; b.setAttribute("aria-pressed", String(filter === k));
      b.addEventListener("click", () => { filter = k; render(); }); fl.append(b);
    });
    fl.append(el("span", "count", rows.length + " tasks"));
    wrap.append(fl);
    const box = el("div", "d-table"); const table = el("table"); const tr = el("tr");
    ["Task", "Start", "Finish", "Sub"].forEach((x) => tr.append(el("th", null, x)));
    GATES.forEach(([k, label, name, def]) => { const th = el("th", "gc", label); th.title = name + ": " + def; tr.append(th); });
    tr.append(el("th", null, "Status"));
    const thead = el("thead"); thead.append(tr); table.append(thead);
    const tb = el("tbody"); const edited = editedTasks();
    rows.forEach((r) => {
      const row = el("tr", "d-tr"); row.tabIndex = 0; row.dataset.id = r.id;
      if (panelId === r.id) row.setAttribute("aria-current", "true");
      const tdT = el("td", "task", r.name); tdT.append(el("small", null, [TYPES[r.type] ? TYPES[r.type][0] : r.type, r.trade].filter(Boolean).join(" · ")));
      if (edited.has(r.id)) tdT.append(el("span", "edited", "Edited · updating"));
      const subTd = el("td", "sub" + (!r.sub && r.type === "work" ? " none" : ""), r.sub || (r.type === "work" ? "None yet" : ""));
      row.append(tdT, el("td", "date", fmt(r.start)), el("td", "date", r.end && r.end !== r.start ? fmt(r.end) : ""), subTd);
      GATES.forEach(([k, label, name]) => {
        const td = el("td", "gc"); const g = (r.gates || {})[k];
        const d = el("span", "dot " + (g ? g.state : "not_applicable"));
        d.title = name + ": " + (g ? (g.state === "green" ? "green" : (g.reasons.join("; ") || g.state)) : "does not apply");
        d.setAttribute("aria-label", d.title); td.append(d); row.append(td);
      });
      const st = statusOf(r); const tdS = el("td"); tdS.append(el("span", "pill " + st.cls, st.text)); row.append(tdS);
      row.addEventListener("click", () => openTask(r.id));
      row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openTask(r.id); } });
      tb.append(row);
    });
    if (!rows.length) { const er = el("tr"); const td = el("td", null, "Nothing matches this filter."); td.colSpan = 11; er.append(td); tb.append(er); }
    table.append(tb); box.append(table); wrap.append(box);
    const key = el("div", "d-key");
    [["green", "Done or in place"], ["red", "Not yet: select the task for why"], ["unknown", "Information missing"], ["not_applicable", "Does not apply"]]
      .forEach(([c, t]) => { const s = el("span"); s.append(el("span", "dot " + c), document.createTextNode(t)); key.append(s); });
    wrap.append(key);
    if ((j.problems || []).length) {
      const box2 = el("section", "d-group"); box2.append(el("h3", null, "Schedule problems · " + j.problems.length));
      j.problems.forEach((p) => box2.append(deskRow({ id: p.id, name: p.task, job: j.job, sub: p.issues.join("; ") })));
      wrap.append(box2);
    }
  }

  function renderPanel() {
    let p = $("#panel");
    const sub = panelSub ? liveSubs().find((x) => x.id === panelSub) : null;
    const [t, j] = !sub && panelId ? findTask(panelId) : [null, null];
    if (!desk() || (!t && !sub)) { closePanel(true); return; }
    if (!p) { p = el("aside", "panel"); p.id = "panel"; p.setAttribute("aria-label", "Task"); document.body.append(p); }
    const scroll = p.scrollTop; p.replaceChildren();
    const x = el("button", "close", "×"); x.type = "button"; x.title = "Close (Esc)"; x.setAttribute("aria-label", "Close"); x.addEventListener("click", () => closePanel());
    p.append(x); if (sub) subEditor(p, sub); else taskBody(p, t, j); p.scrollTop = scroll;
    document.body.classList.add("panel-open");
    document.querySelectorAll('[aria-current="true"]').forEach((e) => e.removeAttribute("aria-current"));
    document.querySelectorAll('[data-id="' + CSS.escape(sub ? sub.id : panelId) + '"]').forEach((e) => e.setAttribute("aria-current", "true"));
  }

  function closePanel(quiet) {
    const p = $("#panel"); if (p) p.remove();
    document.body.classList.remove("panel-open");
    if (!quiet) { panelId = null; panelSub = null; document.querySelectorAll('[aria-current="true"]').forEach((e) => e.removeAttribute("aria-current")); }
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#panel")) closePanel(); });

  window.addEventListener("hashchange", () => { openAct = null; render(); if (desk()) window.scrollTo(0, 0); });
  let lastWide = wide() + "" + desk();
  window.addEventListener("resize", () => { const k = wide() + "" + desk(); if (k !== lastWide) { lastWide = k; render(); } });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && RES) load(); });
  load();
})();
</script>
</body>
</html>
