<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coordinator">
<meta name="theme-color" content="#2e2e2e">
<link rel="apple-touch-icon" href="/coordinator-icon.png">
<link rel="manifest" href="/coordinator.webmanifest">
<title>Six Arrows Coordinator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone first. A top bar names the screen, a bottom tab bar switches
   between Today, Board, Messages and More, and a task opens as a full page.
   From 760px (iPad) the board shows the list and the open task side by side. */
:root {
  --bg: #f1f0ea; --surface: #ffffff; --sunk: #e8e7df; --ink: #2e2e2e; --muted: #676b61; --line: #d9d8ce;
  --sage: #757f69; --sage-ink: #4f5844; --sage-wash: #e6e9e0;
  --ok: #2e7a4c; --ok-wash: #e1efe6; --warn: #a76b12; --warn-wash: #f6ebd6; --bad: #b0412b; --bad-wash: #f6e2dc;
  --na: #b5b7ad; --bar: #2e2e2e; --bar-ink: #f1f0ea;
  --f-head: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Inter", -apple-system, system-ui, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --tabh: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161715; --surface: #21231f; --sunk: #2a2c27; --ink: #ecebe4; --muted: #a2a59a; --line: #363833;
  --sage: #9ba78b; --sage-ink: #c3cdb4; --sage-wash: #2c3228;
  --ok: #6cc28f; --ok-wash: #1d3125; --warn: #e2a64a; --warn-wash: #382e1b; --bad: #ec8a74; --bad-wash: #3b2520;
  --na: #5c5f56; --bar: #0f100e; --bar-ink: #ecebe4; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161715; --surface: #21231f; --sunk: #2a2c27; --ink: #ecebe4; --muted: #a2a59a; --line: #363833;
  --sage: #9ba78b; --sage-ink: #c3cdb4; --sage-wash: #2c3228;
  --ok: #6cc28f; --ok-wash: #1d3125; --warn: #e2a64a; --warn-wash: #382e1b; --bad: #ec8a74; --bad-wash: #3b2520;
  --na: #5c5f56; --bar: #0f100e; --bar-ink: #ecebe4; color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
[hidden] { display: none !important }
html, body { margin: 0; height: 100% }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-text-size-adjust: 100% }
h1, h2, h3 { font-family: var(--f-head); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance }
.mono, .date { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
button, input, select, textarea { font: inherit; color: inherit }
input, select, textarea { font-size: 16px } /* 16px stops iPhone zooming into fields */
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--bar); color: var(--bar-ink);
       padding: calc(var(--safe-t) + 10px) var(--gut-r) 10px var(--gut-l); display: flex; align-items: center; gap: 10px; min-height: 52px }
.top h1 { font-size: 22px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.top .asof { font-size: 11.5px; opacity: .65; text-align: right; line-height: 1.2 }
.back { background: none; border: 0; color: inherit; font-size: 16px; padding: 8px 8px 8px 0; display: flex; gap: 4px; align-items: center; min-height: 44px }
.back svg { width: 18px; height: 18px }

/* bottom tabs (phone); a side rail from 760px */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
        display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 env(safe-area-inset-right, 0px) var(--safe-b) env(safe-area-inset-left, 0px) }
.tabs a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: var(--tabh);
          color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600 }
.tabs a svg { width: 24px; height: 24px }
.tabs a[aria-current="page"] { color: var(--sage-ink) }
.tabs .badge { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--bad); color: #fff; font: 600 11px/18px var(--f-body);
               min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; text-align: center }

main { padding: 14px var(--gut-r) calc(var(--tabh) + var(--safe-b) + 24px) var(--gut-l); max-width: 1180px; margin: 0 auto }
.stack { display: grid; gap: 18px }

/* summary chips */
.summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0 }
.stat label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.stat b { font-family: var(--f-head); font-size: 26px; font-weight: 600; line-height: 1.15 }
.stat.bad b { color: var(--bad) } .stat.ok b { color: var(--ok) }
.stat span { display: block; font-size: 12px; color: var(--muted) }

/* sections and lists */
.sec h2 { font-size: 20px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.sec h2 small { font: 500 12.5px var(--f-body); color: var(--muted) }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line);
        padding: 12px 14px; min-height: 56px; color: inherit; text-decoration: none }
.item:first-child { border-top: 0 }
.item:active { background: var(--sunk) }
.item .main { flex: 1; min-width: 0 }
.item .t { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.item .m { font-size: 13px; color: var(--muted); margin-top: 2px }
.item .r { text-align: right; flex: none; font-size: 13px }
.item .chev { color: var(--na); flex: none; width: 16px; height: 16px }
svg { max-width: 24px; max-height: 24px }
.late .r .date { color: var(--bad); font-weight: 600 }
.kind { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--sage-ink) }
.empty { color: var(--muted); padding: 18px 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; text-align: center }

/* job switch and filters */
.seg { display: flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 3px }
.seg button { flex: 1; border: 0; background: none; border-radius: 8px; padding: 9px 6px; font-weight: 600; font-size: 14px; color: var(--muted); min-height: 40px }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12) }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut-l)); padding: 2px var(--gut-r) 2px var(--gut-l) }
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 7px 14px; font-size: 13.5px; font-weight: 500; min-height: 36px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

/* task cards */
.card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: inherit }
.card:active { background: var(--sunk) }
.card[aria-current="true"] { border-color: var(--sage); box-shadow: 0 0 0 1px var(--sage) }
.cards { display: grid; gap: 8px }
.card .row1 { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start }
.card .t { font-weight: 600 }
.card .m { font-size: 13px; color: var(--muted); margin-top: 2px }
.card .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px }
.gates { display: flex; gap: 10px }
.g { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: .02em }
.dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none }
.dot.green { background: var(--ok) } .dot.red { background: var(--bad) }
.dot.unknown { border: 2px solid var(--warn) } .dot.not_applicable { border: 1px dashed var(--na); width: 12px; height: 12px; margin: 1px }
.pill { font: 600 12px var(--f-body); padding: 3px 9px; border-radius: 12px; white-space: nowrap }
.s-ok { background: var(--ok-wash); color: var(--ok) } .s-warn { background: var(--warn-wash); color: var(--warn) }
.s-bad { background: var(--bad-wash); color: var(--bad) } .s-plain { background: var(--sunk); color: var(--muted) }
.edited { display: inline-block; margin-top: 6px; font-size: 11.5px; font-weight: 600; color: var(--sage-ink); background: var(--sage-wash); padding: 2px 8px; border-radius: 10px }

/* task page */
.sheet { display: grid; gap: 16px }
.sheet .head .t { font-family: var(--f-head); font-size: 26px; font-weight: 600; line-height: 1.1 }
.sheet .head .m { color: var(--muted); font-size: 14px; margin-top: 4px }
.gatelist .item { min-height: 52px; align-items: flex-start }
.gatelist .item .dot { margin-top: 4px }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px }
.facts dt { color: var(--muted) } .facts dd { margin: 0; font-weight: 500 }
.acts { display: grid; gap: 8px }
.act { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.act > button { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 0 14px; min-height: 52px; font-weight: 600; text-align: left }
.act > button svg { width: 16px; height: 16px; color: var(--na); transition: transform .15s }
.act.open > button svg { transform: rotate(90deg) }
.act form { display: grid; gap: 10px; padding: 0 14px 14px }
.act label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500 }
.act input, .act select { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg) }
.btn { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; padding: 0 16px }
.btn.primary { background: var(--sage); border-color: var(--sage); color: #fff }
.btn.block { width: 100% }
.btn:disabled { opacity: .5 }
details.dod { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px }
details.dod summary { font-weight: 600; cursor: pointer; min-height: 28px }
details.dod ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px }

/* messages */
.msg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px }
.msg .t { font-family: var(--f-head); font-size: 19px; font-weight: 600 }
.msg .m { font-size: 13px; color: var(--muted) }
.msg textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px 12px; resize: vertical; line-height: 1.45 }
.row { display: flex; gap: 8px } .row .btn { flex: 1 }
.decided { font-weight: 600; font-size: 14px } .decided.approved { color: var(--ok) } .decided.skipped { color: var(--muted) }

/* more */
.key dl { margin: 0; display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px }
.key dt { font-weight: 600; display: flex; align-items: center; gap: 8px } .key dd { margin: 0; color: var(--muted); font-size: 14px }
.diff { font-size: 14px }
.note { font-size: 13px; color: var(--muted) }

/* login and toast */
.login { max-width: 420px; margin: 8vh auto 0; display: grid; gap: 12px }
.login h1 { font-size: 34px } .login p { margin: 0; color: var(--muted) }
.login input { min-height: 50px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
.warn-text { color: var(--bad); font-weight: 500 }
.toast { position: fixed; left: var(--gut-l); right: var(--gut-r); bottom: calc(var(--tabh) + var(--safe-b) + 12px); z-index: 30;
         background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-size: 14.5px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 560px; margin: 0 auto }
.toast.bad { background: var(--bad); color: #fff }

/* iPad and wider: side rail instead of bottom tabs, list and task side by side */
@media (min-width: 760px) {
  .tabs { top: 0; bottom: 0; right: auto; width: 84px; grid-template-columns: 1fr; grid-auto-rows: 76px; align-content: start;
          border-top: 0; border-right: 1px solid var(--line); padding: calc(var(--safe-t) + 64px) 0 var(--safe-b) env(safe-area-inset-left, 0px) }
  .top, main { margin-left: 84px }
  .top { padding-left: 20px } main { padding: 18px 24px 40px; max-width: none }
  .toast { bottom: 20px; left: 104px }
  .summary { grid-template-columns: repeat(4, minmax(0, 1fr)) }
  .split { display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); gap: 20px; align-items: start }
  .split .pane { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; padding-bottom: 20px }
  .chips { margin: 0; padding: 2px 0 }
}
@media (min-width: 760px) and (max-width: 979px) { .split { grid-template-columns: minmax(260px, 340px) minmax(0, 1fr) } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

/* ---------------------------------------------------------------- desktop
   A computer with a mouse and a wide window gets its own layout: navigation
   across the top, dense tables, and the task in a panel on the right so the
   list stays in view. Phones and iPads never see it. */
body.desk { font-size: 14px }
body.desk .tabs { display: none }
body.desk .top, body.desk main { margin-left: 0 }
body.desk .top { padding: 0 24px; min-height: 54px; gap: 22px }
body.desk .top .brand { font-family: var(--f-head); font-size: 20px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap }
body.desk .top .brand small { font-weight: 500; opacity: .6; margin-left: 6px; font-size: 14px; letter-spacing: .1em }
body.desk .nav { display: flex; gap: 2px; flex: 1; min-width: 0 }
body.desk .nav a { color: var(--bar-ink); opacity: .78; text-decoration: none; padding: 7px 12px; border-radius: 6px; font-weight: 500; font-size: 14.5px; display: flex; gap: 7px; align-items: center; white-space: nowrap }
body.desk .nav a:hover { opacity: 1; background: rgba(255,255,255,.08) }
body.desk .nav a[aria-current="page"] { opacity: 1; background: var(--sage); color: #fff }
body.desk .nav .n { background: var(--bad); color: #fff; font-size: 11px; font-weight: 600; border-radius: 9px; padding: 0 6px; line-height: 17px }
body.desk .top .asof { font-family: var(--f-mono); font-size: 11.5px }
body.desk main { padding: 20px 24px 48px; max-width: 1500px; transition: margin-right .15s }
body.desk.panel-open main { margin-right: 460px }
body.desk .msg textarea { min-height: 170px }
body.desk .toast { left: 24px; right: auto; bottom: 20px; margin: 0; max-width: 480px }

.d-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap }
.d-head h2 { font-size: 30px; line-height: 1.1 }
.d-head p { margin: 2px 0 0; color: var(--muted) }
.d-note { font-size: 12.5px; color: var(--sage-ink); background: var(--sage-wash); padding: 5px 10px; border-radius: 6px }
.d-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 8px }
.d-stats .stat { border: 0; border-radius: 0; padding: 10px 16px }
.d-stats .stat + .stat { border-left: 1px solid var(--line) }
.d-jobs { display: grid; gap: 10px }
.d-job { display: grid; grid-template-columns: 170px 1fr; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.d-job > a { display: flex; flex-direction: column; justify-content: center; padding: 10px 16px; color: inherit; text-decoration: none; border-right: 1px solid var(--line); background: var(--sunk) }
.d-job > a b { font-family: var(--f-head); font-size: 22px; font-weight: 600 }
.d-job > a span { font-size: 12px; color: var(--sage-ink); font-weight: 600 }
.d-job .d-stats { border: 0; border-radius: 0 }
.d-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 14px; align-items: start }
body.desk.panel-open .d-groups { grid-template-columns: 1fr }
.d-group { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.d-group h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .07em; color: var(--sage-ink); padding: 9px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between }
.d-group h3 small { color: var(--muted); font: 500 12px var(--f-body); letter-spacing: 0; text-transform: none }
.d-row { display: grid; grid-template-columns: 1fr auto; gap: 1px 14px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 7px 14px; color: inherit }
.d-row:first-of-type { border-top: 0 }
.d-row:hover { background: var(--sunk) }
.d-row[aria-current="true"], tr.d-tr[aria-current="true"] td { background: var(--sage-wash) }
.d-row .t { font-weight: 500 }
.d-row .m { grid-column: 1; font-size: 12.5px; color: var(--muted) }
.d-row .date { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 13px }
.d-row.late .date { color: var(--bad); font-weight: 600 }
.d-filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.d-filters .chip { min-height: 30px; padding: 4px 12px; font-size: 13px }
.d-filters .count { margin-left: auto; color: var(--muted); font-size: 12.5px }
.d-table { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: auto }
.d-table table { border-collapse: collapse; width: 100% }
.d-table th { position: sticky; top: 0; background: var(--sunk); font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
.d-table th.gc, .d-table td.gc { text-align: center; width: 54px; padding-left: 4px; padding-right: 4px }
.d-table td.date { white-space: nowrap }
.d-table td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
.d-table tr.d-tr { cursor: pointer }
.d-table tr.d-tr:hover td { background: var(--sunk) }
.d-table .task { font-weight: 500 }
.d-table .task small { display: block; font-weight: 400; color: var(--muted); font-size: 12px }
.d-table .sub { color: var(--muted); font-size: 13px }
.d-table .sub.none { color: var(--bad) }
.d-table .edited { margin: 3px 0 0 }
.d-key { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted) }
.d-key span { display: inline-flex; gap: 6px; align-items: center }
.d-msgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; align-items: start }
.d-narrow { max-width: 860px }

.panel { position: fixed; top: 54px; right: 0; bottom: 0; width: 460px; background: var(--bg); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0,0,0,.08);
         overflow-y: auto; padding: 16px 20px 40px; z-index: 15 }
.panel .close { position: sticky; top: 0; float: right; margin: -6px -8px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px; font-size: 20px; line-height: 1; color: var(--muted) }
.panel .close:hover { color: var(--ink) }
.panel .sheet .head .t { font-size: 24px; padding-right: 36px }
.panel .act > button, .panel .btn { min-height: 40px }
.panel .act input, .panel .act select { min-height: 38px; font-size: 14px; padding: 6px 10px }
.panel .gatelist .item { min-height: 0; padding: 8px 12px }
body.desk .act > button { min-height: 42px }
</style>
</head>
<body>
<header class="top" id="top"><h1>Coordinator</h1></header>
<main id="main"><div class="empty">Loading…</div></main>
<nav class="tabs" id="tabs" aria-label="Sections" hidden></nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  "use strict";
  const API = "/.netlify/functions/";
  const KEY = "sa-coord-passcode";
  const $ = (s, r = document) => r.querySelector(s);

  // ------------------------------------------------------------------ data

  const editedTasks = () => new Set((RES.edits || []).map((e) => e.task_id).filter(Boolean));

  function statusOf(r) {
    const g = r.gates || {}; const red = Object.keys(g).filter((k) => g[k].state === "red");
    if (r.in_progress) return { text: "In progress", cls: "s-ok" };
    if (r.type === "work") {
      if (g.booking && g.booking.state === "green") return red.length ? { text: "Booked, not ready", cls: "s-warn" } : { text: "Ready", cls: "s-ok" };
      if (g.booking && g.booking.reasons.some((x) => x.startsWith("requested"))) return { text: "Asked", cls: "s-warn" };

  function todayGroups() {

  }

  function renderTabs(view) {

  // one expandable action: a big row that opens a short form
  function action(key, label, fields, submit, opts = {}) {

    box.append(head);

    const inputs = {};
    fields.forEach(([name, type, value, text, options]) => {
      const lab = el("label", null, text); let i;
      if (type === "select") { i = el("select"); options.forEach(([v, t, dis]) => { const o = el("option", null, t); o.value = v; if (dis) o.disabled = true; i.append(o); }); }
      else { i = el("input"); i.type = type; if (value != null) i.value = value; if (type === "number") { i.min = "0"; i.step = "0.01"; i.inputMode = "decimal"; } }

  function subOptions(r) {

    const rest = subs.filter((s) => !match.includes(s));
    const opts = [["", "Pick a sub"]];
    if (match.length) { opts.push(["", "─ Does " + r.trade + " ─", true]); match.forEach((s) => opts.push([s.id, s.legal_name])); opts.push(["", "─ Everyone else ─", true]); }
    rest.forEach((s) => opts.push([s.id, s.legal_name]));
    return opts;
  }

  function actionsFor(r) {
    const id = r.id, out = [], today = todayISO();
    const a = (k, label, fields, fn, o) => out.push(action(id + "-" + k, label, fields, fn, o));
    if (r.in_progress) {
      a("done", "Mark done", [["date", "date", today, "Finished on"]], (v) => edit({ action: "mark_done", task_id: id, date: v.date }), { save: "Mark done" });
      return out;
    }
    if (r.type === "work") {
      a("sub", r.sub ? "Change the sub" : "Assign a sub", [["sub_id", "select", null, "Sub", subOptions(r)]],
        (v) => v.sub_id ? edit({ action: "assign_sub", task_id: id, sub_id: v.sub_id }) : toast("Pick a sub first.", true), { save: "Assign" });
      a("asked", "I asked the sub", [], () => edit({ action: "mark_requested", task_id: id, start: r.start, end: r.end }), { direct: true });
      a("booked", "Booked", [["start", "date", r.confirmed || r.start, "Start"], ["end", "date", r.end, "End"]],
        (v) => edit({ action: "mark_booked", task_id: id, start: v.start, end: v.end }), { save: "Save booking" });
      a("price", "Price", [["amount", "number", null, "Accepted price ($)"], ["terms", "text", null, "Payment terms (optional)"]],
        (v) => edit({ action: "set_price", task_id: id, amount: v.amount, terms: v.terms }), { save: "Save price" });
      a("release", "Release the site", [], () => edit({ action: "release_site", task_id: id }), { direct: true });
      a("started", "Started", [["date", "date", today, "Started on"]], (v) => edit({ action: "mark_started", task_id: id, date: v.date }), { save: "Mark started" });
    } else if (r.type === "material_order") {
      a("ordered", "Ordered", [["date", "date", today, "Ordered on"]], (v) => edit({ action: "mark_ordered", task_id: id, date: v.date }), { save: "Mark ordered" });
      a("received", "Received and checked", [["date", "date", today, "Received on"]], (v) => edit({ action: "mark_received", task_id: id, date: v.date }), { save: "Mark received" });
    } else if (r.type === "external_gate" || r.type === "external_request") {
      a("called", r.type === "external_gate" ? "Called for inspection" : "Requested", [["date", "date", null, "Set for (if known)"]],
        (v) => edit({ action: "mark_called", task_id: id, date: v.date }), { save: "Save" });
      a("done", r.type === "external_gate" ? "Passed" : "Done", [["date", "date", today, "On"]], (v) => edit({ action: "mark_done", task_id: id, date: v.date }), { save: "Save" });
    } else {
      a("done", r.type === "decision" ? "Client decided" : "Done", [["date", "date", today, "On"]], (v) => edit({ action: "mark_done", task_id: id, date: v.date }), { save: "Save" });
    }
    return out;
  }

  // ------------------------------------------------------------- messages
  function renderMessages(wrap) {
    setTop("Messages");
    wrap.append(el("p", "note", "Drafts the coordinator wrote. Approving records your decision. Nothing is sent."));
    const props = RES.snapshot.proposals.filter((p) => p.kind === "message");
    if (!props.length) { wrap.append(el("div", "empty", "No messages waiting.")); return; }
    props.forEach((p) => {
      const d = RES.decided[p.id];
      const c = el("article", "msg");
      c.append(el("div", "kind", (KIND[p.message_type] || p.message_type) + " · " + short(p.job)), el("div", "t", p.task || ""));
      c.append(el("div", "m", "To " + [p.sub, p.recipient, p.channel].filter(Boolean).join(" · ")));
      const ta = el("textarea"); ta.id = "draft-" + p.id; ta.value = d ? (d.final_body || p.draft_body) : p.draft_body; ta.disabled = !!d; ta.setAttribute("aria-label", "Message text");
      c.append(ta);
      const row = el("div", "row");
      if (d) {
        row.append(el("span", "decided " + (d.state === "skipped" ? "skipped" : "approved"), d.state === "skipped" ? "Skipped" : d.edited ? "Approved with edits" : "Approved"));
        const undo = el("button", "btn", "Undo"); undo.type = "button"; undo.style.flex = "none";
        undo.addEventListener("click", () => edit({ action: "proposal", proposal_id: p.id, decision: "undo" })); row.append(undo);
      } else {
        const ok = el("button", "btn primary", "Approve"); ok.type = "button"; ok.addEventListener("click", () => edit({ action: "proposal", proposal_id: p.id, decision: "approved", final_body: ta.value }));
        const skip = el("button", "btn", "Skip"); skip.type = "button"; skip.addEventListener("click", () => edit({ action: "proposal", proposal_id: p.id, decision: "skipped" }));
        row.append(ok, skip);
      }
      c.append(row); wrap.append(c);
    });
  }

  // ----------------------------------------------------------------- more
  function renderMore(wrap) {
    setTop("More", { asof: true });
    const ds = disagreements();
    const sec = el("section", "sec"); const h = el("h2", null, "Board vs Notion"); h.append(el("small", null, String(ds.length))); sec.append(h);
    sec.append(el("p", "note", "Where something you changed here and Notion now say different things. Your version is kept; Notion is never changed."));
    if (!ds.length) sec.append(el("div", "empty", "No disagreements."));
    else {
      const list = el("div", "list");
      const FIELD = { progress_state: "Status", actual_start: "Started", actual_end: "Finished", confirmed_start: "Booked start", confirmed_end: "Booked end", sub_id: "Sub" };
      ds.forEach((d) => {
        const it = el("div", "item"); const c = el("div", "main diff");
        c.append(el("div", "t", d.task), el("div", "m", short(d.job) + " · " + (FIELD[d.field] || d.field) + ": board " + d.board + ", Notion " + d.notion));
        it.append(c); list.append(it);
      });
      sec.append(list);
    }
    wrap.append(sec);

    const key = el("section", "sec key"); key.append(el("h2", null, "What the dots mean")); const dl = el("dl");
    GATES.forEach(([k, label, name, def]) => { const dt = el("dt"); dt.append(el("span", "dot red"), document.createTextNode(label + " · " + name)); dl.append(dt, el("dd", null, def)); });
    [["green", "Green: done or in place"], ["red", "Red: not yet. Open the task to see why."], ["unknown", "Ring: information missing"]].forEach(([c, t]) => {
      const dt = el("dt"); dt.append(el("span", "dot " + c), document.createTextNode(t)); dl.append(dt);
    });
    key.append(dl); wrap.append(key);

    const types = el("section", "sec key"); types.append(el("h2", null, "Kinds of task")); const tl = el("dl");
    Object.values(TYPES).forEach(([n, d]) => tl.append(el("dt", null, n), el("dd", null, d))); types.append(tl); wrap.append(types);

    const app = el("section", "sec"); app.append(el("h2", null, "On your iPhone"));
    app.append(el("p", "note", "In Safari, tap Share, then Add to Home Screen. It opens like an app. You'll enter the passcode once more there."));
    wrap.append(app);

    const lib = RES.snapshot.library || {};
    wrap.append(el("p", "note", "Run of " + fmtY(RES.snapshot.generated) + " · library " + (lib.id || "") + " · " + (lib.task_count || "") + " tasks"));
    const out = el("button", "btn block", "Forget the passcode on this phone"); out.type = "button";
    out.addEventListener("click", () => { forget(); RES = null; renderLogin(); }); wrap.append(out);
  }


  // ================================================================ desktop
  function renderDesk() {
    const r = route();
    if (r.view === "task") { panelId = r.id; const [, tj] = findTask(r.id); if (tj) jobKey = slug(tj.job); history.replaceState(null, "", "#job-" + jobKey); return renderDesk(); }
    if (r.view === "job" && jobs().some((j) => slug(j.job) === r.job)) { jobKey = r.job; try { localStorage.setItem("sa-coord-job", jobKey); } catch (e) {} }
    const view = r.view === "board" ? "job" : r.view;
    deskTop(view);
    const m = $("#main"); m.replaceChildren();
    const wrap = el("div", "stack"); m.append(wrap);
    if (view === "job") deskJob(wrap, curJob());
    else if (view === "messages") {
      renderMessages(wrap); deskTop(view);
      const grid = el("div", "d-msgs"); wrap.querySelectorAll(".msg").forEach((x) => grid.append(x));
      if (grid.childNodes.length) wrap.append(grid);
    }
    else if (view === "more") { wrap.classList.add("d-narrow"); renderMore(wrap); deskTop(view); }
    else deskToday(wrap);
    renderPanel();
  }

  function deskTop(view) {
    const top = $("#top"); top.replaceChildren();
    const brand = el("div", "brand", "Six Arrows"); brand.append(el("small", null, "Coordinator")); top.append(brand);
    const nav = el("nav", "nav"); nav.setAttribute("aria-label", "Sections");
    const link = (hash, label, n, on) => { const a = el("a", null, label); a.href = "#" + hash; if (n) a.append(el("span", "n", String(n))); if (on) a.setAttribute("aria-current", "page"); nav.append(a); };
    link("today", "Today", todayCount(), view === "today");
    jobs().forEach((j) => link("job-" + slug(j.job), short(j.job), 0, view === "job" && slug(j.job) === jobKey));
    link("messages", "Messages", pendingMessages().length, view === "messages");
    link("more", "Board vs Notion", disagreements().length, view === "more");
    top.append(nav);
    const a = el("div", "asof", "Calculated " + new Date(RES.calculated_at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }));
    top.append(a);
  }

  function jobStats(j) {
    const t = j.today || {};
    const todo = ["calls", "requests", "orders", "decisions", "bookings"].reduce((s, k) => s + (t[k] || []).length, 0);
    const blocked = (j.board || []).filter((r) => statusOf(r).cls === "s-bad").length;
    const st = el("div", "d-stats");
    const stat = (label, value, sub, tone) => { const x = el("div", "stat" + (tone ? " " + tone : "")); x.append(el("label", null, label), el("b", null, value), el("span", null, sub)); st.append(x); };
    stat("Booked out", j.weeks_booked_out >= 99 ? "All" : j.weeks_booked_out + " wks", "Target 2, then 4, 6, 8", j.weeks_booked_out >= 2 ? "ok" : "bad");
    stat("Forecast finish", fmt(j.finish), j.finish ? j.finish.slice(0, 4) : "");
    stat("Needs action today", String(todo), "Book, order, call, decide", todo ? "bad" : "ok");
    stat("Blocked, next 8 weeks", String(blocked), "A gate not yet green", blocked ? "bad" : "ok");
    return st;
  }

  function deskToday(wrap) {
    const head = el("div", "d-head"); const h = el("div"); h.append(el("h2", null, "Today"), el("p", null, "Everything due across both jobs. Select a task to see why and update it."));
    head.append(h, el("span", "d-note", "Side by side with Notion. Edits are saved to the coordinator only. Nothing is sent."));
    wrap.append(head);
    const js = el("div", "d-jobs");
    jobs().forEach((j) => { const row = el("div", "d-job"); const a = el("a"); a.href = "#job-" + slug(j.job); a.append(el("b", null, short(j.job)), el("span", null, "Open the board →")); row.append(a, jobStats(j)); js.append(row); });
    wrap.append(js);
    const g = todayGroups();
    const groups = el("div", "d-groups");
    [["Book a sub", g.bookings, "Assign, ask, then mark booked"], ["Orders to place", g.orders, "By the latest order date"], ["Calls to make", g.calls, "Inspections ready to call"],
     ["Client decisions", g.decisions, "Due before the order they feed"], ["Requests", g.requests, "Utilities and 811"]].forEach(([title, items, sub]) => {
      if (!items.length) return;
      const box = el("section", "d-group"); const h3 = el("h3", null, title + " · " + items.length); h3.append(el("small", null, sub)); box.append(h3);
      items.forEach((x) => box.append(deskRow(x)));
      groups.append(box);
    });
    if (!groups.childNodes.length) wrap.append(el("div", "empty", "Nothing due today on either job."));
    else wrap.append(groups);
  }

  function deskRow(x) {
    const b = el("button", "d-row" + (x.late ? " late" : "")); b.type = "button"; b.dataset.id = x.id;
    if (panelId === x.id) b.setAttribute("aria-current", "true");
    b.append(el("span", "t", x.name), el("span", "date", (x.pre ? x.pre + " " : "") + fmt(x.date)), el("span", "m", short(x.job) + (x.sub ? " · " + x.sub : "")));
    b.addEventListener("click", () => openTask(x.id));
    return b;
  }

  function deskJob(wrap, j) {
    const head = el("div", "d-head"); const h = el("div");
    h.append(el("h2", null, j.job), el("p", null, "Lookahead " + fmt(j.run_date) + " to " + fmt(j.window_end) + ". Forecast finish " + fmtY(j.finish) + "."));
    head.append(h, el("span", "d-note", "Edits are saved to the coordinator only. Notion is not changed."));
    wrap.append(head, jobStats(j));
    const fl = el("div", "d-filters");
    const rows = (j.board || []).filter((r) => filter === "work" ? r.type === "work" : filter === "blocked" ? statusOf(r).cls === "s-bad"
      : filter === "orders" ? (r.type === "material_order" || r.type === "decision") : filter === "calls" ? r.type.startsWith("external") : true);
    [["all", "Next 8 weeks"], ["blocked", "Blocked"], ["work", "Crew on site"], ["orders", "Orders & selections"], ["calls", "Inspections & requests"]].forEach(([k, label]) => {
      const b = el("button", "chip", label); b.type = "button"; b.setAttribute("aria-pressed", String(filter === k));
      b.addEventListener("click", () => { filter = k; render(); }); fl.append(b);
    });
    fl.append(el("span", "count", rows.length + " tasks"));
    wrap.append(fl);
    const box = el("div", "d-table"); const table = el("table"); const tr = el("tr");
    ["Task", "Start", "Finish", "Sub"].forEach((x) => tr.append(el("th", null, x)));
    GATES.forEach(([k, label, name, def]) => { const th = el("th", "gc", label); th.title = name + ": " + def; tr.append(th); });
    tr.append(el("th", null, "Status"));
    const thead = el("thead"); thead.append(tr); table.append(thead);
    const tb = el("tbody"); const edited = editedTasks();
    rows.forEach((r) => {
      const row = el("tr", "d-tr"); row.tabIndex = 0; row.dataset.id = r.id;
      if (panelId === r.id) row.setAttribute("aria-current", "true");
      const tdT = el("td", "task", r.name); tdT.append(el("small", null, [TYPES[r.type] ? TYPES[r.type][0] : r.type, r.trade].filter(Boolean).join(" · ")));
      if (edited.has(r.id)) tdT.append(el("span", "edited", "Edited · updating"));
      const subTd = el("td", "sub" + (!r.sub && r.type === "work" ? " none" : ""), r.sub || (r.type === "work" ? "None yet" : ""));
      row.append(tdT, el("td", "date", fmt(r.start)), el("td", "date", r.end && r.end !== r.start ? fmt(r.end) : ""), subTd);
      GATES.forEach(([k, label, name]) => {
        const td = el("td", "gc"); const g = (r.gates || {})[k];
        const d = el("span", "dot " + (g ? g.state : "not_applicable"));
        d.title = name + ": " + (g ? (g.state === "green" ? "green" : (g.reasons.join("; ") || g.state)) : "does not apply");
        d.setAttribute("aria-label", d.title); td.append(d); row.append(td);
      });
      const st = statusOf(r); const tdS = el("td"); tdS.append(el("span", "pill " + st.cls, st.text)); row.append(tdS);
      row.addEventListener("click", () => openTask(r.id));
      row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openTask(r.id); } });
      tb.append(row);
    });
    if (!rows.length) { const er = el("tr"); const td = el("td", null, "Nothing matches this filter."); td.colSpan = 11; er.append(td); tb.append(er); }
    table.append(tb); box.append(table); wrap.append(box);
    const key = el("div", "d-key");
    [["green", "Done or in place"], ["red", "Not yet: select the task for why"], ["unknown", "Information missing"], ["not_applicable", "Does not apply"]]
      .forEach(([c, t]) => { const s = el("span"); s.append(el("span", "dot " + c), document.createTextNode(t)); key.append(s); });
    wrap.append(key);
    if ((j.problems || []).length) {
      const box2 = el("section", "d-group"); box2.append(el("h3", null, "Schedule problems · " + j.problems.length));
      j.problems.forEach((p) => box2.append(deskRow({ id: p.id, name: p.task, job: j.job, sub: p.issues.join("; ") })));
      wrap.append(box2);
    }
  }

  function renderPanel() {
    let p = $("#panel");
    const [t, j] = panelId ? findTask(panelId) : [null, null];
    if (!desk() || !t) { closePanel(true); return; }
    if (!p) { p = el("aside", "panel"); p.id = "panel"; p.setAttribute("aria-label", "Task"); document.body.append(p); }
    const scroll = p.scrollTop; p.replaceChildren();
    const x = el("button", "close", "×"); x.type = "button"; x.title = "Close (Esc)"; x.setAttribute("aria-label", "Close"); x.addEventListener("click", () => closePanel());
    p.append(x); taskBody(p, t, j); p.scrollTop = scroll;
    document.body.classList.add("panel-open");
    document.querySelectorAll('[aria-current="true"]').forEach((e) => e.removeAttribute("aria-current"));
    document.querySelectorAll('[data-id="' + CSS.escape(panelId) + '"]').forEach((e) => e.setAttribute("aria-current", "true"));
  }

  function closePanel(quiet) {
    const p = $("#panel"); if (p) p.remove();
    document.body.classList.remove("panel-open");
    if (!quiet) { panelId = null; document.querySelectorAll('[aria-current="true"]').forEach((e) => e.removeAttribute("aria-current")); }
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#panel")) closePanel(); });

  window.addEventListener("hashchange", () => { openAct = null; render(); if (desk()) window.scrollTo(0, 0); });
  let lastWide = wide() + "" + desk();
  window.addEventListener("resize", () => { const k = wide() + "" + desk(); if (k !== lastWide) { lastWide = k; render(); } });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && RES) load(); });
  load();
})();
</script>
</body>
</html>
