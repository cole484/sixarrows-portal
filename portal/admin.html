<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Six Arrows — Admin</title>
<link rel="stylesheet" href="style.css"/>
<script src="data.js"></script>
<script src="app.js"></script>
<style>
/* ── Admin shell ── */
.admin-shell { display:flex; min-height:100vh; }
.admin-sidebar {
  width:220px; flex-shrink:0; background:var(--charcoal);
  padding:1.25rem 1rem; display:flex; flex-direction:column; gap:1.25rem;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  transition:width .2s ease, padding .2s ease;
}
.admin-shell.sidebar-hidden .admin-sidebar { width:0; padding:0; overflow:hidden; }
.admin-sidebar-toggle {
  position:fixed; top:14px; z-index:20; width:26px; height:26px;
  background:var(--charcoal); color:var(--cream); border:none; border-radius:0 6px 6px 0;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:14px; font-family:'Work Sans',sans-serif;
  transition:left .2s ease; opacity:.85;
}
.admin-sidebar-toggle:hover { opacity:1; }
.admin-shell:not(.sidebar-hidden) .admin-sidebar-toggle { left:220px; }
.admin-shell.sidebar-hidden .admin-sidebar-toggle { left:0; border-radius:0 6px 6px 0; }
.admin-logo { display:flex; align-items:center; gap:9px; }
.admin-logo img { width:28px; height:28px; object-fit:contain; }
.admin-logo-text { font-size:11px; font-weight:700; color:var(--cream); letter-spacing:.05em; text-transform:uppercase; }
.admin-logo-sub  { font-size:9px; color:rgba(235,233,222,.3); letter-spacing:.1em; text-transform:uppercase; }
.admin-nav-section { margin-bottom:4px; }
.admin-nav-title { font-size:9px; text-transform:uppercase; letter-spacing:.13em; color:rgba(235,233,222,.25); margin-bottom:5px; padding-left:9px; }
.admin-nav-link {
  display:flex; align-items:center; gap:7px;
  padding:7px 9px; border-radius:var(--r-md);
  color:rgba(235,233,222,.42); font-size:12px; font-weight:400;
  cursor:pointer; transition:all .15s; margin-bottom:1px; user-select:none;
}
.admin-nav-link:hover { background:rgba(255,255,255,.06); color:rgba(235,233,222,.72); }
.admin-nav-link.active { background:rgba(117,127,105,.2); color:var(--cream); font-weight:500; }
.admin-nav-link svg { width:13px; height:13px; opacity:.6; flex-shrink:0; }
.admin-nav-link.active svg { opacity:1; }

.admin-main { flex:1; min-width:0; background:var(--cream); }
.admin-topbar {
  position:sticky; top:0; z-index:10;
  height:50px; background:var(--cream-pale);
  border-bottom:0.5px solid var(--border-2);
  padding:0 1.5rem; display:flex; align-items:center; justify-content:space-between;
}
.admin-topbar-title { font-size:13px; font-weight:600; color:var(--charcoal); }
.admin-content { padding:1.5rem; max-width:900px; }
.admin-content.full-width { max-width:none; padding:1rem 1.25rem; }

/* Project tabs */
.project-tabs { display:flex; gap:6px; margin-bottom:1.25rem; flex-wrap:wrap; }
.project-tab {
  padding:7px 15px; border-radius:var(--r-full);
  border:0.5px solid var(--border-2); background:white;
  cursor:pointer; font-size:12px; font-weight:500; color:var(--charcoal-3); transition:all .15s;
}
.project-tab.active { background:var(--charcoal); color:var(--cream); border-color:var(--charcoal); }
.project-tab:hover:not(.active) { border-color:var(--border-3); color:var(--charcoal); }

/* Form elements */
.adm-field { margin-bottom:12px; }
.adm-field label { display:block; font-size:11px; font-weight:600; color:var(--charcoal-3); text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px; }
.adm-inp {
  width:100%; padding:9px 12px; font-size:13px; font-family:'Work Sans',sans-serif;
  border:0.5px solid var(--border-2); border-radius:var(--r-md); background:white;
  color:var(--charcoal); outline:none; transition:border-color .15s;
}
.adm-inp:focus { border-color:var(--green); }
.adm-inp[type=date] { cursor:pointer; }
.adm-sel { appearance:none; cursor:pointer; background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23999' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"); background-repeat:no-repeat; background-position:right 10px center; padding-right:28px; }
.adm-textarea { resize:vertical; min-height:80px; }
.adm-grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.adm-grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.adm-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 16px; border-radius:var(--r-md); border:none;
  font-size:12px; font-weight:600; cursor:pointer; font-family:'Work Sans',sans-serif;
  transition:all .15s;
}
.adm-btn-primary { background:var(--charcoal); color:var(--cream); }
.adm-btn-primary:hover { opacity:.85; }
.adm-btn-green { background:var(--green); color:white; }
.adm-btn-green:hover { opacity:.85; }
.adm-btn-danger { background:var(--danger-lt); color:var(--danger); border:0.5px solid rgba(184,50,50,.2); }
.adm-btn-danger:hover { background:#fde8e8; }
.adm-btn-ghost { background:var(--cream-pale); color:var(--charcoal-3); border:0.5px solid var(--border-2); }
.adm-btn-ghost:hover { background:var(--cream-2); }

/* Step management */
.step-manage-row {
  display:flex; align-items:center; gap:10px;
  padding:10px 0; border-bottom:0.5px solid var(--border);
}
.step-manage-row:last-child { border-bottom:none; }
.step-check {
  width:20px; height:20px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  border:1.5px solid var(--border-3); cursor:pointer; transition:all .15s;
}
.step-check.done { background:var(--green); border-color:var(--green); }
.step-check svg { width:9px; height:9px; }
.step-manage-meta { flex:1; min-width:0; }
.step-manage-name { font-size:13px; font-weight:500; color:var(--charcoal); }
.step-manage-date { font-size:11px; color:var(--charcoal-4); margin-top:1px; }
.step-manage-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.step-date-set { font-size:11px; padding:4px 8px; border:0.5px solid var(--border-2); border-radius:var(--r-xs); font-family:'Work Sans',sans-serif; background:white; color:var(--charcoal); outline:none; cursor:pointer; }
.step-date-set:focus { border-color:var(--green); }

/* Update / milestone rows */
.list-item-row {
  display:flex; align-items:flex-start; gap:10px;
  padding:12px 0; border-bottom:0.5px solid var(--border);
}
.list-item-row:last-child { border-bottom:none; }
.list-item-body { flex:1; min-width:0; }
.list-item-meta { font-size:11px; color:var(--charcoal-4); margin-bottom:2px; }
.list-item-title { font-size:13px; font-weight:600; color:var(--charcoal); margin-bottom:2px; }
.list-item-note { font-size:12px; color:var(--charcoal-3); line-height:1.4; }

/* Phase section header */
.phase-section-hd {
  font-size:10px; font-weight:700; text-transform:uppercase;
  letter-spacing:.1em; color:var(--charcoal-4);
  padding:10px 0 8px; border-bottom:0.5px solid var(--border-2);
  margin-bottom:4px; margin-top:16px;
}
.phase-section-hd:first-child { margin-top:0; }

/* Adm msg */
.adm-msg { font-size:12px; padding:8px 12px; border-radius:var(--r-md); margin-top:8px; display:none; }
.adm-msg.success { background:var(--green-lt); color:var(--green-deep); }
.adm-msg.error   { background:var(--danger-lt); color:var(--danger); }

/* ── Schedule Dashboard & Gantt ──────────────────────── */
.sch-kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(135px,1fr)); gap:10px; margin-bottom:1rem; }
/* Compact KPI bar (default) */
.sch-kpi-compact { display:flex; align-items:center; gap:14px; padding:8px 14px; background:white; border:0.5px solid var(--border-2); border-radius:var(--r-md); margin-bottom:8px; font-size:12px; flex-wrap:wrap; }
.sch-kpi-compact .sch-kpi-stat { display:flex; align-items:center; gap:6px; white-space:nowrap; }
.sch-kpi-compact .sch-kpi-stat-lbl { font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--charcoal-4); font-weight:700; }
.sch-kpi-compact .sch-kpi-stat-val { font-weight:700; color:var(--charcoal); }
.sch-kpi-compact .sch-kpi-expand { margin-left:auto; font-size:10px; color:var(--charcoal-4); cursor:pointer; background:none; border:none; font-family:'Work Sans',sans-serif; }
.sch-kpi-compact .sch-kpi-expand:hover { color:var(--charcoal); }

/* Focus mode — hide everything except Gantt */
.sch-focus-active .sch-kpi-row,
.sch-focus-active .sch-kpi-compact,
.sch-focus-active .sch-alerts,
.sch-focus-active .sch-queue-tabs { display:none !important; }
.sch-focus-active .sch-action-bar { padding:6px 10px; margin-bottom:6px; }
.sch-focus-active .gantt-wrap { min-height:calc(100vh - 180px); }

/* Drag tooltip */
.gantt-drag-tip { position:fixed; z-index:50; background:var(--charcoal); color:var(--cream); padding:5px 10px; border-radius:var(--r-md); font-size:11px; font-weight:600; pointer-events:none; white-space:nowrap; box-shadow:var(--sh-md); }
.sch-kpi-card { background:white; border:0.5px solid var(--border-2); border-radius:var(--r-md); padding:14px 16px; }
.sch-action-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:1rem; padding:10px 14px; background:white; border:0.5px solid var(--border-2); border-radius:var(--r-md); }
.sch-toast { font-size:12px; padding:6px 12px; border-radius:var(--r-md); margin-left:auto; transition:opacity .3s; }
.sch-toast.success { background:var(--green-lt); color:var(--green-deep); }
.sch-toast.error { background:var(--danger-lt); color:var(--danger); }

.gantt-wrap { background:white; border:0.5px solid var(--border-2); border-radius:var(--r-md); overflow:hidden; margin-bottom:1rem; }
.gantt-scroll { overflow-x:auto; overflow-y:visible; position:relative; }
.gantt-header { display:flex; position:sticky; top:0; z-index:3; background:var(--cream-pale); border-bottom:0.5px solid var(--border-2); height:28px; align-items:center; }
.gantt-week-mark { flex-shrink:0; font-size:8px; font-weight:600; color:var(--charcoal-4); text-transform:uppercase; letter-spacing:.04em; text-align:center; border-right:0.5px solid var(--border); height:100%; display:flex; align-items:center; justify-content:center; }
.gantt-phase { border-bottom:0.5px solid var(--border); }
.gantt-phase-hd { display:flex; align-items:center; gap:6px; padding:5px 12px; background:var(--cream-2); cursor:pointer; user-select:none; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--charcoal-3); }
.gantt-phase-hd svg { width:10px; height:10px; transition:transform .15s; }
.gantt-phase.collapsed .gantt-phase-hd svg { transform:rotate(-90deg); }
.gantt-phase.collapsed .gantt-phase-body { display:none; }
.gantt-phase-count { font-weight:400; color:var(--charcoal-4); margin-left:auto; font-size:9px; }
.gantt-row { position:relative; height:26px; border-bottom:0.5px solid var(--border); display:flex; align-items:center; }
.gantt-row:hover { background:var(--cream-pale); }
.gantt-row-label { width:180px; flex-shrink:0; padding:0 8px; font-size:11px; color:var(--charcoal-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-right:0.5px solid var(--border); position:sticky; left:0; z-index:2; background:inherit; }
.gantt-row:hover .gantt-row-label { background:var(--cream-pale); }
.gantt-row-track { flex:1; position:relative; min-width:0; height:100%; }
.gantt-bar { position:absolute; top:4px; height:18px; border-radius:3px; cursor:pointer; font-size:8px; color:white; font-weight:600; display:flex; align-items:center; padding:0 5px; white-space:nowrap; overflow:hidden; transition:opacity .15s; min-width:4px; z-index:2; }
.gantt-bar:hover { opacity:.82; }
.gantt-bar.complete { background:var(--green); }
.gantt-bar.in_progress { background:#4a7fb5; }
.gantt-bar.scheduled { background:#6ba3c7; }
.gantt-bar.needs_scheduling { background:#b0b0b0; }
.gantt-bar.not_started { background:#b0b0b0; }
.gantt-bar.not_ready { background:#d4a574; }
.gantt-bar.waiting_on_client { background:#c89200; }
.gantt-bar.on_hold { background:#8b6bb5; }
.gantt-bar.skipped { background:#ddd; color:#999; }
/* Workstream indicators on bars */
.gantt-bar.ws-interior { border-left:3px solid var(--green); }
.gantt-bar.ws-exterior { border-left:3px solid #6ba3c7; }
.gantt-bar.ws-both { border-left:3px solid var(--charcoal-3); }
.gantt-bar.critical { box-shadow:0 0 0 1.5px var(--charcoal); }
.gantt-bar.alert-red { box-shadow:0 0 0 2px var(--danger); }
.gantt-bar.alert-yellow { box-shadow:0 0 0 2px #c89200; }
.gantt-today { position:absolute; top:0; bottom:0; width:1.5px; background:var(--danger); z-index:1; pointer-events:none; }
.gantt-today::before { content:'Today'; position:absolute; top:2px; left:3px; font-size:7px; color:var(--danger); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }

.sch-edit-panel { background:white; border:1px solid var(--border-2); border-radius:var(--r-md); padding:16px; margin:0 0 4px; box-shadow:var(--sh-md); }
.sch-edit-hd { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.sch-edit-title { font-size:14px; font-weight:700; color:var(--charcoal); }
.sch-edit-meta { font-size:11px; color:var(--charcoal-4); margin-top:2px; }

.sch-alert-row { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:0.5px solid var(--border); font-size:12px; }
.sch-alert-row:last-child { border-bottom:none; }
.sch-gate-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:6px; margin-top:8px; }
.sch-gate-item { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; background:var(--cream-pale); border:0.5px solid var(--border); border-radius:var(--r-md); font-size:11px; }

/* ── Dependency arrows ───────────────────────────────── */
.gantt-dep-svg { position:absolute; top:0; left:180px; pointer-events:none; z-index:1; overflow:visible; }
.gantt-dep-svg line { stroke:var(--charcoal-4); stroke-width:1; opacity:.35; }
.gantt-dep-svg polygon { fill:var(--charcoal-4); opacity:.35; }

/* ── Zoom toggle ─────────────────────────────────────── */
.sch-zoom-toggle { display:inline-flex; border:0.5px solid var(--border-2); border-radius:var(--r-md); overflow:hidden; margin-left:8px; }
.sch-zoom-btn { padding:5px 10px; font-size:10px; font-weight:600; cursor:pointer; background:white; color:var(--charcoal-3); border:none; font-family:'Work Sans',sans-serif; transition:all .15s; }
.sch-zoom-btn.active { background:var(--charcoal); color:var(--cream); }

/* ── Gantt drag ──────────────────────────────────────── */
.gantt-bar[data-draggable] { cursor:grab; }
.gantt-bar[data-draggable]:active { cursor:grabbing; }
.gantt-bar-ghost { opacity:.45; pointer-events:none; z-index:10; border:1.5px dashed var(--charcoal); }

/* ── Queue sub-tabs ──────────────────────────────────── */
.sch-queue-tabs { display:flex; gap:4px; margin-bottom:10px; }
.sch-queue-tab { padding:5px 12px; font-size:11px; font-weight:600; cursor:pointer; background:white; color:var(--charcoal-3); border:0.5px solid var(--border-2); border-radius:999px; font-family:'Work Sans',sans-serif; transition:all .15s; }
.sch-queue-tab.active { background:var(--charcoal); color:var(--cream); border-color:var(--charcoal); }
.sch-queue-count { display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:rgba(0,0,0,.1); font-size:8px; font-weight:700; margin-left:3px; }
.sch-queue-tab.active .sch-queue-count { background:rgba(255,255,255,.2); }

/* ── Add task modal ──────────────────────────────────── */
.sch-add-modal { background:white; border:1px solid var(--border-2); border-radius:var(--r-md); padding:16px; margin-bottom:1rem; box-shadow:var(--sh-md); }

/* ── Task notes ──────────────────────────────────────── */
.sch-note-item { display:flex; gap:8px; padding:8px 0; border-bottom:0.5px solid var(--border); font-size:12px; }
.sch-note-item:last-child { border-bottom:none; }
.sch-note-meta { font-size:10px; color:var(--charcoal-4); margin-bottom:2px; }
.sch-note-type { font-size:8px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:2px 6px; border-radius:999px; }
.sch-note-type.instruction { background:var(--green-lt); color:var(--green-deep); }
.sch-note-type.punchlist { background:var(--danger-lt); color:var(--danger); }
.sch-note-type.observation { background:var(--warning-lt); color:var(--warning); }
.sch-note-type.general { background:var(--cream-2); color:var(--charcoal-3); }

/* ── Workstream lane accents ─────────────────────────── */
.gantt-phase-hd.ws-interior { border-left:3px solid var(--green); }
.gantt-phase-hd.ws-exterior { border-left:3px solid #6ba3c7; }
.gantt-phase-hd.ws-both { border-left:3px solid var(--charcoal-3); }

/* ── View toggle (Gantt / Table) ──────────────────────── */
.sch-view-toggle { display:inline-flex; border:0.5px solid var(--border-2); border-radius:var(--r-md); overflow:hidden; margin-left:auto; }
.sch-view-btn { padding:6px 14px; font-size:11px; font-weight:600; cursor:pointer; background:white; color:var(--charcoal-3); border:none; font-family:'Work Sans',sans-serif; transition:all .15s; }
.sch-view-btn.active { background:var(--charcoal); color:var(--cream); }

/* ── Task table view ─────────────────────────────────── */
.sch-table { width:100%; border-collapse:collapse; font-size:12px; }
.sch-table th { text-align:left; font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--charcoal-4); font-weight:600; padding:8px 6px; border-bottom:1px solid var(--border-2); white-space:nowrap; }
.sch-table td { padding:7px 6px; border-bottom:0.5px solid var(--border); vertical-align:middle; }
.sch-table tr:hover td { background:var(--cream-pale); }
.sch-table .sch-tbl-name { font-weight:600; color:var(--charcoal); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sch-table .sch-tbl-phase { color:var(--charcoal-3); font-size:11px; }
.sch-table .sch-tbl-date { font-size:11px; color:var(--charcoal-3); white-space:nowrap; }
.sch-table select.sch-tbl-status { font-size:11px; padding:3px 6px; border:0.5px solid var(--border-2); border-radius:var(--r-sm); background:white; font-family:'Work Sans',sans-serif; cursor:pointer; }

/* ── Bulk selection ──────────────────────────────────── */
.sch-bulk-bar { display:flex; align-items:center; gap:8px; padding:8px 14px; background:var(--charcoal); color:var(--cream); border-radius:var(--r-md); margin-bottom:8px; font-size:12px; }
.sch-bulk-bar .adm-btn { font-size:11px; padding:5px 12px; }
.sch-chk { width:15px; height:15px; cursor:pointer; accent-color:var(--green); }

@media(max-width:768px) {
  .sch-kpi-row { grid-template-columns:repeat(2,1fr); }
  .gantt-row-label { width:120px; font-size:10px; }
  .sch-edit-panel { padding:12px; }
  .sch-table { font-size:11px; }
}
</style>
</head>

<script>
// ════════════════════════════════════════════════════════
//  SIX ARROWS ADMIN PANEL
// ════════════════════════════════════════════════════════

const ADMIN_PASS = 'sa_admin_2026';
// Supabase direct access for admin operations
const SUPABASE_DIRECT_URL = 'https://mtvcahscwpralmlqlnzg.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10dmNhaHNjd3ByYWxtbHFsbnpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MTY4ODEsImV4cCI6MjA5MDM5Mjg4MX0.givpTh-YxG16vYZmn0KLBCPG0ivxYbjh-i8Q87eCNnk';
let adminAuthed  = false;
let activeProject = sessionStorage.getItem('sa_admin_project') || Object.keys(PROJECTS)[0];
let adminSidebarCollapsed = sessionStorage.getItem('sa_admin_sidebar_collapsed') === '1';
function toggleAdminSidebar() {
  adminSidebarCollapsed = !adminSidebarCollapsed;
  sessionStorage.setItem('sa_admin_sidebar_collapsed', adminSidebarCollapsed ? '1' : '0');
  const shell = document.querySelector('.admin-shell');
  if (shell) shell.classList.toggle('sidebar-hidden', adminSidebarCollapsed);
  const btn = document.querySelector('.admin-sidebar-toggle');
  if (btn) btn.textContent = adminSidebarCollapsed ? '›' : '‹';
}
let activeView    = sessionStorage.getItem('sa_admin_view')    || 'tracker';

// ── Storage helpers ──────────────────────────────────────
function adminKey(projectId, suffix) { return `sa_admin_${projectId}_${suffix}`; }
function adminGet(projectId, suffix) {
  try { return JSON.parse(localStorage.getItem(adminKey(projectId, suffix)) || 'null'); } catch(e) { return null; }
}
function adminSet(projectId, suffix, val) {
  localStorage.setItem(adminKey(projectId, suffix), JSON.stringify(val));
}

// Tracker state uses the same key as the client portal
function getTrackerState(p) {
  try { return JSON.parse(localStorage.getItem('sa_tracker_v3_' + p.id) || '{}'); } catch(e) { return {}; }
}
function setTrackerState(p, TS) {

// Load all client data from Supabase into PROJECTS
async function loadAllClientsFromSupabase() {
  try {
    const sbHeaders = {
      'apikey': SUPABASE_ANON,
      'Authorization': `Bearer ${SUPABASE_ANON}`,
      'Content-Type': 'application/json',
    };

    // Fetch all clients
    const clientsRes = await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/clients?select=*&order=client_name.asc`, { headers: sbHeaders });
    if (!clientsRes.ok) { console.warn('Could not load clients from Supabase'); return; }
    const clients = await clientsRes.json();

    // Fetch all budget categories in one call
    const budgetRes = await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/budget_categories?select=*&order=sort_order.asc`, { headers: sbHeaders });
    const allBudget = budgetRes.ok ? await budgetRes.json() : [];

    // Fetch all updates
    const updatesRes = await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/updates?select=*&approved=eq.true&order=created_at.desc`, { headers: sbHeaders });
    const allUpdates = updatesRes.ok ? await updatesRes.json() : [];

    // Fetch all milestones
    const milestonesRes = await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/milestones?select=*&order=sort_order.asc`, { headers: sbHeaders });
    const allMilestones = milestonesRes.ok ? await milestonesRes.json() : [];

    // Fetch all documents
    const docsRes = await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/documents?select=*&order=created_at.asc`, { headers: sbHeaders });
    const allDocs = docsRes.ok ? await docsRes.json() : [];

    // Merge into PROJECTS
    for (const client of clients) {
      const id = client.id;
      const existing = PROJECTS[id] || {};

      const budgetCats = allBudget
        .filter(b => b.client_id === id)
        .map(cat => ({
          name:          cat.name,
          total:         cat.total || 0,
          spent:         cat.spent || 0,
          status:        cat.status || 'pending',
          subCategories: (cat.sub_categories || []).map(sub => ({
            name: sub.name, total: sub.total || 0, spent: sub.spent || 0,
          })),
        }));

      const updates = allUpdates
        .filter(u => u.client_id === id)
        .map(u => ({ id: u.id, date: u.date, title: u.title, body: u.body }));

      const timeline = allMilestones
        .filter(m => m.client_id === id)
        .map(m => ({ date: m.date, title: m.title, note: m.note, done: m.done }));

      PROJECTS[id] = {
        ...existing,
        id,
        email:               client.email,
        password:            client.password,
        clientName:          client.client_name,
        projectName:         client.project_name,
        location:            client.location,
        statusType:          client.status_type,
        phaseLabel:          client.phase_label,
        constructionPct:     client.construction_pct || 0,
        groundbreakingDate:  client.groundbreaking_date || '',
        budgetTotal:         client.budget_total || 0,
        budgetCommitted:     client.budget_committed || 0,
        budgetAllowance:     client.budget_allowance || 0,
        budgetContingency:   client.budget_contingency || 0,
        timelineStart:       client.timeline_start || 'TBD',
        timelineTarget:      client.timeline_target || 'TBD',
        quickSummary:        client.quick_summary || '',
        notionTrackerPageId: client.notion_tracker_page_id || null,
        selectionsClientKey: client.selections_client_key || id,
        links:               { budget: client.budget_link || (existing.links?.budget || '#'), timeline: '#' },
        reviewDraft:         client.review_draft || '',
        reviewLeft:          !!client.review_left,
        showReviewCard:      !!client.show_review_card,
        projectType:         client.project_type || 'new_build',
        notionTimelineDbId:  client.notion_timeline_db_id || null,
        photoFolders:        Array.isArray(client.photo_folders) ? client.photo_folders : [],
        buildStartDate:      client.build_start_date || null,
        targetEndDate:       client.target_end_date || null,
        computedEndDate:     client.computed_end_date || null,
        activeWorkstreams:   client.active_workstreams || ['exterior','interior'],
        budgetCategories:    budgetCats,
        updates:             updates.length ? updates : (existing.updates || []),
        timeline:            timeline.length ? timeline : (existing.timeline || []),
        sabPhases:           existing.sabPhases || JSON.parse(JSON.stringify(DEFAULT_SAB_PHASES)),
        badges:              existing.badges    || JSON.parse(JSON.stringify(DEFAULT_BADGES)),
        decisions:           existing.decisions || [],
        documents:           allDocs.filter(d => d.client_id === id).map(d => ({
          id: d.id, name: d.name, category: d.category, url: d.url,
          type: d.type, date: d.date, note: d.note || '',
        })),
        changeOrderItems:    existing.changeOrderItems || [],
      };
    }
    console.log(`Admin: loaded ${clients.length} clients from Supabase`);

    // Auto-import categories for remodel clients that have a sheet URL but no categories
    const remodelNeedingSync = clients.filter(c =>
      c.project_type === 'remodel' &&
      c.budget_link && c.budget_link !== '#' &&
      !(PROJECTS[c.id]?.budgetCategories?.length)
    );
    for (const c of remodelNeedingSync) {
      // Fire and forget — don't block the admin from loading
      fetch(`/.netlify/functions/sheet-budget-sync?clientId=${c.id}&sheetUrl=${encodeURIComponent(c.budget_link)}&syncCategories=1`)
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (data?.synced > 0) {
            console.log(`Auto-imported ${data.synced} categories for ${c.id}`);
            // Reload to pick up the new cats (only if admin is viewing this client's budget)
            if (activeProject === c.id && activeView === 'budget') {
              loadAllClientsFromSupabase().then(() => renderAdmin());
            }
          }
        })
        .catch(e => console.log(`Auto-sync failed for ${c.id}:`, e.message));
    }
  } catch(e) {
    console.warn('Supabase load failed, using local data:', e.message);
  }
}

// Cache for dynamic Notion data (remodel clients)
const notionDynamicCache = {};

async function loadNotionDynamicForClient(projectId) {
  const p = PROJECTS[projectId];
  if (!p?.notionTrackerPageId) return null;
  try {
    const res  = await fetch(`/.netlify/functions/notion-tracker?pageId=${p.notionTrackerPageId}&dynamic=1`);
    const data = res.ok ? await res.json() : null;
    if (data?.dynamic && data?.phases) {
      notionDynamicCache[projectId] = data;
      return data;
    }
  } catch(e) { console.error('Notion dynamic fetch failed:', e); }
  return null;
}

// ============================================================
//  TRACKER VIEW
// ============================================================
function renderTrackerView(p) {
  const TS = getTrackerState(p);
  const isRemodel = p.projectType === 'remodel';
  const clientKey = p.selectionsClientKey || p.id;

  // Groundbreaking date card
  const gbDate = adminGet(p.id, 'gbDate') || p.groundbreakingDate || '';
  const dateLabel = isRemodel ? 'Demo Start Date' : 'Groundbreaking Date';
  const dateSub   = isRemodel
    ? "Sets the countdown on the client's Command Center."
    : "Sets the countdown on the client's Command Center and Timeline.";

  let html = `
    <div class="card" style="margin-bottom:1rem">
      <div class="sh"><div class="sh-title">${dateLabel}</div></div>
      <p style="font-size:12px;color:var(--charcoal-3);margin-bottom:12px">${dateSub}</p>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <input class="adm-inp" type="date" id="gb-date-inp" value="${gbDate}" style="width:auto">
        <button class="adm-btn adm-btn-green" onclick="saveGbDate('${p.id}')">Save Date</button>
        <span id="gb-date-msg" class="adm-msg success" style="margin:0"></span>
      </div>
    </div>`;

  if (isRemodel) {
    // ── REMODEL: render from cached Notion dynamic data ──
    const dynData = notionDynamicCache[p.id];

    if (!dynData) {
      html += `
        <div class="card" style="text-align:center;padding:2rem">
          <div style="font-size:13px;color:var(--charcoal-3);margin-bottom:12px">
            Steps are read live from Notion for remodel clients.
          </div>
          <button class="adm-btn adm-btn-green" onclick="loadAndRenderDynTracker('${p.id}')">
            Load Steps from Notion
          </button>
          <span id="dyn-load-msg" class="adm-msg success" style="margin-left:10px"></span>
        </div>`;
      return html;
    }

    // Render phases and steps from Notion dynamic data
    dynData.phases.forEach((ph, pi) => {
      html += `<div class="phase-section-hd">Phase ${pi+1} — ${ph.label}</div>`;
      ph.steps.forEach((step, si) => {
        const topItems  = step.items.filter(it => it.depth <= 1);
        const checked   = topItems.filter(it => it.checked).length;
        const total     = topItems.length;
        const done      = step.complete;
        const stepNum   = step.notionNum || (step.globalIndex + 1);

        html += `<div class="step-manage-row">
          <div class="step-check ${done?'done':''}">
            ${done?`<svg viewBox="0 0 9 9"><path d="M1.5 4.5l2 2 4-4" stroke="white" stroke-width="1.3" fill="none"/></svg>`:''}
          </div>
          <div class="step-manage-meta">
            <div class="step-manage-name">Step ${stepNum}: ${step.title}</div>
            <div class="step-manage-date">${total>0?`${checked}/${total} items`:'No checklist'} · Six Arrows${done?' · Complete':''}</div>
          </div>
          <div class="step-manage-right">
            <span class="tag ${done?'ok':'neutral'}" style="font-size:10px">${done?'Done':'In Progress'}</span>
          </div>
        </div>`;
      });

      if (ph.milestone) {
        html += `<div style="font-size:11px;color:var(--green-dk);font-weight:600;padding:8px 12px;background:var(--green-pale);border-radius:var(--r-md);margin-bottom:12px">
          ★ Milestone: ${ph.milestone}${ph.complete?' — Complete':' — Pending'}
        </div>`;
      }
    });

    // Readiness summary
    html += `
      <div class="card" style="margin-top:1rem">
        <div class="sh"><div class="sh-title">Build Readiness</div></div>
        <div style="font-size:28px;font-weight:700;color:var(--charcoal);margin-bottom:4px">${dynData.readiness}%</div>
        <div style="font-size:12px;color:var(--charcoal-4);margin-bottom:10px">${dynData.checkedItems} of ${dynData.totalItems} items complete</div>
        <div class="track"><div class="bar" style="width:${dynData.readiness}%"></div></div>
        <button class="adm-btn adm-btn-ghost" style="margin-top:12px;font-size:11px" onclick="loadAndRenderDynTracker('${p.id}')">↻ Refresh from Notion</button>
      </div>`;

    return html;
  }

  // ── NEW BUILD: render from p.sabPhases + TS ──
  function isStepDone(pi, si) {
    const st = p.sabPhases[pi].steps[si];
    if (st.isFinal) return true;
    const items = getStepAllItems(st);
    if (items.length === 0) return !!st.complete;
    return items.every((_, ii) => TS[`${pi}-${si}-${ii}`]);
  }

  p.sabPhases.forEach((ph, pi) => {
    html += `<div class="phase-section-hd">Phase ${pi+1} — ${ph.label}</div>`;
    ph.steps.forEach((step, si) => {
      if (step.isFinal) return; // skip review step in admin tracker
      const done      = isStepDone(pi, si);
      const dateKey   = `date-${pi}-${si}`;
      const dateVal   = TS[dateKey] || '';

async function exportSelectionsCSV(projectId, clientKey, clientName) {
  const msgEl = document.getElementById('export-msg');
  if (msgEl) { msgEl.className = 'adm-msg success'; msgEl.textContent = 'Generating...'; }
  try {
    const res = await fetch(
      '/.netlify/functions/selections-export?clientKey=' + encodeURIComponent(clientKey) +
      '&clientName=' + encodeURIComponent(clientName)
    );
    if (!res.ok) { throw new Error('Export failed: ' + res.status); }
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const safeName = (clientName || clientKey).replace(/[^a-z0-9]/gi,'_');
    a.href     = url;
    a.download = safeName + '_Selections_' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if (msgEl) { msgEl.textContent = 'Downloaded ✓'; }
    setTimeout(() => { if (msgEl) msgEl.textContent = ''; }, 3000);
  } catch(e) {
    console.error('exportSelectionsCSV error:', e);
    if (msgEl) { msgEl.className = 'adm-msg error'; msgEl.textContent = 'Error: ' + e.message; }
  }
}

function saveGbDate(projectId) {
  const val = document.getElementById('gb-date-inp')?.value;
  if (!val) return;
  adminSet(projectId, 'gbDate', val);
  // Update in-memory project
  const p = PROJECTS[projectId];
  if (p) p.groundbreakingDate = val;
  // Update tracker state
  const TS = getTrackerState(p);
  TS['groundbreakingDate'] = val;
  setTrackerState(p, TS);
  // Update localStorage session so client portal picks it up immediately
  try {
    const raw = localStorage.getItem('sa_session_v3');
    if (raw) {
      const s = JSON.parse(raw);
      if (s.data && s.data.id === projectId) {
        s.data.groundbreakingDate = val;
        s.ts = 0; // force re-fetch on next dashboard load
        localStorage.setItem('sa_session_v3', JSON.stringify(s));
      }
    }
  } catch(e) {}
  // Upsert to Supabase — works even if client row was never explicitly created there
  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' };
  fetch(SUPABASE_DIRECT_URL + '/rest/v1/clients', {
    method: 'POST',
    headers: sbH,
    body: JSON.stringify({ id: projectId, groundbreaking_date: val }),
  }).then(async res => {
    if (res.ok) {
      showMsg('gb-date-msg', 'success', 'Saved \u2713');
    } else {
      const err = await res.text();
      console.error('saveGbDate upsert failed:', res.status, err);
      showMsg('gb-date-msg', 'error', 'Save failed (' + res.status + ') — check console');
    }
  }).catch(err => {
    console.error('saveGbDate network error:', err);
    showMsg('gb-date-msg', 'error', 'Network error');
  });
}
function toggleStepDone(pi, si, projectId) {
  const p    = PROJECTS[projectId];
  const TS   = getTrackerState(p);
  const step = p.sabPhases[pi].steps[si];
  const items = getStepAllItems(step);
  const done = items.length === 0 ? !!step.complete
    : items.every((_, ii) => TS[`${pi}-${si}-${ii}`]);

  if (!done) {
    // Mark all items complete
    items.forEach((_, ii) => { TS[`${pi}-${si}-${ii}`] = true; });
    // Store completion date
    const today = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    TS[`completed-date-${pi}-${si}`] = today;
    step.complete = true;
  } else {
    // Unmark all items
    items.forEach((_, ii) => { TS[`${pi}-${si}-${ii}`] = false; });
    delete TS[`completed-date-${pi}-${si}`];
    step.complete = false;
  }

  setTrackerState(p, TS);
  renderAdmin(); // re-render to reflect change
}

function setStepDate(pi, si, projectId, val) {
  const p  = PROJECTS[projectId];
  const TS = getTrackerState(p);
  TS[`date-${pi}-${si}`] = val;
  setTrackerState(p, TS);
}

async function generateDraft(projectId, type) {
  const labels = { monday: 'Monday Preview', friday: 'Friday Recap', midweek: 'Midweek Update' };
  const msgEl = document.getElementById('gen-msg');
  if (msgEl) { msgEl.style.display = 'block'; msgEl.className = 'adm-msg neutral'; msgEl.textContent = 'Generating ' + (labels[type]||type) + '... (5-10 seconds)'; }
  try {
    const res  = await fetch('/.netlify/functions/generate-updates', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientId: projectId, type }),
    });
    const data = res.ok ? await res.json() : null;
    if (data && data.generated > 0) {
      if (msgEl) { msgEl.className = 'adm-msg success'; msgEl.textContent = 'Draft generated - review in Pending Drafts above'; }
      setTimeout(() => loadPendingDrafts(projectId), 600);
    } else {
      const err = data && data.results && data.results[0] ? data.results[0].error : 'Generation failed';
      if (msgEl) { msgEl.className = 'adm-msg error'; msgEl.textContent = err; }
    }
  } catch(e) {
    if (msgEl) { msgEl.className = 'adm-msg error'; msgEl.textContent = 'Error: ' + e.message; }
  }
}

async function approveDraft(projectId, draftId) {
  const editedBody = document.getElementById('draft-body-' + draftId) && document.getElementById('draft-body-' + draftId).value.trim();
  try {
    const res = await fetch('/.netlify/functions/client-updates?clientId=' + projectId + '&draftId=' + draftId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ approved: true, body: editedBody }),
    });
    if (res.ok) {
      const el = document.getElementById('draft-' + draftId);
      if (el) el.remove();
      const msgEl = document.getElementById('gen-msg');
      if (msgEl) { msgEl.style.display='block'; msgEl.className='adm-msg success'; msgEl.textContent='Posted to client portal'; }
      loadPendingDrafts(projectId);

function addMilestone(projectId) {
  const title = document.getElementById('ms-title')?.value.trim();
  const date  = document.getElementById('ms-date')?.value;
  const note  = document.getElementById('ms-note')?.value.trim();
  if (!title) { showMsg('ms-msg','error','Title required.'); return; }
  const p = PROJECTS[projectId];
  const milestones = adminGet(projectId, 'milestones') || [...(p.timeline||[])];
  const dateLabel = date ? new Date(date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
  milestones.push({ title, date:dateLabel, note, done:false });
  adminSet(projectId, 'milestones', milestones);
  showMsg('ms-msg','success','Milestone added ✓');
  setTimeout(() => renderAdmin(), 600);
}

function toggleMilestone(projectId, idx) {
  const p = PROJECTS[projectId];
  const milestones = adminGet(projectId, 'milestones') || [...(p.timeline||[])];
  milestones[idx].done = !milestones[idx].done;
  adminSet(projectId, 'milestones', milestones);
  renderAdmin();
}

function deleteMilestone(projectId, idx) {
  const p = PROJECTS[projectId];
  const milestones = adminGet(projectId, 'milestones') || [...(p.timeline||[])];
  milestones.splice(idx, 1);
  adminSet(projectId, 'milestones', milestones);
  renderAdmin();
}

function addChangeOrder(projectId) {
  const desc   = document.getElementById('co-desc')?.value.trim();
  const amount = parseFloat(document.getElementById('co-amount')?.value);
  const dateV  = document.getElementById('co-date')?.value;
  if (!desc || isNaN(amount)) { showMsg('co-msg','error','Description and amount required.'); return; }
  const cos = adminGet(projectId, 'changeOrders') || [...(PROJECTS[projectId].changeOrderItems||[])];
  const dateLabel = dateV ? new Date(dateV+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  cos.push({ description:desc, amount, date:dateLabel });
  adminSet(projectId, 'changeOrders', cos);
  showMsg('co-msg','success','Change order added ✓');
  setTimeout(() => renderAdmin(), 600);
}

function deleteChangeOrder(projectId, idx) {
  const cos = adminGet(projectId, 'changeOrders') || [...(PROJECTS[projectId].changeOrderItems||[])];
  cos.splice(idx, 1);
  adminSet(projectId, 'changeOrders', cos);
  renderAdmin();
}

async function addBudgetCategory(projectId) {
  const name  = document.getElementById('bcat-new-name')?.value.trim();
  const total = parseFloat(document.getElementById('bcat-new-total')?.value) || 0;
  if (!name) { showMsg('bcat-add-msg','error','Category name required'); return; }

  const p = PROJECTS[projectId];
  const nextOrder = (p.budgetCategories?.length || 0) + 1;
  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

  try {
    const res = await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/budget_categories`, {
      method: 'POST', headers: sbH,
      body: JSON.stringify({ client_id: projectId, name, total, spent: 0, status: 'pending', sort_order: nextOrder, sub_categories: [] }),
    });
    if (!res.ok) throw new Error(await res.text());
    showMsg('bcat-add-msg','success','Added ✓');
    // Reload clients to refresh budget categories
    await loadAllClientsFromSupabase();
    setTimeout(() => renderAdmin(), 400);
  } catch(e) {
    showMsg('bcat-add-msg','error',`Error: ${e.message}`);
  }
}

async function deleteBudgetCategory(projectId, catIndex) {
  const p   = PROJECTS[projectId];
  const cat = p.budgetCategories?.[catIndex];
  if (!cat) return;
  if (!confirm(`Remove "${cat.name}" from the budget?`)) return;

  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json' };

  // Get the actual Supabase row ID by matching name and client_id
  try {
    const getRes = await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/budget_categories?client_id=eq.${projectId}&name=eq.${encodeURIComponent(cat.name)}&select=id`, { headers: sbH });
    const rows = await getRes.json();
    if (!rows?.length) { alert('Category not found in database'); return; }

    await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/budget_categories?id=eq.${rows[0].id}`, { method: 'DELETE', headers: sbH });
    await loadAllClientsFromSupabase();
    renderAdmin();
  } catch(e) {
    alert(`Error: ${e.message}`);
  }
}

async function syncSABCategoriesFromSheet(projectId) {
  const p = PROJECTS[projectId];
  const sheetUrl = p.links?.budget;
  if (!sheetUrl || sheetUrl === '#') {
    showMsg('bcat-sync-msg', 'error', 'No sheet URL set in Project Info');
    return;
  }
  showMsg('bcat-sync-msg', 'neutral', 'Syncing...');
  try {
    const res = await fetch(
      `/.netlify/functions/sheet-sab-budget-sync?clientId=${projectId}&sheetUrl=${encodeURIComponent(sheetUrl)}`
    );
    const data = res.ok ? await res.json() : null;
    if (data && data.synced > 0) {
      showMsg('bcat-sync-msg', 'success', `Imported ${data.synced} categories ✓`);
      // Refresh session so budget page sees the new categories
      const fresh = await AUTH.refreshSession(projectId).catch(() => null);
      if (fresh && PROJECTS[projectId]) {
        PROJECTS[projectId].budgetCategories = fresh.budgetCategories || [];
      }
      setTimeout(() => renderAdmin(), 800);
    } else {
      const msg = data?.message || data?.error || 'No categories detected in Budget tab';
      showMsg('bcat-sync-msg', 'error', msg);
    }
  } catch(e) {
    showMsg('bcat-sync-msg', 'error', 'Error: ' + e.message);
  }
}
async function syncCategoriesFromSheet(projectId) {
  const p        = PROJECTS[projectId];
  const msgEl    = document.getElementById('bcat-sync-msg');
  const sheetUrl = p.links?.budget;

  if (!sheetUrl || sheetUrl === '#') {
    if (msgEl) { msgEl.textContent = 'No sheet URL set in Project Info'; msgEl.className = 'adm-msg error'; }
    return;
  }

  if (msgEl) { msgEl.textContent = 'Importing…'; msgEl.className = 'adm-msg success'; }

  try {
    const res = await fetch(`/.netlify/functions/sheet-budget-sync?clientId=${projectId}&sheetUrl=${encodeURIComponent(sheetUrl)}&syncCategories=1`);

    // Log raw response for debugging
    const rawText = await res.text();
    console.log('syncCategoriesFromSheet response:', res.status, rawText);

    let data;
    try { data = JSON.parse(rawText); } catch(e) {
      alert(`Sync failed — unexpected response:\n${rawText.slice(0, 300)}`);
      if (msgEl) { msgEl.textContent = 'Error — see console'; msgEl.className = 'adm-msg error'; }
      return;
    }

    if (!res.ok || !data || data.error) {
      const msg = data?.error || `HTTP ${res.status}`;
      alert(`Sync failed: ${msg}`);
      if (msgEl) { msgEl.textContent = `Error: ${msg}`; msgEl.className = 'adm-msg error'; }
      return;
    }

    if (data.synced === 0) {
      const msg = data.message || 'No rows tagged "Main Category" found in column Z';
      alert(`Sync result: ${msg}\n\nCategories found: ${JSON.stringify(data.categories)}`);
      if (msgEl) { msgEl.textContent = msg; msgEl.className = 'adm-msg error'; }
      return;
    }

    // Success — show message then reload
    alert(`Success! ${data.synced} categories imported from sheet:\n${data.categories.map(c => `• ${c.name} (${c.status})`).join('\n')}`);
    if (msgEl) { msgEl.textContent = `${data.synced} categories imported ✓`; msgEl.className = 'adm-msg success'; }

    await loadAllClientsFromSupabase();
    setTimeout(() => renderAdmin(), 800);

  } catch(e) {
    console.error('syncCategoriesFromSheet error:', e);
    alert(`Sync error: ${e.message}`);
    if (msgEl) { msgEl.textContent = `Error: ${e.message}`; msgEl.className = 'adm-msg error'; }
  }
}

async function updateBudgetCatStatus(projectId, catIndex, newStatus) {
  const p = PROJECTS[projectId];
  if (!p.budgetCategories || !p.budgetCategories[catIndex]) return;
  p.budgetCategories[catIndex].status = newStatus;
  adminSet(projectId, 'budgetCats', p.budgetCategories);
  // Push to Supabase
  try {
    const cat = p.budgetCategories[catIndex];
    // Get the actual Supabase row ID by fetching categories
    const res = await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/budget_categories?client_id=eq.${projectId}&order=sort_order.asc&select=id,name`, {
      headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON }
    });
    if (res.ok) {
      const rows = await res.json();
      const row = rows[catIndex];
      if (row?.id) {
        await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/budget_categories?id=eq.${row.id}`, {
          method: 'PATCH',
          headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
          body: JSON.stringify({ status: newStatus }),
        });
        showMsg('bcat-status-msg','success','Saved ✓');
        setTimeout(() => document.getElementById('bcat-status-msg').textContent = '', 2000);
        // Update PROJECTS in memory immediately
        if (PROJECTS[projectId] && PROJECTS[projectId].budgetCategories[catIndex]) {
          PROJECTS[projectId].budgetCategories[catIndex].status = newStatus;
        }
        // Invalidate client session so they get fresh data on next load
        try {
          const raw = localStorage.getItem('sa_session_v3');
          if (raw) {
            const s = JSON.parse(raw);
            if (s.id === projectId) {
              // Force re-fetch by zeroing the timestamp
              s.ts = 0;
              localStorage.setItem('sa_session_v3', JSON.stringify(s));
            }
          }
        } catch(e) {}
      }
    }
  } catch(e) { console.log('Budget status update error:', e); }
}

  p.timelineStart      = document.getElementById('pi-tlStart')?.value.trim()  || p.timelineStart;

  p.links.budget = budgetLink;
  p.notionTrackerPageId = notionId || p.notionTrackerPageId;
  p.notionTimelineDbId  = notionTimelineDb !== undefined ? notionTimelineDb : (p.notionTimelineDbId || '');
  p.cxName = cxName; p.cxPhone = cxPhone; p.cxEmail = cxEmail;
  p.pmName = pmName; p.pmPhone = pmPhone; p.pmEmail = pmEmail;
  p.teamLead = cxName; p.teamPhone = cxPhone; p.teamEmail = cxEmail;
  if (PROJECTS[projectId]) {
    if (!PROJECTS[projectId].links) PROJECTS[projectId].links = {};
    PROJECTS[projectId].links.budget = budgetLink;
    PROJECTS[projectId].notionTrackerPageId = p.notionTrackerPageId;
    PROJECTS[projectId].notionTimelineDbId  = p.notionTimelineDbId;
    PROJECTS[projectId].cxName  = cxName;  PROJECTS[projectId].cxPhone = cxPhone;  PROJECTS[projectId].cxEmail = cxEmail;
    PROJECTS[projectId].pmName  = pmName;  PROJECTS[projectId].pmPhone = pmPhone;  PROJECTS[projectId].pmEmail = pmEmail;
    PROJECTS[projectId].teamLead = cxName; PROJECTS[projectId].teamPhone = cxPhone; PROJECTS[projectId].teamEmail = cxEmail;
  }
  // Persist to localStorage override
  adminSet(projectId, 'projectOverride', { clientName:p.clientName, projectName:p.projectName, location:p.location, statusType:p.statusType, phaseLabel:p.phaseLabel, constructionPct:p.constructionPct, timelineStart:p.timelineStart, timelineTarget:p.timelineTarget, budgetLink, notionTrackerPageId: p.notionTrackerPageId });
  // Update the cached session so all pages see changes immediately
  try {
    const raw = localStorage.getItem('sa_session_v3');
    if (raw) {
      const s = JSON.parse(raw);
      if (s.data && s.data.id === projectId) {
        if (!s.data.links) s.data.links = {};
        s.data.links.budget          = budgetLink;
        s.data.notionTrackerPageId   = p.notionTrackerPageId;
        s.data.notionTimelineDbId    = p.notionTimelineDbId;
        s.data.groundbreakingDate    = p.groundbreakingDate || '';
        s.data.timelineStart         = p.timelineStart;
        s.data.timelineTarget        = p.timelineTarget;
        s.data.statusType            = p.statusType;
        s.data.phaseLabel            = p.phaseLabel;
        s.data.constructionPct       = p.constructionPct || 0;
        // Force re-fetch on next load so Supabase is source of truth
        s.ts = 0;
        localStorage.setItem('sa_session_v3', JSON.stringify(s));
      }
    }
  } catch(e) {}
  // Push to Supabase directly — use upsert so it works even if row doesn't exist yet
  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' };
  const supabasePayload = {
    id: projectId,
    client_name: p.clientName, project_name: p.projectName, location: p.location,
    status_type: p.statusType, phase_label: p.phaseLabel, construction_pct: p.constructionPct,
    timeline_start: p.timelineStart, timeline_target: p.timelineTarget,
    notion_tracker_page_id: p.notionTrackerPageId,
    notion_timeline_db_id: p.notionTimelineDbId || null,
    budget_link: budgetLink,
    team_lead: cxName, team_phone: cxPhone, team_email: cxEmail,
    cx_name: cxName, cx_phone: cxPhone, cx_email: cxEmail,
    pm_name: pmName, pm_phone: pmPhone, pm_email: pmEmail,
    groundbreaking_date: p.groundbreakingDate || null,
    show_review_card: !!p.showReviewCard,
    review_left: !!p.reviewLeft,
    email: p.email || '',
    password: p.password || '',
  };
  fetch(`${SUPABASE_DIRECT_URL}/rest/v1/clients`, {
    method: 'POST',
    headers: sbH,
    body: JSON.stringify(supabasePayload),
  }).then(async res => {
    if (!res.ok) {
      const err = await res.text();
      console.error('saveProjectInfo upsert failed:', res.status, err);
      showMsg('pi-msg', 'error', `Save failed (${res.status}) — check console`);
    }
  }).catch(err => {
    console.error('saveProjectInfo network error:', err);
    showMsg('pi-msg', 'error', 'Network error — could not reach Supabase');
  });
  showMsg('pi-msg','success','Saved ✓');
}

  // Two-step confirmation: first click shows a confirm prompt
  const confirmed = window.confirm(

  );

async function deleteClient(projectId, clientName) {
  const msgEl = document.getElementById('pi-delete-msg');
  if (msgEl) { msgEl.textContent = 'Deleting…'; msgEl.style.color = 'var(--danger)'; }

  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json' };

  try {
    // Delete all related records first (cascade should handle it, but be explicit)
    const tables = ['selections','updates','budget_categories','change_orders','milestones','documents','decisions'];
    await Promise.all(tables.map(table =>
      fetch(`${SUPABASE_DIRECT_URL}/rest/v1/${table}?client_id=eq.${projectId}`, { method:'DELETE', headers:sbH })
    ));

    // Delete the client record
    const res = await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/clients?id=eq.${projectId}`, {
      method: 'DELETE', headers: sbH,
    });

    if (!res.ok) throw new Error(`Delete failed: ${res.status}`);

    // Remove from in-memory PROJECTS
    delete PROJECTS[projectId];

    // Switch to first remaining client
    const remaining = Object.keys(PROJECTS);
    if (remaining.length > 0) {
      activeProject = remaining[0];
      sessionStorage.setItem('sa_admin_project', activeProject);
    }
    activeView = 'tracker';
    sessionStorage.setItem('sa_admin_view', 'tracker');

    renderAdmin();
    setTimeout(() => showMsg('pi-msg','success',`${clientName} removed ✓`), 100);

  } catch(e) {
    console.error('deleteClient error:', e);
    if (msgEl) { msgEl.textContent = `Error: ${e.message}`; msgEl.style.color = 'var(--danger)'; }
  }
}

function buildSelectionsContent(ck, p, saved, answers) {
  const ALL_CATS = [
    { id:'fireplace',wave:0,name:'Fireplace' },{ id:'appliances',wave:0,name:'Appliances' },
    { id:'exterior_finishes',wave:0,name:'Exterior Finishes' },
    { id:'specialty_trim',wave:1,name:'Specialty Trim' },{ id:'flooring',wave:1,name:'Flooring' },{ id:'tile',wave:1,name:'Tile' },
    { id:'plumbing',wave:2,name:'Plumbing Fixtures' },{ id:'lighting',wave:2,name:'Lighting Fixtures' },
    { id:'countertops',wave:2,name:'Countertops' },{ id:'hardware',wave:2,name:'Hardware' },
    { id:'paint',wave:2,name:'Paint & Stain' },{ id:'doors',wave:2,name:'Interior Doors & Trim' },
  ];
  function catDone(id) {
    if (id==='fireplace' && answers['fireplace_fp_want']==='No — no fireplace') return true;
    return !!saved[id];
  }
  // Get a readable answer preview for a category
  function catPreview(id) {
    const keys = Object.keys(answers).filter(k => k.startsWith(id+'_') && answers[k] && typeof answers[k] === 'string' && answers[k].length < 60);
    return keys.slice(0,2).map(k => answers[k]).filter(Boolean).join(' · ') || '';
  }

  const done = ALL_CATS.filter(c => catDone(c.id)).length;
  const pct  = Math.round(done/ALL_CATS.length*100);
  const waves = [
    { label:'Wave 1 — Structure', cats:ALL_CATS.filter(c=>c.wave===0) },
    { label:'Wave 2 — The Shell', cats:ALL_CATS.filter(c=>c.wave===1) },
    { label:'Wave 3 — The Jewelry', cats:ALL_CATS.filter(c=>c.wave===2) },
  ];

  return `
    <div class="card dark" style="margin-bottom:1rem">
      <div class="kpi"><div class="kpi-lbl">Selections Complete</div><div class="kpi-val">${pct}%</div><div class="kpi-sub">${done} of ${ALL_CATS.length} categories</div></div>
      <div class="track" style="margin-top:11px;background:rgba(255,255,255,.1)"><div class="bar" style="width:${pct}%"></div></div>
    </div>
    <div class="card" style="margin-bottom:1rem">
      <div class="sh"><div class="sh-title">Category Detail</div></div>
      ${waves.map(w => `
        <div class="phase-section-hd">${w.label}</div>
        ${w.cats.map(cat => {
          const isDone    = catDone(cat.id);
          const preview   = catPreview(cat.id);
          return `<div style="padding:9px 0;border-bottom:0.5px solid var(--border)">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:7px;height:7px;border-radius:50%;background:${isDone?'var(--green)':'var(--cream-3)'};flex-shrink:0;margin-top:1px"></div>
              <div style="flex:1;font-size:13px;font-weight:500;color:var(--charcoal)">${cat.name}</div>
              <span class="${isDone?'tag ok':'tag'}" style="font-size:9px;${!isDone?'background:var(--cream-2);color:var(--charcoal-4)':''}">${isDone?'Complete':'Pending'}</span>
            </div>
            ${preview ? `<div style="font-size:11px;color:var(--charcoal-3);margin-top:3px;padding-left:17px;line-height:1.4">${preview}</div>` : ''}
          </div>`;
        }).join('')}`).join('')}
    </div>`;
}

async function addAdminDoc(projectId) {
  const name = document.getElementById('adm-doc-name')?.value.trim();
  const url  = document.getElementById('adm-doc-url')?.value.trim();
  const cat  = document.getElementById('adm-doc-cat')?.value;
  const type = document.getElementById('adm-doc-type')?.value;
  const note = document.getElementById('adm-doc-note')?.value.trim();
  if (!name || !url) { showMsg('adm-doc-msg','error','Name and URL required.'); return; }
  const now = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  let previewUrl = url;
  if (type==='pdf' && url.includes('drive.google.com/file/d/')) {
    previewUrl = url.replace('/view','/preview').replace('/edit','/preview');
    if (!previewUrl.includes('/preview')) previewUrl += '/preview';
  }
  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
  try {
    const res = await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/documents`, {
      method: 'POST',
      headers: sbH,
      body: JSON.stringify({ client_id: projectId, name, category: cat, url: previewUrl, type, date: now, note: note||'' }),
    });
    if (!res.ok) { const err = await res.text(); showMsg('adm-doc-msg','error','Save failed: '+err); return; }
    // Also update PROJECTS in memory
    if (!PROJECTS[projectId].documents) PROJECTS[projectId].documents = [];
    PROJECTS[projectId].documents.push({ id:'adm'+Date.now(), category:cat, name, url:previewUrl, type, date:now, note });
    showMsg('adm-doc-msg','success','Added ✓ — visible to client immediately');
    setTimeout(() => renderAdmin(), 600);
  } catch(e) { showMsg('adm-doc-msg','error','Error: '+e.message); }
}

async function removeAdminDoc(projectId, docId) {
  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Prefer': 'return=minimal' };
  try {
    await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/documents?id=eq.${docId}&client_id=eq.${projectId}`, {
      method: 'DELETE', headers: sbH,
    });
    if (PROJECTS[projectId].documents) {
      PROJECTS[projectId].documents = PROJECTS[projectId].documents.filter(d => d.id != docId);
    }
    renderAdmin();
  } catch(e) { console.error('removeAdminDoc error:', e); }
}

async function addPhotoFolder(projectId) {
  console.log('addPhotoFolder called for:', projectId);
  const urlVal   = document.getElementById('pf-url')?.value.trim();
  const custom   = document.getElementById('pf-custom')?.value.trim();
  const selected = document.getElementById('pf-label')?.value;
  const label    = custom || selected || 'Photos';
  const msgEl    = document.getElementById('pf-msg');

  const setMsg = (type, txt) => { if (msgEl) { msgEl.className = 'adm-msg ' + type; msgEl.textContent = txt; } };

  if (!urlVal) { setMsg('error', 'Folder URL required'); return; }
  if (!urlVal.includes('drive.google.com')) { setMsg('error', 'Must be a Google Drive URL'); return; }

  setMsg('success', 'Saving...');

  // Get current folders from PROJECTS, defaulting to empty array
  const p = PROJECTS[projectId] || {};
  if (!p.photoFolders) p.photoFolders = [];
  const folders = [...p.photoFolders, { label, url: urlVal }];

  const sbH = {
    'apikey': SUPABASE_ANON,
    'Authorization': 'Bearer ' + SUPABASE_ANON,
    'Content-Type': 'application/json',
    'Prefer': 'return=minimal',
  };

  try {
    const res = await fetch(SUPABASE_DIRECT_URL + '/rest/v1/clients?id=eq.' + projectId, {
      method: 'PATCH',
      headers: sbH,
      body: JSON.stringify({ photo_folders: folders }),
    });
    if (res.ok) {
      // Update in-memory project
      p.photoFolders = folders;
      if (PROJECTS[projectId]) PROJECTS[projectId].photoFolders = folders;
      // Update session cache so client portal picks it up
      try {
        const raw = localStorage.getItem('sa_session_v3');
        if (raw) {
          const s = JSON.parse(raw);
          if (s.data && s.data.id === projectId) { s.data.photoFolders = folders; s.ts = 0; localStorage.setItem('sa_session_v3', JSON.stringify(s)); }
        }
      } catch(e) {}
      if (document.getElementById('pf-url')) document.getElementById('pf-url').value = '';
      if (document.getElementById('pf-custom')) document.getElementById('pf-custom').value = '';
      setMsg('success', 'Folder saved ✓');
      setTimeout(() => renderAdmin(), 400);
    } else {
      const err = await res.text();
      console.error('addPhotoFolder Supabase error:', res.status, err);
      setMsg('error', 'Save failed (' + res.status + ') — check console');
    }
  } catch(e) {
    console.error('addPhotoFolder error:', e);
    setMsg('error', 'Error: ' + e.message);
  }
}

async function removePhotoFolder(projectId, idx) {
  if (!confirm('Remove this photo folder? Photos in the folder will no longer appear in the portal.')) return;
  const p = PROJECTS[projectId] || {};
  const updatedFolders = Array.isArray(p.photoFolders) ? [...p.photoFolders] : [];
  updatedFolders.splice(idx, 1);
  p.photoFolders = updatedFolders;
  if (PROJECTS[projectId]) PROJECTS[projectId].photoFolders = updatedFolders;
  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
  try {
    const res = await fetch(SUPABASE_DIRECT_URL + '/rest/v1/clients?id=eq.' + projectId, {
      method: 'PATCH', headers: sbH,
      body: JSON.stringify({ photo_folders: updatedFolders }),
    });
    if (!res.ok) console.error('removePhotoFolder error:', res.status, await res.text());
  } catch(e) { console.error('removePhotoFolder error:', e); }
  renderAdmin();
}


async function addAdminPhoto(projectId) {
  const caption = document.getElementById('adm-ph-caption')?.value.trim();
  const url     = document.getElementById('adm-ph-url')?.value.trim();
  const phase   = document.getElementById('adm-ph-phase')?.value;
  const dateVal = document.getElementById('adm-ph-date')?.value;
  if (!url) { showMsg('adm-ph-msg','error','Image URL required.'); return; }
  const dateLabel = dateVal
    ? new Date(dateVal+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
    : new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
  try {
    const res = await fetch(SUPABASE_DIRECT_URL + '/rest/v1/documents', {
      method: 'POST',
      headers: sbH,
      body: JSON.stringify({
        client_id: projectId,
        name:      caption || 'Build Photo',
        url,
        category:  'photos',
        type:      'image',
        date:      dateLabel,
        note:      phase || '',
      }),
    });
    if (!res.ok) {
      const err = await res.text();
      showMsg('adm-ph-msg','error','Save failed: ' + err);
      console.error('addAdminPhoto failed:', res.status, err);
      return;
    }
    // Update PROJECTS in memory so photos appear in admin immediately
    if (!PROJECTS[projectId].documents) PROJECTS[projectId].documents = [];
    PROJECTS[projectId].documents.push({
      id: 'adm'+Date.now(), category:'photos', caption, phase,
      name: caption || 'Build Photo', url, type:'image', date: dateLabel,
    });
    showMsg('adm-ph-msg','success','Photo added \u2713');
    if (document.getElementById('adm-ph-caption')) document.getElementById('adm-ph-caption').value = '';
    if (document.getElementById('adm-ph-url'))     document.getElementById('adm-ph-url').value = '';
    setTimeout(() => renderAdmin(), 600);
  } catch(e) {
    showMsg('adm-ph-msg','error','Error: ' + e.message);
    console.error('addAdminPhoto exception:', e);
  }
}
async function removeAdminPhoto(projectId, docId) {
  if (!docId) { console.error('removeAdminPhoto: no docId'); return; }
  if (!confirm('Remove this photo?')) return;
  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON };
  try {
    await fetch(SUPABASE_DIRECT_URL + '/rest/v1/documents?id=eq.' + docId + '&client_id=eq.' + projectId, {
      method: 'DELETE', headers: sbH,
    });
    // Remove from in-memory PROJECTS
    if (PROJECTS[projectId]?.documents) {
      PROJECTS[projectId].documents = PROJECTS[projectId].documents.filter(d => String(d.id) !== String(docId));
    }
    renderAdmin();
  } catch(e) { console.error('removeAdminPhoto error:', e); }
}

function getSchDayWidth() {
  return schZoom === 'months' ? 1.5 : schZoom === 'weeks' ? 5 : 18;

function schDaysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function schBarLeft(taskStart, tlStart) { return schDaysBetween(tlStart, taskStart) * getSchDayWidth(); }
function schBarWidth(dur) { return Math.max(dur * getSchDayWidth(), getSchDayWidth()); }
function schFmtDate(d) { if (!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function schFmtDateFull(d) { if (!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function schAddDays(dateStr, days) { const d=new Date(dateStr+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+days); return d.toISOString().split('T')[0]; }

async function scheduleAPI(projectId, action, method='GET', body=null, extra='') {
  const url = `/.netlify/functions/schedule-engine?projectId=${encodeURIComponent(projectId)}&action=${action}${extra}`;
  const opts = { method, headers: { 'Authorization': `Bearer ${ADMIN_PASS}`, 'Content-Type':'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `API error ${res.status}`);
  if (data.tasks) scheduleCache[projectId] = data;
  return data;
}

async function subsAPI(method='GET', id=null, body=null) {
  const url = `/.netlify/functions/subcontractors${id ? '?id='+id : ''}`;
  const opts = { method, headers: { 'Authorization': `Bearer ${ADMIN_PASS}`, 'Content-Type':'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  return await res.json();
}

async function loadSubcontractors() { subsCache = await subsAPI(); }

async function loadSchedule(projectId) {
  const el = document.getElementById('sch-loading');
  if (el) el.textContent = 'Loading schedule…';
  try {
    await loadSubcontractors();
    const sched = await scheduleAPI(projectId, 'schedule');
    if (sched.tasks && sched.tasks.length > 0) {
      await scheduleAPI(projectId, 'calculate');
    } else {
      scheduleCache[projectId] = sched;
    }
    renderAdmin();
  } catch(e) {
    if (el) { el.textContent = 'Error: ' + e.message; el.style.color = 'var(--danger)'; }
  }
}

function generateTimeMarkers(start, end) {
  const dw = getSchDayWidth();
  const markers = [];
  const d = new Date(start + 'T00:00:00');
  const endD = new Date(end + 'T00:00:00');

  if (schZoom === 'months') {
    d.setUTCDate(1); // align to month start
    while (d <= endD) {
      const daysInMonth = new Date(d.getUTCFullYear(), d.getUTCMonth()+1, 0).getUTCDate();
      markers.push({ label: d.toLocaleDateString('en-US',{month:'short',year:'2-digit',timeZone:'UTC'}), width: daysInMonth * dw });
      d.setUTCMonth(d.getUTCMonth() + 1);
    }
  } else {
    const day = d.getUTCDay();
    d.setUTCDate(d.getUTCDate() - (day === 0 ? 6 : day - 1));
    while (d <= endD) {
      markers.push({ label: d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}), width: 7 * dw });
      d.setUTCDate(d.getUTCDate() + 7);
    }
  }
  return markers;
}

function groupTasksByPhase(tasks) {
  const map = new Map();
  PHASE_ORDER.forEach(p => map.set(p, []));
  tasks.forEach(t => {
    const phase = t.phase || 'Other';
    if (!map.has(phase)) map.set(phase, []);
    map.get(phase).push(t);
  });
  return map;
}

function groupTasksByWorkstream(tasks) {
  const map = new Map([['Interior',[]],['Exterior',[]],['Both',[]]]);
  tasks.forEach(t => {
    const ws = (t.workstream||'both').charAt(0).toUpperCase() + (t.workstream||'both').slice(1);
    if (!map.has(ws)) map.set(ws, []);
    map.get(ws).push(t);
  });
  return map;
}

function filterQueue(tasks, queueKey) {
  const now = new Date().toISOString().split('T')[0];
  switch(queueKey) {
    case 'next_to_schedule': {
      const cutoff = schAddDays(now, 30);
      return tasks.filter(t =>
        (t.status === 'needs_scheduling' || t.status === 'not_ready') &&
        (!t.plannedStart || t.plannedStart <= cutoff)
      ).sort((a,b) => (a.sequenceOrder||0) - (b.sequenceOrder||0));
    }
    case 'long_lead':
      return tasks.filter(t => t.isLongLead && t.status !== 'complete')
        .sort((a,b) => (a.mustScheduleBy||'9999') < (b.mustScheduleBy||'9999') ? -1 : 1);
    case 'waiting_hold':
      return tasks.filter(t => t.status === 'waiting_on_client' || t.status === 'on_hold');
    default: return tasks;
  }
}
function countQueue(tasks, key) { return filterQueue(tasks, key).length; }

async function schBulkSetStatus(projectId, status) {
  if (schBulkSelected.size === 0) return;
  schShowToast(`Updating ${schBulkSelected.size} tasks…`, '');
  try {
    for (const taskId of schBulkSelected) {
      const body = { taskId, status };
      if (status === 'in_progress') body.actual_start = new Date().toISOString().split('T')[0];
      if (status === 'complete') {
        body.actual_start = body.actual_start || new Date().toISOString().split('T')[0];

      await scheduleAPI(projectId, 'update-task', 'PATCH', body);

    schShowToast('Bulk update complete', 'success');
    renderAdmin();
