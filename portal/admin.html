          <input class="adm-inp" value="${(v.detail||'').replace(/"/g,'&quot;')}" data-id="${v.id}" data-field="detail"
            oninput="rmadmEditDefault(${v.id},'detail',this.value)">
          <select class="adm-inp adm-sel" onchange="rmadmEditDefault(${v.id},'tag',this.value||null)">
            ${ROADMAP_TAG_OPTS.map(t => `<option value="${t}" ${((v.tag||'')===t)?'selected':''}>${t?t[0].toUpperCase()+t.slice(1):'— no tag —'}</option>`).join('')}
          </select>
          <input class="adm-inp" type="number" min="0" step="1" style="width:60px" value="${v.sort_order??0}"
            oninput="rmadmEditDefault(${v.id},'sort_order',parseInt(this.value)||0)">
          <button class="adm-btn adm-btn-danger" style="padding:4px 10px;font-size:11px" onclick="rmadmDeleteDefault(${v.id})">×</button>
        </div>`).join('');
      return `
        <div style="padding:14px 0;border-bottom:0.5px solid var(--border)">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px">
            <div style="font-size:13px;font-weight:700;color:var(--charcoal)">${stop.name}</div>
            <button class="adm-btn adm-btn-green" style="font-size:11px;padding:5px 10px" onclick="rmadmAddDefault('${stop.id}')">+ Add vendor</button>
          </div>
          ${vendorRows || '<div style="font-size:12px;color:var(--charcoal-4);padding:8px 0">No default vendors yet. Add one above.</div>'}
        </div>`;
    }).join('');
    return `<div class="card" style="margin-bottom:1rem"><div class="sh"><div class="sh-title">${ROADMAP_WAVE_LABELS[wi]}</div></div>${rows}</div>`;
  }).join('');

  return `
    <div class="card" style="margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--charcoal)">Global defaults affect every client</div>
        <div style="font-size:11px;color:var(--charcoal-4);margin-top:2px">These are what every client sees unless a per-client override has been set.</div>
      </div>
      <button class="adm-btn adm-btn-green" onclick="rmadmSaveDefaults()">Save changes to defaults</button>
    </div>
    ${waves}
    <style>
      .rmadm-row { display:grid; grid-template-columns: 1.4fr 1.6fr 130px 70px 40px; gap:6px; margin-bottom:6px; align-items:center; }
      @media (max-width:720px) { .rmadm-row { grid-template-columns: 1fr; } }
    </style>`;
}

// ── Per-client override mutations (buffered in memory, saved on click) ────
function rmadmStartOverride(stopId) {
  // Seed override with a deep copy of current defaults
  const seed = defaultsForStop(stopId).map((v,i) => ({
    name: v.name, detail: v.detail||'', tag: v.tag||null, sort_order: v.sort_order ?? (i+1),
  }));
  ROADMAP_ADMIN.overrides[stopId] = seed;
  rerenderRoadmapClientEditor();
}
function rmadmAddOverrideRow(stopId) {
  if (!Array.isArray(ROADMAP_ADMIN.overrides[stopId])) ROADMAP_ADMIN.overrides[stopId] = [];
  ROADMAP_ADMIN.overrides[stopId].push({ name:'', detail:'', tag:null, sort_order: (ROADMAP_ADMIN.overrides[stopId].length+1) });
  rerenderRoadmapClientEditor();
}
function rmadmEditOverride(stopId, idx, field, val) {
  if (!Array.isArray(ROADMAP_ADMIN.overrides[stopId])) return;
  ROADMAP_ADMIN.overrides[stopId][idx][field] = (field === 'tag' && !val) ? null : val;
}
function rmadmRemoveOverride(stopId, idx) {
  if (!Array.isArray(ROADMAP_ADMIN.overrides[stopId])) return;
  ROADMAP_ADMIN.overrides[stopId].splice(idx, 1);
  rerenderRoadmapClientEditor();
}
function rmadmResetStop(stopId) {
  if (!confirm('Reset this stop to global defaults? The client will lose any custom vendors set here.')) return;
  delete ROADMAP_ADMIN.overrides[stopId];
  rerenderRoadmapClientEditor();
  // Persist immediately so the "reset" actually takes effect
  const p = PROJECTS[activeProject]; const ck = p.selectionsClientKey || p.id;
  rmadmSaveOverrides(ck, /*silent*/ true);
}
async function rmadmSaveOverrides(ck, silent) {
  try {
    const res = await fetch(`/.netlify/functions/roadmap-vendors?clientKey=${ck}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ overrides: ROADMAP_ADMIN.overrides }),
    });
    if (!res.ok) throw new Error('save failed '+res.status);
    if (!silent) alert('Saved. The client will see these vendors the next time they open the Roadmap.');
  } catch(e) { console.error(e); if (!silent) alert('Save failed. Check your connection and try again.'); }
}
async function rmadmClearAllOverrides(ck) {
  if (!confirm('Remove ALL vendor overrides for this client? Every stop will revert to global defaults.')) return;
  try {
    const res = await fetch(`/.netlify/functions/roadmap-vendors?clientKey=${ck}`, { method:'DELETE' });
    if (!res.ok) throw new Error('delete failed '+res.status);
    ROADMAP_ADMIN.overrides = {};
    rerenderRoadmapClientEditor();
  } catch(e) { console.error(e); alert('Clear failed.'); }
}
function rerenderRoadmapClientEditor() {
  const p = PROJECTS[activeProject]; const ck = p.selectionsClientKey || p.id;
  const wrap = document.getElementById('rmadm-content');
  if (wrap) wrap.innerHTML = buildRoadmapAdminContent(ck, p);
}

// ── Global defaults mutations ───────────────────────────
// Buffered edits are applied to ROADMAP_ADMIN.defaults, then saved in one POST.
let _rmadmDirtyIds = new Set();
let _rmadmNewRows  = [];  // { stop_id, name, detail, tag, sort_order }
let _rmadmDeletes  = [];

function rmadmEditDefault(id, field, val) {
  const row = ROADMAP_ADMIN.defaults.find(r => r.id === id);
  if (!row) return;
  row[field] = (field === 'tag' && !val) ? null : val;
  _rmadmDirtyIds.add(id);
}
function rmadmAddDefault(stopId) {
  const newRow = { stop_id: stopId, name:'New vendor', detail:'', tag:null, sort_order: defaultsForStop(stopId).length + 1, is_active:true };
  // Temporary UI-only id
  const tmpId = -1 * (Date.now() + Math.floor(Math.random()*999));
  ROADMAP_ADMIN.defaults.push({ ...newRow, id: tmpId, _new: true });
  _rmadmNewRows.push({ tmpId, ...newRow });
  const wrap = document.getElementById('rmadm-content');
  if (wrap) wrap.innerHTML = buildRoadmapDefaultsEditor();
}
async function rmadmDeleteDefault(id) {
  if (!confirm('Delete this default vendor? Clients currently using it will fall back to whatever defaults remain for that stop.')) return;
  if (id < 0) {
    // Unsaved new row — just drop it locally
    ROADMAP_ADMIN.defaults = ROADMAP_ADMIN.defaults.filter(r => r.id !== id);
    _rmadmNewRows = _rmadmNewRows.filter(r => r.tmpId !== id);
  } else {
    try {
      const res = await fetch(`/.netlify/functions/roadmap-vendors?defaults=1&delete=${id}`, { method:'POST' });
      if (!res.ok) throw new Error('delete failed');
      ROADMAP_ADMIN.defaults = ROADMAP_ADMIN.defaults.filter(r => r.id !== id);
      _rmadmDirtyIds.delete(id);
    } catch(e) { alert('Delete failed.'); return; }
  }
  const wrap = document.getElementById('rmadm-content');
  if (wrap) wrap.innerHTML = buildRoadmapDefaultsEditor();
}
async function rmadmSaveDefaults() {
  // Build rows array: updates (with id) + inserts (no id)
  const updates = ROADMAP_ADMIN.defaults
    .filter(r => !r._new && _rmadmDirtyIds.has(r.id))
    .map(r => ({ id:r.id, stop_id:r.stop_id, name:r.name, detail:r.detail||'', tag:r.tag||null, sort_order:r.sort_order||0, is_active:r.is_active!==false }));
  const inserts = _rmadmNewRows.map(r => ({ stop_id:r.stop_id, name:r.name, detail:r.detail||'', tag:r.tag||null, sort_order:r.sort_order||0, is_active:true }));
  // Pull fresh values from current state for inserts (since the user may have edited them)
  const newIdsFromState = ROADMAP_ADMIN.defaults.filter(r => r._new);
  const finalInserts = newIdsFromState.map(r => ({ stop_id:r.stop_id, name:r.name, detail:r.detail||'', tag:r.tag||null, sort_order:r.sort_order||0, is_active:true }));
  const rows = [...updates, ...finalInserts];
  if (!rows.length) { alert('No changes to save.'); return; }
  try {
    const res = await fetch(`/.netlify/functions/roadmap-vendors?defaults=1`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ rows }),
    });
    if (!res.ok) throw new Error('save failed '+res.status);
    alert('Saved. Reloading defaults…');
    _rmadmDirtyIds.clear();
    _rmadmNewRows = [];
    // Reload fresh from the server
    const defRes = await fetch(`/.netlify/functions/roadmap-vendors?defaults=1`);
    ROADMAP_ADMIN.defaults = defRes.ok ? (await defRes.json()).rows || [] : [];
    const wrap = document.getElementById('rmadm-content');
    if (wrap) wrap.innerHTML = buildRoadmapDefaultsEditor();
  } catch(e) { console.error(e); alert('Save failed. Check your connection and try again.'); }
}

async function addAdminDoc(projectId) {
  const name = document.getElementById('adm-doc-name')?.value.trim();
  const url  = document.getElementById('adm-doc-url')?.value.trim();
  const cat  = document.getElementById('adm-doc-cat')?.value;
  const type = document.getElementById('adm-doc-type')?.value;
  const note = document.getElementById('adm-doc-note')?.value.trim();
  if (!name || !url) { showMsg('adm-doc-msg','error','Name and URL required.'); return; }
  const now = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  let previewUrl = url;
  if (type==='pdf' && url.includes('drive.google.com/file/d/')) {
    previewUrl = url.replace('/view','/preview').replace('/edit','/preview');
    if (!previewUrl.includes('/preview')) previewUrl += '/preview';
  }
  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
  try {
    const res = await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/documents`, {
      method: 'POST',
      headers: sbH,
      body: JSON.stringify({ client_id: projectId, name, category: cat, url: previewUrl, type, date: now, note: note||'' }),
    });
    if (!res.ok) { const err = await res.text(); showMsg('adm-doc-msg','error','Save failed: '+err); return; }
    // Also update PROJECTS in memory
    if (!PROJECTS[projectId].documents) PROJECTS[projectId].documents = [];
    PROJECTS[projectId].documents.push({ id:'adm'+Date.now(), category:cat, name, url:previewUrl, type, date:now, note });
    showMsg('adm-doc-msg','success','Added ✓ — visible to client immediately');
    setTimeout(() => renderAdmin(), 600);
  } catch(e) { showMsg('adm-doc-msg','error','Error: '+e.message); }
}

async function removeAdminDoc(projectId, docId) {
  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Prefer': 'return=minimal' };
  try {
    await fetch(`${SUPABASE_DIRECT_URL}/rest/v1/documents?id=eq.${docId}&client_id=eq.${projectId}`, {
      method: 'DELETE', headers: sbH,
    });
    if (PROJECTS[projectId].documents) {
      PROJECTS[projectId].documents = PROJECTS[projectId].documents.filter(d => d.id != docId);
    }
    renderAdmin();
  } catch(e) { console.error('removeAdminDoc error:', e); }
}

async function addPhotoFolder(projectId) {
  console.log('addPhotoFolder called for:', projectId);
  const urlVal   = document.getElementById('pf-url')?.value.trim();
  const custom   = document.getElementById('pf-custom')?.value.trim();
  const selected = document.getElementById('pf-label')?.value;
  const label    = custom || selected || 'Photos';
  const msgEl    = document.getElementById('pf-msg');

  const setMsg = (type, txt) => { if (msgEl) { msgEl.className = 'adm-msg ' + type; msgEl.textContent = txt; } };

  if (!urlVal) { setMsg('error', 'Folder URL required'); return; }
  if (!urlVal.includes('drive.google.com')) { setMsg('error', 'Must be a Google Drive URL'); return; }

  setMsg('success', 'Saving...');

  // Get current folders from PROJECTS, defaulting to empty array
  const p = PROJECTS[projectId] || {};
  if (!p.photoFolders) p.photoFolders = [];
  const folders = [...p.photoFolders, { label, url: urlVal }];

  const sbH = {
    'apikey': SUPABASE_ANON,
    'Authorization': 'Bearer ' + SUPABASE_ANON,
    'Content-Type': 'application/json',
    'Prefer': 'return=minimal',
  };

  try {
    const res = await fetch(SUPABASE_DIRECT_URL + '/rest/v1/clients?id=eq.' + projectId, {
      method: 'PATCH',
      headers: sbH,
      body: JSON.stringify({ photo_folders: folders }),
    });
    if (res.ok) {
      // Update in-memory project
      p.photoFolders = folders;
      if (PROJECTS[projectId]) PROJECTS[projectId].photoFolders = folders;
      // Update session cache so client portal picks it up
      try {
        const raw = localStorage.getItem('sa_session_v3');
        if (raw) {
          const s = JSON.parse(raw);
          if (s.data && s.data.id === projectId) { s.data.photoFolders = folders; s.ts = 0; localStorage.setItem('sa_session_v3', JSON.stringify(s)); }
        }
      } catch(e) {}
      if (document.getElementById('pf-url')) document.getElementById('pf-url').value = '';
      if (document.getElementById('pf-custom')) document.getElementById('pf-custom').value = '';
      setMsg('success', 'Folder saved ✓');
      setTimeout(() => renderAdmin(), 400);
    } else {
      const err = await res.text();
      console.error('addPhotoFolder Supabase error:', res.status, err);
      setMsg('error', 'Save failed (' + res.status + ') — check console');
    }
  } catch(e) {
    console.error('addPhotoFolder error:', e);
    setMsg('error', 'Error: ' + e.message);
  }
}

async function removePhotoFolder(projectId, idx) {
  if (!confirm('Remove this photo folder? Photos in the folder will no longer appear in the portal.')) return;
  const p = PROJECTS[projectId] || {};
  const updatedFolders = Array.isArray(p.photoFolders) ? [...p.photoFolders] : [];
  updatedFolders.splice(idx, 1);
  p.photoFolders = updatedFolders;
  if (PROJECTS[projectId]) PROJECTS[projectId].photoFolders = updatedFolders;
  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
  try {
    const res = await fetch(SUPABASE_DIRECT_URL + '/rest/v1/clients?id=eq.' + projectId, {
      method: 'PATCH', headers: sbH,
      body: JSON.stringify({ photo_folders: updatedFolders }),
    });
    if (!res.ok) console.error('removePhotoFolder error:', res.status, await res.text());
  } catch(e) { console.error('removePhotoFolder error:', e); }
  renderAdmin();
}


async function addAdminPhoto(projectId) {
  const caption = document.getElementById('adm-ph-caption')?.value.trim();
  const url     = document.getElementById('adm-ph-url')?.value.trim();
  const phase   = document.getElementById('adm-ph-phase')?.value;
  const dateVal = document.getElementById('adm-ph-date')?.value;
  if (!url) { showMsg('adm-ph-msg','error','Image URL required.'); return; }
  const dateLabel = dateVal
    ? new Date(dateVal+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
    : new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
  try {
    const res = await fetch(SUPABASE_DIRECT_URL + '/rest/v1/documents', {
      method: 'POST',
      headers: sbH,
      body: JSON.stringify({
        client_id: projectId,
        name:      caption || 'Build Photo',
        url,
        category:  'photos',
        type:      'image',
        date:      dateLabel,
        note:      phase || '',
      }),
    });
    if (!res.ok) {
      const err = await res.text();
      showMsg('adm-ph-msg','error','Save failed: ' + err);
      console.error('addAdminPhoto failed:', res.status, err);
      return;
    }
    // Update PROJECTS in memory so photos appear in admin immediately
    if (!PROJECTS[projectId].documents) PROJECTS[projectId].documents = [];
    PROJECTS[projectId].documents.push({
      id: 'adm'+Date.now(), category:'photos', caption, phase,
      name: caption || 'Build Photo', url, type:'image', date: dateLabel,
    });
    showMsg('adm-ph-msg','success','Photo added \u2713');
    if (document.getElementById('adm-ph-caption')) document.getElementById('adm-ph-caption').value = '';
    if (document.getElementById('adm-ph-url'))     document.getElementById('adm-ph-url').value = '';
    setTimeout(() => renderAdmin(), 600);
  } catch(e) {
    showMsg('adm-ph-msg','error','Error: ' + e.message);
    console.error('addAdminPhoto exception:', e);
  }
}
async function removeAdminPhoto(projectId, docId) {
  if (!docId) { console.error('removeAdminPhoto: no docId'); return; }
  if (!confirm('Remove this photo?')) return;
  const sbH = { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON };
  try {
    await fetch(SUPABASE_DIRECT_URL + '/rest/v1/documents?id=eq.' + docId + '&client_id=eq.' + projectId, {
      method: 'DELETE', headers: sbH,
    });
    // Remove from in-memory PROJECTS
    if (PROJECTS[projectId]?.documents) {
      PROJECTS[projectId].documents = PROJECTS[projectId].documents.filter(d => String(d.id) !== String(docId));
    }
    renderAdmin();
  } catch(e) { console.error('removeAdminPhoto error:', e); }
}

async function createClientDirect() {
  const clientName     = document.getElementById('nc-clientName')?.value.trim();
  const projectName    = document.getElementById('nc-projectName')?.value.trim();
  const location       = document.getElementById('nc-location')?.value.trim() || 'Bowling Green, KY';
  const phase          = document.getElementById('nc-phase')?.value || 'sab';
  const projectType    = document.getElementById('nc-projectType')?.value || 'new_build';
  const email          = document.getElementById('nc-email')?.value.trim();
  const password       = document.getElementById('nc-password')?.value.trim();
  const notionTracker  = document.getElementById('nc-notionTracker')?.value.trim() || null;
  const notionTimeline = document.getElementById('nc-notionTimeline')?.value.trim() || null;
  const sheetUrl       = document.getElementById('nc-sheetUrl')?.value.trim() || null;
  const tlStart        = document.getElementById('nc-tlStart')?.value.trim() || 'TBD';
  const tlTarget       = document.getElementById('nc-tlTarget')?.value.trim() || 'TBD';
  const pmName         = document.getElementById('nc-pmName')?.value.trim() || 'Cole Borders';
  const pmPhone        = document.getElementById('nc-pmPhone')?.value.trim() || '(270) 782-5388';
  const pmEmail        = document.getElementById('nc-pmEmail')?.value.trim() || 'cole@sixarrowsconstruction.com';

  const msgEl = document.getElementById('nc-msg');

  if (!clientName || !email || !password) {
    if (msgEl) { msgEl.className = 'adm-msg error'; msgEl.style.display = 'block'; msgEl.textContent = 'Client name, email, and access code are required.'; }
    return;
  }

  // Generate a clean ID from client name
  const id = clientName.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/, '');

  if (msgEl) { msgEl.className = 'adm-msg neutral'; msgEl.style.display = 'block'; msgEl.textContent = 'Creating client...'; }

  const record = {
    id,
    email,
    password,
    client_name:            clientName,
    project_name:           projectName || 'Custom Home',
    location,
    status_type:            phase,
    project_type:           projectType,
    phase_label:            phase === 'sab' ? 'Phase 1 - Design & Architecture' : 'Active Build',
    construction_pct:       0,
    timeline_start:         tlStart,
    timeline_target:        tlTarget,
    budget_link:            sheetUrl,
    notion_tracker_page_id: notionTracker,
    notion_timeline_db_id:  notionTimeline,
    team_lead:              pmName,
    team_phone:             pmPhone,
    team_email:             pmEmail,
    cx_name:                pmName,
    cx_phone:               pmPhone,
    cx_email:               pmEmail,
    pm_name:                pmName,
    pm_phone:               pmPhone,
    pm_email:               pmEmail,
    quick_summary:          'Welcome to your Six Arrows client portal.',
    show_review_card:       false,
    review_left:            false,
  };

  try {
    const sbH = {
      'apikey':        SUPABASE_ANON,
      'Authorization': 'Bearer ' + SUPABASE_ANON,
      'Content-Type':  'application/json',
      'Prefer':        'return=minimal',
    };

    const res = await fetch(SUPABASE_DIRECT_URL + '/rest/v1/clients', {
      method:  'POST',
      headers: sbH,
      body:    JSON.stringify(record),
    });

    if (res.status === 409) {
      if (msgEl) { msgEl.className = 'adm-msg error'; msgEl.textContent = 'A client with ID "' + id + '" already exists. Try a slightly different name.'; }
      return;
    }

    if (!res.ok) {
      const err = await res.text();
      if (msgEl) { msgEl.className = 'adm-msg error'; msgEl.textContent = 'Supabase error: ' + err; }
      return;
    }

    // Add to in-memory PROJECTS so admin can switch to the new client immediately
    PROJECTS[id] = {
      id, email, password,
      clientName, projectName: projectName || 'Custom Home', location,
      status: phase === 'sab' ? 'In SAB Process' : 'Active Construction',
      statusType: phase,
      projectType,
      constructionPct: 0, sabProgress: 0,
      phaseLabel: phase === 'sab' ? 'Phase 1 - Design & Architecture' : 'Active Build',
      groundbreakingDate: '', budgetTotal: 0, budgetCommitted: 0,
      budgetAllowance: 0, budgetContingency: 0, changeOrders: 0, changeOrderItems: [],
      timelineStart: tlStart, timelineTarget: tlTarget,
      teamLead: pmName, teamPhone: pmPhone, teamEmail: pmEmail,
      cxName: pmName, cxPhone: pmPhone, cxEmail: pmEmail,
      pmName, pmPhone, pmEmail,
      quickSummary: 'Welcome to your Six Arrows client portal.',
      selectionsClientKey: id,
      notionTrackerPageId: notionTracker || null,
      notionTimelineDbId:  notionTimeline || null,
      links: { budget: sheetUrl || '#', timeline: '#' },
      decisions: [], updates: [], timeline: [], documents: [],
      budgetCategories: [],
      sabPhases: JSON.parse(JSON.stringify(DEFAULT_SAB_PHASES)),
    };

    if (msgEl) { msgEl.className = 'adm-msg success'; msgEl.textContent = 'Client created! Switching to their admin view...'; }

    // Switch to the new client's tracker view
    setTimeout(() => {
      currentProjectId = id;
      activeView = 'project_info';
      renderAdmin();
    }, 1000);

  } catch(e) {
    if (msgEl) { msgEl.className = 'adm-msg error'; msgEl.textContent = 'Error: ' + e.message; }
  }
}
