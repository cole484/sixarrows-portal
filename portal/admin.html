// ── Drag-to-reschedule (smooth free-follow with live tooltip) ──
let _dragState = null;
let _dragTip = null;

function schComputeDateFromLeft(leftPx) {
  const cache = scheduleCache[activeProject];
  if (!cache) return null;
  const tlStart = cache.tasks.reduce((m,t) => { const s=t.plannedStart; return s&&(!m||s<m)?s:m; }, null) || cache.buildStart;
  const dw = getSchDayWidth();
  return schAddDays(tlStart, Math.round(leftPx / dw));
}

function initGanttDrag() {
  const scroll = document.querySelector('.gantt-scroll');
  if (!scroll || scroll.dataset.dragInit) return;
  scroll.dataset.dragInit = '1';

  scroll.addEventListener('mousedown', (e) => {
    const bar = e.target.closest('.gantt-bar[data-draggable]');
    if (!bar) return;
    e.preventDefault();
    window._dragMoved = false;
    const ghost = bar.cloneNode(true);
    ghost.classList.add('gantt-bar-ghost');
    bar.parentElement.appendChild(ghost);

    // Create floating tooltip
    _dragTip = document.createElement('div');
    _dragTip.className = 'gantt-drag-tip';
    _dragTip.textContent = '';
    document.body.appendChild(_dragTip);

    _dragState = {
      bar, ghost,
      taskId: bar.dataset.taskId,
      origLeft: parseFloat(bar.dataset.originalLeft),
      startX: e.clientX + scroll.scrollLeft,
      startY: e.clientY,
      scroll,
      startTop: bar.closest('.gantt-row').getBoundingClientRect().top,
    };
  });

  // Robust row-at-point: elementFromPoint first, then nearest-row fallback by Y.
  // Falls back because elementFromPoint may land on empty area (dep SVG, hidden
  // edit panel, phase gap) where .closest('.gantt-row') returns null.
  function schRowAtPoint(clientX, clientY) {
    const el = document.elementFromPoint(clientX, clientY);
    const row = el?.closest?.('.gantt-row');
    if (row && row.dataset.taskId) return row;
    let best = null, bestDist = Infinity;
    document.querySelectorAll('.gantt-row[data-task-id]').forEach(r => {
      const rect = r.getBoundingClientRect();
      if (rect.height === 0) return;
      const center = rect.top + rect.height / 2;
      const dist = Math.abs(clientY - center);
      if (dist < bestDist && dist < 60) { best = r; bestDist = dist; }
    });
    return best;
  }

  document.addEventListener('mousemove', (e) => {
    if (!_dragState) return;
    window._dragMoved = true;
    const { ghost, origLeft, startX, startY, scroll, taskId } = _dragState;
    // Free follow — X and Y
    const dx = (e.clientX + scroll.scrollLeft) - startX;
    const dy = e.clientY - startY;
    const newLeft = Math.max(0, origLeft + dx);
    ghost.style.left = newLeft + 'px';
    ghost.style.transform = `translateY(${dy}px)`;

    // Detect hovered row (ignore dragged task's own row)
    const hoveredRow = schRowAtPoint(e.clientX, e.clientY);
    const validTarget = hoveredRow && hoveredRow.dataset.taskId && hoveredRow.dataset.taskId !== taskId;
    _dragState.hoveredTaskId = validTarget ? hoveredRow.dataset.taskId : null;

    // Highlight hovered row
    document.querySelectorAll('.gantt-row').forEach(r => r.style.outline = '');
    if (validTarget) {
      hoveredRow.style.outline = '2px solid var(--green)';
      hoveredRow.style.outlineOffset = '-2px';
    }

    // Live tooltip
    if (_dragTip) {
      const isReorderIntent = Math.abs(dy) > 20;
      const dw = getSchDayWidth();
      const snapped = Math.round(newLeft / dw) * dw;
      const d = schComputeDateFromLeft(snapped);
      const dateStr = d ? new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) : '';
      const cache = scheduleCache[activeProject];
      const hoveredTask = _dragState.hoveredTaskId && cache ? cache.tasks.find(t => t.id === _dragState.hoveredTaskId) : null;
      if (isReorderIntent && hoveredTask) {
        _dragTip.innerHTML = `↕ reorder before "${hoveredTask.taskName}"`;
      } else if (isReorderIntent) {
        _dragTip.innerHTML = `<span style="opacity:.7">release on a row to reorder</span>`;
      } else {
        _dragTip.innerHTML = dateStr;
      }
      _dragTip.style.left = (e.clientX + 14) + 'px';
      _dragTip.style.top = (e.clientY + 14) + 'px';
    }
  });

  document.addEventListener('mouseup', async (e) => {
    if (!_dragState) return;
    const { ghost, taskId, origLeft, startX, startY, scroll } = _dragState;
    _dragState = null;
    ghost.remove();
    if (_dragTip) { _dragTip.remove(); _dragTip = null; }
    document.querySelectorAll('.gantt-row').forEach(r => r.style.outline = '');

    if (!window._dragMoved) return;

    const dx = (e.clientX + scroll.scrollLeft) - startX;
    const dy = e.clientY - startY;
    const dw = getSchDayWidth();
    const cache = scheduleCache[activeProject];
    if (!cache) return;

    // Recompute drop target at release time (don't trust stale mousemove value).
    const dropRow = schRowAtPoint(e.clientX, e.clientY);
    const hoveredTaskId = (dropRow && dropRow.dataset.taskId && dropRow.dataset.taskId !== taskId)
      ? dropRow.dataset.taskId : null;

    // Intent: vertical drag above threshold means the user wants to reorder.
    // If intent is reorder but no valid target, cancel silently — do NOT reschedule.
    const REORDER_THRESHOLD = 20;
    const reorderIntent = Math.abs(dy) > REORDER_THRESHOLD;
    if (reorderIntent && !hoveredTaskId) {
      schShowToast('Drop on a task row to reorder','');
      return;
    }
    const isReorder = reorderIntent && hoveredTaskId;

    try {
      if (isReorder) {
        // REORDER: insert dragged task immediately before the hovered task.
        // Optimistic UI — reorder in-memory and re-render before the network round-trip.
        const draggedTask = cache.tasks.find(t => t.id === taskId);
        const targetTask = cache.tasks.find(t => t.id === hoveredTaskId);
        if (!draggedTask || !targetTask) return;

        const newPhase = (targetTask.phase && targetTask.phase !== draggedTask.phase) ? targetTask.phase : null;

        // Snapshot for rollback
        const snapshot = cache.tasks.map(t => ({ id: t.id, sequenceOrder: t.sequenceOrder, phase: t.phase }));

        // In-memory reorder + renumber
        const arr = cache.tasks.slice().sort((a, b) => a.sequenceOrder - b.sequenceOrder);
        const fromIdx = arr.findIndex(t => t.id === taskId);
        if (fromIdx < 0) return;
        const [moved] = arr.splice(fromIdx, 1);
        const toIdx = arr.findIndex(t => t.id === hoveredTaskId);
        arr.splice(toIdx, 0, moved);
        if (newPhase) moved.phase = newPhase;
        arr.forEach((t, i) => { t.sequenceOrder = i + 1; });
        cache.tasks = arr;
        renderAdmin();

        // Fire server update in background
        const patch = { taskId, targetTaskId: hoveredTaskId };
        if (newPhase) patch.phase = newPhase;
        scheduleAPI(activeProject, 'reorder-task', 'PATCH', patch)
          .then(() => schShowToast('Reordered','success'))
          .catch(err => {
            // Roll back on failure
            const byId = new Map(snapshot.map(s => [s.id, s]));
            cache.tasks.forEach(t => { const s = byId.get(t.id); if (s) { t.sequenceOrder = s.sequenceOrder; t.phase = s.phase; } });
            renderAdmin();
            schShowToast('Reorder failed: ' + err.message, 'error');
          });
      } else {
        // RESCHEDULE (horizontal move)
        const rawLeft = Math.max(0, origLeft + dx);
        const snappedLeft = Math.round(rawLeft / dw) * dw;
        const newStartDate = schComputeDateFromLeft(snappedLeft);
        if (!newStartDate) return;

        const endpoint = schRippleMode ? 'update-task' : 'move-task';
        const msg = schRippleMode ? 'Rescheduled & recalculated' : 'Moved';
        schShowToast(schRippleMode ? 'Rescheduling…' : 'Moving…','');
        await scheduleAPI(activeProject, endpoint, 'PATCH', { taskId, planned_start: newStartDate });
        if (schRippleMode) {
          schShowToast(msg,'success');
          renderAdmin();
        } else {
          const t = cache.tasks.find(x => x.id === taskId);
          if (t) {
            t.plannedStart = newStartDate;
            const d = new Date(newStartDate+'T00:00:00Z');
            d.setUTCDate(d.getUTCDate() + (t.durationDays||1));
            t.plannedFinish = d.toISOString().split('T')[0];
          }
          schShowToast(msg,'success');
          renderAdmin();
        }
      }
    } catch(err) { schShowToast(err.message, 'error'); }
  });
}

// ── Table view renderer ──
function renderScheduleTable(tasks, projectId) {
  const statusOpts = (cur) => Object.entries(STATUS_LABELS).map(([s,l]) =>
    `<option value="${s}" ${s===cur?'selected':''}>${l}</option>`
  ).join('');

  // ── Sort tasks ──
  const sortCol = schTblSort.col;
  const dir = schTblSort.dir === 'asc' ? 1 : -1;
  const getSubName = (t) => t.subcontractorId && subsCache ? (subsCache.find(s=>s.id===t.subcontractorId)||{}).name||'' : t.assignedContractor||'';
  const sortedTasks = [...tasks].sort((a,b) => {
    let av, bv;
    switch(sortCol) {
      case 'name': av=a.taskName||''; bv=b.taskName||''; break;
      case 'phase': av=PHASE_ORDER.indexOf(a.phase); bv=PHASE_ORDER.indexOf(b.phase); break;
      case 'status': av=a.status||''; bv=b.status||''; break;
      case 'start': av=a.plannedStart||'9999'; bv=b.plannedStart||'9999'; break;
      case 'finish': av=a.plannedFinish||'9999'; bv=b.plannedFinish||'9999'; break;
      case 'duration': av=a.durationDays||0; bv=b.durationDays||0; break;
      case 'contractor': av=getSubName(a).toLowerCase(); bv=getSubName(b).toLowerCase(); break;
      case 'workstream': av=a.workstream||''; bv=b.workstream||''; break;
      case 'float': av=a.float??9999; bv=b.float??9999; break;
      case 'alert': { const rank={red:0,yellow:1,none:2}; av=rank[a.alertLevel]??3; bv=rank[b.alertLevel]??3; break; }
      default: av=a.sequenceOrder||0; bv=b.sequenceOrder||0;
    }
    if (av<bv) return -1*dir;
    if (av>bv) return 1*dir;
    return 0;
  });

  const sortArrow = (col) => sortCol === col ? (schTblSort.dir === 'asc' ? ' ↑' : ' ↓') : '';
  const th = (col, label, style='') => `<th style="cursor:pointer;user-select:none;${style}" onclick="schSetSort('${col}')">${label}${sortArrow(col)}</th>`;

  // Group when sorted by sequence, otherwise flat
  let html = '';
  const groupByPhase = sortCol === 'sequence';

  if (groupByPhase) {
    const phaseMap = groupTasksByPhase(sortedTasks);
    for (const [phaseName, phaseTasks] of phaseMap) {
      if (phaseTasks.length === 0) continue;
      const pi = PHASE_ORDER.indexOf(phaseName);
      const isCollapsed = schCollapsed[pi];
      const done = phaseTasks.filter(t => t.status === 'complete').length;
      html += `<tr><td colspan="11" style="padding:0">
        <div class="gantt-phase-hd" onclick="schTogglePhase(${pi})" id="sch-tbl-phase-${pi}">
          <svg viewBox="0 0 10 10" style="width:10px;height:10px;transition:transform .15s;${isCollapsed?'transform:rotate(-90deg)':''}"><path d="M3 1l4 4-4 4" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
          ${phaseName} <span class="gantt-phase-count">${done}/${phaseTasks.length}</span>
        </div>
      </td></tr>`;
      if (!isCollapsed) {
        phaseTasks.forEach(t => html += renderTableRow(t, projectId, statusOpts));
      }
    }
  } else {
    sortedTasks.forEach(t => html += renderTableRow(t, projectId, statusOpts));
  }

  return `<div class="card" style="overflow-x:auto;margin-bottom:1rem">
    <table class="sch-table">
      <thead><tr>
        <th style="width:30px"><input type="checkbox" class="sch-chk" onchange="this.checked?schSelectAll():schSelectNone()"></th>
        ${th('name','Task')}

  const blocking = deps.filter(d => d.blockedByTaskId === taskId).map(d => { const bt = cache.tasks.find(t => t.id === d.taskId); return bt ? { id: d.taskId, name: bt.taskName } : null; }).filter(Boolean);

function renderGanttRow(task, tlStart, tlWidth) {
  const barL = schBarLeft(task.plannedStart || task.planned_start, tlStart);
  const barW = schBarWidth(task.durationDays || task.duration_days || 1);
  const status = task.status || 'needs_scheduling';
  const crit = task.isCritical ? 'critical' : '';
  const alert = (task.alertLevel||task.alert_level)==='red' ? 'alert-red' : (task.alertLevel||task.alert_level)==='yellow' ? 'alert-yellow' : '';
  const ws = (task.workstream||'both');
  const wsClass = 'ws-'+ws;
  const name = task.taskName || task.task_name;
  const id = task.id;
  const canDrag = status !== 'complete' && status !== 'skipped';
  const dw = getSchDayWidth();
  return `<div class="gantt-row" data-task-id="${id}">
    <div class="gantt-row-label" title="${name}">${name}</div>
    <div class="gantt-row-track" style="width:${tlWidth}px">
      <div class="gantt-bar ${status} ${crit} ${alert} ${wsClass}" style="left:${barL}px;width:${barW}px"
           ${canDrag ? `data-draggable="true" data-task-id="${id}" data-original-left="${barL}"` : ''}
           onclick="if(!window._dragMoved)toggleTaskEdit('${id}','${activeProject}')"
           title="${name} (${task.durationDays||task.duration_days}d) ${task.trade||''}&#10;${schFmtDate(task.plannedStart||task.planned_start)} → ${schFmtDate(task.plannedFinish||task.planned_finish)}">
        ${barW > 70 ? name : ''}

  </div>
  <div id="sch-edit-${id}" style="display:none"></div>`;
}

//  CHARTS VIEW — visual dashboards
// ══════════════════════════════════════════════════════
function renderScheduleCharts(tasks, cache) {
  if (!tasks || tasks.length === 0) return `<div class="card"><div style="padding:2rem;text-align:center;color:var(--charcoal-4)">No tasks to chart</div></div>`;

  // Phase completion bars
  const phaseStats = {};
  PHASE_ORDER.forEach(p => phaseStats[p] = { total:0, complete:0, inProg:0, days:0 });
  tasks.forEach(t => {
    const p = t.phase || 'Other';
    if (!phaseStats[p]) phaseStats[p] = { total:0, complete:0, inProg:0, days:0 };
    phaseStats[p].total++;
    phaseStats[p].days += (t.durationDays || 0);
    if (t.status === 'complete') phaseStats[p].complete++;
    if (t.status === 'in_progress') phaseStats[p].inProg++;
  });

  const phaseBars = Object.entries(phaseStats).filter(([,s])=>s.total>0).map(([name, s]) => {
    const pct = s.total ? Math.round(s.complete/s.total*100) : 0;
    const inProgPct = s.total ? Math.round(s.inProg/s.total*100) : 0;
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
        <span style="font-weight:600;color:var(--charcoal)">${name}</span>
        <span style="color:var(--charcoal-4)">${s.complete}/${s.total} · ${s.days}d</span>
      </div>
      <div style="height:14px;background:var(--cream-2);border-radius:7px;overflow:hidden;display:flex">
        <div style="width:${pct}%;background:var(--green);transition:width .3s"></div>
        <div style="width:${inProgPct}%;background:#4a7fb5;transition:width .3s"></div>
      </div>
    </div>`;
  }).join('');

  // Status donut (pseudo via horizontal bar)
  const statusCounts = {};
  tasks.forEach(t => { statusCounts[t.status] = (statusCounts[t.status]||0) + 1; });
  const statusColors = { complete:'var(--green)', in_progress:'#4a7fb5', scheduled:'#6ba3c7', needs_scheduling:'#b0b0b0', waiting_on_client:'#c89200', on_hold:'#8b6bb5', not_ready:'#d4a574', skipped:'#ddd' };
  const total = tasks.length;
  const statusSegments = Object.entries(statusCounts).map(([s,c]) => ({
    status: s, count: c, pct: Math.round(c/total*100), color: statusColors[s]||'#aaa'
  })).sort((a,b) => b.count - a.count);

  const statusStack = `<div style="display:flex;height:24px;border-radius:4px;overflow:hidden;margin-bottom:10px">
    ${statusSegments.map(s => `<div style="width:${s.pct}%;background:${s.color};transition:width .3s" title="${STATUS_LABELS[s.status]||s.status}: ${s.count}"></div>`).join('')}
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:10px;font-size:11px">
    ${statusSegments.map(s => `<div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:2px;background:${s.color}"></div>${STATUS_LABELS[s.status]||s.status} <strong>${s.count}</strong></div>`).join('')}
  </div>`;

  // Workstream split
  const wsCounts = { interior:0, exterior:0, both:0 };
  const wsDays = { interior:0, exterior:0, both:0 };
  tasks.forEach(t => {
    const w = t.workstream || 'both';
    if (wsCounts[w] !== undefined) { wsCounts[w]++; wsDays[w] += (t.durationDays||0); }
  });
  const wsTotal = wsCounts.interior + wsCounts.exterior + wsCounts.both || 1;
  const wsBars = `<div style="display:flex;gap:12px">
    ${['interior','exterior','both'].map(w => {
      const pct = Math.round(wsCounts[w]/wsTotal*100);
      const color = w==='interior'?'var(--green)':w==='exterior'?'#6ba3c7':'var(--charcoal-3)';
      return `<div style="flex:1;text-align:center">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--charcoal-4);font-weight:700;margin-bottom:4px">${w}</div>
        <div style="font-size:24px;font-weight:700;color:${color}">${wsCounts[w]}</div>
        <div style="font-size:10px;color:var(--charcoal-4)">${pct}% · ${wsDays[w]}d work</div>
      </div>`;
    }).join('')}
  </div>`;

  // Subcontractor workload
  const subWorkload = {};
  tasks.forEach(t => {
    if (t.subcontractorId) {
      const sub = (subsCache||[]).find(s => s.id === t.subcontractorId);
      const name = sub ? sub.name : 'Unknown';
      if (!subWorkload[name]) subWorkload[name] = { count:0, days:0, complete:0 };
      subWorkload[name].count++;
      subWorkload[name].days += (t.durationDays || 0);
      if (t.status === 'complete') subWorkload[name].complete++;
    }
  });
  const subList = Object.entries(subWorkload).sort((a,b) => b[1].days - a[1].days);
  const maxDays = subList.length ? subList[0][1].days : 1;
  const subBars = subList.length === 0
    ? `<div style="font-size:12px;color:var(--charcoal-4);padding:1rem;text-align:center;font-style:italic">No subcontractors assigned yet</div>`
    : subList.map(([name, s]) => `<div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px">
          <span style="font-weight:600">${name}</span>
          <span style="color:var(--charcoal-4)">${s.count} tasks · ${s.days}d${s.complete?` · ${s.complete} done`:''}</span>
        </div>
        <div style="height:10px;background:var(--cream-2);border-radius:5px;overflow:hidden">
          <div style="width:${Math.round(s.days/maxDays*100)}%;height:100%;background:var(--charcoal)"></div>
        </div>
      </div>`).join('');

  // Critical path timeline
  const critical = tasks.filter(t => t.isCritical);
  const critHTML = critical.length === 0
    ? `<div style="font-size:12px;color:var(--charcoal-4);font-style:italic">No critical path tasks</div>`
    : critical.slice(0, 10).map(t => `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid var(--border);font-size:11px">
        <span style="font-weight:600">${t.taskName}</span>
        <span style="color:var(--charcoal-4)">${schFmtDate(t.plannedStart)} → ${schFmtDate(t.plannedFinish)}</span>
      </div>`).join('');

  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px">
    <div class="card">
      <div class="sh"><div class="sh-title">Phase Progress</div><span style="font-size:10px;color:var(--charcoal-4)">${tasks.length} tasks total</span></div>
      ${phaseBars}
    </div>
    <div class="card">
      <div class="sh"><div class="sh-title">Status Breakdown</div></div>
      ${statusStack}
    </div>
    <div class="card">
      <div class="sh"><div class="sh-title">Workstream Split</div></div>
      ${wsBars}
    </div>
    <div class="card">
      <div class="sh"><div class="sh-title">Subcontractor Workload</div><span style="font-size:10px;color:var(--charcoal-4)">${subList.length} active</span></div>
      ${subBars}
    </div>
    <div class="card" style="grid-column:1/-1">
      <div class="sh"><div class="sh-title">Critical Path Tasks</div><span class="tag ${critical.length?'danger':'ok'}" style="font-size:9px">${critical.length} zero-float</span></div>
      ${critHTML}
    </div>
  </div>`;
}

  if (stored) todayScope = stored;
  const projectOpts = Object.values(PROJECTS).map(pr =>
    `<option value="${pr.id}" ${pr.id===todayScope?'selected':''}>${pr.clientName}</option>`
  ).join('');
  return `
    <div class="sch-hd" style="margin-bottom:12px">
      <div>
        <div class="sh-title" style="font-size:18px">Today</div>
        <div style="font-size:11px;color:var(--charcoal-4)">Everything that needs your attention across every active project.</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <select class="adm-inp adm-sel" style="font-size:12px;padding:5px 8px;width:auto" onchange="setTodayScope(this.value)" title="Filter by project">
          <option value="all" ${todayScope==='all'?'selected':''}>All projects</option>
          ${projectOpts}
        </select>
        <button class="adm-btn adm-btn-ghost" onclick="loadActionItems(todayScope)" title="Refresh">↻ Refresh</button>
        <button class="adm-btn adm-btn-ghost" onclick="openManualItemForm(todayScope==='all' ? '${p.id}' : todayScope)">+ Add manual item</button>
      </div>
    </div>
    <div id="manual-item-form" style="display:none;margin-bottom:12px"></div>
    <div id="today-queue">
      <div style="padding:2rem;text-align:center;color:var(--charcoal-4);font-size:12px">Loading action items…</div>
    </div>
  `;
}

function setTodayScope(scope) {
  todayScope = scope;
  sessionStorage.setItem('sa_today_scope', scope);
  loadActionItems(scope);
}

async function loadActionItems(scope) {
  const el = document.getElementById('today-queue');
  if (!el) return;
  scope = scope || todayScope || 'all';
  try {
    const res = await fetch(`/.netlify/functions/action-items?projectId=${encodeURIComponent(scope)}&status=open`, {
      headers: { 'Authorization': `Bearer ${ADMIN_PASS}` },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load');
    actionItemsCache[scope] = data.items || [];
    renderTodayQueue(scope);
  } catch (err) {
    el.innerHTML = `<div style="padding:2rem;text-align:center;color:var(--danger);font-size:12px">Error: ${err.message}</div>`;
  }
}

function renderTodayQueue(scope) {
  const el = document.getElementById('today-queue');
  if (!el) return;
  const items = actionItemsCache[scope] || [];
  if (items.length === 0) {
    const scopeLabel = scope === 'all' ? 'across all projects' : `for ${projectNameById(scope)}`;
    el.innerHTML = `<div class="card" style="padding:2.5rem;text-align:center">
      <div style="font-size:32px;margin-bottom:8px">✓</div>
      <div style="font-size:14px;font-weight:600;color:var(--charcoal)">All clear</div>
      <div style="font-size:11px;color:var(--charcoal-4);margin-top:4px">Nothing needs your attention ${scopeLabel}.</div>
    </div>`;
    return;
  }
  const byPri = { red:[], yellow:[], normal:[] };
  items.forEach(it => (byPri[it.priority] || byPri.normal).push(it));
  const order = [
    ['red',    'Urgent',     'var(--danger)'],
    ['yellow', 'This week',  '#c89200'],
    ['normal', 'Normal',     'var(--charcoal-3)'],
  ];
  const showProjectLabel = scope === 'all';
  el.innerHTML = order.map(([pri, label, color]) => {
    if (!byPri[pri].length) return '';
    return `<div style="margin-bottom:16px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:${color};margin-bottom:6px">${label} · ${byPri[pri].length}</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${byPri[pri].map(it => renderActionCard(it, showProjectLabel)).join('')}
      </div>
    </div>`;
  }).join('');
}

function renderActionCard(it, showProjectLabel) {
  const kindLabel = KIND_LABELS[it.kind] || it.kind;
  const borderColor = it.priority === 'red' ? 'var(--danger)' : it.priority === 'yellow' ? '#c89200' : 'var(--border-2)';
  const age = timeAgo(it.created_at);
  const projectLabel = showProjectLabel ? `<span style="display:inline-block;padding:1px 6px;margin-right:5px;background:var(--cream-2);color:var(--charcoal-3);border-radius:3px;font-size:10px;font-weight:600">${escapeHtml(projectNameById(it.project_id))}</span>` : '';

  // Kind-specific primary action
  let primaryBtn = `<button class="adm-btn adm-btn-green" style="padding:5px 10px;font-size:11px" onclick="completeActionItem('${it.id}')" title="Mark done">✓ Done</button>`;
  if (it.kind === 'approve_contractor_text' && it.related_entity_id) {
    primaryBtn = `<button class="adm-btn" style="padding:5px 10px;font-size:11px;background:#4a7fb5;color:white" onclick="openApproveTextModal('${it.related_entity_id}','${it.id}')" title="Preview and approve the draft">📨 Review & Send</button>`;
  }

  return `<div class="card" style="padding:12px;border-left:3px solid ${borderColor}">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
      <div style="flex:1;min-width:0">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--charcoal-4);font-weight:700;margin-bottom:3px">${projectLabel}${kindLabel}</div>
        <div style="font-size:13px;font-weight:600;color:var(--charcoal);margin-bottom:2px">${escapeHtml(it.title)}</div>
        ${it.body ? `<div style="font-size:11px;color:var(--charcoal-3);margin-top:4px;line-height:1.4">${escapeHtml(it.body)}</div>` : ''}
        <div style="font-size:10px;color:var(--charcoal-4);margin-top:6px">Created ${age}${it.due_at?` · Due ${new Date(it.due_at).toLocaleDateString()}`:''}</div>
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
        ${primaryBtn}
        <button class="adm-btn adm-btn-ghost" style="padding:5px 10px;font-size:11px" onclick="snoozeActionItem('${it.id}')" title="Snooze 24h">⏱ Snooze</button>
        <button class="adm-btn adm-btn-ghost" style="padding:5px 10px;font-size:11px" onclick="dismissActionItem('${it.id}')" title="Dismiss">✕</button>
      </div>
    </div>
  </div>`;
}

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function timeAgo(iso) {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}

async function patchActionItem(id, action, extra = '') {
  const res = await fetch(`/.netlify/functions/action-items?id=${id}&action=${action}${extra}`, {
    method: 'PATCH',
    headers: { 'Authorization': `Bearer ${ADMIN_PASS}` },
  });
  if (!res.ok) { const d = await res.json().catch(()=>({})); throw new Error(d.error || `HTTP ${res.status}`); }
  // Optimistic: remove from whichever scope caches contain it, then re-render current
  Object.keys(actionItemsCache).forEach(scope => {
    actionItemsCache[scope] = (actionItemsCache[scope] || []).filter(it => it.id !== id);
  });
  renderTodayQueue(todayScope);
}

async function completeActionItem(id) {
  try { await patchActionItem(id, 'complete'); schShowToast('Marked done','success'); }
  catch (e) { schShowToast(e.message,'error'); loadActionItems(todayScope); }
}
async function snoozeActionItem(id) {
  try { await patchActionItem(id, 'snooze'); schShowToast('Snoozed 24h',''); }
  catch (e) { schShowToast(e.message,'error'); loadActionItems(todayScope); }
}
async function dismissActionItem(id) {
  try { await patchActionItem(id, 'dismiss'); schShowToast('Dismissed',''); }
  catch (e) { schShowToast(e.message,'error'); loadActionItems(todayScope); }
}

    <div style="font-size:12px;font-weight:700;color:var(--charcoal);margin-bottom:8px">Add manual action item</div>

async function draftContractorText(projectId, taskId) {
  schShowToast('Drafting…','');
  try {
    const res = await fetch(`/.netlify/functions/contractor-messages?action=draft`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${ADMIN_PASS}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ projectId, taskId }),
    });
    const data = await res.json();

function openApproveTextModal(messageId, actionItemId) {
  // Fetch the message via admin list + find the one we want (simple for now)
  const backdrop = document.createElement('div');
  backdrop.id = 'approve-text-backdrop';
  backdrop.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px';
  backdrop.innerHTML = `<div style="background:white;border-radius:var(--r-md);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg)">
    <div style="padding:16px 18px;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:14px;font-weight:700;color:var(--charcoal)">Review contractor text</div>
      <button class="adm-btn adm-btn-ghost" style="padding:4px 10px;font-size:12px" onclick="closeApproveTextModal()">✕</button>
    </div>
    <div id="approve-text-body" style="padding:18px">
      <div style="text-align:center;color:var(--charcoal-4);font-size:12px;padding:2rem">Loading draft…</div>
    </div>
  </div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeApproveTextModal(); });
  loadApproveTextBody(messageId, actionItemId);

function closeApproveTextModal() {
  document.getElementById('approve-text-backdrop')?.remove();
}

async function loadApproveTextBody(messageId, actionItemId) {
  const el = document.getElementById('approve-text-body');
  if (!el) return;
  // Find the item in our cache for context
  let item = null;
  Object.values(actionItemsCache).forEach(arr => {
    const found = (arr || []).find(it => it.related_entity_id === messageId);
    if (found) item = found;
  });
  if (!item) {
    el.innerHTML = `<div style="color:var(--danger);font-size:12px">Could not find the action item. Refresh and try again.</div>`;
    return;
  }

  // Pull the full message list for this project, pick ours
  try {
    const res = await fetch(`/.netlify/functions/contractor-messages?projectId=${encodeURIComponent(item.project_id)}`, {
      headers: { 'Authorization': `Bearer ${ADMIN_PASS}` },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    const msg = (data.messages || []).find(m => m.id === messageId);
    if (!msg) throw new Error('Message not found');

    const confirmUrl = `${location.origin}/confirm.html?token=${msg.confirm_token}`;
    el.innerHTML = `
      <div style="font-size:11px;color:var(--charcoal-4);margin-bottom:6px">
        To: <strong style="color:var(--charcoal)">${escapeHtml(msg.contact_name || 'Contractor')}</strong>
        ${msg.contact_phone ? ` · ${escapeHtml(msg.contact_phone)}` : ''}
        ${msg.contact_email ? ` · ${escapeHtml(msg.contact_email)}` : ''}
      </div>
      <div style="font-size:10px;color:var(--charcoal-4);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Message</div>
      <textarea id="approve-text-body-input" class="adm-inp adm-textarea" style="min-height:200px;font-family:'Work Sans',sans-serif;font-size:13px;line-height:1.5;white-space:pre-wrap">${escapeHtml(msg.body)}</textarea>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
        <button class="adm-btn adm-btn-ghost" style="flex:0 0 auto" onclick="copyApproveText()">📋 Copy message</button>
        <button class="adm-btn adm-btn-ghost" style="flex:0 0 auto" onclick="copyApproveUrl('${msg.confirm_token}')">🔗 Copy confirm link</button>
        <div style="flex:1"></div>
        <button class="adm-btn" style="background:#4a7fb5;color:white" onclick="approveTextAndClose('${msg.id}','${actionItemId}')">Mark as Sent</button>
      </div>
      <div style="font-size:10px;color:var(--charcoal-4);margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border);line-height:1.5">
        <strong style="color:var(--charcoal-3)">How to use:</strong> Copy the message, paste into a text or email to the contractor. They tap the link, pick Confirm/Decline/Propose. When their response lands, Today updates automatically.
        <br>Confirm URL: <span style="color:var(--charcoal-3);word-break:break-all">${escapeHtml(confirmUrl)}</span>
      </div>`;
  } catch (err) {
    el.innerHTML = `<div style="color:var(--danger);font-size:12px">Error: ${escapeHtml(err.message)}</div>`;
  }
}

function copyApproveText() {
  const ta = document.getElementById('approve-text-body-input');
  if (!ta) return;
  navigator.clipboard.writeText(ta.value).then(
    () => schShowToast('Message copied','success'),
    () => schShowToast('Copy failed — select and copy manually','error')
  );
}

function copyApproveUrl(token) {
  const url = `${location.origin}/confirm.html?token=${token}`;
  navigator.clipboard.writeText(url).then(
    () => schShowToast('Link copied','success'),
    () => schShowToast('Copy failed','error')
  );
}

async function approveTextAndClose(messageId, actionItemId) {
  const ta = document.getElementById('approve-text-body-input');
  const editedBody = ta?.value || null;
  try {
    const res = await fetch(`/.netlify/functions/contractor-messages?id=${messageId}&action=approve`, {
      method: 'PATCH',
      headers: { 'Authorization': `Bearer ${ADMIN_PASS}`, 'Content-Type':'application/json' },
      body: JSON.stringify(editedBody ? { body: editedBody } : {}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    schShowToast('Marked sent — waiting on contractor','success');
    closeApproveTextModal();
    // Optimistic: drop from cache
    Object.keys(actionItemsCache).forEach(scope => {
      actionItemsCache[scope] = (actionItemsCache[scope] || []).filter(it => it.id !== actionItemId);
    });
    renderTodayQueue(todayScope);
  } catch (err) {
    schShowToast(err.message, 'error');
  }
}

async function submitManualItem(projectId) {
  const title = document.getElementById('mi-title')?.value.trim();
  const body  = document.getElementById('mi-body')?.value.trim() || null;
  const priority = document.getElementById('mi-priority')?.value || 'normal';
  if (!title) { schShowToast('Title required','error'); return; }
  try {
    const res = await fetch(`/.netlify/functions/action-items`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${ADMIN_PASS}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ projectId, kind: 'manual', title, body, priority }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    schShowToast('Item created','success');
    openManualItemForm(projectId); // close form
    loadActionItems(projectId);
  } catch (e) { schShowToast(e.message, 'error'); }
}

function renderScheduleView(p) {
  const cache = scheduleCache[p.id];

  // No cache yet — loading state
  if (!cache) {
    return `<div class="card" style="text-align:center;padding:2rem">
      <div id="sch-loading" style="font-size:13px;color:var(--charcoal-3)">Loading schedule…</div>
    </div>`;
  }

  const tasks = cache.tasks || [];

  // No schedule yet — offer to instantiate
  if (tasks.length === 0) {
    const hasBSD = p.buildStartDate || (cache.client && cache.client.build_start_date);
    return `<div class="card" style="text-align:center;padding:2rem">
      <div style="font-size:13px;color:var(--charcoal-3);margin-bottom:12px">
        No build schedule exists for this project yet.
      </div>
      ${!hasBSD ? `<div style="font-size:12px;color:var(--danger);margin-bottom:12px">Set build_start_date on this client first (Project Info tab).</div>` : ''}
      <button class="adm-btn adm-btn-green" onclick="instantiateSchedule('${p.id}')" ${!hasBSD?'disabled':''}>
        Instantiate Schedule from Templates
      </button>
      <div id="sch-toast" class="sch-toast" style="margin-top:8px"></div>
    </div>`;
  }

  // ── Compute stats ──
  const total = tasks.length;
  const complete = tasks.filter(t => (t.status) === 'complete').length;
  const inProg = tasks.filter(t => (t.status) === 'in_progress').length;
  const notStarted = tasks.filter(t => (t.status) === 'not_started').length;
  const skipped = tasks.filter(t => (t.status) === 'skipped').length;
  const pct = total ? Math.round(complete / total * 100) : 0;
  const critCount = cache.criticalPathLength || (cache.criticalPath||[]).length;
  const alerts = cache.alerts || { red:[], yellow:[] };
  const gates = cache.gateStatus || {};
  const buildStart = cache.buildStart || p.buildStartDate || '';
  const targetEnd = cache.targetEnd || p.targetEndDate || '';
  const computedEnd = cache.computedEnd || p.computedEndDate || '';

  // ── A: KPI row (compact by default, expandable) ──
  const alertBadges = `${alerts.red.length?`<span class="tag danger" style="font-size:9px">${alerts.red.length} Red</span>`:''}${alerts.yellow.length?`<span class="tag warn" style="font-size:9px;margin-left:4px">${alerts.yellow.length} Yellow</span>`:''}${!alerts.red.length&&!alerts.yellow.length?`<span class="tag ok" style="font-size:9px">Clear</span>`:''}`;
  const kpiCompactHTML = `<div class="sch-kpi-compact">
    <div class="sch-kpi-stat"><span class="sch-kpi-stat-lbl">Progress</span><span class="sch-kpi-stat-val">${pct}%</span><div class="track" style="width:60px;margin:0"><div class="bar" style="width:${pct}%"></div></div></div>

    <div class="sch-kpi-stat"><span class="sch-kpi-stat-lbl">Timeline</span><span class="sch-kpi-stat-val">${schFmtDate(buildStart)} → ${schFmtDate(computedEnd)}</span></div>
    <div class="sch-kpi-stat"><span class="sch-kpi-stat-lbl">Critical</span><span class="sch-kpi-stat-val">${critCount}</span></div>
    <div class="sch-kpi-stat"><span class="sch-kpi-stat-lbl">Alerts</span>${alertBadges}</div>
    <button class="sch-kpi-expand" onclick="schKpiExpanded=!schKpiExpanded;renderAdmin()">${schKpiExpanded?'Collapse ↑':'Expand ↓'}</button>
  </div>`;

  const kpiExpandedHTML = `<div class="sch-kpi-row">
    <div class="sch-kpi-card"><div class="kpi"><div class="kpi-lbl">Tasks</div><div class="kpi-val">${total}</div><div class="kpi-sub">${complete} done · ${inProg} active · ${skipped} skipped</div></div></div>
    <div class="sch-kpi-card"><div class="kpi"><div class="kpi-lbl">Complete</div><div class="kpi-val">${pct}%</div></div><div class="track" style="margin-top:6px"><div class="bar" style="width:${pct}%"></div></div></div>
    <div class="sch-kpi-card"><div class="kpi"><div class="kpi-lbl">Timeline</div><div class="kpi-val" style="font-size:13px">${schFmtDate(buildStart)} → ${schFmtDate(computedEnd)}</div><div class="kpi-sub">Target: ${schFmtDateFull(targetEnd)}</div></div></div>
    <div class="sch-kpi-card"><div class="kpi"><div class="kpi-lbl">Critical Path</div><div class="kpi-val">${critCount}</div><div class="kpi-sub">Zero-float tasks</div></div></div>
    <div class="sch-kpi-card"><div class="kpi"><div class="kpi-lbl">Alerts</div><div style="display:flex;gap:6px;margin-top:4px">${alerts.red.length?`<span class="tag danger">${alerts.red.length} Red</span>`:''}<span class="tag ${alerts.yellow.length?'warn':'neutral'}">${alerts.yellow.length} Yellow</span></div></div></div>
  </div>`;

  const kpiHTML = schKpiExpanded ? kpiCompactHTML + kpiExpandedHTML : kpiCompactHTML;

  // ── B: Action bar + controls ──
  const actionHTML = `<div class="sch-action-bar">
    <button class="adm-btn adm-btn-green" onclick="recalculateSchedule('${p.id}')">Recalculate CPM</button>
    <button class="adm-btn adm-btn-ghost" onclick="validateSchedule('${p.id}')">Validate</button>
    <button class="adm-btn adm-btn-ghost" onclick="schShowAddTask=!schShowAddTask;renderAdmin()">+ Add Task</button>
    <div id="sch-toast" class="sch-toast"></div>
    <div class="sch-view-toggle">
      <button class="sch-view-btn ${schViewMode==='gantt'?'active':''}" onclick="schSetView('gantt')">Gantt</button>
      <button class="sch-view-btn ${schViewMode==='table'?'active':''}" onclick="schSetView('table')">Table</button>
      <button class="sch-view-btn ${schViewMode==='charts'?'active':''}" onclick="schSetView('charts')">Charts</button>
    </div>
    ${schViewMode==='gantt' ? `
    <div class="sch-view-toggle" style="margin-left:4px">
      <button class="sch-view-btn ${schGroupBy==='phase'?'active':''}" onclick="schSetGroupBy('phase')">Phase</button>
      <button class="sch-view-btn ${schGroupBy==='workstream'?'active':''}" onclick="schSetGroupBy('workstream')">Workstream</button>
    </div>
    <div class="sch-zoom-toggle">
      <button class="sch-zoom-btn ${schZoom==='days'?'active':''}" onclick="schSetZoom('days')">Days</button>
      <button class="sch-zoom-btn ${schZoom==='weeks'?'active':''}" onclick="schSetZoom('weeks')">Weeks</button>
      <button class="sch-zoom-btn ${schZoom==='months'?'active':''}" onclick="schSetZoom('months')">Months</button>
    </div>
    <div class="sch-zoom-toggle" title="Ripple mode: when you drag a task, also recalculate downstream dates">
      <button class="sch-zoom-btn ${schRippleMode?'active':''}" onclick="schRippleMode=true;renderAdmin()">Ripple</button>
      <button class="sch-zoom-btn ${!schRippleMode?'active':''}" onclick="schRippleMode=false;renderAdmin()">Free</button>
    </div>
    <button class="adm-btn adm-btn-ghost" onclick="schFocusMode=!schFocusMode;renderAdmin()" title="Hide everything but the Gantt" style="margin-left:4px">${schFocusMode?'Exit Focus':'Focus'}</button>` : ''}
  </div>

  <div class="sch-queue-tabs">
    ${[{key:'all',label:'All'},{key:'next_to_schedule',label:'Next to Schedule'},{key:'long_lead',label:'Long-Lead'},{key:'waiting_hold',label:'Waiting / Hold'}].map(t =>
      `<button class="sch-queue-tab ${schSubView===t.key?'active':''}" onclick="schSetSubView('${t.key}')">${t.label}${t.key!=='all'?`<span class="sch-queue-count">${countQueue(tasks, t.key)}</span>`:''}</button>`
    ).join('')}
  </div>

  ${schShowAddTask ? `<div class="sch-add-modal">
    <div class="sh"><div class="sh-title">Add Custom Task</div></div>
    <div class="adm-grid2">
      <div class="adm-field"><label>Task Name *</label><input class="adm-inp" id="sch-add-name" placeholder="e.g. Install specialty beam"></div>
      <div class="adm-field"><label>Phase</label><select class="adm-inp adm-sel" id="sch-add-phase">${PHASE_ORDER.map(p=>`<option value="${p}">${p}</option>`).join('')}</select></div>
      <div class="adm-field"><label>Trade</label><select class="adm-inp adm-sel" id="sch-add-trade"><option value="">—</option>${TRADE_OPTIONS.map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div>
      <div class="adm-field"><label>Workstream</label><select class="adm-inp adm-sel" id="sch-add-ws"><option value="interior">Interior</option><option value="exterior">Exterior</option><option value="both" selected>Both</option></select></div>
      <div class="adm-field"><label>Duration (days)</label><input class="adm-inp" type="number" id="sch-add-dur" value="1" min="1"></div>
      <div class="adm-field"><label>Sequence #</label><input class="adm-inp" type="number" id="sch-add-seq" value="999" min="1"></div>
    </div>
    <div class="adm-field"><label>Definition of Done</label><input class="adm-inp" id="sch-add-dod" placeholder="What marks this task complete?"></div>
    <div class="adm-field"><label>Client Note</label><input class="adm-inp" id="sch-add-cnote" placeholder="Visible to client"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="adm-btn adm-btn-green" onclick="schAddTask('${p.id}')">Add Task</button>
      <button class="adm-btn adm-btn-ghost" onclick="schShowAddTask=false;renderAdmin()">Cancel</button>
    </div>
  </div>` : ''}

  <div id="sch-bulk-bar" class="sch-bulk-bar" style="display:${schBulkSelected.size>0?'flex':'none'}">
    <span id="sch-bulk-count">${schBulkSelected.size} selected</span>
    <button class="adm-btn adm-btn-green" onclick="schBulkSetStatus('${p.id}','scheduled')">Scheduled</button>
    <button class="adm-btn adm-btn-green" onclick="schBulkSetStatus('${p.id}','in_progress')">In Progress</button>
    <button class="adm-btn adm-btn-green" onclick="schBulkSetStatus('${p.id}','complete')">Complete</button>
    <button class="adm-btn adm-btn-ghost" onclick="schBulkSetStatus('${p.id}','on_hold')">On Hold</button>
    <button class="adm-btn adm-btn-ghost" onclick="schBulkSetStatus('${p.id}','waiting_on_client')">Waiting</button>
    <button class="adm-btn adm-btn-ghost" onclick="schSelectNone()" style="margin-left:auto">Clear</button>
  </div>`;

  // ── Filter by queue sub-view ──
  const viewTasks = schSubView === 'all' ? tasks : filterQueue(tasks, schSubView);

  // ── C: Gantt chart ──
  const dw = getSchDayWidth();
  const tlStart = viewTasks.reduce((m,t) => {
    const s = t.plannedStart || t.planned_start;
    return s && (!m || s < m) ? s : m;
  }, null) || buildStart;
  const tlEnd = viewTasks.reduce((m,t) => {
    const f = t.plannedFinish || t.planned_finish;
    return f && (!m || f > m) ? f : m;
  }, null) || computedEnd;

  const tlEndPad = new Date((tlEnd||buildStart) + 'T00:00:00');
  tlEndPad.setUTCDate(tlEndPad.getUTCDate() + 14);
  const tlEndStr = tlEndPad.toISOString().split('T')[0];

  const tlWidth = schDaysBetween(tlStart, tlEndStr) * dw;
  const timeMarkers = generateTimeMarkers(tlStart, tlEndStr);

  const headerHTML = `<div class="gantt-header" style="width:${180 + tlWidth}px">
    <div style="width:180px;flex-shrink:0;font-size:9px;font-weight:700;color:var(--charcoal-3);padding:0 8px">Task</div>
    ${timeMarkers.map(w => `<div class="gantt-week-mark" style="width:${w.width}px">${w.label}</div>`).join('')}
  </div>`;

  const todayStr = new Date().toISOString().split('T')[0];
  const todayInRange = todayStr >= tlStart && todayStr <= tlEndStr;
  const todayLeft = 180 + schBarLeft(todayStr, tlStart);
  const todayHTML = todayInRange ? `<div class="gantt-today" style="left:${todayLeft}px"></div>` : '';

  const groupMap = schGroupBy === 'workstream' ? groupTasksByWorkstream(viewTasks) : groupTasksByPhase(viewTasks);
  let phaseHTML = '';
  let pi = 0;
  for (const [groupName, groupTasks] of groupMap) {
    if (groupTasks.length === 0) { pi++; continue; }
    const done = groupTasks.filter(t => t.status === 'complete').length;
    const isCollapsed = schCollapsed[pi];
    const wsAccent = schGroupBy === 'workstream' ? ` ws-${groupName.toLowerCase()}` : '';
    phaseHTML += `<div class="gantt-phase ${isCollapsed?'collapsed':''}" id="sch-phase-${pi}">
      <div class="gantt-phase-hd${wsAccent}" onclick="schTogglePhase(${pi})">
        <svg viewBox="0 0 10 10"><path d="M3 1l4 4-4 4" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        ${groupName}
        <span class="gantt-phase-count">${done}/${groupTasks.length} complete</span>
      </div>
      <div class="gantt-phase-body">
        ${groupTasks.map(t => renderGanttRow(t, tlStart, tlWidth)).join('')}
      </div>
    </div>`;
    pi++;
  }

  const ganttHTML = `<div class="gantt-wrap">
    <div class="gantt-scroll">
      <div style="min-width:${180+tlWidth}px;position:relative">
        ${headerHTML}
        ${todayHTML}
        ${phaseHTML}
      </div>
    </div>
  </div>`;

  // ── D: Alerts & gates ──
  let alertsHTML = '';
  if (alerts.red.length || alerts.yellow.length || Object.keys(gates).length) {
    alertsHTML = `<div class="card">
      <div class="sh"><div class="sh-title">Alerts & Selection Gates</div></div>
      ${alerts.red.length ? `<div style="font-size:10px;font-weight:700;color:var(--danger);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em">Red Alerts (${alerts.red.length})</div>
        ${alerts.red.map(a => `<div class="sch-alert-row"><span class="tag danger" style="font-size:9px">RED</span><strong style="font-size:12px">${a.taskName}</strong><span style="color:var(--charcoal-4);font-size:11px">— ${a.reason}</span></div>`).join('')}` : ''}
      ${alerts.yellow.length ? `<div style="font-size:10px;font-weight:700;color:var(--warning);margin:${alerts.red.length?'12px':'0'} 0 4px;text-transform:uppercase;letter-spacing:.05em">Yellow Alerts (${alerts.yellow.length})</div>
        ${alerts.yellow.map(a => `<div class="sch-alert-row"><span class="tag warn" style="font-size:9px">YELLOW</span><strong style="font-size:12px">${a.taskName}</strong><span style="color:var(--charcoal-4);font-size:11px">— ${a.reason}</span></div>`).join('')}` : ''}
      ${Object.keys(gates).length ? `<div style="font-size:10px;font-weight:700;color:var(--charcoal-4);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em">Selection Gates</div>
        <div class="sch-gate-grid">
          ${Object.entries(gates).map(([g,v]) => `<div class="sch-gate-item"><span style="text-transform:capitalize">${g.replace(/_/g,' ')}</span><span class="tag ${v?'ok':'danger'}" style="font-size:9px">${v?'Resolved':'Unresolved'}</span></div>`).join('')}
        </div>` : ''}
    </div>`;
  }

  // ── E: Table view ──
  const tableHTML = renderScheduleTable(viewTasks, p.id);
  // ── F: Charts view ──
  const chartsHTML = renderScheduleCharts(viewTasks, cache);

  // Choose view
  const mainView = schViewMode === 'table' ? tableHTML : schViewMode === 'charts' ? chartsHTML : ganttHTML;

  // Auto-scroll + drag init after render
  if (schViewMode === 'gantt') {
    setTimeout(() => { schAutoScrollToday(); initGanttDrag(); }, 150);
  }

  const wrapperOpen = schFocusMode ? '<div class="sch-focus-active">' : '<div>';
  return wrapperOpen + kpiHTML + actionHTML + mainView + alertsHTML + '</div>';
}

// ════════════════════════════════════════════════════════
//  ATTACH HANDLERS (called after every render)
// ════════════════════════════════════════════════════════
function attachHandlers(p) {
  // Nothing extra needed — all handlers are inline onclick
}

// ── Boot ─────────────────────────────────────────────────
checkAdminAuth();
</script>
</body>
</html>
