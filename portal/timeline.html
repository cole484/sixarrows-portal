<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Timeline — Six Arrows</title>
<link rel="stylesheet" href="style.css"/>
<script src="data.js"></script><script src="app.js"></script>
<style>

/* ── Date hero card ── */
.date-card {
  background:var(--charcoal);
  border-radius:var(--r-2xl);
  padding:1.375rem 1.75rem;
  margin-bottom:1rem;
  position:relative; overflow:hidden;
}
.date-card::before {
  content:''; position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(117,127,105,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(117,127,105,.06) 1px,transparent 1px);
  background-size:28px 28px; pointer-events:none;
}
.date-card-inner { position:relative; z-index:1; }
.date-card-eyebrow {
  font-size:9px; font-weight:700; text-transform:uppercase;
  letter-spacing:.16em; color:var(--green); margin-bottom:10px;
}
.date-row {
  display:flex; gap:2rem; flex-wrap:wrap;
}
.date-item {}
.date-lbl {
  font-size:10px; text-transform:uppercase; letter-spacing:.1em;
  color:rgba(235,233,222,.35); font-weight:600; margin-bottom:3px;
}
.date-val {
  font-size:22px; font-weight:700; color:var(--cream);
  letter-spacing:-.02em; line-height:1;
}

/* ── Notion link card ── */
.notion-link {
  display:flex; align-items:center; justify-content:space-between;
  background:var(--white); border:0.5px solid var(--border);
  border-radius:var(--r-xl); padding:.875rem 1.125rem;
  text-decoration:none; margin-bottom:1rem;
  transition:border-color .18s, box-shadow .18s;
}
.notion-link:hover { border-color:var(--border-2); box-shadow:var(--sh-sm); }
.notion-link-left { display:flex; align-items:center; gap:10px; }
.notion-link-ico {
  width:32px; height:32px; background:var(--charcoal);
  border-radius:var(--r-md); display:flex; align-items:center;
  justify-content:center; flex-shrink:0;
}
.notion-link-ico svg { width:14px; height:14px; }
.notion-link-label {
  font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.1em; color:var(--charcoal-4); margin-bottom:1px;
}
.notion-link-name { font-size:13px; font-weight:600; color:var(--charcoal); }
.notion-link-arrow { width:12px; height:12px; opacity:.35; }

/* ── Milestone timeline ── */
.milestone-list { display:flex; flex-direction:column; }
.milestone-item {
  display:flex; gap:14px;
  padding:12px 0; border-bottom:0.5px solid var(--border);
}
.milestone-item:last-child { border-bottom:none; }
.milestone-pip-col {
  display:flex; flex-direction:column; align-items:center;
  flex-shrink:0; width:20px;
}
.milestone-pip {
  width:20px; height:20px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; border:1.5px solid var(--border-3);
  background:var(--white);
}
.milestone-pip.done {
  background:var(--green); border-color:var(--green);
}
.milestone-pip.active {
  background:var(--white); border-color:var(--green); border-width:2px;
}
.milestone-pip.done svg { width:9px; height:9px; }
.milestone-pip-dot {
  width:6px; height:6px; border-radius:50%; background:var(--green);
}
.milestone-pip-line {
  width:1px; flex:1; background:var(--border-2); margin-top:3px;
}
.milestone-body { flex:1; padding-top:1px; }
.milestone-date {
  font-size:10px; font-weight:600; color:var(--charcoal-4);
  text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px;
}
.milestone-title {
  font-size:14px; font-weight:600; color:var(--charcoal); margin-bottom:2px;
}
.milestone-item.done .milestone-title { color:var(--charcoal-3); }
.milestone-note { font-size:12px; color:var(--charcoal-4); line-height:1.4; }
.milestone-tag { margin-top:5px; }

/* ── Journey timeline ── */
.journey-wrap {
  padding-left:26px; position:relative;
}
.journey-line {
  position:absolute; left:8px; top:12px; bottom:12px;
  width:1px; background:var(--border-2);
}
.journey-node { position:relative; margin-bottom:1.25rem; }
.journey-dot {
  position:absolute; left:-26px; top:11px;
  width:18px; height:18px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  border:1.5px solid var(--border-3); z-index:1;
}
.journey-dot.done  { background:var(--green); border-color:var(--green); }
.journey-dot.active { background:var(--white); border-color:var(--green); border-width:2px; }
.journey-dot.future { background:var(--cream-3); border-color:var(--cream-3); }
.journey-dot svg { width:8px; height:8px; }
.journey-dot-inner {
  width:5px; height:5px; border-radius:50%; background:var(--green);
}
.journey-card-eyebrow {
  font-size:9px; text-transform:uppercase; letter-spacing:.12em;
  font-weight:700; margin-bottom:2px;
}
.journey-card-title {
  font-size:14px; font-weight:700; margin-bottom:4px;
}
.journey-card-desc {
  font-size:12px; color:var(--charcoal-4); margin-bottom:9px; line-height:1.5;
}
</style>
</head>
<body>
<script>
async function initTimeline() {
  let p = AUTH.requireAuth();
  if (!p) return;

  // Always refresh from Supabase to get latest data and ensure sabPhases is populated
  try {
    const fresh = await AUTH.refreshSession(p.id);
    if (fresh) p = fresh;
  } catch(e) {}

  // Ensure sabPhases exists (guard against stale cached sessions)
  if (!p.sabPhases || !p.sabPhases.length) {
    p.sabPhases = JSON.parse(JSON.stringify(DEFAULT_SAB_PHASES));
  }

  const isSAB     = p.statusType === 'sab';
  const isRemodel = p.projectType === 'remodel';

  // ── Load TS from localStorage ──
  let TS = {};
  try { const r = localStorage.getItem('sa_tracker_v3_' + p.id); if (r) TS = JSON.parse(r); } catch(e) {}

  // Load cached dynamic data for remodel clients
  let notionDynamic = null;
  if (isRemodel) {
    try { const r = localStorage.getItem('sa_tracker_v3_dynamic_' + p.id); if (r) notionDynamic = JSON.parse(r); } catch(e) {}
  }

  // ── Phase/step completion derived from TS (new build only) ─
  function isStepDone(pi, si) {
    const step = p.sabPhases[pi]?.steps[si];
    if (!step) return false;
    if (step.isFinal) return true;
    const items = getStepAllItems(step);
    if (items.length === 0) return !!step.complete;
    return items.every((_, ii) => TS[`${pi}-${si}-${ii}`]);
  }
  function isPhaseDone(pi) {
    const ph = p.sabPhases[pi];
    if (!ph) return false;
    return ph.steps.every((_, si) => isStepDone(pi, si));
  }
  function isPhaseActive(pi) {
    if (isPhaseDone(pi)) return false;
    return pi === 0 || isPhaseDone(pi - 1);
  }
  function activeStepLabel(pi) {
    const ph = p.sabPhases[pi];
    for (let si = 0; si < ph.steps.length; si++) {
      if (!isStepDone(pi, si)) return ph.steps[si].title;
    }
    return '';
  }

  // ── Notion sync ────────────────────────────────────────
  if (isSAB && p.notionTrackerPageId) {
    try {
      const syncUrl = isRemodel
        ? `/.netlify/functions/notion-tracker?pageId=${p.notionTrackerPageId}&dynamic=1`
        : `/.netlify/functions/notion-tracker?pageId=${p.notionTrackerPageId}`;
      const res  = await fetch(syncUrl);
      const data = res.ok ? await res.json() : null;
      if (isRemodel && data?.dynamic && data?.phases) {
        notionDynamic = data;
        try { localStorage.setItem('sa_tracker_v3_dynamic_' + p.id, JSON.stringify(data)); } catch(e) {}
      } else if (!isRemodel && data?.steps) {
        p.sabPhases.forEach((ph, pi) => {
          ph.steps.forEach((st, si) => {
            const notionStep = data.steps[`${pi}-${si}`];
            if (notionStep?.complete) {
              getStepAllItems(st).forEach((_, ii) => { TS[`${pi}-${si}-${ii}`] = true; });
            }
          });
        });
        try { localStorage.setItem('sa_tracker_v3_' + p.id, JSON.stringify(TS)); } catch(e) {}
      }
    } catch(e) {}
  }

  // ── Journey nodes ──────────────────────────────────────
  function buildJourneyNodes() {
    // For remodel clients, use dynamic Notion data; for new builds use TS-derived state
    const phases = isRemodel && notionDynamic?.phases
      ? notionDynamic.phases.map((ph, pi) => ({
          label:    ph.label,
          goal:     ph.goal || ph.milestoneDesc || '',
          done:     ph.complete,
          active:   !ph.complete && (pi === 0 || notionDynamic.phases[pi-1]?.complete),
          doneSteps:ph.steps.filter(s => s.complete).length,
          totalSteps:ph.steps.filter(s => true).length,
          currentStep: ph.steps.find(s => !s.complete)?.title || '',
          milestoneDate: null,
        }))
      : p.sabPhases.map((ph, pi) => ({
          label:     ph.label,
          goal:      ph.goal || ph.milestoneDesc || '',
          done:      isPhaseDone(pi),
          active:    isPhaseActive(pi),
          doneSteps: ph.steps.filter((_, si) => !ph.steps[si].isFinal && isStepDone(pi, si)).length,
          totalSteps:ph.steps.filter(s => !s.isFinal).length,
          currentStep: activeStepLabel(pi),
          milestoneDate: ph.milestoneDate,
        }));

    const phaseNodes = phases.map((ph, pi) => {
      const { done, active } = ph;
      const state  = done ? 'done' : active ? 'active' : 'future';
      const cardBg = done   ? 'background:var(--green-pale);border-color:rgba(117,127,105,.25)'
                   : active ? 'border-color:rgba(117,127,105,.4)'
                   :          'background:var(--cream-pale)';
      const eyeColor   = done || active ? 'color:var(--green-dk)' : 'color:var(--charcoal-4)';
      const titleColor = state === 'future' ? 'color:var(--charcoal-3)' : 'color:var(--charcoal)';
      const tag = done
        ? '<span class="tag ok">Complete</span>'
        : active
        ? '<span class="tag" style="background:var(--green-lt);color:var(--green-deep)">In Progress</span>'
        : '<span class="tag neutral">Upcoming</span>';
      const dotContent = done
        ? `<svg viewBox="0 0 8 8"><path d="M1 4l2 2 4-4" stroke="white" stroke-width="1.3" fill="none"/></svg>`
        : active ? `<div class="journey-dot-inner"></div>` : '';

      const totalSteps  = ph.totalSteps;
      const doneSteps   = ph.doneSteps;
      const currentStep = ph.currentStep;
      const progressLine = active
        ? `<div style="font-size:11px;color:var(--charcoal-4);margin-bottom:7px">
             Step ${doneSteps + 1} of ${totalSteps} — <span style="color:var(--charcoal-3);font-weight:500">${currentStep}</span>
           </div>
           <div style="height:4px;background:var(--cream-2);border-radius:999px;margin-bottom:10px">
             <div style="height:100%;width:${totalSteps ? Math.round(doneSteps/totalSteps*100) : 0}%;background:var(--green);border-radius:999px"></div>
           </div>`
        : done
        ? `<div style="font-size:11px;color:var(--green-dk);margin-bottom:8px;font-weight:500">✓ All ${totalSteps} steps complete</div>`
        : '';

      return `<div class="journey-node">
        <div class="journey-dot ${state}">${dotContent}</div>
        <div class="card" style="${cardBg}">
          <div class="journey-card-eyebrow" style="${eyeColor}">Pre-Construction · Phase ${pi+1}</div>
          <div class="journey-card-title" style="${titleColor}">${ph.label}</div>
          <div class="journey-card-desc">${ph.goal || ''}</div>
          ${progressLine}
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
            ${tag}
            ${ph.milestoneDate ? `<span style="font-size:11px;color:var(--charcoal-4)">${done?'Completed':'Target'}: ${ph.milestoneDate}</span>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');

    const allSABDone     = phases.every(ph => ph.done);
    const isConstruction = p.statusType === 'construction';
    const constructionDot = isConstruction ? 'active' : allSABDone ? 'active' : 'future';
    const constructionBg  = isConstruction ? 'border-color:rgba(117,127,105,.4)' : 'background:var(--cream-pale)';
    const constructionEye = isConstruction || allSABDone ? 'color:var(--green-dk)' : 'color:var(--charcoal-4)';
    const constructionTag = isConstruction
      ? `<span class="tag" style="background:var(--green-lt);color:var(--green-deep)">In Progress — ${p.phaseLabel}</span>`
      : allSABDone
      ? `<span class="tag neutral">${isRemodel ? 'Ready — Pending Demo Day' : 'Build Ready — Pending Groundbreaking'}</span>`
      : '<span class="tag neutral">Unlocks at Build Ready</span>';

    const constructionTitle = isRemodel ? 'Demo Day & Remodel' : 'Breaking Ground & Building';
    const constructionDesc  = isRemodel
      ? 'With planning complete, the remodel begins — demo, rough-in, finishes, and punch list through to completion.'
      : 'With planning complete, your home begins to take physical shape — from excavation through framing, systems, finishes, and close-out.';

    const buildSteps = isRemodel ? [
      'Demo & removal','Rough-in (plumbing, electrical, HVAC)',
      'Drywall & paint','Cabinets & millwork',
      'Flooring & tile','Fixtures & finishes','Punch list & walk-through'
    ] : [
      'Site prep & excavation','Foundation & slab','Framing',
      'Rough MEP (plumbing, electrical, HVAC)','Insulation & drywall',
      'Exterior finishes','Interior finishes & trim','Punch list & close-out'
    ];

    const constructionNode = `<div class="journey-node">
      <div class="journey-dot ${constructionDot}">${constructionDot==='active'?'<div class="journey-dot-inner"></div>':''}</div>
      <div class="card" style="${constructionBg}">
        <div class="journey-card-eyebrow" style="${constructionEye}">Construction</div>
        <div class="journey-card-title" style="${isConstruction?'color:var(--charcoal)':'color:var(--charcoal-3)'}">${constructionTitle}</div>
        <div class="journey-card-desc">${constructionDesc}</div>
        <div style="border-top:0.5px solid var(--border);padding-top:9px;margin-bottom:10px;display:flex;flex-direction:column;gap:5px">
          ${buildSteps.map(s=>`<div style="display:flex;align-items:center;gap:7px"><div style="width:4px;height:4px;border-radius:50%;background:var(--charcoal-4);flex-shrink:0"></div><span style="font-size:12px;color:var(--charcoal-4)">${s}</span></div>`).join('')}
        </div>
        ${constructionTag}
      </div>
    </div>`;

    const completionNode = `<div class="journey-node">
      <div class="journey-dot future"></div>
      <div class="card" style="background:var(--cream-pale)">
        <div class="journey-card-eyebrow" style="color:var(--charcoal-4)">Completion</div>
        <div class="journey-card-title" style="color:var(--charcoal-3)">${isRemodel ? 'Project Complete' : 'Keys in Hand'}</div>
        <div class="journey-card-desc">${isRemodel ? 'The final walk-through, the punch list closed, and your home transformed. Everything before this was preparation for this moment.' : 'The walk-through, the handshake, and the moment you step through the front door. Everything before this day was preparation for this one.'}</div>
        ${isConstruction && p.timelineTarget ? `<span style="font-size:11px;color:var(--charcoal-4)">Target: ${p.timelineTarget}</span>` : '<span class="tag neutral">The finish line</span>'}
      </div>
    </div>`;

    return `<div class="journey-wrap">
      <div class="journey-line"></div>
      ${phaseNodes}
      ${constructionNode}
      ${completionNode}
    </div>`;
  }

  function sabLayout() {
    return `
      <div class="page-eyebrow">Schedule</div>
      <div class="page-title">Project Timeline</div>
      <p class="page-sub">From first site visit to the day you walk through your front door.</p>

      <div class="date-card" style="margin-bottom:1.25rem">
        <div class="date-card-inner">
          <div class="date-card-eyebrow">Pre-Construction Schedule</div>
          <div class="date-row">
            <div class="date-item">
              <div class="date-lbl">Projected Groundbreaking</div>
              <div class="date-val">${p.groundbreakingDate
                ? new Date(p.groundbreakingDate + 'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})
                : 'To be confirmed'}</div>
            </div>
          </div>
          ${!p.groundbreakingDate ? `<div style="font-size:11px;color:rgba(235,233,222,.35);margin-top:8px">Your Six Arrows team will confirm this date as you approach Build Ready.</div>` : ''}
        </div>
      </div>

      <div style="font-size:13px;font-weight:700;color:var(--charcoal);margin-bottom:1rem;letter-spacing:-.01em">Your Full Build Journey</div>
      ${buildJourneyNodes()}
    `;
  }

  async function constructionLayout() {
    // Fetch live schedule data from the scheduling engine
    let schedData = null;
    try {
      const res = await fetch(`/.netlify/functions/client-schedule?projectId=${p.id}`);
      if (res.ok) schedData = await res.json();
    } catch(e) { console.log('Schedule fetch unavailable:', e.message); }

    // Milestones
    const milestones    = schedData?.milestones || [];
    const usesNotion    = false; // fully replaced by schedule engine
    const doneCount     = milestones.filter(m => m.group === 'completed').length;
    const nextMilestone = milestones.find(m => m.group !== 'completed');

    // Rolling tasks
    const tasks          = schedData?.tasks || [];
    const overallPct     = schedData?.overallPct || p.constructionPct || 0;
    const completedCount = schedData?.completedCount || 0;
    const totalTasks     = schedData?.totalTasks || 0;

    // ── Status tag helper ────────────────────────────────────────────────────
    function taskStatusTag(group) {
      const map = {
        completed:        `<span class="tag ok" style="font-size:9px">Complete</span>`,
        active:           `<span class="tag" style="font-size:9px;background:var(--green-lt);color:var(--green-deep)">In Progress</span>`,
        scheduled:        `<span class="tag neutral" style="font-size:9px">Scheduled</span>`,
        estimated:        `<span class="tag" style="font-size:9px;background:rgba(200,112,0,.1);color:#c87000">Est. Timeframe</span>`,
        needs_scheduling: `<span class="tag" style="font-size:9px;background:var(--cream-2);color:var(--charcoal-4)">To Be Scheduled</span>`,
        not_ready:        `<span class="tag" style="font-size:9px;background:var(--cream-2);color:var(--charcoal-4)">Not Yet Ready</span>`,
        waiting:          `<span class="tag" style="font-size:9px;background:rgba(200,112,0,.1);color:#c87000">Waiting on Client</span>`,
        on_hold:          `<span class="tag" style="font-size:9px;background:var(--cream-2);color:var(--charcoal-4)">On Hold</span>`,
      };
      return map[group] || '';
    }

    // ── Task row renderer ────────────────────────────────────────────────────
    function renderTaskRow(task) {
      const isActive    = task.windowRole === 'active';
      const isCompleted = task.windowRole === 'completed';

      // Client-facing note: shown as a teal callout if present
      const noteHtml = task.clientNote
        ? `<div style="font-size:11px;color:var(--green-dk);background:var(--green-pale);border-left:2px solid var(--green);padding:5px 8px;border-radius:3px;margin:4px 0;line-height:1.45">${task.clientNote}</div>`
        : '';

      // Definition of done: shown as secondary text when task is active or upcoming
      const dodHtml = task.definitionOfDone && !isCompleted
        ? `<div style="font-size:11px;color:var(--charcoal-3);line-height:1.45;margin-top:3px"><span style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--charcoal-4);font-weight:600">Done when: </span>${task.definitionOfDone}</div>`
        : '';

      // Date line
      const dateHtml = task.dateLabel && ['scheduled','active','estimated'].includes(task.group)
        ? `<div style="font-size:10px;color:var(--charcoal-4);margin-top:2px">${task.group === 'estimated' ? 'Est. ' : ''}${task.dateLabel}</div>`
        : '';

      // Trade/phase label
      const metaHtml = task.phase
        ? `<div style="font-size:10px;color:var(--charcoal-4);margin-top:2px">${task.phase}${task.trade ? ' · ' + task.trade : ''}</div>`
        : task.trade
        ? `<div style="font-size:10px;color:var(--charcoal-4);margin-top:2px">${task.trade}</div>`
        : '';

      const rowStyle = [
        'display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:0.5px solid var(--border)',
        isActive    ? 'border-left:3px solid var(--green);background:var(--green-pale);padding:12px;border-radius:6px;border-bottom:none;margin-bottom:4px' : '',
        isCompleted ? 'opacity:.55' : '',
      ].filter(Boolean).join(';');

      return `<div style="${rowStyle}">
        <div style="width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;background:${isCompleted||isActive?'var(--green)':'var(--cream-2)'}">
          ${isCompleted
            ? `<svg viewBox="0 0 9 9" style="width:10px;height:10px"><path d="M1.5 4.5l2 2 4-4" stroke="white" stroke-width="1.3" fill="none"/></svg>`
            : isActive
            ? `<div style="width:7px;height:7px;border-radius:50%;background:white"></div>`
            : `<div style="width:6px;height:6px;border-radius:50%;background:var(--charcoal-4)"></div>`}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:${isActive?'700':'500'};color:${isCompleted?'var(--charcoal-3)':'var(--charcoal)'};line-height:1.3">${task.name}</div>
          ${noteHtml}
          ${dodHtml}
          ${metaHtml}
          ${dateHtml}
        </div>
        <div style="flex-shrink:0;margin-top:2px">${taskStatusTag(task.group)}</div>
      </div>`;
    }

    const taskListHtml = tasks.length === 0
      ? `<div style="font-size:13px;color:var(--charcoal-4);padding:1.5rem;text-align:center;font-style:italic">
           Your build schedule is being prepared and will appear here soon.
         </div>`
      : tasks.map(renderTaskRow).join('');

    // ── Milestone list renderer (collapsed by default) ───────────────────────
    function renderMilestoneList() {
      if (!milestones.length) return '';
      return milestones.map((m, i) => {
        const isLast  = i === milestones.length - 1;
        const isDone  = usesNotion ? m.group === 'completed' : m.done;
        const isNext  = !isDone && milestones.slice(0,i).every(x => usesNotion ? x.group === 'completed' : x.done);
        const dateStr = usesNotion ? (m.dateLabel || '') : (m.date || '');
        const title   = usesNotion ? m.name : m.title;
        const note    = usesNotion ? '' : (m.note || '');
        return `<div class="milestone-item ${isDone?'done':''}">
          <div class="milestone-pip-col">
            <div class="milestone-pip ${isDone?'done':isNext?'active':''}">
              ${isDone ? `<svg viewBox="0 0 9 9"><path d="M1.5 4.5l2 2 4-4" stroke="white" stroke-width="1.3" fill="none"/></svg>` : isNext ? `<div class="milestone-pip-dot"></div>` : ''}
            </div>
            ${!isLast ? `<div class="milestone-pip-line"></div>` : ''}
          </div>
          <div class="milestone-body">
            ${dateStr ? `<div class="milestone-date">${dateStr}</div>` : ''}
            <div class="milestone-title">${title}</div>
            ${note ? `<div class="milestone-note">${note}</div>` : ''}
            ${isNext ? `<div class="milestone-tag"><span class="tag" style="font-size:9px;background:var(--green-lt);color:var(--green-deep)">Up Next</span></div>` : ''}
            ${isDone ? `<div class="milestone-tag"><span class="tag ok" style="font-size:9px">Complete</span></div>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    // ── Next milestone callout ───────────────────────────────────────────────
    const nextMilestoneName = usesNotion ? nextMilestone?.name : nextMilestone?.title;
    const nextMilestoneDate = usesNotion ? (nextMilestone?.dateLabel || '') : (nextMilestone?.date || '');
    const nextMilestoneHtml = nextMilestoneName ? `
      <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--green-pale);border-left:3px solid var(--green);border-radius:6px;margin-bottom:10px">
        <svg viewBox="0 0 14 14" fill="none" stroke="var(--green-dk)" stroke-width="1.4" style="width:16px;height:16px;flex-shrink:0"><path d="M7 1v2M7 11v2M1 7h2M11 7h2M3 3l1.5 1.5M9.5 9.5L11 11M3 11l1.5-1.5M9.5 4.5L11 3"/><circle cx="7" cy="7" r="2.5"/></svg>
        <div>
          <div style="font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--green-dk);font-weight:700;margin-bottom:1px">Next Milestone</div>
          <div style="font-size:13px;font-weight:600;color:var(--charcoal)">${nextMilestoneName}</div>
          ${nextMilestoneDate ? `<div style="font-size:11px;color:var(--charcoal-4)">${nextMilestoneDate}</div>` : ''}
        </div>
      </div>` : '';

    return `
      <div class="page-eyebrow">Schedule</div>
      <div class="page-title">Project Timeline</div>
      <p class="page-sub">Your build schedule from groundbreaking to the day you get your keys.</p>

      <div class="date-card" style="margin-bottom:1rem">
        <div class="date-card-inner">
          <div class="date-card-eyebrow">Build Schedule</div>
          <div class="date-row">
            <div class="date-item"><div class="date-lbl">Construction Start</div><div class="date-val">${schedData?.buildStart ? new Date(schedData.buildStart+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : (p.timelineStart||'TBD')}</div></div>
            <div class="date-item"><div class="date-lbl">Target Completion</div><div class="date-val">${schedData?.targetEnd ? new Date(schedData.targetEnd+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : (p.timelineTarget||'TBD')}</div></div>
            ${totalTasks > 0 ? `<div class="date-item"><div class="date-lbl">Tasks Complete</div><div class="date-val">${completedCount} of ${totalTasks} (${overallPct}%)</div></div>` : ''}
          </div>
        </div>
      </div>


      <!-- WHAT'S HAPPENING NOW — first, most immediate -->
      <div class="card" style="margin-bottom:1rem">
        <div class="sh">
          <div class="sh-title">What's Happening Now</div>
          ${totalTasks > 0 ? `<span style="font-size:11px;color:var(--charcoal-4)">${overallPct}% complete</span>` : ''}
        </div>
        ${taskListHtml}
      </div>

      <!-- BUILD MILESTONES — collapsed by default, next milestone shown as callout -->
      <div class="card" style="margin-bottom:1rem">
        <div class="sh" style="cursor:pointer" onclick="toggleMilestones()">
          <div class="sh-title">Build Milestones</div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="tag ok" style="font-size:9px">${doneCount} of ${milestones.length} complete</span>
            <svg id="ms-chev" viewBox="0 0 12 12" fill="none" stroke="var(--charcoal-4)" stroke-width="1.5" style="width:12px;height:12px;transition:transform .2s"><path d="M4 2.5l4 3.5-4 3.5"/></svg>
          </div>
        </div>
        ${nextMilestoneHtml}
        <div id="ms-list" style="max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)">
          <div class="milestone-list" style="margin-top:8px">
            ${renderMilestoneList()}
          </div>
        </div>
        ${milestones.length === 0 ? `<div style="font-size:13px;color:var(--charcoal-4);padding:4px 0">Milestones will appear here as your build progresses.</div>` : ''}
      </div>
    `;
  }

  let _msOpen = false;
  window.toggleMilestones = function() {
    _msOpen = !_msOpen;
    const list = document.getElementById('ms-list');
    const chev = document.getElementById('ms-chev');
    if (list) list.style.maxHeight = _msOpen ? '2000px' : '0';
    if (chev) chev.style.transform = _msOpen ? 'rotate(90deg)' : '';
  };

    const layoutHtml = isSAB ? sabLayout() : await constructionLayout();
  mountLayout('timeline', 'Timeline', layoutHtml);
}

initTimeline();

</script></body></html>
