function setLifestyle(key, value) {
  if (!ST.lifestyle) ST.lifestyle = { investmentRanking: ST.rms.map(r => r.id) };
  ST.lifestyle[key] = value;
  scheduleSave();
  render();
}

// Drag-to-rank handlers
let _dragRoomId = null;

function rankDragStart(e) {
  _dragRoomId = e.target.closest('[data-room-id]').dataset.roomId;
  e.target.closest('.lifestyle-rank-item').classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function rankDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function rankDrop(e) {
  e.preventDefault();
  const targetId = e.target.closest('[data-room-id]')?.dataset.roomId;
  if (!targetId || !_dragRoomId || targetId === _dragRoomId) return;

  if (!ST.lifestyle) ST.lifestyle = { investmentRanking: ST.rms.map(r => r.id) };
  const ranking = ST.lifestyle.investmentRanking;
  const fromIdx = ranking.indexOf(_dragRoomId);
  const toIdx = ranking.indexOf(targetId);
  if (fromIdx === -1 || toIdx === -1) return;

  ranking.splice(fromIdx, 1);
  ranking.splice(toIdx, 0, _dragRoomId);
  scheduleSave();
  render();
}

function rankDragEnd(e) {
  _dragRoomId = null;
  document.querySelectorAll('.lifestyle-rank-item').forEach(el => el.classList.remove('dragging'));
}

// Touch-based drag for mobile
let _rankTouchItem = null;
let _rankTouchStartY = 0;
let _rankTouchClone = null;

function rankTouchStart(e) {
  const item = e.target.closest('[data-room-id]');
  if (!item) return;
  _rankTouchItem = item;
  _rankTouchStartY = e.touches[0].clientY;
  item.classList.add('dragging');
}

function rankTouchMove(e) {
  if (!_rankTouchItem) return;
  e.preventDefault();
  const y = e.touches[0].clientY;
  const list = document.getElementById('rank-list');
  if (!list) return;

  const items = Array.from(list.querySelectorAll('.lifestyle-rank-item'));
  const currentIdx = items.indexOf(_rankTouchItem);

  // Find which item we're hovering over
  for (let i = 0; i < items.length; i++) {
    if (i === currentIdx) continue;
    const rect = items[i].getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if (y < mid && i < currentIdx) {
      list.insertBefore(_rankTouchItem, items[i]);
      updateRankingFromDOM();
      break;
    } else if (y > mid && i > currentIdx) {
      list.insertBefore(_rankTouchItem, items[i].nextSibling);
      updateRankingFromDOM();
      break;
    }
  }
}

function rankTouchEnd(e) {
  if (_rankTouchItem) {
    _rankTouchItem.classList.remove('dragging');
    _rankTouchItem = null;
    render(); // re-render to update tier badges
  }
}

function updateRankingFromDOM() {
  const list = document.getElementById('rank-list');
  if (!list) return;
  const items = Array.from(list.querySelectorAll('[data-room-id]'));
  if (!ST.lifestyle) ST.lifestyle = { investmentRanking: ST.rms.map(r => r.id) };
  ST.lifestyle.investmentRanking = items.map(el => el.dataset.roomId);
  scheduleSave();
}

function deriveBudgetTiers(ranking) {
  const tiers = {};
  ranking.forEach((roomId, i) => {
    if (i < 2) tiers[roomId] = 'showpiece';
    else if (i < 4) tiers[roomId] = 'elevated';
    else tiers[roomId] = 'essential';
  });
  return tiers;
}

function backFromLifestyle() {
  // Go back to comparisons (at last step)
  const pairs = ST.comparisonPairs || [];
  const nwSets = ST.neverWantSets || [];
  ST.compIdx = Math.max(0, pairs.length + nwSets.length - 1);
  ST.phase = 'comparisons';
  render();
}

function completeLifestyle() {
  if (!ST.lifestyle || !ST.lifestyle.kitchenUse || !ST.lifestyle.householdType || !ST.lifestyle.maintenanceTolerance || !ST.lifestyle.decisionStyle) {
    showToast('Answer the required questions first');
    return;
  }
  // Move to guardrails (they'll trigger analysis when done)
  if (!ST.guardrails) ST.guardrails = { abstractGuardrails: [], specificRedFlags: [] };
  ST.phase = 'guardrails';
  scheduleSave();
  render();
}

// Legacy completeLifestyle path for old quiz flow
async function completeLifestyleLegacy() {
  if (!ST.lifestyle || !ST.lifestyle.kitchenUse || !ST.lifestyle.durability) {
    showToast('Answer all questions first');
    return;
  }
  const ranking = ST.lifestyle.investmentRanking || ST.rms.map(r => r.id);
  ST.budgetTiers = deriveBudgetTiers(ranking);
  scheduleSave();
  ST.phase = 'analyzing';
  render();
  try {
    await analyzeQuiz();
  } catch (err) {
    console.error('Style analysis failed:', err);
    ST.phase = 'error';
    ST.errorMessage = 'Style analysis failed: ' + err.message;
    render();
  }
}

// ─────────────────────────────────────────────────────────
//  Style Fingerprint Engine
//  Computes the 12-dimension taste profile + confidence +
//  coherence + taste maturity + style fit + derived directions.
//  All scoring constants are TUNABLE.
// ─────────────────────────────────────────────────────────

const TASTE_DIMS = [
  'warmth', 'formality', 'traditionalContemporary', 'restraintOrnament',
  'tonalContrast', 'naturalManufactured', 'mattePolished', 'quietExpressive',
  'softStructured', 'patternTolerance', 'colorTolerance', 'riskTolerance',
];

// Dimension-specific base confidence adjustments (caution/experimental dims start lower)
const DIM_CONFIDENCE_BASE = {
  naturalManufactured: -0.15,
  restraintOrnament: -0.10,
  traditionalContemporary: -0.05,
  quietExpressive: -0.05,
};

// Coherence compatibility matrix — pairs that are naturally compatible, neutral, or in tension
const COHERENCE_RULES = [
  // [dimA, rangeA, dimB, rangeB, relationship] — 'compatible' | 'tension' | 'moderate_tension'
  // rangeA/B: 'high' = >=7, 'low' = <=3
  { a: 'warmth', aRange: 'high', b: 'naturalManufactured', bRange: 'high', rel: 'compatible' },
  { a: 'warmth', aRange: 'high', b: 'formality', bRange: 'high', rel: 'compatible' },
  { a: 'warmth', aRange: 'low', b: 'mattePolished', bRange: 'high', rel: 'compatible' },
  { a: 'warmth', aRange: 'low', b: 'softStructured', bRange: 'high', rel: 'compatible' },
  { a: 'naturalManufactured', aRange: 'high', b: 'mattePolished', bRange: 'low', rel: 'compatible' },
  { a: 'quietExpressive', aRange: 'low', b: 'patternTolerance', bRange: 'low', rel: 'compatible' },
  // Tensions
  { a: 'restraintOrnament', aRange: 'high', b: 'traditionalContemporary', bRange: 'low', rel: 'tension' },
  { a: 'mattePolished', aRange: 'high', b: 'naturalManufactured', bRange: 'high', rel: 'tension' },
  { a: 'quietExpressive', aRange: 'low', b: 'colorTolerance', bRange: 'high', rel: 'moderate_tension' },
  { a: 'restraintOrnament', aRange: 'low', b: 'patternTolerance', bRange: 'high', rel: 'tension' },
  { a: 'quietExpressive', aRange: 'high', b: 'riskTolerance', bRange: 'low', rel: 'moderate_tension' },
];

function computeStyleFingerprint() {
  const dims = {};
  const confidence = {};

  // Step 1: Score from comparisons (primary signal)
  const pairs = ST.comparisonPairs || [];
  for (const pair of pairs) {
    const result = ST.comparisonResults[pair.id];
    if (!result || !result.pick) {
      dims[pair.dimension] = 5; // neutral default
      confidence[pair.dimension] = 0.2;
      continue;
    }
    let score = result.pick === 'A' ? pair.aScore : pair.bScore;
    // Affinity modifiers for pairs that have them
    if (pair.hasAffinity && result.affinity) {
      if (result.affinity === 'ok') {
        // Nudge toward center
        score = score < 5 ? score + 1 : score - 1;
      } else if (result.affinity === 'neither') {
        score = 5; // dimension not found
      }
    }
    dims[pair.dimension] = score;
    // Base confidence from comparison
    let conf = pair.hasAffinity
      ? (result.affinity === 'love' ? 0.35 : result.affinity === 'ok' ? 0.25 : 0.10)
      : 0.25;
    confidence[pair.dimension] = conf;
  }

  // Score risk tolerance from never-want sets
  const nwSets = ST.neverWantSets || [];
  let riskScores = [];
  for (const nwSet of nwSets) {
    const rejected = ST.comparisonResults[nwSet.id];
    if (!rejected) continue;
    const opt = nwSet.options.find(o => o.id === rejected);
    if (opt) riskScores.push(opt.riskScore);
  }
  if (riskScores.length > 0) {
    dims.riskTolerance = Math.round(riskScores.reduce((a, b) => a + b, 0) / riskScores.length);
    confidence.riskTolerance = 0.15 * riskScores.length; // more sets = more confidence
  } else {
    dims.riskTolerance = 5;
    confidence.riskTolerance = 0.1;
  }

  // Step 2: Apply identity word modifiers (+/-1 max per dimension)
  const ip = ST.identityProfile || { positiveWords: [], negativeWords: [] };
  const catalog = ST.catalog || {};
  const wordDefs = catalog.identityWords || { positive: [], negative: [] };
  const wordMods = {}; // accumulate per dimension

  function accumulateWordMods(selectedWords, wordList) {
    for (const word of selectedWords) {
      const def = wordList.find(w => w.word === word);
      if (!def || !def.dims) continue;
      for (const [dim, val] of Object.entries(def.dims)) {
        if (!wordMods[dim]) wordMods[dim] = 0;
        wordMods[dim] += val;
      }
    }
  }
  accumulateWordMods(ip.positiveWords || [], wordDefs.positive);
  accumulateWordMods(ip.negativeWords || [], wordDefs.negative);

  // Apply with clamp to +/-1
  for (const dim of TASTE_DIMS) {
    if (!dims[dim] && dims[dim] !== 0) dims[dim] = 5;
    const mod = Math.max(-1, Math.min(1, wordMods[dim] || 0));
    dims[dim] = Math.max(0, Math.min(10, dims[dim] + mod));

    // Adjust confidence based on word agreement
    if (wordMods[dim]) {
      const compScore = dims[dim] - mod; // original comparison score
      const wordDirection = mod > 0 ? 1 : -1;
      const compDirection = compScore >= 5 ? 1 : -1;
      if (wordDirection === compDirection || compScore === 5) {
        confidence[dim] = (confidence[dim] || 0) + 0.20; // words agree
      } else {
        confidence[dim] = (confidence[dim] || 0) - 0.15; // words contradict
        confidence[dim + '_conflicted'] = true;
      }
    }
  }

  // Step 3: Apply dimension-specific base confidence adjustments
  for (const [dim, adj] of Object.entries(DIM_CONFIDENCE_BASE)) {
    if (confidence[dim] !== undefined) confidence[dim] += adj;
  }

  // Clamp confidence to 0-1
  for (const dim of TASTE_DIMS) {
    confidence[dim] = Math.max(0, Math.min(1, confidence[dim] || 0));
  }

  // Step 4: Compute coherence
  const coherence = computeCoherence(dims);

  // Step 5: Compute taste maturity
  const tasteMaturity = computeTasteMaturity();

  // Step 6: Derive material directions
  const derived = deriveMaterialDirections(dims);

  // Step 7: Compute style fit via centroids
  const styleFit = computeStyleFit(dims);

  // Build structured dimensions with score + confidence + label
  const structuredDims = {};
  for (const dim of TASTE_DIMS) {
    const conflicted = !!confidence[dim + '_conflicted'];
    const conf = confidence[dim] || 0;
    let label;
    if (conflicted) label = 'conflicted';
    else if (conf >= 0.75) label = 'high';
    else if (conf >= 0.50) label = 'medium';
    else if (conf >= 0.25) label = 'low';
    else label = 'low';

    structuredDims[dim] = {
      score: dims[dim] || 5,
      confidence: conf,
      label,
      conflicted,
    };
  }

  ST.styleFingerprint = {
    dimensions: structuredDims,
    coherence,
    tasteMaturity,
    derived,
    materialDirections: derived,
    styleFit,
    luxuryExpression: ip.luxuryExpression || null,
    decisionStyle: ST.lifestyle?.decisionStyle || null,
    maintenanceTolerance: ST.lifestyle?.maintenanceTolerance || null,
  };

  // Also set the style name for downstream compatibility
  ST.style = styleFit.primary;
  ST.styleProfile = (ST.catalog?.styles || {})[styleFit.primary] || null;
}

function computeCoherence(dims) {
  let tensionWeight = 0;
  let maxPossibleTension = 0;
  const conflicts = [];

  for (const rule of COHERENCE_RULES) {
    const valA = dims[rule.a] || 5;
    const valB = dims[rule.b] || 5;
    const aInRange = rule.aRange === 'high' ? valA >= 7 : valA <= 3;
    const bInRange = rule.bRange === 'high' ? valB >= 7 : valB <= 3;

    if (rule.rel === 'compatible') {
      // Compatible pairs reduce tension — no action needed
      continue;
    }

    const weight = rule.rel === 'tension' ? 1.0 : 0.5;
    maxPossibleTension += weight;

    if (aInRange && bInRange) {
      tensionWeight += weight;
      conflicts.push({
        dims: [rule.a, rule.b],
        severity: rule.rel === 'tension' ? 'worth_discussing' : 'gentle_note',
        note: `${rule.a} (${Math.round(valA)}) + ${rule.b} (${Math.round(valB)}) may pull in different directions`,
      });
    }
  }

  const score = maxPossibleTension > 0 ? 1 - (tensionWeight / maxPossibleTension) : 1;
  let classification;
  if (score >= 0.85) classification = 'highly_coherent';
  else if (score >= 0.65) classification = 'mostly_aligned';
  else if (score >= 0.45) classification = 'mixed';
  else classification = 'scattered';

  return { score: Math.round(score * 100), classification, conflicts };
}

function computeTasteMaturity() {
  const ip = ST.identityProfile || { positiveWords: [], negativeWords: [] };
  const catalog = ST.catalog || {};
  const wordDefs = catalog.identityWords || { positive: [] };

  let signals = [];

  // Signal 1: Word bucket distribution — material/visual > social = higher maturity
  const buckets = { emotional: 0, visual: 0, material: 0, social: 0 };
  for (const word of (ip.positiveWords || [])) {
    const def = wordDefs.positive.find(w => w.word === word);
    if (def) buckets[def.bucket] = (buckets[def.bucket] || 0) + 1;
  }
  const socialRatio = buckets.social / Math.max(1, ip.positiveWords?.length || 1);
  signals.push(1 - socialRatio); // low social = high maturity signal

  // Signal 2: Affinity check responses — "love" = high maturity, "neither" = low
  let loveCount = 0, totalAffinity = 0;
  for (const [id, result] of Object.entries(ST.comparisonResults)) {
    if (result && result.affinity) {
      totalAffinity++;
      if (result.affinity === 'love') loveCount++;
    }
  }
  if (totalAffinity > 0) signals.push(loveCount / totalAffinity);

  // Signal 3: Coherence (already computed, but use a simple proxy)
  const fp = ST.styleFingerprint;
  if (fp && fp.coherence) signals.push(fp.coherence.score / 100);

  // Signal 4: Abstract guardrails vs specific red flags
  const gr = ST.guardrails || { abstractGuardrails: [], specificRedFlags: [] };
  const absCount = gr.abstractGuardrails.length;
  const rfCount = gr.specificRedFlags.length;
  if (absCount + rfCount > 0) {
    signals.push(absCount / (absCount + rfCount)); // more abstract = higher maturity
  }

  // Weighted average
  if (signals.length === 0) return 0.5;
  return Math.round((signals.reduce((a, b) => a + b, 0) / signals.length) * 100) / 100;
}

function deriveMaterialDirections(dims) {
  const d = {};

  // Metals — from warmth + mattePolished
  if (dims.warmth >= 7) {
    d.preferredMetals = dims.mattePolished >= 6
      ? ['polished brass', 'brushed gold']
      : ['unlacquered brass', 'oil-rubbed bronze'];
  } else if (dims.warmth <= 3) {
    d.preferredMetals = dims.mattePolished >= 6
      ? ['polished chrome', 'polished nickel']
      : ['brushed nickel', 'satin chrome'];
  } else {
    d.preferredMetals = ['brushed brass', 'brushed nickel'];
  }

  // Woods — from warmth + traditionalContemporary
  if (dims.warmth >= 7 && dims.traditionalContemporary >= 6) {
    d.woodFamilies = ['walnut', 'cherry', 'warm-stained oak'];
  } else if (dims.warmth >= 7) {
    d.woodFamilies = ['white oak', 'rift-cut oak', 'light walnut'];
  } else {
    d.woodFamilies = ['rift-cut white oak', 'oiled walnut', 'ash'];
  }

  // Stones — from naturalManufactured + tonalContrast + patternTolerance
  if (dims.naturalManufactured >= 7) {
    if (dims.patternTolerance >= 6) d.stoneFamilies = ['book-matched marble', 'dramatic quartzite'];
    else d.stoneFamilies = ['honed limestone', 'soft-veined quartzite', 'soapstone'];
  } else {
    d.stoneFamilies = ['engineered quartz', 'porcelain slab'];
  }

  // Paint direction — from warmth + tonalContrast + colorTolerance
  if (dims.warmth >= 7 && dims.colorTolerance <= 3) d.paintDirection = 'warm whites, creamy neutrals';
  else if (dims.warmth <= 3 && dims.colorTolerance <= 3) d.paintDirection = 'bright whites, cool greys';
  else if (dims.colorTolerance >= 7) d.paintDirection = 'saturated accent walls, deep tones';
  else d.paintDirection = 'balanced neutrals with muted color moments';

  // Cabinet tendency — from formality + restraintOrnament + traditionalContemporary
  if (dims.formality >= 7 && dims.restraintOrnament >= 6) d.cabinetTendency = 'inset beaded frame, painted or stained';
  else if (dims.formality >= 7 && dims.restraintOrnament <= 3) d.cabinetTendency = 'flat front, handleless or integrated pull';
  else if (dims.restraintOrnament >= 5) d.cabinetTendency = 'shaker or transitional, classic proportions';
  else d.cabinetTendency = 'clean shaker or slab, simple hardware';

  // Tile tendency — from mattePolished + naturalManufactured + patternTolerance
  if (dims.naturalManufactured >= 7 && dims.mattePolished <= 3) d.tileTendency = 'handmade-look, matte, zellige or cotto';
  else if (dims.patternTolerance >= 7) d.tileTendency = 'patterned encaustic, mosaic, or decorative';
  else d.tileTendency = 'clean subway, large-format porcelain, or slab';

  return d;
}

function computeStyleFit(dims) {
  // STYLE_CENTROIDS are served via catalog-data.js on the backend,
  // but for client-side computation we define them inline.
  // Must match catalog-data.js STYLE_CENTROIDS (calibrated values)
  const centroids = {
    'Modern Farmhouse':   { warmth: 8, formality: 3, traditionalContemporary: 6, restraintOrnament: 4, tonalContrast: 4, naturalManufactured: 7, mattePolished: 3, quietExpressive: 4, softStructured: 5, patternTolerance: 4, colorTolerance: 3, riskTolerance: 3 },
    'Transitional':       { warmth: 6, formality: 6, traditionalContemporary: 5, restraintOrnament: 4, tonalContrast: 4, naturalManufactured: 5, mattePolished: 5, quietExpressive: 3, softStructured: 5, patternTolerance: 3, colorTolerance: 3, riskTolerance: 3 },
    'Modern Traditional': { warmth: 7, formality: 8, traditionalContemporary: 8, restraintOrnament: 8, tonalContrast: 5, naturalManufactured: 8, mattePolished: 4, quietExpressive: 4, softStructured: 5, patternTolerance: 4, colorTolerance: 5, riskTolerance: 3 },
    'Organic Modern':     { warmth: 8, formality: 3, traditionalContemporary: 4, restraintOrnament: 5, tonalContrast: 3, naturalManufactured: 9, mattePolished: 2, quietExpressive: 4, softStructured: 2, patternTolerance: 5, colorTolerance: 5, riskTolerance: 6 },
    'Clean Modern':       { warmth: 3, formality: 6, traditionalContemporary: 1, restraintOrnament: 1, tonalContrast: 5, naturalManufactured: 4, mattePolished: 4, quietExpressive: 3, softStructured: 8, patternTolerance: 1, colorTolerance: 2, riskTolerance: 4 },
    'Warm Luxury':        { warmth: 7, formality: 8, traditionalContemporary: 6, restraintOrnament: 7, tonalContrast: 7, naturalManufactured: 8, mattePolished: 6, quietExpressive: 7, softStructured: 5, patternTolerance: 6, colorTolerance: 8, riskTolerance: 6 },
  };

  const scores = {};
  for (const [style, centroid] of Object.entries(centroids)) {
    let sumSq = 0;
    for (const dim of TASTE_DIMS) {
      const diff = (dims[dim] || 5) - (centroid[dim] || 5);
      sumSq += diff * diff;
    }
    // Convert distance to a 0-100 similarity score (lower distance = higher score)
    // Max possible distance = sqrt(12 * 10^2) = ~34.6
    const distance = Math.sqrt(sumSq);
    scores[style] = Math.round(Math.max(0, 100 - (distance / 34.6) * 100));
  }

  // Sort by score descending
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const primary = sorted[0][0];
  const secondary = sorted[1][0];
  const topScore = sorted[0][1];
  const gap = sorted[0][1] - sorted[1][1];
  // Confidence: bigger gap between top two = more confident
  const confidence = Math.min(100, Math.round(50 + gap * 2));

  return { primary, secondary, confidence, scores };
}

// ── Profile analysis (replaces analyzeQuiz for new flow) ──
async function analyzeProfile() {
  const fp = ST.styleFingerprint;
  if (!fp) {
    ST.phase = 'error';
    ST.errorMessage = 'No fingerprint computed';
    render();
    return;
  }

  const userMsg = JSON.stringify({
    fingerprint: fp,
    identityProfile: ST.identityProfile,
    guardrails: ST.guardrails,
    lifestyle: ST.lifestyle,
  });

  try {
    const res = await fetch('/.netlify/functions/design-agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: 'profile-analyze',
        messages: [{ role: 'user', content: userMsg }],
        context: { style: fp.styleFit.primary },
      }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const reply = data.reply || '';

    // Try to parse JSON from reply
    let parsed;
    try {
      const jsonMatch = reply.match(/\{[\s\S]*\}/);
      parsed = jsonMatch ? JSON.parse(jsonMatch[0]) : {};
    } catch (e) {
      parsed = {};
    }

    ST.style = parsed.style || fp.styleFit.primary;
    ST.styleProfile = (ST.catalog?.styles || {})[ST.style] || null;
    ST.styleSummary = parsed.summary || '';
    ST.styleGreeting = parsed.greeting || '';
    ST.designConcept = parsed.conceptStatement || '';
    ST.designGuardrails = parsed.designGuardrails || [];
    ST.inconsistencies = parsed.inconsistencies || [];
    ST.livabilityNotes = parsed.livabilityNotes || [];

    scheduleSave();
    stopAnalyzeAnimation();
    ST.phase = 'reveal';
    render();
  } catch (err) {
    console.error('Profile analysis failed:', err);
    stopAnalyzeAnimation();
    // Fall back to fingerprint-only reveal (no Claude interpretation)
    ST.style = fp.styleFit.primary;
    ST.styleProfile = (ST.catalog?.styles || {})[ST.style] || null;
    ST.styleSummary = `Your taste aligns most closely with ${fp.styleFit.primary} with ${fp.styleFit.secondary} as a secondary influence.`;
    ST.styleGreeting = '';
    ST.designConcept = '';
    scheduleSave();
    ST.phase = 'reveal';
    render();
  }
}

const ANALYZE_STEPS = [
  'Reading your identity words…',
  'Analyzing your comparisons…',
  'Computing your taste fingerprint…',
  'Fox is building your design concept…',
];
let analyzeStepIdx = 0;
let analyzeInterval = null;

function startAnalyzeAnimation() {
  analyzeStepIdx = 0;
  const el = document.getElementById('analyze-step');
  if (el) el.textContent = ANALYZE_STEPS[0];
  analyzeInterval = setInterval(() => {
    analyzeStepIdx = Math.min(analyzeStepIdx + 1, ANALYZE_STEPS.length - 1);
    const el = document.getElementById('analyze-step');
    if (el) {
      el.style.opacity = '0';
      setTimeout(() => {
        el.textContent = ANALYZE_STEPS[analyzeStepIdx];
        el.style.opacity = '1';
      }, 200);
    }
  }, 2200);
}

function stopAnalyzeAnimation() {
  if (analyzeInterval) { clearInterval(analyzeInterval); analyzeInterval = null; }
}

function renderAnalyzing() {
  setTimeout(startAnalyzeAnimation, 100);
  return `
    <div class="fox-analyzing">
      <div class="fox-spinner"></div>
      <h2 id="analyze-step" style="transition:opacity .2s">${ANALYZE_STEPS[0]}</h2>
      <p>This takes about 10 seconds.</p>
    </div>`;
}

async function analyzeQuiz() {
  ST.phase = 'analyzing';
  render();

  // Build a single user message containing the answers as readable text
  const lines = ST.quiz.map(q => {
    const letter = ST.quizAnswers[q.id];
    const opt = q.options.find(o => o.letter === letter);
    return `${q.id} (${q.prompt}): ${letter} — ${opt ? opt.label : '(no answer)'}`;
  });
  const userText = `Here are my quiz answers:\n${lines.join('\n')}`;

  try {
    const res = await fetch('/.netlify/functions/design-agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: 'quiz-analyze',
        context: { clientName: CLIENT_NAME },
        messages: [{ role: 'user', content: userText }],
      }),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(`design-agent error ${res.status}: ${err}`);
    }
    const data = await res.json();
    let parsed;
    try { parsed = JSON.parse(data.reply); }
    catch (e) { throw new Error('Fox returned unparseable JSON: ' + (data.reply || '').slice(0, 200)); }

    ST.style         = parsed.style || '';
    ST.styleSummary  = parsed.summary || '';
    ST.styleGreeting = parsed.greeting || '';
    ST.styleProfile  = (ST.catalog && ST.catalog.styles && ST.catalog.styles[ST.style]) || null;
    ST.phase = 'reveal';
    scheduleSave();
    render();
  } catch (err) {
    console.error(err);
    ST.phase = 'error';
    ST.errorMessage = err.message || String(err);
    render();
  }
}

function renderCalibrationDashboard(fp) {
  if (!fp) return '';
  const dims = fp.dimensions || {};
  const dimRows = Object.entries(dims).map(([name, d]) => {
    const pct = ((d.score || 5) / 10 * 100).toFixed(0);
    const confClass = d.confidence >= 0.75 ? 'high' : d.confidence >= 0.5 ? 'med' : d.conflicted ? 'conflict' : 'low';
    return `<tr>
      <td class="cal-dim-name">${esc(name)}</td>
      <td class="cal-dim-bar"><div class="cal-bar-track"><div class="cal-bar-fill" style="width:${pct}%"></div></div></td>
      <td class="cal-dim-score">${(d.score || 0).toFixed(1)}</td>
      <td class="cal-dim-conf ${confClass}">${d.conflicted ? 'CONFLICT' : (d.confidence || 0).toFixed(2)}</td>
    </tr>`;
  }).join('');

  const coh = fp.coherence || {};
  const conflicts = (coh.conflicts || []).map(c =>
    `<div class="cal-conflict">${esc(c.dimA || '')} vs ${esc(c.dimB || '')} — ${esc(c.severity || '')}${c.description ? ': ' + esc(c.description) : ''}</div>`
  ).join('') || '<div class="cal-none">No conflicts</div>';

  const styleFit = fp.styleFit || {};
  const styleRows = Object.entries(styleFit.scores || {}).sort((a, b) => b[1] - a[1]).map(([name, score]) =>
    `<tr><td>${esc(name)}</td><td>${score}%</td><td>${name === styleFit.primary ? 'PRIMARY' : name === styleFit.secondary ? 'secondary' : ''}</td></tr>`
  ).join('');

  const md = fp.materialDirections || {};
  const mdLines = Object.entries(md).map(([k, v]) =>
    `<div><strong>${esc(k)}:</strong> ${esc(Array.isArray(v) ? v.join(', ') : String(v))}</div>`
  ).join('');

  return `
    <details class="cal-dashboard">
      <summary class="cal-toggle">Calibration Dashboard (internal)</summary>
      <div class="cal-body">
        <div class="cal-section">
          <div class="cal-section-title">Dimensions</div>
          <table class="cal-table"><thead><tr><th>Dim</th><th>Bar</th><th>Score</th><th>Conf</th></tr></thead>
          <tbody>${dimRows}</tbody></table>
        </div>
        <div class="cal-section">
          <div class="cal-section-title">Coherence: ${(coh.score || 0)}/100 — ${esc(coh.classification || '?')}</div>
          ${conflicts}
        </div>
        <div class="cal-section">
          <div class="cal-section-title">Taste Maturity: ${(fp.tasteMaturity || 0).toFixed(2)}</div>
        </div>
        <div class="cal-section">
          <div class="cal-section-title">Style Fit (similarity, higher = closer)</div>
          <table class="cal-table"><thead><tr><th>Style</th><th>Match</th><th></th></tr></thead>
          <tbody>${styleRows}</tbody></table>
          <div>Confidence: ${styleFit.confidence || '?'}%</div>
        </div>
        <div class="cal-section">
          <div class="cal-section-title">Derived Material Directions</div>
          ${mdLines}
        </div>
        <div class="cal-section">
          <div class="cal-section-title">Identity Profile</div>
          <div>Positive: ${esc((ST.identityProfile?.positiveWords || []).join(', '))}</div>
          <div>Negative: ${esc((ST.identityProfile?.negativeWords || []).join(', '))}</div>
          <div>Luxury: ${esc(ST.identityProfile?.luxuryExpression || 'none')}</div>
        </div>
        <div class="cal-section">
          <div class="cal-section-title">Raw Fingerprint JSON</div>
          <pre class="cal-json">${esc(JSON.stringify(fp, null, 2))}</pre>
        </div>
      </div>
    </details>`;
}

async function completeBudget() {
  if (!allBudgetTiersSet()) {
    showToast('Pick a tier for every room first');
    return;
  }
  // Generate the auto-populated design package
  ST.phase = 'generating';
  render();
  try {
    const res = await fetch('/.netlify/functions/generate-package', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        style: ST.style,
        budgetTiers: ST.budgetTiers,
        rooms: ST.rms.map(r => ({ id: r.id, name: r.name })),
      }),
    });
    if (!res.ok) throw new Error(`generate-package ${res.status}`);
    const data = await res.json();
    ST.designPackage = data.package;
    // Auto-populate picks from the package
    for (const [roomId, categories] of Object.entries(ST.designPackage)) {
      for (const [cat, sel] of Object.entries(categories)) {
        const k = cellKey(roomId, cat);
        if (!ST.picks[k]) {
          ST.picks[k] = {
            tier: sel.selected.tier,
            name: sel.selected.name,
            note: sel.selected.note,
            imageUrl: sel.selected.imageUrl,
            autoGenerated: true,
          };
        }
      }
    }
    ST.phase = 'package';
  } catch (err) {
    console.error('Package generation failed:', err);
    showToast('Could not generate package — falling back to manual');
    ST.phase = 'home';
  }
  scheduleSave();
  render();
}

function renderSwapPanel(roomId, cat, sel) {

function toggleSwapPanel(swapId) {

function swapSelection(roomId, cat, newPick) {

    name: newPick.name,
    note: newPick.note || '',

// ── Chat ──────────────────────────────────────
function cellKey(roomId, cat) { return `${roomId}::${cat}`; }
function chatThread() {
  const k = cellKey(ST.currentRoomId, ST.currentCategory);
  if (!ST.chatHistory[k]) ST.chatHistory[k] = [];
  return ST.chatHistory[k];
}

function openChat(roomId, category) {
  const room = ST.rms.find(r => r.id === roomId);
  if (!room) return;
  ST.currentRoom = room.name;
  ST.currentRoomId = roomId;
  ST.currentCategory = category;
  ST.phase = 'chat';
  render();
  // If no messages yet, send the opening prompt for Fox
  const thread = chatThread();
  if (thread.length === 0) {
    sendOpeningMessage();
  }
}

function backToHome() {
  ST.phase = 'home';
  render();
}

function renderChat() {
  const thread = chatThread();
  const k = cellKey(ST.currentRoomId, ST.currentCategory);
  const lockedPick = ST.picks[k];

  return `
    <div class="chat-shell">
      <div class="chat-hd">
        <div class="chat-hd-l">
          <div class="chat-hd-text">
            <div class="chat-hd-room">${esc(ST.currentRoom)}</div>
            <div class="chat-hd-cat">${esc(CAT_LABELS[ST.currentCategory] || ST.currentCategory)}</div>
          </div>
        </div>
        <button class="chat-hd-back" onclick="backToHome()">← All rooms</button>
      </div>
      <div class="chat-body" id="chat-body">
        ${thread.map(renderChatMsg).join('')}
        ${ST.awaitingFox ? `
          <div class="chat-msg fox">
            <div class="chat-bubble">
              <div class="chat-thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            </div>
          </div>` : ''}
      </div>
      ${lockedPick ? `
        <div class="chat-locked-banner">
          <div class="chat-locked-text">
            ✓ Picked: ${esc(lockedPick.tier || '')} ${esc(lockedPick.name)}
            <small>${esc(lockedPick.priceRange || '')}</small>
          </div>

}

function renderChatMsg(m, idx) {
  if (m.role === 'user') {
    return `<div class="chat-msg user"><div class="chat-bubble">${esc(m.content)}</div></div>`;
  }
  // assistant
  const picks = Array.isArray(m.picks) ? m.picks : null;
  const isLast = idx === undefined; // unused
  const k = cellKey(ST.currentRoomId, ST.currentCategory);
  const lockedPick = ST.picks[k];
  return `
    <div class="chat-msg fox">
      <div style="max-width:88%">
        <div class="chat-bubble">${mdRender(m.content)}</div>
        ${picks && !lockedPick ? `
          <div class="pick-cards">
            ${picks.map((pk, pi) => `
              <button type="button" class="pick-card ${pk.myPick ? 'foxpick' : ''}" onclick="lockInPick(${esc(JSON.stringify(JSON.stringify(pk)))})">
                ${pk.myPick ? '<div class="pick-card-foxpick-tag">Fox\u2019s pick</div>' : ''}
                <div class="pick-card-tier">${esc(pk.tier || '')} ${pk.priceRange ? '· <span class="pick-card-price">' + esc(pk.priceRange) + '</span>' : ''}</div>
                <div class="pick-card-name">${esc(pk.name || '')}</div>
                <div class="pick-card-why">${esc(pk.why || '')}</div>
              </button>`).join('')}
          </div>` : ''}

}

function autosizeInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollChatToBottom() {
  const body = $('#chat-body');
  if (body) body.scrollTop = body.scrollHeight;
}

async function sendOpeningMessage() {
  // Auto-send a structured opener so Fox immediately presents 3 picks
  const opener = `Show me my three ${CAT_LABELS[ST.currentCategory] || ST.currentCategory} picks for the ${ST.currentRoom}.`;
  await sendUserMessage(opener);
}

async function onChatSend() {
  const input = $('#chat-input');
  if (!input) return;
  const text = (input.value || '').trim();
  if (!text) return;
  input.value = '';
  autosizeInput(input);
  await sendUserMessage(text);
}

// Fetch matching products from the real catalog API for Fox's context
async function fetchCatalogForChat(category, style, fingerprint) {
  try {
    const res = await fetch('/.netlify/functions/product-catalog', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category, style, fingerprint, limit: 12 }),
    });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data.products?.length) return null;
    // Format for Fox's catalog context — include Fox Notes and Pairings (the design opinion)
    return data.products.map(p => ({
      name: p.name,
      vendor: p.vendor,
      tier: p.tier,
      priceRange: p.priceRange,
      notes: p.notes,
      foxNotes: p.foxNotes,
      pairings: p.pairings,
      tasteMatch: p.tasteMatchScore,
      imageUrl: p.imageUrl,
    }));
  } catch (e) {
    console.warn('Catalog fetch failed:', e);
    return null;
  }
}

async function sendUserMessage(content) {
  const thread = chatThread();
  thread.push({ role: 'user', content });
  ST.awaitingFox = true;
  render();
  scheduleSave();

  try {
    // Build the messages array — strip our `picks` metadata from assistant turns
    const apiMessages = thread.map(m => ({
      role:    m.role,
      content: m.content,
    }));

    // Fetch real products from catalog if we have a category
    const catMap = {
      flooring: 'Flooring', tile: 'Floor Tile', backsplash: 'Backsplash Tile',
      countertops: 'Countertops', cabinetry: 'Cabinetry', hardware: 'Cabinet Hardware',
      plumbing: 'Plumbing Fixtures', lighting: 'Lighting', paint: 'Paint',
      vanity: 'Vanities', mirror: 'Mirrors',
    };
    const notionCategory = catMap[ST.currentCategory] || null;
    let realCatalog = null;
    if (notionCategory && thread.length <= 2) {
      // Only fetch on first message in a category thread to avoid repeated API calls
      realCatalog = await fetchCatalogForChat(notionCategory, ST.style, ST.styleFingerprint);
    }

    const context = {
      clientName:   CLIENT_NAME,
      style:        ST.style,
      room:         ST.currentRoom,
      roomId:       ST.currentRoomId,
      category:     ST.currentCategory,
      budgetTier:   ST.budgetTiers[ST.currentRoomId] || '',
      boardPick:    ST.boardPicks[ST.currentRoomId] || '',
      answersSoFar: collectLockedPicksContext(),
      catalog:          realCatalog,
      fingerprint:      ST.styleFingerprint || null,
      designGuardrails: ST.designGuardrails || [],
      designConcept:    ST.designConcept || '',
    };

    const res = await fetch('/.netlify/functions/design-agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'chat', context, messages: apiMessages }),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(`design-agent ${res.status}: ${err}`);
    }
    const data = await res.json();
    thread.push({
      role: 'assistant',
      content: data.reply || '',
      picks: data.picks || null,
    });
  } catch (err) {
    console.error(err);
    thread.push({
      role: 'assistant',
      content: `Sorry — I hit a snag reaching the server. Try sending that again, or refresh the page.\n\n*${err.message || err}*`,
    });
  } finally {
    ST.awaitingFox = false;
    scheduleSave();
    render();
  }
}

// Build a flat dictionary of locked picks across the project so Fox stays
// consistent with prior decisions.
function collectLockedPicksContext() {
  const out = {};
  Object.keys(ST.picks).forEach(k => {
    const [roomId, cat] = k.split('::');
    const room = (ST.rms.find(r => r.id === roomId) || {}).name || roomId;
    const pk = ST.picks[k];
    out[`${room} ${CAT_LABELS[cat] || cat}`] = `${pk.tier || ''} ${pk.name || ''}`.trim();
  });
  return out;
}

// ─────────────────────────────────────────────────────────
//  Picks
// ─────────────────────────────────────────────────────────

function lockInPick(pickJsonString) {
  let pk;
  try { pk = JSON.parse(pickJsonString); }
  catch (e) { console.warn('bad pick payload', e); return; }

  const k = cellKey(ST.currentRoomId, ST.currentCategory);
  ST.picks[k] = {
    tier:       pk.tier || '',
    name:       pk.name || '',
    priceRange: pk.priceRange || '',
    why:        pk.why || '',
    myPick:     !!pk.myPick,
    pickedAt:   new Date().toISOString(),
  };
  ST.sav[`_v2_${k}`] = true;

  // Mirror into v1-compatible product fields where it matters for the design book
  mirrorPickToV1Fields(ST.currentRoomId, ST.currentCategory, ST.picks[k]);

  // Append a confirmation user-message to the thread so Fox knows the choice
  const thread = chatThread();
  thread.push({
    role: 'user',
    content: `I'll go with the ${pk.tier || ''} option — ${pk.name}.`,
  });
  // Also append a closing assistant note (no API call) so the conversation feels finished
  thread.push({
    role: 'assistant',
    content: `Great pick. **${pk.name}** is locked in for the ${ST.currentRoom} ${(CAT_LABELS[ST.currentCategory] || ST.currentCategory).toLowerCase()}. Hit "← All rooms" when you're ready for the next decision.`,
  });

  scheduleSave();
  showToast('Pick saved');
  render();
}

function changePick() {
  const k = cellKey(ST.currentRoomId, ST.currentCategory);
  delete ST.picks[k];
  delete ST.sav[`_v2_${k}`];
  scheduleSave();
  render();
}

// Best-effort mapping from (room, category, pick) to v1's design-book field
// keys. Anything unmapped still lives under _v2_picks so the v2 page itself
// always has the data.
function mirrorPickToV1Fields(roomId, cat, pick) {
  const product = pick.name || '';
  const rk = roomId; // already snake_case
  const ans = ST.ans;

  if (cat === 'countertops' && roomId === 'kitchen') {
    ans['countertops_ct_product'] = product;
    ans['countertops_ct_kit']     = product;
  } else if (cat === 'countertops') {
    ans[`ct_bath_${rk}_mat`]     = product;
    ans[`ct_bath_product_${rk}`] = product;
  } else if (cat === 'flooring') {
    ans[`flooring_floor_${rk}`]   = product;
    ans[`flooring_product_${rk}`] = product;
  } else if (cat === 'tile') {
    ans[`tile_floor_${rk}`]         = product;
    ans[`tile_floor_product_${rk}`] = product;
  } else if (cat === 'lighting') {
    ans[`lighting_${rk}_pendant_product`] = product;
  } else if (cat === 'plumbing' && roomId === 'kitchen') {
    ans[`plumbing_${rk}_kitchen_sink_product`] = product;
  } else if (cat === 'plumbing') {
    ans[`plumbing_${rk}_shower_product`] = product;
  } else if (cat === 'hardware') {
    ans['hardware_hw_product'] = product;
    ans['hardware_hw_finish']  = product;
  } else if (cat === 'paint') {
    ans[`paint_${rk}_color`]   = product;
    ans[`paint_${rk}_product`] = product;
  } else if (cat === 'appliances') {
    ans['app_range_product'] = product;
  } else if (cat === 'fireplace') {
    ans['fireplace_fp_want']    = 'Yes';
    ans['fireplace_fp_product'] = product;
  } else if (cat === 'specialty_trim') {
    ans['specialty_trim_beams_loc'] = product;
  }
}

// ─────────────────────────────────────────────────────────
//  Boot
// ─────────────────────────────────────────────────────────

async function boot() {
  render(); // loading screen

  // 1) Load saved data
  await loadAll();

  // 2) Load quiz catalog (with photos)
  try {
    const res = await fetch('/.netlify/functions/style-catalog?withPhotos=1');
    if (!res.ok) throw new Error(`style-catalog ${res.status}`);
    const cat = await res.json();
    ST.catalog = cat;
    ST.quiz    = Array.isArray(cat.quiz) ? cat.quiz : [];
    if (ST.style && cat.styles && cat.styles[ST.style]) {
      ST.styleProfile = cat.styles[ST.style];
    }
    ST.swipeImages = Array.isArray(cat.swipeImages) ? cat.swipeImages : [];
  } catch (err) {
    ST.phase = 'error';
    ST.errorMessage = 'Could not load style catalog: ' + err.message;
    render();
    return;
  }

  // 3) Hydrate V2 catalog data
  if (ST.catalog) {
    ST.comparisonPairs = Array.isArray(ST.catalog.comparisonPairs) ? ST.catalog.comparisonPairs : [];
    ST.neverWantSets = Array.isArray(ST.catalog.neverWantSets) ? ST.catalog.neverWantSets : [];
  }

  // 4) Decide which phase to start in based on what's saved.
  //    V2 flow: identity → comparisons → lifestyle → guardrails → analyzing → reveal → budget → package → home → chat
  //    Legacy flow: quiz → tasteboard → lifestyle → analyzing → reveal → budget → package → home → chat
  //    On reload we drop the user at the furthest completed step.

  // Check if client is on V2 flow (has any V2 data)
  const isV2 = ST.identityProfile || ST.styleFingerprint || (ST.comparisonResults && Object.keys(ST.comparisonResults).length > 0);

  if (ST.style && ST.styleGreeting) {
    // Post-analysis — same for V1 and V2
    if (ST.designPackage) {
      ST.phase = 'package';
    } else if (ST.budgetTiers && Object.keys(ST.budgetTiers).length) {
      completeBudget();
      return;
    } else {
      ST.phase = 'reveal';
    }
  } else if (isV2) {
    // V2 taste engine flow — resume at furthest incomplete step
    if (ST.styleFingerprint && ST.lifestyle && ST.guardrails) {
      // All data collected, fingerprint computed — run analysis
      ST.phase = 'analyzing';
      render();
      analyzeProfile();
      return;
    } else if (ST.lifestyle && ST.comparisonResults && Object.keys(ST.comparisonResults).length > 0) {
      // Has lifestyle + comparisons — go to guardrails
      ST.phase = 'guardrails';
    } else if (ST.comparisonResults && Object.keys(ST.comparisonResults).length > 0) {
      // Has some comparisons — resume at lifestyle or comparisons
      const totalSteps = (ST.comparisonPairs?.length || 0) + (ST.neverWantSets?.length || 0);
      const doneCount = Object.keys(ST.comparisonResults).length;
      if (doneCount >= totalSteps) {
        ST.phase = 'lifestyle';
      } else {
        ST.phase = 'comparisons';
        ST.compIdx = doneCount;
      }
    } else if (ST.identityProfile) {
      // Has identity — go to comparisons
      ST.phase = 'comparisons';
      ST.compIdx = 0;
    } else {
      ST.phase = 'identity';
    }
  } else if (ST.lifestyle && ST.tasteProfile) {
    // Legacy V1 flow — ready to analyze
    completeLifestyleLegacy ? completeLifestyleLegacy() : completeLifestyle();
    return;
  } else if (ST.tasteProfile || Object.keys(ST.swipeResults).length > 0) {
    if (ST.swipeImages.length && Object.keys(ST.swipeResults).length >= ST.swipeImages.length) {
      ST.phase = 'lifestyle';
    } else {
      ST.phase = 'tasteboard';
      ST.swipeIndex = Object.keys(ST.swipeResults).length;
    }
  } else {
    // Fresh client — start V2 flow
    ST.phase = 'identity';
  }
  render();
}

boot();
</script>
