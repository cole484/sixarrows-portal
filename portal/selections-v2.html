<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fox — David Adler Group</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<script src="data.js"></script>
<style>
/* ─────────────────────────────────────────────────────────
   Selections v2 — Fox
   Standalone full-screen interface (no portal sidebar).
   Uses portal CSS tokens for color consistency.
───────────────────────────────────────────────────────── */
body { background: var(--cream); padding: 0; }

.fox-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ─────────────────────────────────── */
.fox-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 22px;
  background: var(--charcoal);
  color: var(--cream);
  border-bottom: 0.5px solid rgba(255,255,255,.06);
  flex-shrink: 0;
}
.fox-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.fox-brand-mark {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: var(--cream);
  letter-spacing: .02em;
}
.fox-brand-text { line-height: 1.2; }
.fox-brand-name { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
.fox-brand-sub  { font-size: 10px; color: rgba(235,233,222,.55); text-transform: uppercase; letter-spacing: .12em; }

.fox-back {
  font-size: 12px;
  color: rgba(235,233,222,.6);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 16px;
  transition: background .15s, color .15s;
}
.fox-back:hover { color: var(--cream); background: rgba(255,255,255,.06); }

/* ── Main canvas ─────────────────────────────── */
.fox-main {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 32px 22px 80px;
}
.fox-stage {
  width: 100%;
  max-width: 880px;
}

@media (max-width: 700px) {
  .fox-top { padding: 12px 16px; }
  .fox-main { padding: 22px 14px 60px; }
}

/* ── Phase: loading ──────────────────────────── */
.fox-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  color: var(--charcoal-3);
  gap: 14px;
}
.fox-spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--cream-2);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Phase: quiz ─────────────────────────────── */
.quiz-card {
  background: var(--white);
  border-radius: var(--r-xl);
  padding: 28px 32px 24px;
  box-shadow: var(--sh-md);
  border: 0.5px solid var(--border);
}
.quiz-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  font-weight: 600;
  color: var(--green);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.quiz-progress-bar {
  flex: 1;
  height: 4px;
  background: var(--cream-2);
  border-radius: 2px;
  overflow: hidden;
}
.quiz-progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: 2px;
  transition: width .35s ease;
}
.quiz-prompt {
  font-size: 22px;
  font-weight: 700;
  color: var(--charcoal);
  line-height: 1.3;
  margin: 4px 0 4px;
  letter-spacing: -0.01em;
}
.quiz-note {
  font-size: 13px;
  color: var(--charcoal-3);
  margin-bottom: 22px;
}
.quiz-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 600px) {
  .quiz-options { grid-template-columns: 1fr; }
  .quiz-card { padding: 22px 20px; }
  .quiz-prompt { font-size: 18px; }
}
.quiz-option {
  display: flex;
  flex-direction: column;
  background: var(--cream-pale);
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  cursor: pointer;
  overflow: hidden;
  transition: all .16s;
  text-align: left;
  padding: 0;
  font: inherit;
  color: inherit;
}
.quiz-option:hover {
  border-color: var(--green);
  transform: translateY(-1px);
  box-shadow: var(--sh-md);
}
.quiz-option.selected {
  border-color: var(--green);
  background: var(--green-pale);
  box-shadow: 0 0 0 3px rgba(117,127,105,.15);
}
.quiz-option-img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  background: var(--cream-2);
  display: block;
}
.quiz-option-img-fallback {
  width: 100%;
  aspect-ratio: 4/3;
  background: linear-gradient(135deg, var(--cream-2) 0%, var(--cream-3) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--charcoal-4);
  font-size: 32px;
  font-weight: 700;
  letter-spacing: .04em;
}
.quiz-option-body {
  padding: 12px 14px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.quiz-option-letter {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--cream-2);
  color: var(--charcoal-2);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.quiz-option.selected .quiz-option-letter {
  background: var(--green);
  color: var(--cream);
}
.quiz-option-label {
  font-size: 13px;
  line-height: 1.4;
  color: var(--charcoal-2);
  font-weight: 500;
}
.quiz-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}
.quiz-back {
  background: none;
  border: none;
  font: inherit;
  color: var(--charcoal-3);
  cursor: pointer;
  font-size: 13px;
  padding: 8px 4px;
}
.quiz-back:hover { color: var(--charcoal); }
.quiz-back:disabled { opacity: .35; cursor: default; }
.quiz-next {
  background: var(--charcoal);
  color: var(--cream);
  border: none;
  border-radius: 999px;
  padding: 10px 22px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.quiz-next:hover { background: var(--green-deep); }
.quiz-next:disabled { background: var(--cream-3); color: var(--charcoal-4); cursor: default; }

/* ── Phase: analyzing ────────────────────────── */
.fox-analyzing {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 50vh;
  text-align: center;
}
.fox-analyzing h2 {
  font-size: 18px;
  font-weight: 600;
  color: var(--charcoal);
  margin-top: 18px;
  letter-spacing: -0.01em;
}
.fox-analyzing p {
  font-size: 13px;
  color: var(--charcoal-3);
  margin-top: 6px;
}

/* ── Phase: reveal ───────────────────────────── */
.reveal-card {
  background: var(--white);
  border-radius: var(--r-xl);
  padding: 36px 36px 30px;
  box-shadow: var(--sh-lg);
  border: 0.5px solid var(--border);
}
.reveal-eyebrow {
  font-size: 11px;
  font-weight: 700;
  color: var(--green);
  letter-spacing: .14em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.reveal-style {
  font-size: 36px;
  font-weight: 700;
  color: var(--charcoal);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.reveal-tagline {
  font-size: 15px;
  color: var(--charcoal-3);
  font-style: italic;
  margin-bottom: 22px;
}
.reveal-palette {
  display: flex;
  gap: 8px;
  margin-bottom: 26px;
}
.reveal-swatch {
  flex: 1;
  height: 56px;
  border-radius: var(--r-md);
  border: 0.5px solid var(--border);
}
.reveal-greeting {
  background: var(--green-pale);
  border-left: 3px solid var(--green);
  padding: 18px 20px;
  border-radius: var(--r-md);
  font-size: 15px;
  line-height: 1.65;
  color: var(--charcoal-2);
  margin-bottom: 24px;
  white-space: pre-wrap;
}
.reveal-keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 28px;
}
.reveal-keyword {
  font-size: 11px;
  font-weight: 600;
  background: var(--cream);
  color: var(--charcoal-2);
  padding: 4px 11px;
  border-radius: 999px;
  letter-spacing: .02em;
}
.reveal-cta {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.btn-primary {
  background: var(--green);
  color: var(--white);
  border: none;
  border-radius: 999px;
  padding: 13px 28px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.btn-primary:hover { background: var(--green-dk); }
.btn-secondary {
  background: transparent;
  color: var(--charcoal-3);
  border: 1px solid var(--border-2);
  border-radius: 999px;
  padding: 12px 22px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.btn-secondary:hover { background: var(--cream-pale); color: var(--charcoal); }

/* V2 reveal extras */
.reveal-animate {
  animation: revealFadeIn .6s ease-out;
}
@keyframes revealFadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.reveal-concept {
  font-size: 16px; line-height: 1.65; color: var(--charcoal);
  margin-bottom: 24px; font-style: italic;
  border-left: 3px solid var(--gold); padding-left: 16px;
}
.reveal-section-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .12em; color: var(--charcoal-3); margin-bottom: 10px;
}
.reveal-guardrails { margin-bottom: 22px; }
.reveal-guardrail-item {
  font-size: 13px; color: var(--charcoal-2); line-height: 1.5;
  padding: 8px 0; border-bottom: 1px solid var(--cream-2);
  padding-left: 16px; position: relative;
}
.reveal-guardrail-item::before {
  content: '—'; position: absolute; left: 0; color: var(--green);
}
.reveal-guardrail-item:last-child { border-bottom: none; }
.reveal-notes { margin-bottom: 22px; }
.reveal-note-item {
  font-size: 13px; color: var(--charcoal-3); line-height: 1.5;
  padding: 6px 0; font-style: italic;
}

/* Material directions preview */
.reveal-materials { margin-bottom: 24px; }
.reveal-material-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.reveal-material-item {
  display: flex; flex-direction: column; gap: 2px;
  padding: 10px 12px; background: var(--cream-pale, #faf9f6);
  border-radius: 8px; border: 1px solid var(--cream-2);
}
.reveal-material-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; color: var(--charcoal-3);
}
.reveal-material-val {
  font-size: 13px; color: var(--charcoal); line-height: 1.4;
}

@media (max-width: 600px) {
  .reveal-material-grid { grid-template-columns: 1fr; }
}

/* Calibration dashboard (internal debug) */
.cal-dashboard {
  margin-top: 32px; border-top: 2px dashed var(--cream-2); padding-top: 16px;
}
.cal-toggle {
  font-size: 12px; font-weight: 700; color: var(--charcoal-3);
  text-transform: uppercase; letter-spacing: .1em; cursor: pointer;
  list-style: none; user-select: none;
}
.cal-toggle::-webkit-details-marker { display: none; }
.cal-toggle::before { content: '+ '; }
details[open] > .cal-toggle::before { content: '- '; }
.cal-body { margin-top: 16px; }
.cal-section { margin-bottom: 20px; }
.cal-section-title {
  font-size: 12px; font-weight: 700; color: var(--charcoal);
  margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em;
}
.cal-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.cal-table th {
  text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--cream-2);
  font-weight: 600; color: var(--charcoal-3); font-size: 10px;
  text-transform: uppercase; letter-spacing: .06em;
}
.cal-table td { padding: 4px 8px; border-bottom: 1px solid var(--cream-2); }
.cal-dim-name { font-weight: 500; white-space: nowrap; width: 140px; }
.cal-dim-bar { width: 40%; }
.cal-bar-track {
  height: 8px; background: var(--cream-2); border-radius: 4px; overflow: hidden;
}
.cal-bar-fill { height: 100%; background: var(--green); border-radius: 4px; }
.cal-dim-score { font-weight: 600; text-align: right; width: 40px; }
.cal-dim-conf { text-align: right; width: 60px; }
.cal-dim-conf.high { color: var(--green-deep); }
.cal-dim-conf.med { color: var(--gold); }
.cal-dim-conf.low { color: var(--charcoal-3); }
.cal-dim-conf.conflict { color: var(--danger); font-weight: 700; }
.cal-conflict {
  font-size: 12px; color: var(--danger); padding: 4px 0;
  border-bottom: 1px solid var(--cream-2);
}
.cal-none { font-size: 12px; color: var(--charcoal-3); font-style: italic; }
.cal-json {
  font-size: 10px; background: var(--cream); padding: 12px;
  border-radius: 8px; overflow-x: auto; max-height: 300px;
  overflow-y: auto; white-space: pre; line-height: 1.4;
}

@media (max-width: 600px) {
  .reveal-card { padding: 26px 22px; }
  .reveal-style { font-size: 28px; }
  .cal-dim-name { width: 100px; font-size: 11px; }
}

/* ── Phase: budget calibration ────────────────── */
/* Sits between reveal and home. User picks one tier per room. */
.budget-shell { display: block; }
.budget-hd {
  margin-bottom: 20px;
}
.budget-eyebrow {
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--charcoal-4);
  margin-bottom: 6px;
}
.budget-title {
  font-family: var(--font-serif, Georgia, serif);
  font-size: 30px;
  line-height: 1.15;
  color: var(--charcoal);
  margin-bottom: 10px;
}
.budget-sub {
  font-size: 14px;
  line-height: 1.55;
  color: var(--charcoal-3);
  max-width: 640px;
}
.budget-room {
  background: var(--white);
  border: 1px solid var(--border-2);
  border-radius: 20px;
  padding: 18px 18px 20px;
  margin-bottom: 16px;
}
.budget-room-hd {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.budget-room-name {
  font-family: var(--font-serif, Georgia, serif);
  font-size: 22px;
  color: var(--charcoal);
}
.budget-room-hint {
  font-size: 12px;
  color: var(--charcoal-4);
}
.budget-tier-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.budget-tier {
  display: flex;
  flex-direction: column;
  text-align: left;
  background: var(--cream-pale);
  border: 1.5px solid var(--border-2);
  border-radius: 14px;
  padding: 0;
  cursor: pointer;
  transition: all .15s;
  overflow: hidden;
  font: inherit;
  color: inherit;
}
.budget-tier:hover {
  border-color: var(--green);
  transform: translateY(-1px);
}
.budget-tier.selected {
  border-color: var(--green);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(92,124,94,.15);
}
.budget-tier-img {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: var(--cream-3);
  background-size: cover;
  background-position: center;
  display: block;
}
.budget-tier-img-fallback {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: linear-gradient(135deg, var(--cream-2) 0%, var(--cream-3) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--charcoal-4);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.budget-tier-body {
  padding: 12px 14px 14px;
}
.budget-tier-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--charcoal);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.budget-tier-check {
  display: inline-flex;
  width: 16px;
  height: 16px;
  align-items: center;
  justify-content: center;
  background: var(--green);
  color: var(--white);
  border-radius: 50%;
  font-size: 10px;
  font-weight: 700;
}
.budget-tier-desc {
  font-size: 12px;
  line-height: 1.45;
  color: var(--charcoal-3);
}
.budget-footer {
  position: sticky;
  bottom: 0;
  background: linear-gradient(to top, var(--cream) 70%, rgba(247,243,234,0));
  padding: 18px 0 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-top: 8px;
}
.budget-footer-status {
  font-size: 13px;
  color: var(--charcoal-3);
}
.budget-footer-status strong { color: var(--charcoal); font-weight: 600; }

@media (max-width: 600px) {
  .budget-title { font-size: 24px; }
  .budget-tier-grid { grid-template-columns: 1fr; }
  .budget-tier { flex-direction: row; }
  .budget-tier-img, .budget-tier-img-fallback { width: 120px; aspect-ratio: 1 / 1; flex-shrink: 0; }
  .budget-tier-body { flex: 1; padding: 12px 14px; }
}

/* ── Phase: taste board (swipe) ─────────────── */
.tasteboard-shell {
  display: flex; flex-direction: column; align-items: center;
  min-height: 60vh;
}
.tasteboard-hd { text-align: center; margin-bottom: 20px; }
.tasteboard-eyebrow {
  font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
  color: var(--charcoal-3); margin-bottom: 6px;
}
.tasteboard-title {
  font-size: 22px; font-weight: 700; color: var(--charcoal);
  margin-bottom: 6px;
}
.tasteboard-sub {
  font-size: 14px; color: var(--charcoal-3); max-width: 420px;
  margin: 0 auto; line-height: 1.5;
}

.tasteboard-card-wrap {
  position: relative; width: 100%; max-width: 400px;
  margin: 0 auto; perspective: 800px;
}
.tasteboard-card {
  border-radius: 14px; overflow: hidden; background: #fff;
  box-shadow: 0 4px 20px rgba(0,0,0,.1);
  transition: transform 0.35s ease, opacity 0.35s ease;
  will-change: transform;
}
.tasteboard-card.swiping-left {
  transform: translateX(-120%) rotate(-8deg); opacity: 0;
}
.tasteboard-card.swiping-right {
  transform: translateX(120%) rotate(8deg); opacity: 0;
}
.tasteboard-card-img {
  width: 100%; aspect-ratio: 4 / 3; object-fit: cover;
  display: block; background: var(--cream-2);
}
.tasteboard-card-label {
  padding: 12px 16px; font-size: 13px; color: var(--charcoal-3);
  line-height: 1.4; border-top: 1px solid var(--cream-2);
}

.tasteboard-actions {
  display: flex; gap: 16px; margin-top: 20px; justify-content: center;
}
.tasteboard-btn {
  width: 64px; height: 64px; border-radius: 50%;
  border: 2px solid var(--cream-2); background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; cursor: pointer;
  transition: transform .15s, border-color .15s, box-shadow .15s;
}
.tasteboard-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 12px rgba(0,0,0,.1);
}
.tasteboard-btn-skip { color: var(--charcoal-3); }
.tasteboard-btn-skip:hover { border-color: #e74c3c; color: #e74c3c; }
.tasteboard-btn-love { color: var(--green); }
.tasteboard-btn-love:hover { border-color: var(--green); }

.tasteboard-progress {
  margin-top: 20px; text-align: center;
  font-size: 12px; color: var(--charcoal-3);
}
.tasteboard-progress-bar {
  width: 200px; height: 3px; background: var(--cream-2);
  border-radius: 2px; margin: 8px auto 0; overflow: hidden;
}
.tasteboard-progress-fill {
  height: 100%; background: var(--green);
  transition: width .3s ease;
}

.tasteboard-skip-all {
  margin-top: 16px; font-size: 12px; color: var(--charcoal-3);
  text-decoration: underline; cursor: pointer; border: none;
  background: none; padding: 4px;
}

@media (max-width: 600px) {
  .tasteboard-card-wrap { max-width: 100%; }
  .tasteboard-btn { width: 56px; height: 56px; font-size: 20px; }
}

/* ── Phase: lifestyle ───────────────────────── */
.lifestyle-shell { max-width: 600px; margin: 0 auto; }
.lifestyle-hd { text-align: center; margin-bottom: 28px; }
.lifestyle-eyebrow {
  font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
  color: var(--charcoal-3); margin-bottom: 6px;
}
.lifestyle-title {
  font-size: 22px; font-weight: 700; color: var(--charcoal);
  margin-bottom: 6px;
}
.lifestyle-sub {
  font-size: 14px; color: var(--charcoal-3); line-height: 1.5;
}

.lifestyle-section { margin-bottom: 28px; }
.lifestyle-q {
  font-size: 15px; font-weight: 600; color: var(--charcoal);
  margin-bottom: 12px;
}
.lifestyle-options { display: flex; flex-wrap: wrap; gap: 10px; }
.lifestyle-opt {
  flex: 1; min-width: 140px; padding: 14px 16px;
  border: 2px solid var(--cream-2); border-radius: 10px;
  background: #fff; cursor: pointer; text-align: center;
  transition: border-color .15s, background .15s;
  font-size: 14px; color: var(--charcoal);
}
.lifestyle-opt:hover { border-color: var(--green); }
.lifestyle-opt.selected {
  border-color: var(--green); background: rgba(66,108,74,.06);
  font-weight: 600;
}

.lifestyle-rank-list { display: flex; flex-direction: column; gap: 8px; }
.lifestyle-rank-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border: 2px solid var(--cream-2);
  border-radius: 10px; background: #fff; cursor: grab;
  transition: border-color .15s, box-shadow .15s;
  user-select: none;
}
.lifestyle-rank-item:active { cursor: grabbing; }
.lifestyle-rank-item.dragging {
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
  border-color: var(--green);
}
.lifestyle-rank-num {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; flex-shrink: 0;
}
.lifestyle-rank-num.top { background: rgba(201,165,102,.15); color: #8a6d2b; }
.lifestyle-rank-num.mid { background: rgba(66,108,74,.1); color: var(--green-deep); }
.lifestyle-rank-num.low { background: var(--cream-2); color: var(--charcoal-3); }
.lifestyle-rank-name { font-size: 14px; color: var(--charcoal); flex: 1; }
.lifestyle-rank-grip {
  color: var(--charcoal-3); font-size: 16px; flex-shrink: 0; opacity: .4;
}
.lifestyle-rank-tier {
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  padding: 2px 8px; border-radius: 8px; font-weight: 600;
}
.lifestyle-rank-tier.showpiece { background: rgba(201,165,102,.15); color: #8a6d2b; }
.lifestyle-rank-tier.elevated { background: rgba(66,108,74,.1); color: var(--green-deep); }
.lifestyle-rank-tier.essential { background: var(--cream-2); color: var(--charcoal-3); }

.lifestyle-note {
  font-size: 12px; color: var(--charcoal-3); text-align: center;
  margin-top: 8px; line-height: 1.4;
}

.lifestyle-footer {
  display: flex; justify-content: center; padding-top: 20px;
  border-top: 1px solid var(--cream-2); margin-top: 12px;
}

/* ── Phase: identity ───────────────────────────── */
.identity-shell { max-width: 600px; margin: 0 auto; }
.identity-hd { text-align: center; margin-bottom: 28px; }
.identity-section { margin-bottom: 32px; }
.identity-section h3 {
  font-size: 15px; font-weight: 600; color: var(--charcoal);
  margin-bottom: 14px;
}
.identity-section p {
  font-size: 13px; color: var(--charcoal-3); margin-bottom: 14px; line-height: 1.4;
}
.identity-word-grid {
  display: flex; flex-wrap: wrap; gap: 10px;
}
.identity-chip {
  padding: 10px 18px; border: 2px solid var(--cream-2); border-radius: 20px;
  background: #fff; cursor: pointer; font-size: 14px; color: var(--charcoal);
  transition: border-color .15s, background .15s;
  user-select: none;
}
.identity-chip:hover { border-color: var(--green); }
.identity-chip.selected {
  border-color: var(--green); background: rgba(66,108,74,.08);
  font-weight: 600;
}
.identity-chip.neg.selected {
  border-color: var(--danger); background: rgba(200,60,60,.06);
}

.identity-luxury-grid {
  display: flex; gap: 12px; flex-wrap: wrap;
}
.identity-luxury-card {
  flex: 1; min-width: 150px; padding: 18px 16px;
  border: 2px solid var(--cream-2); border-radius: 12px;
  background: #fff; cursor: pointer; text-align: center;
  transition: border-color .15s, background .15s;
}
.identity-luxury-card:hover { border-color: var(--green); }
.identity-luxury-card.selected {
  border-color: var(--green); background: rgba(66,108,74,.06);
}
.identity-luxury-label {
  font-size: 15px; font-weight: 600; color: var(--charcoal); margin-bottom: 4px;
}
.identity-luxury-desc {
  font-size: 12px; color: var(--charcoal-3); line-height: 1.4;
}

.identity-footer {
  display: flex; justify-content: center; padding-top: 20px;
  border-top: 1px solid var(--cream-2); margin-top: 12px;
}

/* ── Phase: comparisons ────────────────────────── */
.comparison-shell { max-width: 600px; margin: 0 auto; }
.comparison-hd { text-align: center; margin-bottom: 20px; }
.comparison-progress {
  display: flex; gap: 4px; margin-bottom: 24px; padding: 0 20px;
}
.comparison-progress-dot {
  flex: 1; height: 4px; border-radius: 2px;
  background: var(--cream-2); transition: background .2s;
}
.comparison-progress-dot.done { background: var(--green); }
.comparison-progress-dot.current { background: var(--gold); }

.comparison-prompt {
  font-size: 17px; font-weight: 600; color: var(--charcoal);
  text-align: center; margin-bottom: 20px; line-height: 1.3;
}
.comparison-sub {
  font-size: 13px; color: var(--charcoal-3); text-align: center;
  margin-bottom: 20px; line-height: 1.4;
}

.comparison-pair {
  display: flex; gap: 16px; justify-content: center; margin-bottom: 20px;
}
.comparison-option {
  flex: 1; max-width: 260px; cursor: pointer;
  border: 3px solid transparent; border-radius: 14px;
  overflow: hidden; transition: border-color .2s, transform .15s;
  background: #fff;
}
.comparison-option:hover { border-color: var(--green); transform: scale(1.02); }
.comparison-option.picked { border-color: var(--green); }

.comparison-img-wrap {
  width: 100%; aspect-ratio: 4/3; overflow: hidden;
  background: var(--cream-2); position: relative;
}
.comparison-img {
  width: 100%; height: 100%; object-fit: cover;
  display: block;
}
.comparison-img-fallback {
  position: absolute; inset: 0; display: none;
  align-items: center; justify-content: center;
  font-size: 13px; color: var(--charcoal-3); padding: 12px;
  text-align: center; line-height: 1.4;
}
.comparison-img-fallback.show { display: flex; }
.comparison-label {
  padding: 12px; text-align: center;
  font-size: 14px; font-weight: 600; color: var(--charcoal);
}

/* never-want grid (2x2) */
.neverwant-prompt {
  font-size: 17px; font-weight: 600; color: var(--charcoal);
  text-align: center; margin-bottom: 8px;
}
.neverwant-sub {
  font-size: 13px; color: var(--charcoal-3); text-align: center;
  margin-bottom: 20px;
}
.neverwant-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  max-width: 540px; margin: 0 auto 20px;
}
.neverwant-option {
  cursor: pointer; border: 3px solid transparent; border-radius: 14px;
  overflow: hidden; transition: border-color .2s;
  background: #fff; position: relative;
}
.neverwant-option:hover { border-color: var(--danger); }
.neverwant-option.rejected { border-color: var(--danger); opacity: .7; }
.neverwant-x {
  position: absolute; top: 8px; right: 8px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--danger); color: #fff;
  display: none; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700;
}
.neverwant-option.rejected .neverwant-x { display: flex; }
.neverwant-img {
  width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block;
}
.neverwant-label {
  padding: 10px; text-align: center;
  font-size: 13px; color: var(--charcoal); font-weight: 500;
}

/* affinity check */
.affinity-shell { text-align: center; padding: 20px 0; }
.affinity-prompt {
  font-size: 16px; font-weight: 600; color: var(--charcoal);
  margin-bottom: 16px;
}
.affinity-options {
  display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
}
.affinity-btn {
  padding: 12px 24px; border: 2px solid var(--cream-2); border-radius: 10px;
  background: #fff; cursor: pointer; font-size: 14px; color: var(--charcoal);
  transition: border-color .15s, background .15s;
}
.affinity-btn:hover { border-color: var(--green); }

/* comparison back button */
.comparison-back {
  display: block; margin: 0 auto; padding: 8px 16px;
  background: none; border: none; cursor: pointer;
  font-size: 13px; color: var(--charcoal-3);
  text-decoration: underline;
}
.comparison-back:hover { color: var(--charcoal); }

@media (max-width: 600px) {
  .comparison-pair { gap: 10px; }
  .comparison-option { max-width: 48%; }
  .identity-luxury-card { min-width: 100%; }
  .neverwant-grid { gap: 10px; }
}

/* ── Phase: guardrails ─────────────────────────── */
.guardrails-shell { max-width: 600px; margin: 0 auto; }
.guardrails-hd { text-align: center; margin-bottom: 28px; }
.guardrails-section { margin-bottom: 28px; }
.guardrails-section h3 {
  font-size: 15px; font-weight: 600; color: var(--charcoal);
  margin-bottom: 12px;
}
.guardrails-section p {
  font-size: 13px; color: var(--charcoal-3); margin-bottom: 14px; line-height: 1.4;
}
.guardrail-list {
  display: flex; flex-direction: column; gap: 8px;
}
.guardrail-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border: 2px solid var(--cream-2); border-radius: 10px;
  background: #fff; cursor: pointer;
  transition: border-color .15s, background .15s;
  font-size: 14px; color: var(--charcoal); line-height: 1.4;
}
.guardrail-item:hover { border-color: var(--green); }
.guardrail-item.checked {
  border-color: var(--green); background: rgba(66,108,74,.06);
}
.guardrail-item .check-icon {
  width: 22px; height: 22px; border-radius: 6px;
  border: 2px solid var(--cream-2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: transparent; transition: all .15s;
}
.guardrail-item.checked .check-icon {
  border-color: var(--green); background: var(--green); color: #fff;
}
.guardrail-item.redflag.checked {
  border-color: var(--danger); background: rgba(200,60,60,.04);
}
.guardrail-item.redflag.checked .check-icon {
  border-color: var(--danger); background: var(--danger);
}

.guardrails-footer {
  display: flex; justify-content: center; padding-top: 20px;
  border-top: 1px solid var(--cream-2); margin-top: 12px;
}

/* ── Phase: boards (design board selection) ───── */
/* Client sees 3 design board options per room (one per tier) and picks the
   one closest to their vision. The board matching their budget tier is
   pre-highlighted with a "Recommended" badge. */
.boards-shell { display: block; }
.boards-hd { margin-bottom: 20px; }
.boards-eyebrow {
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--charcoal-4);
  margin-bottom: 6px;
}
.boards-title {
  font-family: var(--font-serif, Georgia, serif);
  font-size: 30px;
  line-height: 1.15;
  color: var(--charcoal);
  margin-bottom: 10px;
}
.boards-sub {
  font-size: 14px;
  line-height: 1.55;
  color: var(--charcoal-3);
  max-width: 640px;
}
.boards-room {
  background: var(--white);
  border: 1px solid var(--border-2);
  border-radius: 20px;
  padding: 18px 18px 20px;
  margin-bottom: 16px;
}
.boards-room-hd {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.boards-room-name {
  font-family: var(--font-serif, Georgia, serif);
  font-size: 22px;
  color: var(--charcoal);
}
.boards-room-hint {
  font-size: 12px;
  color: var(--charcoal-4);
}
.boards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.board-card {
  display: flex;
  flex-direction: column;
  background: var(--cream-pale);
  border: 1.5px solid var(--border-2);
  border-radius: 14px;
  padding: 0;
  cursor: pointer;
  transition: all .15s;
  overflow: hidden;
  font: inherit;
  color: inherit;
  text-align: left;
  position: relative;
}
.board-card:hover {
  border-color: var(--green);
  transform: translateY(-1px);
}
.board-card.selected {
  border-color: var(--green);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(92,124,94,.15);
}
.board-card-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: var(--green);
  color: var(--white);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 6px;
  z-index: 1;
}
.board-card-img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  display: block;
  background: var(--cream-3);
}
.board-card-img-fallback {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: linear-gradient(135deg, var(--cream-2) 0%, var(--cream-3) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--charcoal-4);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.board-card-body {
  padding: 12px 14px 14px;
}
.board-card-tier {
  font-weight: 600;
  font-size: 14px;
  color: var(--charcoal);
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.board-card-check {
  display: inline-flex;
  width: 16px;
  height: 16px;
  align-items: center;
  justify-content: center;
  background: var(--green);
  color: var(--white);
  border-radius: 50%;
  font-size: 10px;
  font-weight: 700;
}
.board-card-desc {
  font-size: 12px;
  line-height: 1.45;
  color: var(--charcoal-3);
}
.boards-footer {
  position: sticky;
  bottom: 0;
  background: linear-gradient(to top, var(--cream) 70%, rgba(247,243,234,0));
  padding: 18px 0 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-top: 8px;
}
.boards-footer-status {
  font-size: 13px;
  color: var(--charcoal-3);
}
.boards-footer-status strong { color: var(--charcoal); font-weight: 600; }

@media (max-width: 600px) {
  .boards-title { font-size: 24px; }
  .boards-grid { grid-template-columns: 1fr; }
  .board-card { flex-direction: row; }
  .board-card-img, .board-card-img-fallback { width: 140px; aspect-ratio: 1 / 1; flex-shrink: 0; }
  .board-card-body { flex: 1; padding: 12px 14px; }
}

/* ── Phase: package (auto-generated design review) ── */
.package-shell { display: block; }
.package-hd { text-align: center; margin-bottom: 32px; }
.package-eyebrow {
  font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
  color: var(--charcoal-3); margin-bottom: 8px;
}
.package-title {
  font-size: 24px; font-weight: 700; color: var(--charcoal);
  margin-bottom: 8px; line-height: 1.25;
}
.package-sub {
  font-size: 14px; color: var(--charcoal-3); max-width: 560px;
  margin: 0 auto; line-height: 1.55;
}

.package-room { margin-bottom: 36px; }
.package-room-hd {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 1px solid var(--cream-2);
}
.package-room-name { font-size: 18px; font-weight: 700; color: var(--charcoal); }
.package-room-tier {
  font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--green-deep); background: var(--green-pale, rgba(66,108,74,.08));
  padding: 4px 10px; border-radius: 12px; font-weight: 600;
}

.package-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.product-card {
  background: #fff; border-radius: 12px; overflow: hidden;
  border: 2px solid transparent;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  cursor: pointer; transition: border-color .15s, box-shadow .15s;
  display: flex; flex-direction: column;
}
.product-card:hover {
  border-color: var(--green);
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}
.product-card-img {
  width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
  background: var(--cream-2);
}
.product-card-img-fallback {
  width: 100%; aspect-ratio: 1 / 1;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--cream-2), var(--cream));
  color: var(--charcoal-3); font-size: 13px; font-weight: 600;
}
.product-card-body { padding: 12px 14px; flex: 1; }
.product-card-cat {
  font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--charcoal-3); margin-bottom: 4px;
}
.product-card-name {
  font-size: 14px; font-weight: 600; color: var(--charcoal);
  line-height: 1.3; margin-bottom: 6px;
}
.product-card-tier-badge {
  display: inline-block; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
  padding: 2px 8px; border-radius: 8px; margin-bottom: 6px;
}
.tier-essential  { background: #e8f0e8; color: #3a6b3a; }
.tier-elevated   { background: #e8ecf4; color: #3a4f7a; }
.tier-showpiece  { background: #f4ece4; color: #7a5a3a; }
.product-card-note {
  font-size: 12px; color: var(--charcoal-3); line-height: 1.45;
}

/* Swap panel (expanded under card) */
.swap-panel {
  border-top: 1px solid var(--cream-2);
  padding: 12px 14px;
  background: var(--cream);
}
.swap-panel-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--charcoal-3); margin-bottom: 10px; font-weight: 600;
}
.swap-options { display: flex; flex-direction: column; gap: 8px; }
.swap-option {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--cream-2);
  background: #fff; cursor: pointer; transition: border-color .15s;
}
.swap-option:hover { border-color: var(--green); }
.swap-option-img {
  width: 48px; height: 48px; border-radius: 6px; object-fit: cover;
  background: var(--cream-2); flex-shrink: 0;
}
.swap-option-body { flex: 1; min-width: 0; }
.swap-option-name { font-size: 13px; font-weight: 600; color: var(--charcoal); }
.swap-option-tier {
  font-size: 10px; color: var(--charcoal-3); text-transform: uppercase;
  letter-spacing: .06em;
}

.package-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 24px; margin-top: 12px;
  border-top: 1px solid var(--cream-2);
  gap: 12px;
}

.package-refine-hint {
  text-align: center; margin-top: 16px; padding: 14px;
  font-size: 13px; color: var(--charcoal-3); line-height: 1.5;
}
.package-refine-hint a {
  color: var(--green-deep); text-decoration: underline; cursor: pointer;
}

@media (max-width: 600px) {
  .package-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .product-card-name { font-size: 13px; }
  .product-card-note { font-size: 11px; }
  .swap-option { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 400px) {
  .package-grid { grid-template-columns: 1fr; }
}

/* ── Phase: home (room/category grid) ────────── */
.home-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 22px;
}
.home-header-text { flex: 1; min-width: 220px; }
.home-eyebrow {
  font-size: 11px;
  font-weight: 700;
  color: var(--green);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.home-title {
  font-size: 26px;
  font-weight: 700;
  color: var(--charcoal);
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.home-style-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--charcoal);
  color: var(--cream);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.home-style-badge .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
}

.home-progress {
  background: var(--white);
  border: 0.5px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 22px;
  margin-bottom: 22px;
  box-shadow: var(--sh-sm);
}
.home-progress-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.home-progress-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--charcoal-2);
}
.home-progress-pct {
  font-size: 18px;
  font-weight: 700;
  color: var(--green);
}
.home-progress-bar {
  height: 6px;
  background: var(--cream-2);
  border-radius: 3px;
  overflow: hidden;
}
.home-progress-fill {
  height: 100%;
  background: var(--green);
  transition: width .35s;
}

.room-section { margin-bottom: 26px; }
.room-section-hd {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 0.5px solid var(--border);
}
.room-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--charcoal);

<script>
// ─────────────────────────────────────────────────────────
//  SELECTIONS V2 — FOX
//  AI design consultant for David Adler Group / Six Arrows
//
//  Phases: loading → quiz → tasteboard → lifestyle → analyzing → reveal → home → chat
//
//  Persistence: writes to /selections-storage using v1 key format
//  (sab8_{clientKey}_{suffix}) so the existing design book reads it.
//  v2-specific state lives under _v2_* keys inside the `ans` object;
//  picks are mirrored into v1-compatible product fields where possible.
// ─────────────────────────────────────────────────────────

const p = AUTH.requireAuth();
if (!p) { /* AUTH redirected */ }

const CLIENT_KEY  = p.selectionsClientKey || p.id;
const CLIENT_NAME = p.clientName;

// ── Default rooms (only seeded if `rms` is empty so we never overwrite v1) ──
const V2_DEFAULT_ROOMS = [
  { id: 'kitchen',        name: 'Kitchen',        plumbing: 'kitchen' },
  { id: 'master_bath',    name: 'Master Bath',    plumbing: 'bath' },
  { id: 'guest_bath',     name: 'Guest Bath',     plumbing: 'bath' },
  { id: 'powder_room',    name: 'Powder Room',    plumbing: 'bath' },
  { id: 'living_room',    name: 'Living Room',    plumbing: 'none' },
  { id: 'master_bedroom', name: 'Master Bedroom', plumbing: 'none' },
  { id: 'mudroom',        name: 'Mudroom',        plumbing: 'none' },
  { id: 'laundry',        name: 'Laundry',        plumbing: 'utility' },
];

// ── Which categories Fox walks through per room ──
// Derived from a room's `plumbing` flag and name (so it works with whatever
// rooms the v1 setup screen saved — kitchen / bathroom_1 / dining / etc.)
const CATS_KITCHEN = ['countertops', 'tile', 'flooring', 'appliances', 'plumbing', 'lighting', 'hardware', 'paint'];
const CATS_BATH    = ['countertops', 'tile', 'flooring', 'plumbing', 'lighting', 'hardware', 'paint'];
const CATS_UTILITY = ['flooring', 'tile', 'lighting', 'paint', 'plumbing', 'hardware'];
const CATS_LIVING  = ['flooring', 'lighting', 'paint', 'fireplace', 'specialty_trim'];
const CATS_BEDROOM = ['flooring', 'lighting', 'paint'];

function categoriesFor(room) {
  if (!room) return [];
  const plumb = (room.plumbing || '').toLowerCase();
  const name  = (room.name || '').toLowerCase();
  if (plumb === 'kitchen' || /kitchen/.test(name)) return CATS_KITCHEN;
  if (plumb === 'bath'    || /bath|shower|powder/.test(name)) return CATS_BATH;
  if (plumb === 'utility' || /mud|laundry|utility|pantry/.test(name)) return CATS_UTILITY;
  if (/living|family|great|den|fireplace/.test(name)) return CATS_LIVING;
  if (/bed|nursery|guest/.test(name)) return CATS_BEDROOM;
  // Dining, office, hallway, foyer, etc.
  return ['flooring', 'lighting', 'paint'];
}

const CAT_LABELS = {
  fireplace:         'Fireplace',
  appliances:        'Appliances',
  exterior_finishes: 'Exterior Finishes',
  specialty_trim:    'Specialty Trim',
  flooring:          'Flooring',
  tile:              'Tile',
  plumbing:          'Plumbing Fixtures',
  lighting:          'Lighting',
  countertops:       'Countertops',
  hardware:          'Hardware',
  paint:             'Paint & Stain',
  doors:             'Interior Doors & Trim',
};

// ─────────────────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────────────────

const ST = {
  phase: 'loading',
  // ── Taste Engine V1 — new intake phases ──
  // Identity phase
  identityProfile: null,     // { positiveWords[], negativeWords[], luxuryExpression }
  // Comparisons phase
  comparisonPairs: [],       // from catalog
  neverWantSets: [],         // from catalog
  compIdx: 0,                // current comparison index (0-13: 0-11 = A/B pairs, 12-13 = never-want sets)
  comparisonResults: {},     // { comp_warmth: { pick: 'A'|'B', affinity: 'love'|'ok'|'neither'|null }, nw_bath: 'nw_bath_2', ... }
  affinityPending: null,     // id of comparison awaiting affinity response
  // Guardrails phase
  guardrails: null,          // { abstractGuardrails[], specificRedFlags[] }
  // Style fingerprint (replaces tasteProfile)
  styleFingerprint: null,    // { dimensions{}, confidence{}, coherence{}, tasteMaturity, derived{}, styleFit{} }
  designConcept: '',         // house-level thesis from Claude
  designGuardrails: [],      // prose guardrails from Claude
  inconsistencies: [],       // from Claude
  livabilityNotes: [],       // from Claude
  // ── Legacy fields (kept for backward compat) ──
  // Quiz (legacy — still works for existing clients)
  quiz: [],          // array of question objects from style-catalog
  qIdx: 0,
  quizAnswers: {},   // { q1_vibe: 'A', ... }
  // Taste board (legacy swipe)
  swipeImages: [],
  swipeIndex: 0,
  swipeResults: {},    // { imageId: 'love' | 'skip' }
  tasteProfile: null,  // computed from swipe results
  // Lifestyle (expanded)
  lifestyle: null,     // { kitchenUse, kitchenMessLevel, householdType, bathPriority, maintenanceTolerance, hostingFrequency, decisionStyle, investmentRanking }
  // Style identification
  style: '',
  styleSummary: '',
  styleGreeting: '',
  styleProfile: null,  // palette/tagline/keywords from /style-catalog
  // Budget calibration — one tier per room, set after style reveal.
  // Shape: { 'kitchen': 'essential' | 'elevated' | 'showpiece', ... }
  // Drives which products Fox recommends in chat AND which design boards
  // we show for each room.
  budgetTiers: {},
  // Design board picks — one board per room, chosen from 3 tier options.
  // Shape: { 'kitchen': 'elevated', 'master_bath': 'showpiece', ... }
  // This records which design board the client picked for each room.
  boardPicks: {},
  // Auto-generated design package — all selections pre-filled.
  // Shape: { 'kitchen': { 'countertops': { selected: {...}, alternatives: [...] }, ... }, ... }
  designPackage: null,
  expandedSwap: null,  // which product card has its swap panel open
  // Catalog
  catalog: null,
  // Chat
  currentRoom: '',
  currentCategory: '',
  chatHistory: {},   // { 'room::cat': [{role, content, picks?}] }
  picks: {},         // { 'room::cat': { tier, name, priceRange, why } }
  awaitingFox: false,
  // Persistence
  ans: {},
  sav: {},
  rms: [],
  // Save coordination
  pendingSave: null,
};

// ─────────────────────────────────────────────────────────
//  Utilities
// ─────────────────────────────────────────────────────────

function $(sel, root) { return (root || document).querySelector(sel); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Minimal markdown renderer for Fox bubbles: bold, italic, line breaks.
function mdRender(s) {
  if (!s) return '';
  let out = esc(s);
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  out = out.replace(/\n/g, '<br>');
  return out;
}

function showToast(msg) {
  const wrap = $('#fox-toast-wrap');
  if (!wrap) return;
  const t = document.createElement('div');
  t.className = 'fox-toast';
  t.textContent = msg;
  wrap.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 280); }, 2400);
}

function render() {
  const stage = $('#stage');
  if (!stage) return;
  if (ST.phase === 'loading')    stage.innerHTML = renderLoading('Loading Fox…');
  if (ST.phase === 'identity')   stage.innerHTML = renderIdentity();
  if (ST.phase === 'comparisons') stage.innerHTML = renderComparisons();
  if (ST.phase === 'lifestyle')  stage.innerHTML = renderLifestyle();
  if (ST.phase === 'guardrails') stage.innerHTML = renderGuardrails();
  if (ST.phase === 'quiz')      stage.innerHTML = renderQuiz();
  if (ST.phase === 'analyzing') stage.innerHTML = renderAnalyzing();
  if (ST.phase === 'reveal')    stage.innerHTML = renderReveal();
  if (ST.phase === 'tasteboard') stage.innerHTML = renderTasteBoard();
  if (ST.phase === 'budget')     stage.innerHTML = renderBudget();
  if (ST.phase === 'boards')     stage.innerHTML = renderBoards();
  if (ST.phase === 'generating') stage.innerHTML = renderLoading('Fox is building your design package…');
  if (ST.phase === 'package')    stage.innerHTML = renderPackageReview();
  if (ST.phase === 'home')       stage.innerHTML = renderHome();
  if (ST.phase === 'chat')       stage.innerHTML = renderChat();
  if (ST.phase === 'error')     stage.innerHTML = renderError(ST.errorMessage);
  // Post-render hooks
  if (ST.phase === 'chat') scrollChatToBottom();
}

// ─────────────────────────────────────────────────────────
//  Persistence
// ─────────────────────────────────────────────────────────

async function loadAll() {
  try {
    const res = await fetch(`/.netlify/functions/selections-storage?clientKey=${encodeURIComponent(CLIENT_KEY)}`);
    if (res.ok) {
      const data = await res.json();
      const all = data.data || {};
      ST.ans = all.ans || {};
      ST.sav = all.sav || {};
      ST.rms = Array.isArray(all.rms) && all.rms.length ? all.rms : V2_DEFAULT_ROOMS.slice();
    } else {
      ST.ans = {}; ST.sav = {}; ST.rms = V2_DEFAULT_ROOMS.slice();
    }
  } catch (e) {
    ST.ans = {}; ST.sav = {}; ST.rms = V2_DEFAULT_ROOMS.slice();
  }
  // Hydrate v2 state from ans
  try { ST.quizAnswers = JSON.parse(ST.ans._v2_quiz_answers || '{}'); } catch(e) { ST.quizAnswers = {}; }
  ST.style         = ST.ans._v2_style          || '';
  ST.styleSummary  = ST.ans._v2_style_summary  || '';
  ST.styleGreeting = ST.ans._v2_style_greeting || '';
  try { ST.chatHistory = JSON.parse(ST.ans._v2_chat_history || '{}'); } catch(e) { ST.chatHistory = {}; }
  try { ST.picks       = JSON.parse(ST.ans._v2_picks        || '{}'); } catch(e) { ST.picks = {}; }
  try { ST.budgetTiers = JSON.parse(ST.ans._v2_budget_tiers || '{}'); } catch(e) { ST.budgetTiers = {}; }
  try { ST.boardPicks  = JSON.parse(ST.ans._v2_board_picks  || '{}'); } catch(e) { ST.boardPicks = {}; }
  try { ST.designPackage = JSON.parse(ST.ans._v2_design_package || 'null'); } catch(e) { ST.designPackage = null; }
  try { ST.swipeResults = JSON.parse(ST.ans._v2_swipe_results || '{}'); } catch(e) { ST.swipeResults = {}; }
  try { ST.tasteProfile = JSON.parse(ST.ans._v2_taste_profile || 'null'); } catch(e) { ST.tasteProfile = null; }
  try { ST.lifestyle = JSON.parse(ST.ans._v2_lifestyle || 'null'); } catch(e) { ST.lifestyle = null; }
  // Taste engine V1 fields
  try { ST.identityProfile    = JSON.parse(ST.ans._v2_identity_profile    || 'null'); } catch(e) { ST.identityProfile = null; }
  try { ST.comparisonResults  = JSON.parse(ST.ans._v2_comparison_results  || '{}'); }   catch(e) { ST.comparisonResults = {}; }
  try { ST.guardrails         = JSON.parse(ST.ans._v2_guardrails          || 'null'); } catch(e) { ST.guardrails = null; }
  try { ST.styleFingerprint   = JSON.parse(ST.ans._v2_style_fingerprint   || 'null'); } catch(e) { ST.styleFingerprint = null; }
  ST.designConcept      = ST.ans._v2_design_concept      || '';
  try { ST.designGuardrails   = JSON.parse(ST.ans._v2_design_guardrails   || '[]'); }   catch(e) { ST.designGuardrails = []; }
  try { ST.inconsistencies    = JSON.parse(ST.ans._v2_inconsistencies     || '[]'); }   catch(e) { ST.inconsistencies = []; }
  try { ST.livabilityNotes    = JSON.parse(ST.ans._v2_livability_notes    || '[]'); }   catch(e) { ST.livabilityNotes = []; }
}

// Debounced batch save — coalesces rapid mutations into one network write.
function scheduleSave() {
  if (ST.pendingSave) clearTimeout(ST.pendingSave);
  ST.pendingSave = setTimeout(saveAllNow, 250);
}
async function saveAllNow() {
  ST.pendingSave = null;
  // Refresh the v2 mirror keys before persisting
  ST.ans._v2_quiz_answers   = JSON.stringify(ST.quizAnswers);
  ST.ans._v2_style          = ST.style          || '';
  ST.ans._v2_style_summary  = ST.styleSummary   || '';
  ST.ans._v2_style_greeting = ST.styleGreeting  || '';
  ST.ans._v2_chat_history   = JSON.stringify(ST.chatHistory);
  ST.ans._v2_picks          = JSON.stringify(ST.picks);
  ST.ans._v2_budget_tiers   = JSON.stringify(ST.budgetTiers);
  ST.ans._v2_board_picks    = JSON.stringify(ST.boardPicks);
  ST.ans._v2_design_package = JSON.stringify(ST.designPackage);
  ST.ans._v2_swipe_results  = JSON.stringify(ST.swipeResults);
  ST.ans._v2_taste_profile  = JSON.stringify(ST.tasteProfile);
  ST.ans._v2_lifestyle      = JSON.stringify(ST.lifestyle);
  // Taste engine V1 fields
  ST.ans._v2_identity_profile    = JSON.stringify(ST.identityProfile);
  ST.ans._v2_comparison_results  = JSON.stringify(ST.comparisonResults);
  ST.ans._v2_guardrails          = JSON.stringify(ST.guardrails);
  ST.ans._v2_style_fingerprint   = JSON.stringify(ST.styleFingerprint);
  ST.ans._v2_design_concept      = ST.designConcept || '';
  ST.ans._v2_design_guardrails   = JSON.stringify(ST.designGuardrails);
  ST.ans._v2_inconsistencies     = JSON.stringify(ST.inconsistencies);
  ST.ans._v2_livability_notes    = JSON.stringify(ST.livabilityNotes);

  // Batch endpoint expects { batch: { ans, sav, rms, ... } } — same shape v1 uses.
  const body = {
    batch: {
      ans: ST.ans,
      sav: ST.sav,
      rms: ST.rms,
    },
  };
  try {
    const res = await fetch(`/.netlify/functions/selections-storage?clientKey=${encodeURIComponent(CLIENT_KEY)}&batch=1`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) console.warn('selections-v2 save failed:', res.status, await res.text());
  } catch (e) {
    console.warn('selections-v2 save error:', e.message);
  }
}

// ── Identity ─────────────────────────────────
// Phase 1: "Who are you and how should your home feel?"
function renderIdentity() {

            const disabled = !sel && negCount >= 5;
            return `<button class="identity-chip negative ${sel ? 'selected' : ''} ${disabled ? 'disabled' : ''}"
                            onclick="toggleIdentityWord('negative','${esc(w.word)}')">${esc(w.word)}</button>`;

function toggleIdentityWord(type, word) {
  if (!ST.identityProfile) ST.identityProfile = { positiveWords: [], negativeWords: [], luxuryExpression: null };
  const arr = type === 'positive' ? ST.identityProfile.positiveWords : ST.identityProfile.negativeWords;
  const max = type === 'positive' ? 5 : 5;
  const idx = arr.indexOf(word);
  if (idx >= 0) arr.splice(idx, 1);
  else if (arr.length < max) arr.push(word);
  scheduleSave();
  render();
}

function setLuxuryExpression(val) {
  if (!ST.identityProfile) ST.identityProfile = { positiveWords: [], negativeWords: [], luxuryExpression: null };
  ST.identityProfile.luxuryExpression = val;
  scheduleSave();
  render();
}

function completeIdentity() {
  const ip = ST.identityProfile;
  if (!ip || ip.positiveWords.length < 5 || ip.negativeWords.length < 3 || !ip.luxuryExpression) {
    showToast('Finish all three sections first');
    return;
  }
  // Load comparison data from catalog
  ST.comparisonPairs = Array.isArray(ST.catalog?.comparisonPairs) ? ST.catalog.comparisonPairs : [];
  ST.neverWantSets = Array.isArray(ST.catalog?.neverWantSets) ? ST.catalog.neverWantSets : [];
  ST.compIdx = 0;
  ST.affinityPending = null;
  ST.phase = 'comparisons';
  scheduleSave();
  render();
}

// ── Comparisons ──────────────────────────────
// Phase 2: A/B image pairs + never-want sets
function renderComparisons() {
  const pairs = ST.comparisonPairs || [];
  const nwSets = ST.neverWantSets || [];
  const totalSteps = pairs.length + nwSets.length;
  const idx = ST.compIdx;

  if (idx >= totalSteps) {
    // All done — move to lifestyle
    ST.phase = 'lifestyle';
    scheduleSave();
    render();
    return '';
  }

  const pctNum = Math.round((idx / totalSteps) * 100);

  // Check if we're showing an affinity follow-up
  if (ST.affinityPending) {
    const pair = pairs.find(p => p.id === ST.affinityPending);
    if (pair) return renderAffinityCheck(pair, idx, totalSteps, pctNum);
  }

  // A/B comparison pairs (indices 0 through pairs.length-1)
  if (idx < pairs.length) {
    const pair = pairs[idx];
    const existing = ST.comparisonResults[pair.id];
    return `
      <div class="comparison-card">
        <div class="quiz-progress">
          <span>${idx + 1} of ${totalSteps}</span>
          <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pctNum}%"></div></div>
        </div>
        <div class="comparison-prompt">${esc(pair.prompt)}</div>
        <div class="comparison-pair">
          <button class="comparison-option ${existing?.pick === 'A' ? 'selected' : ''}"
                  onclick="onComparisonPick('${esc(pair.id)}','A')">
            <div class="comparison-img-wrap">
              <img src="${esc(pair.imageA)}" alt="${esc(pair.labelA)}" class="comparison-img"
                   onerror="this.style.display='none';this.nextElementSibling.classList.add('show')">
              <div class="comparison-img-fallback">A</div>
            </div>
            <div class="comparison-label">${esc(pair.labelA)}</div>
          </button>
          <button class="comparison-option ${existing?.pick === 'B' ? 'selected' : ''}"
                  onclick="onComparisonPick('${esc(pair.id)}','B')">
            <div class="comparison-img-wrap">
              <img src="${esc(pair.imageB)}" alt="${esc(pair.labelB)}" class="comparison-img"
                   onerror="this.style.display='none';this.nextElementSibling.classList.add('show')">
              <div class="comparison-img-fallback">B</div>
            </div>
            <div class="comparison-label">${esc(pair.labelB)}</div>
          </button>
        </div>
        <div class="quiz-actions">
          <button class="quiz-back" ${idx === 0 ? 'disabled' : ''} onclick="onCompBack()">← Back</button>
        </div>
      </div>`;
  }

  // Never-want sets (indices pairs.length through totalSteps-1)
  const nwIdx = idx - pairs.length;
  const nwSet = nwSets[nwIdx];
  if (!nwSet) return renderError('Comparison data missing.');

  const rejected = ST.comparisonResults[nwSet.id];
  return `
    <div class="comparison-card">
      <div class="quiz-progress">
        <span>${idx + 1} of ${totalSteps}</span>
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pctNum}%"></div></div>
      </div>
      <div class="comparison-prompt">${esc(nwSet.prompt)}</div>
      <div class="comparison-sub">Tap the one you\u2019d never want.</div>
      <div class="neverwant-grid">
        ${nwSet.options.map(opt => `
          <button class="neverwant-option ${rejected === opt.id ? 'rejected' : ''}"
                  onclick="onNeverWantPick('${esc(nwSet.id)}','${esc(opt.id)}')">
            <div class="comparison-img-wrap">
              <img src="${esc(opt.imageUrl)}" alt="${esc(opt.label)}" class="comparison-img"
                   onerror="this.style.display='none';this.nextElementSibling.classList.add('show')">
              <div class="comparison-img-fallback">${esc(opt.label.slice(0, 1))}</div>
            </div>
            <div class="comparison-label">${esc(opt.label)}</div>
            ${rejected === opt.id ? '<div class="neverwant-x">\u2715</div>' : ''}
          </button>
        `).join('')}
      </div>
      <div class="quiz-actions">
        <button class="quiz-back" onclick="onCompBack()">← Back</button>
      </div>
    </div>`;
}

function renderAffinityCheck(pair, idx, totalSteps, pctNum) {
  return `
    <div class="comparison-card">
      <div class="quiz-progress">
        <span>${idx + 1} of ${totalSteps}</span>
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pctNum}%"></div></div>
      </div>
      <div class="comparison-prompt">How do you feel about your pick?</div>
      <div class="comparison-sub">Do you actually love it, or was it just the better of the two?</div>
      <div class="affinity-options">
        <button class="lifestyle-opt" onclick="onAffinityPick('love')">Love it</button>
        <button class="lifestyle-opt" onclick="onAffinityPick('ok')">It\u2019s OK</button>
        <button class="lifestyle-opt" onclick="onAffinityPick('neither')">Neither really</button>
      </div>
    </div>`;
}

function onComparisonPick(pairId, pick) {
  if (!ST.comparisonResults[pairId]) ST.comparisonResults[pairId] = {};
  ST.comparisonResults[pairId] = { pick, affinity: null };
  scheduleSave();

  // Check if this pair needs an affinity follow-up
  const pair = (ST.comparisonPairs || []).find(p => p.id === pairId);
  if (pair && pair.hasAffinity) {
    ST.affinityPending = pairId;
    render();
    return;
  }

  // Auto-advance
  ST.compIdx++;
  render();
}

function onAffinityPick(affinity) {
  if (ST.affinityPending && ST.comparisonResults[ST.affinityPending]) {
    ST.comparisonResults[ST.affinityPending].affinity = affinity;
  }
  ST.affinityPending = null;
  ST.compIdx++;
  scheduleSave();
  render();
}

function onNeverWantPick(setId, optionId) {
  ST.comparisonResults[setId] = optionId;
  scheduleSave();
  // Auto-advance after a brief visual beat
  setTimeout(() => { ST.compIdx++; render(); }, 350);
}

function onCompBack() {
  if (ST.affinityPending) {
    ST.affinityPending = null;
    render();
    return;
  }
  if (ST.compIdx > 0) {
    ST.compIdx--;
    render();
  } else {
    // Go back to identity
    ST.phase = 'identity';
    render();
  }
}

function toggleGuardrail(type, id) {
  if (!ST.guardrails) ST.guardrails = { abstractGuardrails: [], specificRedFlags: [] };
  const arr = type === 'abstract' ? ST.guardrails.abstractGuardrails : ST.guardrails.specificRedFlags;
  const idx = arr.indexOf(id);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(id);
  scheduleSave();
  render();
}

function backFromGuardrails() {
  ST.phase = 'lifestyle';
  render();
}

async function completeGuardrails() {
  if (!ST.guardrails) ST.guardrails = { abstractGuardrails: [], specificRedFlags: [] };

  // Derive budget tiers from investment ranking
  const ranking = ST.lifestyle?.investmentRanking || ST.rms.map(r => r.id);
  ST.budgetTiers = deriveBudgetTiers(ranking);
  scheduleSave();

  // Compute the style fingerprint
  computeStyleFingerprint();
  scheduleSave();

  // Move to analyzing phase — Claude will interpret the fingerprint
  ST.phase = 'analyzing';
  render();

  try {
    await analyzeProfile();
  } catch (err) {
    console.error('Profile analysis failed:', err);
    ST.phase = 'error';
    ST.errorMessage = 'Profile analysis failed: ' + err.message;
    render();
  }

        <button class="quiz-back" ${ST.qIdx === 0 ? 'disabled' : ''} onclick="onQuizBack()">← Back</button>

function onQuizBack() {

    ST.qIdx++;

// ── Taste Board (swipe) ──────────────────────
function renderTasteBoard() {
  const images = ST.swipeImages || [];
  if (!images.length) return renderLoading('Loading taste board\u2026');

  const idx = ST.swipeIndex;
  const total = images.length;

  if (idx >= total) {
    // All swiped — compute profile and move on
    computeTasteProfile();
    ST.phase = 'lifestyle';
    scheduleSave();
    setTimeout(() => render(), 0);
    return renderLoading('Computing your taste profile\u2026');
  }

  const pct = Math.round((idx / total) * 100);

  return `
    <div class="tasteboard-shell">

      </div>

      <div class="tasteboard-card-wrap" id="swipe-wrap">
        <div class="tasteboard-card" id="swipe-card"
             ontouchstart="swipeTouchStart(event)"
             ontouchmove="swipeTouchMove(event)"
             ontouchend="swipeTouchEnd(event)">
          <img class="tasteboard-card-img" src="${esc(img.imageUrl)}" alt=""
               onerror="this.style.background='var(--cream-2)'">

      <div class="tasteboard-actions">
        <button class="tasteboard-btn tasteboard-btn-skip" onclick="swipeSkip()" title="Skip">\u2715</button>

      </div>

        <div class="tasteboard-progress-bar">
          <div class="tasteboard-progress-fill" style="width:${pct}%"></div>
        </div>
      </div>

      ${idx >= 15 ? `<button class="tasteboard-skip-all" onclick="skipRemainingSwipes()">I\u2019ve seen enough \u2014 continue</button>` : ''}
    </div>`;

// Swipe touch gesture state
let _swipeStartX = 0;
let _swipeDeltaX = 0;

function swipeTouchStart(e) {
  _swipeStartX = e.touches[0].clientX;
  _swipeDeltaX = 0;
}

function swipeTouchMove(e) {
  _swipeDeltaX = e.touches[0].clientX - _swipeStartX;
  const card = document.getElementById('swipe-card');
  if (card) {
    const rotation = _swipeDeltaX * 0.05;
    card.style.transform = `translateX(${_swipeDeltaX}px) rotate(${rotation}deg)`;
    card.style.transition = 'none';
  }
}

function swipeTouchEnd(e) {
  const card = document.getElementById('swipe-card');
  if (Math.abs(_swipeDeltaX) > 80) {
    // Swipe committed
    if (_swipeDeltaX > 0) swipeLove();
    else swipeSkip();
  } else if (card) {
    // Snap back
    card.style.transition = 'transform 0.3s ease';
    card.style.transform = '';
  }
  _swipeDeltaX = 0;
}

function animateSwipe(direction) {
  const card = document.getElementById('swipe-card');
  if (card) {
    card.classList.add(direction === 'right' ? 'swiping-right' : 'swiping-left');
  }
  setTimeout(() => {
    ST.swipeIndex++;
    render();
  }, 350);
}

function swipeLove() {
  const img = ST.swipeImages[ST.swipeIndex];
  if (img) ST.swipeResults[img.id] = 'love';
  scheduleSave();
  animateSwipe('right');
}

function swipeSkip() {
  const img = ST.swipeImages[ST.swipeIndex];
  if (img) ST.swipeResults[img.id] = 'skip';
  scheduleSave();
  animateSwipe('left');
}

function skipRemainingSwipes() {
  // Mark remaining as skip and move on
  const images = ST.swipeImages || [];
  for (let i = ST.swipeIndex; i < images.length; i++) {
    if (!ST.swipeResults[images[i].id]) {
      ST.swipeResults[images[i].id] = 'skip';
    }
  }
  computeTasteProfile();
  ST.phase = 'lifestyle';
  scheduleSave();
  render();
}

function computeTasteProfile() {
  const images = ST.swipeImages || [];
  const tagCounts = {};
  const tagLoves = {};

  for (const img of images) {
    const result = ST.swipeResults[img.id];
    if (!result) continue;
    const isLove = result === 'love';
    for (const [tag, val] of Object.entries(img.tags || {})) {
      if (!val) continue;
      tagCounts[tag] = (tagCounts[tag] || 0) + 1;
      if (isLove) tagLoves[tag] = (tagLoves[tag] || 0) + 1;
    }
  }

  function score(tag) {
    if (!tagCounts[tag]) return 0.5;
    return (tagLoves[tag] || 0) / tagCounts[tag];
  }

  // Metal preference
  const metalScores = { warm: score('warmMetal'), cool: score('coolMetal'), black: score('blackMetal') };
  const topMetal = Object.entries(metalScores).sort((a,b) => b[1] - a[1])[0];

  // Color mood
  const colorScores = { brightAiry: score('brightAiry'), warmEarthy: score('warmEarthy'), moodyDark: score('moodyDark'), crispNeutral: score('crispNeutral') };
  const topColor = Object.entries(colorScores).sort((a,b) => b[1] - a[1])[0];

  ST.tasteProfile = {
    metalPreference: topMetal[0],
    metalScore: metalScores,
    patternTolerance: score('busyPattern'),
    colorMood: topColor[0],
    colorMoodScore: colorScores,
    textureAffinity: {
      naturalStone: score('naturalStone'),
      naturalWood: score('naturalWood'),
      handmade: score('handmadeTexture'),
      polished: score('polishedSurface'),
    },
    contrastPreference: score('highContrast'),
  };
}
