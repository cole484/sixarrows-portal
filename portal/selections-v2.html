<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fox — David Adler Group</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<script src="data.js"></script>
<style>
/* ─────────────────────────────────────────────────────────
   Selections v2 — Fox
   Standalone full-screen interface (no portal sidebar).
   Uses portal CSS tokens for color consistency.
───────────────────────────────────────────────────────── */
body { background: var(--cream); padding: 0; }

.fox-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ─────────────────────────────────── */
.fox-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 22px;
  background: var(--charcoal);
  color: var(--cream);
  border-bottom: 0.5px solid rgba(255,255,255,.06);
  flex-shrink: 0;
}
.fox-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.fox-brand-mark {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: var(--cream);
  letter-spacing: .02em;
}
.fox-brand-text { line-height: 1.2; }
.fox-brand-name { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
.fox-brand-sub  { font-size: 10px; color: rgba(235,233,222,.55); text-transform: uppercase; letter-spacing: .12em; }

.fox-back {
  font-size: 12px;
  color: rgba(235,233,222,.6);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 16px;
  transition: background .15s, color .15s;
}
.fox-back:hover { color: var(--cream); background: rgba(255,255,255,.06); }

/* ── Main canvas ─────────────────────────────── */
.fox-main {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 32px 22px 80px;
}
.fox-stage {
  width: 100%;
  max-width: 880px;
}

@media (max-width: 700px) {
  .fox-top { padding: 12px 16px; }
  .fox-main { padding: 22px 14px 60px; }
}

/* ── Phase: loading ──────────────────────────── */
.fox-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  color: var(--charcoal-3);
  gap: 14px;
}
.fox-spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--cream-2);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Phase: quiz ─────────────────────────────── */
.quiz-card {
  background: var(--white);
  border-radius: var(--r-xl);
  padding: 28px 32px 24px;
  box-shadow: var(--sh-md);
  border: 0.5px solid var(--border);
}
.quiz-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  font-weight: 600;
  color: var(--green);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.quiz-progress-bar {
  flex: 1;
  height: 4px;
  background: var(--cream-2);
  border-radius: 2px;
  overflow: hidden;
}
.quiz-progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: 2px;
  transition: width .35s ease;
}
.quiz-prompt {
  font-size: 22px;
  font-weight: 700;
  color: var(--charcoal);
  line-height: 1.3;
  margin: 4px 0 4px;
  letter-spacing: -0.01em;
}
.quiz-note {
  font-size: 13px;
  color: var(--charcoal-3);
  margin-bottom: 22px;
}
.quiz-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 600px) {
  .quiz-options { grid-template-columns: 1fr; }
  .quiz-card { padding: 22px 20px; }
  .quiz-prompt { font-size: 18px; }
}
.quiz-option {
  display: flex;
  flex-direction: column;
  background: var(--cream-pale);
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  cursor: pointer;
  overflow: hidden;
  transition: all .16s;
  text-align: left;
  padding: 0;
  font: inherit;
  color: inherit;
}
.quiz-option:hover {
  border-color: var(--green);
  transform: translateY(-1px);
  box-shadow: var(--sh-md);
}
.quiz-option.selected {
  border-color: var(--green);
  background: var(--green-pale);
  box-shadow: 0 0 0 3px rgba(117,127,105,.15);
}
.quiz-option-img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  background: var(--cream-2);
  display: block;
}
.quiz-option-img-fallback {
  width: 100%;
  aspect-ratio: 4/3;
  background: linear-gradient(135deg, var(--cream-2) 0%, var(--cream-3) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--charcoal-4);
  font-size: 32px;
  font-weight: 700;
  letter-spacing: .04em;
}
.quiz-option-body {
  padding: 12px 14px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.quiz-option-letter {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--cream-2);
  color: var(--charcoal-2);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.quiz-option.selected .quiz-option-letter {
  background: var(--green);
  color: var(--cream);
}
.quiz-option-label {
  font-size: 13px;
  line-height: 1.4;
  color: var(--charcoal-2);
  font-weight: 500;
}
.quiz-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}
.quiz-back {
  background: none;
  border: none;
  font: inherit;
  color: var(--charcoal-3);
  cursor: pointer;
  font-size: 13px;
  padding: 8px 4px;
}
.quiz-back:hover { color: var(--charcoal); }
.quiz-back:disabled { opacity: .35; cursor: default; }
.quiz-next {
  background: var(--charcoal);
  color: var(--cream);
  border: none;
  border-radius: 999px;
  padding: 10px 22px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.quiz-next:hover { background: var(--green-deep); }
.quiz-next:disabled { background: var(--cream-3); color: var(--charcoal-4); cursor: default; }

/* ── Phase: analyzing ────────────────────────── */
.fox-analyzing {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 50vh;
  text-align: center;
}
.fox-analyzing h2 {
  font-size: 18px;
  font-weight: 600;
  color: var(--charcoal);
  margin-top: 18px;
  letter-spacing: -0.01em;
}
.fox-analyzing p {
  font-size: 13px;
  color: var(--charcoal-3);
  margin-top: 6px;
}

/* ── Phase: reveal ───────────────────────────── */
.reveal-card {
  background: var(--white);
  border-radius: var(--r-xl);
  padding: 36px 36px 30px;
  box-shadow: var(--sh-lg);
  border: 0.5px solid var(--border);
}
.reveal-eyebrow {
  font-size: 11px;
  font-weight: 700;
  color: var(--green);
  letter-spacing: .14em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.reveal-style {
  font-size: 36px;
  font-weight: 700;
  color: var(--charcoal);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.reveal-tagline {
  font-size: 15px;
  color: var(--charcoal-3);
  font-style: italic;
  margin-bottom: 22px;
}
.reveal-palette {
  display: flex;
  gap: 8px;
  margin-bottom: 26px;
}
.reveal-swatch {
  flex: 1;
  height: 56px;
  border-radius: var(--r-md);
  border: 0.5px solid var(--border);
}
.reveal-greeting {
  background: var(--green-pale);
  border-left: 3px solid var(--green);
  padding: 18px 20px;
  border-radius: var(--r-md);
  font-size: 15px;
  line-height: 1.65;
  color: var(--charcoal-2);
  margin-bottom: 24px;
  white-space: pre-wrap;
}
.reveal-keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 28px;
}
.reveal-keyword {
  font-size: 11px;
  font-weight: 600;
  background: var(--cream);
  color: var(--charcoal-2);
  padding: 4px 11px;
  border-radius: 999px;
  letter-spacing: .02em;
}
.reveal-cta {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.btn-primary {
  background: var(--green);
  color: var(--white);
  border: none;
  border-radius: 999px;
  padding: 13px 28px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.btn-primary:hover { background: var(--green-dk); }
.btn-secondary {
  background: transparent;
  color: var(--charcoal-3);
  border: 1px solid var(--border-2);
  border-radius: 999px;
  padding: 12px 22px;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.btn-secondary:hover { background: var(--cream-pale); color: var(--charcoal); }

@media (max-width: 600px) {
  .reveal-card { padding: 26px 22px; }
  .reveal-style { font-size: 28px; }
}

/* ── Phase: budget calibration ────────────────── */
/* Sits between reveal and home. User picks one tier per room. */
.budget-shell { display: block; }
.budget-hd {
  margin-bottom: 20px;
}
.budget-eyebrow {
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--charcoal-4);
  margin-bottom: 6px;
}
.budget-title {
  font-family: var(--font-serif, Georgia, serif);
  font-size: 30px;
  line-height: 1.15;
  color: var(--charcoal);
  margin-bottom: 10px;
}
.budget-sub {
  font-size: 14px;
  line-height: 1.55;
  color: var(--charcoal-3);
  max-width: 640px;
}
.budget-room {
  background: var(--white);
  border: 1px solid var(--border-2);
  border-radius: 20px;
  padding: 18px 18px 20px;
  margin-bottom: 16px;
}
.budget-room-hd {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.budget-room-name {
  font-family: var(--font-serif, Georgia, serif);
  font-size: 22px;
  color: var(--charcoal);
}
.budget-room-hint {
  font-size: 12px;
  color: var(--charcoal-4);
}
.budget-tier-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.budget-tier {
  display: flex;
  flex-direction: column;
  text-align: left;
  background: var(--cream-pale);
  border: 1.5px solid var(--border-2);
  border-radius: 14px;
  padding: 0;
  cursor: pointer;
  transition: all .15s;
  overflow: hidden;
  font: inherit;
  color: inherit;
}
.budget-tier:hover {
  border-color: var(--green);
  transform: translateY(-1px);
}
.budget-tier.selected {
  border-color: var(--green);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(92,124,94,.15);
}
.budget-tier-img {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: var(--cream-3);
  background-size: cover;
  background-position: center;
  display: block;
}
.budget-tier-img-fallback {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: linear-gradient(135deg, var(--cream-2) 0%, var(--cream-3) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--charcoal-4);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.budget-tier-body {
  padding: 12px 14px 14px;
}
.budget-tier-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--charcoal);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.budget-tier-check {
  display: inline-flex;
  width: 16px;
  height: 16px;
  align-items: center;
  justify-content: center;
  background: var(--green);
  color: var(--white);
  border-radius: 50%;
  font-size: 10px;
  font-weight: 700;
}
.budget-tier-desc {
  font-size: 12px;
  line-height: 1.45;
  color: var(--charcoal-3);
}
.budget-footer {
  position: sticky;
  bottom: 0;
  background: linear-gradient(to top, var(--cream) 70%, rgba(247,243,234,0));
  padding: 18px 0 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-top: 8px;
}
.budget-footer-status {
  font-size: 13px;
  color: var(--charcoal-3);
}
.budget-footer-status strong { color: var(--charcoal); font-weight: 600; }

@media (max-width: 600px) {
  .budget-title { font-size: 24px; }
  .budget-tier-grid { grid-template-columns: 1fr; }
  .budget-tier { flex-direction: row; }
  .budget-tier-img, .budget-tier-img-fallback { width: 120px; aspect-ratio: 1 / 1; flex-shrink: 0; }
  .budget-tier-body { flex: 1; padding: 12px 14px; }
}

/* ── Phase: boards (design board selection) ───── */
/* Client sees 3 design board options per room (one per tier) and picks the
   one closest to their vision. The board matching their budget tier is
   pre-highlighted with a "Recommended" badge. */
.boards-shell { display: block; }
.boards-hd { margin-bottom: 20px; }
.boards-eyebrow {
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--charcoal-4);
  margin-bottom: 6px;
}
.boards-title {
  font-family: var(--font-serif, Georgia, serif);
  font-size: 30px;
  line-height: 1.15;
  color: var(--charcoal);
  margin-bottom: 10px;
}
.boards-sub {
  font-size: 14px;
  line-height: 1.55;
  color: var(--charcoal-3);
  max-width: 640px;
}
.boards-room {
  background: var(--white);
  border: 1px solid var(--border-2);
  border-radius: 20px;
  padding: 18px 18px 20px;
  margin-bottom: 16px;
}
.boards-room-hd {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.boards-room-name {
  font-family: var(--font-serif, Georgia, serif);
  font-size: 22px;
  color: var(--charcoal);
}
.boards-room-hint {
  font-size: 12px;
  color: var(--charcoal-4);
}
.boards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.board-card {
  display: flex;
  flex-direction: column;
  background: var(--cream-pale);
  border: 1.5px solid var(--border-2);
  border-radius: 14px;
  padding: 0;
  cursor: pointer;
  transition: all .15s;
  overflow: hidden;
  font: inherit;
  color: inherit;
  text-align: left;
  position: relative;
}
.board-card:hover {
  border-color: var(--green);
  transform: translateY(-1px);
}
.board-card.selected {
  border-color: var(--green);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(92,124,94,.15);
}
.board-card-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: var(--green);
  color: var(--white);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 6px;
  z-index: 1;
}
.board-card-img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  display: block;
  background: var(--cream-3);
}
.board-card-img-fallback {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: linear-gradient(135deg, var(--cream-2) 0%, var(--cream-3) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--charcoal-4);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.board-card-body {
  padding: 12px 14px 14px;
}
.board-card-tier {
  font-weight: 600;
  font-size: 14px;
  color: var(--charcoal);
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.board-card-check {
  display: inline-flex;
  width: 16px;
  height: 16px;
  align-items: center;
  justify-content: center;
  background: var(--green);
  color: var(--white);
  border-radius: 50%;
  font-size: 10px;
  font-weight: 700;
}
.board-card-desc {
  font-size: 12px;
  line-height: 1.45;
  color: var(--charcoal-3);
}
.boards-footer {
  position: sticky;
  bottom: 0;
  background: linear-gradient(to top, var(--cream) 70%, rgba(247,243,234,0));
  padding: 18px 0 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-top: 8px;
}
.boards-footer-status {
  font-size: 13px;
  color: var(--charcoal-3);
}
.boards-footer-status strong { color: var(--charcoal); font-weight: 600; }

@media (max-width: 600px) {
  .boards-title { font-size: 24px; }
  .boards-grid { grid-template-columns: 1fr; }
  .board-card { flex-direction: row; }
  .board-card-img, .board-card-img-fallback { width: 140px; aspect-ratio: 1 / 1; flex-shrink: 0; }
  .board-card-body { flex: 1; padding: 12px 14px; }
}

/* ── Phase: home (room/category grid) ────────── */
.home-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 22px;
}
.home-header-text { flex: 1; min-width: 220px; }
.home-eyebrow {
  font-size: 11px;
  font-weight: 700;
  color: var(--green);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.home-title {
  font-size: 26px;
  font-weight: 700;
  color: var(--charcoal);
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.home-style-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--charcoal);
  color: var(--cream);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.home-style-badge .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
}

.home-progress {
  background: var(--white);
  border: 0.5px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 22px;
  margin-bottom: 22px;
  box-shadow: var(--sh-sm);
}
.home-progress-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.home-progress-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--charcoal-2);
}
.home-progress-pct {
  font-size: 18px;
  font-weight: 700;
  color: var(--green);
}
.home-progress-bar {
  height: 6px;
  background: var(--cream-2);
  border-radius: 3px;
  overflow: hidden;
}
.home-progress-fill {
  height: 100%;
  background: var(--green);
  transition: width .35s;
}

.room-section { margin-bottom: 26px; }
.room-section-hd {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 0.5px solid var(--border);
}
.room-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--charcoal);
  letter-spacing: -0.005em;
}
.room-progress {
  font-size: 11px;
  color: var(--charcoal-3);
  font-weight: 500;
}
.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 10px;
}
.cat-tile {
  background: var(--white);
  border: 0.5px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px 16px;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  font: inherit;
  color: inherit;
}
.cat-tile:hover {
  border-color: var(--green);
  box-shadow: var(--sh-md);
  transform: translateY(-1px);
}
.cat-tile.done {
  background: var(--green-pale);
  border-color: rgba(117,127,105,.35);
}
.cat-tile-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--charcoal);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.cat-tile-status {
  font-size: 11px;
  color: var(--charcoal-4);

</head>
<body>
<div class="fox-shell" id="fox-shell">
  <div class="fox-top">
    <div class="fox-brand">
      <div class="fox-brand-mark">F</div>
      <div class="fox-brand-text">
        <div class="fox-brand-name">Fox</div>
        <div class="fox-brand-sub">David Adler Group</div>
      </div>
    </div>
    <a class="fox-back" href="dashboard.html">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 2L3 5.5 7 9"/></svg>
      Back to portal
    </a>
  </div>
  <div class="fox-main">
    <div class="fox-stage" id="stage"></div>
  </div>
</div>
<div class="fox-toast-wrap" id="fox-toast-wrap"></div>

<script>
// ─────────────────────────────────────────────────────────
//  SELECTIONS V2 — FOX
//  AI design consultant for David Adler Group / Six Arrows
//
//  Phases: loading → quiz → analyzing → reveal → home → chat
//
//  Persistence: writes to /selections-storage using v1 key format
//  (sab8_{clientKey}_{suffix}) so the existing design book reads it.
//  v2-specific state lives under _v2_* keys inside the `ans` object;
//  picks are mirrored into v1-compatible product fields where possible.
// ─────────────────────────────────────────────────────────

const p = AUTH.requireAuth();
if (!p) { /* AUTH redirected */ }

const CLIENT_KEY  = p.selectionsClientKey || p.id;
const CLIENT_NAME = p.clientName;

// ── Default rooms (only seeded if `rms` is empty so we never overwrite v1) ──
const V2_DEFAULT_ROOMS = [
  { id: 'kitchen',        name: 'Kitchen',        plumbing: 'kitchen' },
  { id: 'master_bath',    name: 'Master Bath',    plumbing: 'bath' },
  { id: 'guest_bath',     name: 'Guest Bath',     plumbing: 'bath' },
  { id: 'powder_room',    name: 'Powder Room',    plumbing: 'bath' },
  { id: 'living_room',    name: 'Living Room',    plumbing: 'none' },
  { id: 'master_bedroom', name: 'Master Bedroom', plumbing: 'none' },
  { id: 'mudroom',        name: 'Mudroom',        plumbing: 'none' },
  { id: 'laundry',        name: 'Laundry',        plumbing: 'utility' },
];

// ── Which categories Fox walks through per room ──
// Derived from a room's `plumbing` flag and name (so it works with whatever
// rooms the v1 setup screen saved — kitchen / bathroom_1 / dining / etc.)
const CATS_KITCHEN = ['countertops', 'tile', 'flooring', 'appliances', 'plumbing', 'lighting', 'hardware', 'paint'];
const CATS_BATH    = ['countertops', 'tile', 'flooring', 'plumbing', 'lighting', 'hardware', 'paint'];
const CATS_UTILITY = ['flooring', 'tile', 'lighting', 'paint', 'plumbing', 'hardware'];
const CATS_LIVING  = ['flooring', 'lighting', 'paint', 'fireplace', 'specialty_trim'];
const CATS_BEDROOM = ['flooring', 'lighting', 'paint'];

function categoriesFor(room) {
  if (!room) return [];
  const plumb = (room.plumbing || '').toLowerCase();
  const name  = (room.name || '').toLowerCase();
  if (plumb === 'kitchen' || /kitchen/.test(name)) return CATS_KITCHEN;
  if (plumb === 'bath'    || /bath|shower|powder/.test(name)) return CATS_BATH;
  if (plumb === 'utility' || /mud|laundry|utility|pantry/.test(name)) return CATS_UTILITY;
  if (/living|family|great|den|fireplace/.test(name)) return CATS_LIVING;
  if (/bed|nursery|guest/.test(name)) return CATS_BEDROOM;
  // Dining, office, hallway, foyer, etc.
  return ['flooring', 'lighting', 'paint'];
}

const CAT_LABELS = {
  fireplace:         'Fireplace',
  appliances:        'Appliances',
  exterior_finishes: 'Exterior Finishes',
  specialty_trim:    'Specialty Trim',
  flooring:          'Flooring',
  tile:              'Tile',
  plumbing:          'Plumbing Fixtures',
  lighting:          'Lighting',
  countertops:       'Countertops',
  hardware:          'Hardware',
  paint:             'Paint & Stain',
  doors:             'Interior Doors & Trim',
};

// ─────────────────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────────────────

const ST = {
  phase: 'loading',
  // Quiz
  quiz: [],          // array of question objects from style-catalog
  qIdx: 0,
  quizAnswers: {},   // { q1_vibe: 'A', ... }
  // Style identification
  style: '',
  styleSummary: '',
  styleGreeting: '',
  styleProfile: null,  // palette/tagline/keywords from /style-catalog
  // Budget calibration — one tier per room, set after style reveal.
  // Shape: { 'kitchen': 'essential' | 'elevated' | 'showpiece', ... }
  // Drives which products Fox recommends in chat AND which design boards
  // we show for each room.
  budgetTiers: {},
  // Design board picks — one board per room, chosen from 3 tier options.
  // Shape: { 'kitchen': 'elevated', 'master_bath': 'showpiece', ... }
  // This records which design board the client picked for each room.
  boardPicks: {},
  // Catalog
  catalog: null,
  // Chat
  currentRoom: '',
  currentCategory: '',
  chatHistory: {},   // { 'room::cat': [{role, content, picks?}] }
  picks: {},         // { 'room::cat': { tier, name, priceRange, why } }
  awaitingFox: false,
  // Persistence
  ans: {},
  sav: {},
  rms: [],
  // Save coordination
  pendingSave: null,
};

// ─────────────────────────────────────────────────────────
//  Utilities
// ─────────────────────────────────────────────────────────

function $(sel, root) { return (root || document).querySelector(sel); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Minimal markdown renderer for Fox bubbles: bold, italic, line breaks.
function mdRender(s) {
  if (!s) return '';
  let out = esc(s);
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  out = out.replace(/\n/g, '<br>');
  return out;
}

function showToast(msg) {
  const wrap = $('#fox-toast-wrap');
  if (!wrap) return;
  const t = document.createElement('div');
  t.className = 'fox-toast';
  t.textContent = msg;
  wrap.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 280); }, 2400);
}

function render() {
  const stage = $('#stage');
  if (!stage) return;
  if (ST.phase === 'loading')   stage.innerHTML = renderLoading('Loading Fox…');
  if (ST.phase === 'quiz')      stage.innerHTML = renderQuiz();
  if (ST.phase === 'analyzing') stage.innerHTML = renderAnalyzing();
  if (ST.phase === 'reveal')    stage.innerHTML = renderReveal();
  if (ST.phase === 'budget')    stage.innerHTML = renderBudget();
  if (ST.phase === 'boards')    stage.innerHTML = renderBoards();
  if (ST.phase === 'home')      stage.innerHTML = renderHome();
  if (ST.phase === 'chat')      stage.innerHTML = renderChat();
  if (ST.phase === 'error')     stage.innerHTML = renderError(ST.errorMessage);
  // Post-render hooks
  if (ST.phase === 'chat') scrollChatToBottom();
}

// ─────────────────────────────────────────────────────────
//  Persistence
// ─────────────────────────────────────────────────────────

async function loadAll() {
  try {
    const res = await fetch(`/.netlify/functions/selections-storage?clientKey=${encodeURIComponent(CLIENT_KEY)}`);
    if (res.ok) {
      const data = await res.json();
      const all = data.data || {};
      ST.ans = all.ans || {};
      ST.sav = all.sav || {};
      ST.rms = Array.isArray(all.rms) && all.rms.length ? all.rms : V2_DEFAULT_ROOMS.slice();
    } else {
      ST.ans = {}; ST.sav = {}; ST.rms = V2_DEFAULT_ROOMS.slice();
    }
  } catch (e) {
    ST.ans = {}; ST.sav = {}; ST.rms = V2_DEFAULT_ROOMS.slice();
  }
  // Hydrate v2 state from ans
  try { ST.quizAnswers = JSON.parse(ST.ans._v2_quiz_answers || '{}'); } catch(e) { ST.quizAnswers = {}; }
  ST.style         = ST.ans._v2_style          || '';
  ST.styleSummary  = ST.ans._v2_style_summary  || '';
  ST.styleGreeting = ST.ans._v2_style_greeting || '';
  try { ST.chatHistory = JSON.parse(ST.ans._v2_chat_history || '{}'); } catch(e) { ST.chatHistory = {}; }
  try { ST.picks       = JSON.parse(ST.ans._v2_picks        || '{}'); } catch(e) { ST.picks = {}; }
  try { ST.budgetTiers = JSON.parse(ST.ans._v2_budget_tiers || '{}'); } catch(e) { ST.budgetTiers = {}; }
  try { ST.boardPicks  = JSON.parse(ST.ans._v2_board_picks  || '{}'); } catch(e) { ST.boardPicks = {}; }
}

// Debounced batch save — coalesces rapid mutations into one network write.
function scheduleSave() {
  if (ST.pendingSave) clearTimeout(ST.pendingSave);
  ST.pendingSave = setTimeout(saveAllNow, 250);
}
async function saveAllNow() {
  ST.pendingSave = null;
  // Refresh the v2 mirror keys before persisting
  ST.ans._v2_quiz_answers   = JSON.stringify(ST.quizAnswers);
  ST.ans._v2_style          = ST.style          || '';
  ST.ans._v2_style_summary  = ST.styleSummary   || '';
  ST.ans._v2_style_greeting = ST.styleGreeting  || '';
  ST.ans._v2_chat_history   = JSON.stringify(ST.chatHistory);
  ST.ans._v2_picks          = JSON.stringify(ST.picks);
  ST.ans._v2_budget_tiers   = JSON.stringify(ST.budgetTiers);
  ST.ans._v2_board_picks    = JSON.stringify(ST.boardPicks);

  // Batch endpoint expects { batch: { ans, sav, rms, ... } } — same shape v1 uses.
  const body = {
    batch: {
      ans: ST.ans,
      sav: ST.sav,
      rms: ST.rms,
    },
  };
  try {
    const res = await fetch(`/.netlify/functions/selections-storage?clientKey=${encodeURIComponent(CLIENT_KEY)}&batch=1`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) console.warn('selections-v2 save failed:', res.status, await res.text());
  } catch (e) {
    console.warn('selections-v2 save error:', e.message);
  }
}

// ─────────────────────────────────────────────────────────
//  Renderers — phases
// ─────────────────────────────────────────────────────────

function renderLoading(label) {
  return `
    <div class="fox-loading">
      <div class="fox-spinner"></div>
      <div>${esc(label || 'Loading…')}</div>
    </div>`;
}

function renderError(msg) {
  return `
    <div class="fox-error">${esc(msg || 'Something went wrong.')}</div>
    <button class="btn-primary" onclick="location.reload()">Reload</button>`;
}

// ── Quiz ──────────────────────────────────────
function renderQuiz() {
  const q = ST.quiz[ST.qIdx];
  if (!q) return renderError('Quiz failed to load.');
  const total = ST.quiz.length;
  const pctNum = Math.round((ST.qIdx / total) * 100);
  const selectedLetter = ST.quizAnswers[q.id];
  const photos = Array.isArray(q.photos) ? q.photos : [];

  return `
    <div class="quiz-card">
      <div class="quiz-progress">
        <span>Question ${ST.qIdx + 1} of ${total}</span>
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pctNum}%"></div></div>
      </div>
      <div class="quiz-prompt">${esc(q.prompt)}</div>
      ${q.note ? `<div class="quiz-note">${esc(q.note)}</div>` : ''}
      <div class="quiz-options">
        ${q.options.map((opt, i) => {
          const photo = photos[i] || photos[opt.letter ? opt.letter.charCodeAt(0) - 65 : i];
          const sel   = selectedLetter === opt.letter;
          // onerror swaps the broken <img> for a letter-box fallback. Uses &quot;
          // entities so the inline handler stays single-quoted and doesn't collide
          // with the outer double-quoted attribute value.
          const img   = photo && photo.thumbUrl
            ? `<img class="quiz-option-img" src="${esc(photo.thumbUrl)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='&lt;div class=&quot;quiz-option-img-fallback&quot;&gt;${esc(opt.letter)}&lt;/div&gt;'">`
            : `<div class="quiz-option-img-fallback">${esc(opt.letter)}</div>`;
          return `
            <button type="button" class="quiz-option ${sel ? 'selected' : ''}" data-letter="${esc(opt.letter)}" onclick="onQuizPick('${esc(q.id)}','${esc(opt.letter)}')">
              ${img}
              <div class="quiz-option-body">
                <div class="quiz-option-letter">${esc(opt.letter)}</div>
                <div class="quiz-option-label">${esc(opt.label)}</div>
              </div>
            </button>`;
        }).join('')}
      </div>
      <div class="quiz-actions">
        <button class="quiz-back" ${ST.qIdx === 0 ? 'disabled' : ''} onclick="onQuizBack()">← Back</button>
        <button class="quiz-next" ${selectedLetter ? '' : 'disabled'} onclick="onQuizNext()">
          ${ST.qIdx === total - 1 ? 'See my style →' : 'Next →'}
        </button>
      </div>
    </div>`;
}

function onQuizPick(qid, letter) {
  ST.quizAnswers[qid] = letter;
  scheduleSave();
  render();
}
function onQuizBack() {
  if (ST.qIdx > 0) { ST.qIdx--; render(); }
}
function onQuizNext() {
  if (ST.qIdx < ST.quiz.length - 1) {
    ST.qIdx++;
    render();
  } else {
    analyzeQuiz();
  }
}

// ── Analyzing ─────────────────────────────────
function renderAnalyzing() {
  return `
    <div class="fox-analyzing">
      <div class="fox-spinner"></div>
      <h2>Reading your answers…</h2>
      <p>Fox is matching your taste to a style profile.</p>
    </div>`;
}

async function analyzeQuiz() {
  ST.phase = 'analyzing';
  render();

  // Build a single user message containing the answers as readable text
  const lines = ST.quiz.map(q => {
    const letter = ST.quizAnswers[q.id];
    const opt = q.options.find(o => o.letter === letter);
    return `${q.id} (${q.prompt}): ${letter} — ${opt ? opt.label : '(no answer)'}`;
  });
  const userText = `Here are my quiz answers:\n${lines.join('\n')}`;

  try {
    const res = await fetch('/.netlify/functions/design-agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mode: 'quiz-analyze',
        context: { clientName: CLIENT_NAME },
        messages: [{ role: 'user', content: userText }],
      }),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(`design-agent error ${res.status}: ${err}`);
    }
    const data = await res.json();
    let parsed;
    try { parsed = JSON.parse(data.reply); }
    catch (e) { throw new Error('Fox returned unparseable JSON: ' + (data.reply || '').slice(0, 200)); }

    ST.style         = parsed.style || '';
    ST.styleSummary  = parsed.summary || '';
    ST.styleGreeting = parsed.greeting || '';
    ST.styleProfile  = (ST.catalog && ST.catalog.styles && ST.catalog.styles[ST.style]) || null;
    ST.phase = 'reveal';
    scheduleSave();
    render();
  } catch (err) {
    console.error(err);
    ST.phase = 'error';
    ST.errorMessage = err.message || String(err);
    render();
  }
}

// ── Reveal ────────────────────────────────────
function renderReveal() {
  const profile = ST.styleProfile || (ST.catalog && ST.catalog.styles && ST.catalog.styles[ST.style]) || {};
  const palette = Array.isArray(profile.palette) ? profile.palette : [];

    <div class="reveal-card">

      ${palette.length ? `
        <div class="reveal-palette">
          ${palette.map(c => `<div class="reveal-swatch" style="background:${esc(c)}"></div>`).join('')}

      ${keywords.length ? `
        <div class="reveal-keywords">
          ${keywords.map(k => `<span class="reveal-keyword">${esc(k)}</span>`).join('')}
        </div>` : ''}

// Route from reveal through budget → boards → home.
// Skip phases that are already completed.
function enterHome() {
  if (!allBudgetTiersSet()) {
    ST.phase = 'budget';
  } else if (!allBoardPicksSet()) {
    ST.phase = 'boards';
  } else {
    ST.phase = 'home';
  }
  scheduleSave();
  render();
}
function restartQuiz() {
  ST.qIdx = 0;
  ST.quizAnswers = {};
  ST.style = ''; ST.styleSummary = ''; ST.styleGreeting = '';
  ST.budgetTiers = {};
  ST.boardPicks = {};
  ST.phase = 'quiz';
  scheduleSave();
  render();
}

// ── Budget calibration ────────────────────────
// Shown once, between reveal and home. Client picks Essential / Elevated /
// Showpiece for every room. Drives which design boards and catalog products
// Fox recommends. No dollar amounts — tier meaning scales with project
// budget/sqft, so we describe the *experience* instead of the price.

// Library of tier definitions. Applies across all rooms. The description
// and "includes" copy is deliberately outcome-focused, not spec-focused —
// the client is deciding what the room should *feel* like, not picking a
// line item.
const BUDGET_TIERS = [
  {
    id: 'essential',
    name: 'Essential',
    tagline: 'Smart value that still looks great.',
    desc:
      'Quality finishes from trusted brands. Classic, durable choices ' +
      'that look beautiful without the splurge. A room guests admire, ' +
      'not one they linger in.',
  },
  {
    id: 'elevated',
    name: 'Elevated',
    tagline: 'A clear step up. Designer-level detail.',
    desc:
      'Better materials, richer textures, and thoughtful moments of ' +
      'upgrade — the kind of room that makes people say "ooh, nice." ' +
      'The sweet spot most of our clients land in.',
  },
  {
    id: 'showpiece',
    name: 'Showpiece',
    tagline: 'Heirloom materials. The rooms people remember.',
    desc:
      'Natural stone, custom millwork, statement lighting, and finishes ' +
      'you\'d expect in a design magazine. This is the room guests won\'t ' +
      'stop talking about.',
  },
];

function allBudgetTiersSet() {
  if (!ST.rms || !ST.rms.length) return false;

}

function tierImageUrl(roomId, tierId) {

  const bi = ST.catalog && ST.catalog.boardImages;
  if (bi && ST.style && bi[ST.style]) {

    if (room && room[tierId]) return room[tierId];
  }
  return null;
}

function renderBudget() {
  const rooms = ST.rms || [];
  const doneCount = rooms.filter(rm => !!ST.budgetTiers[rm.id]).length;

    <div class="budget-shell">

function selectTier(roomId, tierId) {

function allBoardPicksSet() {

function boardImageUrl(style, roomId, tier) {

const BOARD_TIER_LABELS = {

function selectBoard(roomId, tier) {

}

// ── Home (room/category grid) ─────────────────

    <div class="home-header">

        ${esc(ST.style)}
      </div>
    </div>

      <div class="home-progress-row">

        <div class="home-progress-pct">${pctNum}%</div>

      <div class="home-progress-bar"><div class="home-progress-fill" style="width:${pctNum}%"></div></div>

                    ${done ? '<span class="cat-tile-check">✓</span>' : ''}
                  </div>

// ── Chat ──────────────────────────────────────
function cellKey(roomId, cat) { return `${roomId}::${cat}`; }
function chatThread() {
  const k = cellKey(ST.currentRoomId, ST.currentCategory);
  if (!ST.chatHistory[k]) ST.chatHistory[k] = [];
  return ST.chatHistory[k];
}

function openChat(roomId, category) {
  const room = ST.rms.find(r => r.id === roomId);
  if (!room) return;
  ST.currentRoom = room.name;
  ST.currentRoomId = roomId;
  ST.currentCategory = category;
  ST.phase = 'chat';
  render();
  // If no messages yet, send the opening prompt for Fox
  const thread = chatThread();
  if (thread.length === 0) {
    sendOpeningMessage();
  }
}

function backToHome() {
  ST.phase = 'home';
  render();
}

function renderChat() {
  const thread = chatThread();
  const k = cellKey(ST.currentRoomId, ST.currentCategory);
  const lockedPick = ST.picks[k];

  return `
    <div class="chat-shell">
      <div class="chat-hd">
        <div class="chat-hd-l">
          <div class="chat-hd-text">
            <div class="chat-hd-room">${esc(ST.currentRoom)}</div>
            <div class="chat-hd-cat">${esc(CAT_LABELS[ST.currentCategory] || ST.currentCategory)}</div>
          </div>
        </div>
        <button class="chat-hd-back" onclick="backToHome()">← All rooms</button>
      </div>
      <div class="chat-body" id="chat-body">
        ${thread.map(renderChatMsg).join('')}
        ${ST.awaitingFox ? `
          <div class="chat-msg fox">
            <div class="chat-bubble">
              <div class="chat-thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            </div>
          </div>` : ''}
      </div>
      ${lockedPick ? `
        <div class="chat-locked-banner">
          <div class="chat-locked-text">
            ✓ Picked: ${esc(lockedPick.tier || '')} ${esc(lockedPick.name)}
            <small>${esc(lockedPick.priceRange || '')}</small>
          </div>
          <button class="btn-secondary" onclick="changePick()" style="padding:7px 14px;font-size:12px">Change pick</button>
        </div>` : `
        <div class="chat-foot">
          <textarea class="chat-input" id="chat-input" placeholder="Ask Fox anything…" rows="1"
            oninput="autosizeInput(this)"
            onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();onChatSend()}"></textarea>
          <button class="chat-send" onclick="onChatSend()">Send</button>
        </div>`}
    </div>`;
}

function renderChatMsg(m, idx) {
  if (m.role === 'user') {
    return `<div class="chat-msg user"><div class="chat-bubble">${esc(m.content)}</div></div>`;
  }
  // assistant
  const picks = Array.isArray(m.picks) ? m.picks : null;
  const isLast = idx === undefined; // unused
  const k = cellKey(ST.currentRoomId, ST.currentCategory);
  const lockedPick = ST.picks[k];
  return `
    <div class="chat-msg fox">
      <div style="max-width:88%">
        <div class="chat-bubble">${mdRender(m.content)}</div>
        ${picks && !lockedPick ? `
          <div class="pick-cards">
            ${picks.map((pk, pi) => `
              <button type="button" class="pick-card ${pk.myPick ? 'foxpick' : ''}" onclick="lockInPick(${esc(JSON.stringify(JSON.stringify(pk)))})">
                ${pk.myPick ? '<div class="pick-card-foxpick-tag">Fox\u2019s pick</div>' : ''}
                <div class="pick-card-tier">${esc(pk.tier || '')} ${pk.priceRange ? '· <span class="pick-card-price">' + esc(pk.priceRange) + '</span>' : ''}</div>
                <div class="pick-card-name">${esc(pk.name || '')}</div>
                <div class="pick-card-why">${esc(pk.why || '')}</div>
              </button>`).join('')}
          </div>` : ''}
      </div>
    </div>`;
}

function autosizeInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollChatToBottom() {
  const body = $('#chat-body');
  if (body) body.scrollTop = body.scrollHeight;
}

async function sendOpeningMessage() {
  // Auto-send a structured opener so Fox immediately presents 3 picks
  const opener = `Show me my three ${CAT_LABELS[ST.currentCategory] || ST.currentCategory} picks for the ${ST.currentRoom}.`;
  await sendUserMessage(opener);
}

async function onChatSend() {
  const input = $('#chat-input');
  if (!input) return;
  const text = (input.value || '').trim();
  if (!text) return;
  input.value = '';
  autosizeInput(input);
  await sendUserMessage(text);
}

async function sendUserMessage(content) {
  const thread = chatThread();
  thread.push({ role: 'user', content });
  ST.awaitingFox = true;
  render();
  scheduleSave();

  try {
    // Build the messages array — strip our `picks` metadata from assistant turns
    const apiMessages = thread.map(m => ({
      role:    m.role,
      content: m.content,
    }));

    const context = {
      clientName:   CLIENT_NAME,
      style:        ST.style,
      room:         ST.currentRoom,
      roomId:       ST.currentRoomId,
      category:     ST.currentCategory,
      budgetTier:   ST.budgetTiers[ST.currentRoomId] || '',
      boardPick:    ST.boardPicks[ST.currentRoomId] || '',
      answersSoFar: collectLockedPicksContext(),
    };

    const res = await fetch('/.netlify/functions/design-agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'chat', context, messages: apiMessages }),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(`design-agent ${res.status}: ${err}`);
    }
    const data = await res.json();
    thread.push({
      role: 'assistant',
      content: data.reply || '',
      picks: data.picks || null,
    });
  } catch (err) {
    console.error(err);
    thread.push({
      role: 'assistant',
      content: `Sorry — I hit a snag reaching the server. Try sending that again, or refresh the page.\n\n*${err.message || err}*`,
    });
  } finally {
    ST.awaitingFox = false;
    scheduleSave();
    render();
  }
}

// Build a flat dictionary of locked picks across the project so Fox stays
// consistent with prior decisions.
function collectLockedPicksContext() {
  const out = {};
  Object.keys(ST.picks).forEach(k => {
    const [roomId, cat] = k.split('::');
    const room = (ST.rms.find(r => r.id === roomId) || {}).name || roomId;
    const pk = ST.picks[k];
    out[`${room} ${CAT_LABELS[cat] || cat}`] = `${pk.tier || ''} ${pk.name || ''}`.trim();
  });
  return out;
}

// ─────────────────────────────────────────────────────────
//  Picks
// ─────────────────────────────────────────────────────────

function lockInPick(pickJsonString) {
  let pk;
  try { pk = JSON.parse(pickJsonString); }
  catch (e) { console.warn('bad pick payload', e); return; }

  const k = cellKey(ST.currentRoomId, ST.currentCategory);
  ST.picks[k] = {
    tier:       pk.tier || '',
    name:       pk.name || '',
    priceRange: pk.priceRange || '',
    why:        pk.why || '',
    myPick:     !!pk.myPick,
    pickedAt:   new Date().toISOString(),
  };
  ST.sav[`_v2_${k}`] = true;

  // Mirror into v1-compatible product fields where it matters for the design book
  mirrorPickToV1Fields(ST.currentRoomId, ST.currentCategory, ST.picks[k]);

  // Append a confirmation user-message to the thread so Fox knows the choice
  const thread = chatThread();
  thread.push({
    role: 'user',
    content: `I'll go with the ${pk.tier || ''} option — ${pk.name}.`,
  });
  // Also append a closing assistant note (no API call) so the conversation feels finished
  thread.push({
    role: 'assistant',
    content: `Great pick. **${pk.name}** is locked in for the ${ST.currentRoom} ${(CAT_LABELS[ST.currentCategory] || ST.currentCategory).toLowerCase()}. Hit "← All rooms" when you're ready for the next decision.`,
  });

  scheduleSave();
  showToast('Pick saved');
  render();
}

function changePick() {
  const k = cellKey(ST.currentRoomId, ST.currentCategory);
  delete ST.picks[k];
  delete ST.sav[`_v2_${k}`];
  scheduleSave();
  render();
}

// Best-effort mapping from (room, category, pick) to v1's design-book field
// keys. Anything unmapped still lives under _v2_picks so the v2 page itself
// always has the data.
function mirrorPickToV1Fields(roomId, cat, pick) {
  const product = pick.name || '';
  const rk = roomId; // already snake_case
  const ans = ST.ans;

  if (cat === 'countertops' && roomId === 'kitchen') {
    ans['countertops_ct_product'] = product;
    ans['countertops_ct_kit']     = product;
  } else if (cat === 'countertops') {
    ans[`ct_bath_${rk}_mat`]     = product;
    ans[`ct_bath_product_${rk}`] = product;
  } else if (cat === 'flooring') {
    ans[`flooring_floor_${rk}`]   = product;
    ans[`flooring_product_${rk}`] = product;
  } else if (cat === 'tile') {
    ans[`tile_floor_${rk}`]         = product;
    ans[`tile_floor_product_${rk}`] = product;
  } else if (cat === 'lighting') {
    ans[`lighting_${rk}_pendant_product`] = product;
  } else if (cat === 'plumbing' && roomId === 'kitchen') {
    ans[`plumbing_${rk}_kitchen_sink_product`] = product;
  } else if (cat === 'plumbing') {
    ans[`plumbing_${rk}_shower_product`] = product;
  } else if (cat === 'hardware') {
    ans['hardware_hw_product'] = product;
    ans['hardware_hw_finish']  = product;
  } else if (cat === 'paint') {
    ans[`paint_${rk}_color`]   = product;
    ans[`paint_${rk}_product`] = product;
  } else if (cat === 'appliances') {
    ans['app_range_product'] = product;
  } else if (cat === 'fireplace') {
    ans['fireplace_fp_want']    = 'Yes';
    ans['fireplace_fp_product'] = product;
  } else if (cat === 'specialty_trim') {
    ans['specialty_trim_beams_loc'] = product;
  }
}

// ─────────────────────────────────────────────────────────
//  Boot
// ─────────────────────────────────────────────────────────

async function boot() {
  render(); // loading screen

  // 1) Load saved data
  await loadAll();

  // 2) Load quiz catalog (with photos)
  try {
    const res = await fetch('/.netlify/functions/style-catalog?withPhotos=1');
    if (!res.ok) throw new Error(`style-catalog ${res.status}`);
    const cat = await res.json();
    ST.catalog = cat;
    ST.quiz    = Array.isArray(cat.quiz) ? cat.quiz : [];
    if (ST.style && cat.styles && cat.styles[ST.style]) {
      ST.styleProfile = cat.styles[ST.style];
    }
  } catch (err) {
    ST.phase = 'error';
    ST.errorMessage = 'Could not load style catalog: ' + err.message;
    render();
    return;
  }

  // 3) Decide which phase to start in based on what's saved.
  //    Full flow: quiz → analyzing → reveal → budget → boards → home → chat
  //    On reload we drop the user at the furthest completed step.
  if (ST.style && ST.styleGreeting) {
    // Style identified — figure out which post-reveal step they're at.
    if (!allBudgetTiersSet()) {
      ST.phase = 'budget';
    } else if (!allBoardPicksSet()) {
      ST.phase = 'boards';
    } else {
      ST.phase = 'home';
    }
  } else {
    ST.phase = 'quiz';
    // Restore in-progress quiz position to first unanswered question
    const firstUnanswered = ST.quiz.findIndex(q => !ST.quizAnswers[q.id]);
    ST.qIdx = firstUnanswered === -1 ? 0 : firstUnanswered;
  }
  render();
}

boot();
</script>
