name: Staging preflight (read-only)

# Verifies the Supabase + Netlify tokens work and shows what accounts they can
# see. Creates NOTHING. Touches NOTHING. Safe to run repeatedly.
# Runs on push to the build branch when this file changes (workflow_dispatch
# only works from the default branch, which we don't push to).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/six-arrows-cx-discovery-ts3lk9
    paths:
      - .github/workflows/staging-preflight.yml

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; missing=1; fi
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then echo "::error::NETLIFY_AUTH_TOKEN secret is missing"; missing=1; fi
          [ "$missing" = "1" ] && exit 1 || echo "Both secrets present."

      - name: Supabase — list organizations and projects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "== Organizations =="
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/organizations \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(f"  id={o.get(\"id\")}  name={o.get(\"name\")}  plan={o.get(\"plan\") or o.get(\"tier\")}") for o in d]' \
            || echo "  (could not parse — token may be invalid)"
          echo "== Existing projects (name / ref / region / status) =="
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(f"  {p.get(\"name\")}  ref={p.get(\"id\")}  region={p.get(\"region\")}  status={p.get(\"status\")}") for p in d]' \
            || echo "  (none or parse error)"
          echo "NOTE: production ref mtvcahscwpralmlqlnzg is OFF-LIMITS — do not target it."

      - name: Netlify — list sites
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          echo "== Netlify sites (name / id / url) =="
          curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites?per_page=100" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(f"  {s.get(\"name\")}  id={s.get(\"id\")}  url={s.get(\"ssl_url\") or s.get(\"url\")}") for s in d]' \
            || echo "  (could not parse — token may be invalid)"

      - name: Summary
        run: |
          echo "Preflight done. If orgs/projects/sites printed above, credentials work"
          echo "and Claude can proceed to provision the staging project + Netlify context."
